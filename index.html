<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator | Interactive Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            /* --- LIGHT MODE VARIABLES (DEFAULT) --- */
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --input-bg: #f9fafb;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --primary: #6366f1;
            
            /* Card Defaults */
            --card-gradient: linear-gradient(135deg, #242066, #171542);
            --card-accent: #fbbf24;
            --card-text: #ffffff;
        }

        /* --- DARK MODE CLASS --- */
        body.dark-mode {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }

        body { 
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            background: var(--panel-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background 0.3s;
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Mode Toggle Button */
        .theme-toggle {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        .theme-toggle:hover { background: var(--primary); color: white; }

        .hamburger {
            cursor: pointer; font-size: 24px; color: var(--text-main); display: block;
        }

        /* Mobile Menu */
        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: var(--panel-bg);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s;
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
            border-left: 1px solid var(--border-color);
            z-index: 999;
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-color);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            margin-top: 90px;
            width: 95%;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding-bottom: 40px;
            flex: 1;
        }

        /* --- EDITOR SECTION --- */
        .editor-box {
            flex: 1; min-width: 350px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background 0.3s;
        }

        .section-title {
            font-size: 18px; font-weight: 700; margin-bottom: 20px;
            color: var(--primary); border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: var(--text-muted); margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        .form-control:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .row-inputs { display: flex; gap: 10px; }
        .row-inputs > div { flex: 1; }

        /* Buttons */
        .btn-generate {
            width: 100%; padding: 14px; margin-top: 10px;
            border-radius: 10px; border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-download {
            width: 100%; padding: 14px; margin-top: 15px;
            border-radius: 50px; border: none;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: white; font-weight: 700; cursor: pointer; display: none;
        }

        /* --- PREVIEW SECTION --- */
        .preview-box {
            flex: 1; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 10px;
        }

        /* --- MCQ CARD --- */
        #mcqWrapper {
            width: 100%; max-width: 400px;
            background: var(--card-gradient);
            border-radius: 16px;
            padding: 25px 20px;
            display: none; flex-direction: column;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .question-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .q-prefix { color: var(--card-accent); font-size: 20px; font-weight: 800; line-height: 1.3; flex-shrink: 0; }
        .q-text { color: var(--card-text); font-size: 17px; font-weight: 600; line-height: 1.4; }

        .options-list { display: flex; flex-direction: column; gap: 8px; }
        .opt-item {
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; padding: 8px 12px;
        }
        .opt-circle {
            width: 24px; height: 24px; flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: var(--card-text);
            display: flex; justify-content: center; align-items: center;
            font-size: 11px; font-weight: 700; margin-right: 10px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .opt-text { color: var(--card-text); font-size: 14px; font-weight: 500; }

        .card-footer {
            margin-top: 20px; text-align: center;
        }
        .card-line { width: 40px; height: 3px; background: var(--card-accent); margin: 0 auto 10px; border-radius: 2px; }
        .card-brand { color: rgba(255, 255, 255, 0.6); font-size: 10px; font-weight: 500; letter-spacing: 1px; }

        /* Footer */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: var(--panel-bg); color: var(--text-muted);
            border-top: 1px solid var(--border-color); margin-top: auto; font-size: 13px;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            /* Editor stays on top naturally, removed the 'order' property */
            .brand-logo span { font-size: 16px; }
        }
    </style>
</head>
<body class=""> <header>
        <div class="brand-logo">
            <i class="fas fa-book-open"></i> Interactive Learning
        </div>
        
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            
            <div class="hamburger" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
        </div>

        <div class="nav-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="notice.html">Notice</a>
            <a href="quotation.html">Quotation</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-box">
            <div class="section-title">Design Your Card</div>

            <div class="row-inputs">
                <div class="input-group">
                    <label>প্রশ্ন স্টাইল (Q. Style)</label>
                    <select id="qStyle" class="form-control" onchange="updatePreviewLive()">
                        <option value="Q.">Q.</option>
                        <option value="?">?</option>
                        <option value="প্রশ্ন:">প্রশ্ন:</option>
                        <option value="Question:">Question:</option>
                        <option value="">(No Prefix)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>অপশন স্টাইল (Option Type)</label>
                    <select id="optStyle" class="form-control" onchange="updatePreviewLive()">
                        <option value="english">A, B, C, D</option>
                        <option value="bengali">ক, খ, গ, ঘ</option>
                        <option value="roman">i, ii, iii, iv</option>
                        <option value="number">1, 2, 3, 4</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>কার্ড থিম (Color Theme)</label>
                <select id="themeSelector" class="form-control" onchange="updatePreviewLive()">
                    </select>
            </div>

            <div class="input-group">
                <label>প্রশ্ন (Question)</label>
                <input id="qInput" class="form-control" placeholder="এখানে প্রশ্ন লিখুন..." oninput="updatePreviewLive()">
            </div>

            <div class="input-group">
                <label>অপশন সমূহ</label>
                <input id="optA" class="form-control" placeholder="Option 1" style="margin-bottom:8px;" oninput="updatePreviewLive()">
                <input id="optB" class="form-control" placeholder="Option 2" style="margin-bottom:8px;" oninput="updatePreviewLive()">
                <input id="optC" class="form-control" placeholder="Option 3" style="margin-bottom:8px;" oninput="updatePreviewLive()">
                <input id="optD" class="form-control" placeholder="Option 4" oninput="updatePreviewLive()">
            </div>

            <button class="btn-generate" onclick="generate()">
                <i class="fas fa-magic"></i> Generate & View
            </button>
            <button class="btn-download" id="dlBtn" onclick="downloadImage()">
                <i class="fas fa-download"></i> Download Image
            </button>
        </div>

        <div class="preview-box">
            <div id="mcqWrapper">
                <div class="question-box">
                    <span id="pPrefix" class="q-prefix">Q.</span>
                    <span id="pQ" class="q-text">তোমার প্রশ্ন এখানে দেখাবে...</span>
                </div>
                <div class="options-list">
                    <div class="opt-item"><div class="opt-circle" id="oc1">A</div><div id="pA" class="opt-text">Option 1</div></div>
                    <div class="opt-item"><div class="opt-circle" id="oc2">B</div><div id="pB" class="opt-text">Option 2</div></div>
                    <div class="opt-item"><div class="opt-circle" id="oc3">C</div><div id="pC" class="opt-text">Option 3</div></div>
                    <div class="opt-item"><div class="opt-circle" id="oc4">D</div><div id="pD" class="opt-text">Option 4</div></div>
                </div>
                <div class="card-footer">
                    <div class="card-line"></div>
                    <div class="card-brand">Follow: Interactive Learning</div>
                </div>
            </div>
        </div>
    </div>

    <footer>&copy; <span id="year"></span> Interactive Learning</footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        // --- THEME TOGGLE LOGIC ---
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            
            body.classList.toggle('dark-mode');
            
            if(body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        // --- MENU TOGGLE ---
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
        }

        // --- POPULATE 100 THEMES ---
        const themes = [
            { name: "Royal Blue (Default)", bg: "linear-gradient(135deg, #242066, #171542)", accent: "#fbbf24" },
            { name: "Emerald", bg: "linear-gradient(135deg, #064e3b, #065f46)", accent: "#34d399" },
            { name: "Crimson", bg: "linear-gradient(135deg, #7f1d1d, #991b1b)", accent: "#fca5a5" },
            { name: "Midnight", bg: "linear-gradient(135deg, #0f172a, #1e293b)", accent: "#38bdf8" },
            { name: "Sunset", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Violet", bg: "linear-gradient(135deg, #4c1d95, #7c3aed)", accent: "#c4b5fd" },
            { name: "Teal", bg: "linear-gradient(135deg, #115e59, #14b8a6)", accent: "#5eead4" },
            { name: "Dark Grey", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            // Generating remaining themes generically
        ];

        // Fill up to 100 themes
        for(let i=themes.length; i<100; i++) {
             const hue = Math.floor(Math.random() * 360);
             themes.push({
                 name: `Custom Theme ${i+1}`,
                 bg: `linear-gradient(135deg, hsl(${hue}, 60%, 20%), hsl(${hue}, 60%, 10%))`,
                 accent: `hsl(${(hue+180)%360}, 80%, 60%)`
             });
        }

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        // --- OPTION MAPPING ---
        const optionTypes = {
            english: ['A', 'B', 'C', 'D'],
            bengali: ['ক', 'খ', 'গ', 'ঘ'],
            roman: ['i', 'ii', 'iii', 'iv'],
            number: ['1', '2', '3', '4']
        };

        // --- LIVE UPDATE & GENERATE ---
        function updatePreviewLive() {
            // Apply Text
            const q = document.getElementById('qInput').value || "তোমার প্রশ্ন এখানে দেখাবে...";
            document.getElementById('pQ').innerText = q;

            document.getElementById('pA').innerText = document.getElementById('optA').value || "Option 1";
            document.getElementById('pB').innerText = document.getElementById('optB').value || "Option 2";
            document.getElementById('pC').innerText = document.getElementById('optC').value || "Option 3";
            document.getElementById('pD').innerText = document.getElementById('optD').value || "Option 4";

            // Apply Prefixes
            const qStyle = document.getElementById('qStyle').value;
            document.getElementById('pPrefix').innerText = qStyle;

            const optStyle = document.getElementById('optStyle').value;
            const labels = optionTypes[optStyle];
            document.getElementById('oc1').innerText = labels[0];
            document.getElementById('oc2').innerText = labels[1];
            document.getElementById('oc3').innerText = labels[2];
            document.getElementById('oc4').innerText = labels[3];

            // Apply Theme
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            const wrapper = document.getElementById('mcqWrapper');
            
            wrapper.style.background = theme.bg;
            document.querySelector('.q-prefix').style.color = theme.accent;
            document.querySelector('.card-line').style.background = theme.accent;
            
            // Adjust text color logic slightly for lighter/darker themes if needed
            // Defaulting all text to white for these dark gradients
        }

        function generate() {
            updatePreviewLive();
            const wrapper = document.getElementById('mcqWrapper');
            wrapper.style.display = 'flex';
            document.getElementById('dlBtn').style.display = 'block';
            
            // Scroll only on mobile
            if(window.innerWidth < 768) {
                wrapper.scrollIntoView({behavior: 'smooth', block: 'center'});
            }
        }

        function downloadImage() {
            const wrapper = document.getElementById('mcqWrapper');
            html2canvas(wrapper, {scale: 3, backgroundColor: null, useCORS: true}).then(canvas => {
                const link = document.createElement('a');
                link.download = 'MCQ_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
