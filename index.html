<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MCQ Generator | Interactive Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Lexend',sans-serif;
}

body{
  margin:0;
  background:#f4f6fb;
  display:flex;
  justify-content:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:400px;
}

/* header */
.h23{
  text-align:center;
  background:#65f6af;
  color:#065f46;
  padding:12px;
  border-radius:12px;
  font-weight:600;
  margin-bottom:16px;
}

/* input box */
.input-box{
  background:#fff;
  padding:16px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.input-box b{font-size:13px}

.input-box input{
  width:100%;
  padding:14px;
  margin:8px 0 14px;
  border-radius:10px;
  border:1px solid #ddd;
}

.input-box button{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* MCQ CARD */
.mcq-card{
  display:none;
  padding:16px;
  border-radius:26px;
  box-shadow:0 25px 60px rgba(0,0,0,.18);
  background:
    linear-gradient(135deg,#6b6bff,#5ec6ff,#9f7cff,#ff8fcf);
  background-size:300% 300%;
}

/* inner white layer */
.mcq-inner{
  background:rgba(255,255,255,.93);
  border-radius:22px;
  padding:16px;
}

/* quiz header */
.quiz-header{
  width:fit-content;
  margin:0 auto 16px;
  padding:10px 24px;
  border-radius:999px;
  background:linear-gradient(135deg,#6a5cff,#8f6bff);
  color:#fff;
  font-weight:600;
}

/* question strip */
.question{
  font-size:16px;
  font-weight:600;
  padding:14px;
  border-radius:14px;
  margin-bottom:14px;
  background:linear-gradient(135deg,#efeaff,#e8f4ff);
}

/* options */
.option{
  display:flex;
  align-items:center;
  background:#f7f8fc;
  border-radius:18px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  font-weight:600;
}

.option span{
  width:36px;
  height:36px;
  border-radius:50%;
  border:3px solid #cfcfe6;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:12px;
}

/* watermark */
.watermark{
  margin-top:12px;
  text-align:right;
  font-size:12px;
  font-weight:600;
  opacity:.7;
}

/* download */
.download-btn{
  width:100%;
  margin-top:16px;
  padding:12px;
  border-radius:14px;
  border:none;
  background:#10b981;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  display:none;
}
</style>
</head>

<body>

<div class="app">

<div class="h23">Create MCQ</div>

<div class="input-box">
  <b>Enter Question</b>
  <input id="question">

  <b>Option A</b>
  <input id="optA">

  <b>Option B</b>
  <input id="optB">

  <b>Option C</b>
  <input id="optC">

  <b>Option D</b>
  <input id="optD">

  <button onclick="generateMCQ()">Generate MCQ</button>
</div>

<div id="mcqWrapper">
  <div class="mcq-card" id="mcqCard">
    <div class="mcq-inner">
      <div class="quiz-header">Quick Quiz</div>

      <div class="question" id="qText"></div>

      <div class="option"><span>A</span><p id="aText"></p></div>
      <div class="option"><span>B</span><p id="bText"></p></div>
      <div class="option"><span>C</span><p id="cText"></p></div>
      <div class="option"><span>D</span><p id="dText"></p></div>

      <div class="watermark">Follow: Interactive Learning</div>
    </div>
  </div>
</div>

<button class="download-btn" id="mcqBtn" onclick="downloadMCQ()">Download Image</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
function generateMCQ(){
  if(!question.value||!optA.value||!optB.value||!optC.value||!optD.value){
    alert("সব ঘর পূরণ করো");
    return;
  }

  mcqCard.style.display="block";
  mcqBtn.style.display="block";

  qText.innerText="☆ "+question.value;
  aText.innerText=optA.value;
  bText.innerText=optB.value;
  cText.innerText=optC.value;
  dText.innerText=optD.value;
}

function downloadMCQ(){
  html2canvas(mcqWrapper,{
    scale:4,
    backgroundColor:null
  }).then(canvas=>{
    const a=document.createElement("a");
    a.download="mcq_"+Date.now()+".png";
    a.href=canvas.toDataURL();
    a.click();
  });
}
</script>

</body>
</html>
