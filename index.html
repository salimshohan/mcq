    <style>
  :root {
    --bg-body: #f3f4f6;       /* খুব সফট গ্রে ব্যাকগ্রাউন্ড */
    --panel-bg: #ffffff;      /* একদম সাদা প্যানেল */
    --primary: #4f46e5;       /* Indigo Blue (Premium Color) */
    --primary-soft: rgba(79, 70, 229, 0.1);
    --text-main: #111827;     /* Jet Black */
    --text-muted: #6b7280;    /* Muted Gray */
    --border-light: #e5e7eb;  /* হালকা বর্ডার */
    --border-focus: #4f46e5;  /* ফোকাস বর্ডার */
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

body { 
    font-family: 'Lexend', 'Anek Bangla', sans-serif;
    background-color: var(--bg-body);
    /* Dotted Pattern Background for professional look */
    background-image: radial-gradient(#d1d5db 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text-main);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
}

/* --- CONTAINER --- */
.container {
    margin-top: 100px;
    width: 95%; max-width: 1200px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 40px; padding-bottom: 40px; flex: 1;
}

/* --- EDITOR BOX (Left Panel) --- */
.editor-box {
    flex: 1; min-width: 360px; max-width: 500px;
    background: var(--panel-bg);
    padding: 32px;
    border-radius: 16px;
    /* Clean Border & Shadow */
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: var(--shadow-lg);
}

.section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 25px; 
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border-light);
}
.section-title { 
    font-size: 20px; font-weight: 700; 
    color: #1f2937;
    letter-spacing: -0.5px;
}

/* Action Buttons */
.action-buttons { display: flex; gap: 10px; }
.btn-icon {
    background: white; 
    border: 1px solid var(--border-light);
    color: var(--text-muted); width: 38px; height: 38px; border-radius: 10px;
    cursor: pointer; transition: all 0.2s ease; 
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
}
.btn-icon:hover { 
    border-color: var(--primary); color: var(--primary); 
    transform: translateY(-2px); box-shadow: var(--shadow-md);
}

/* --- INPUT FIELDS DESIGN (The Key Update) --- */
.input-group { margin-bottom: 20px; }

.input-group label {
    display: block; font-size: 13px; font-weight: 600;
    color: #374151; margin-bottom: 8px;
    letter-spacing: 0.3px;
}

.form-control {
    width: 100%;
    background: #ffffff;
    border: 1px solid #d1d5db; /* Distinct Border */
    color: #111827;
    padding: 12px 16px;
    border-radius: 8px; /* Standard Modern Radius */
    font-size: 15px;
    font-family: inherit;
    transition: all 0.2s ease-in-out;
    box-shadow: var(--shadow-sm); /* Subtle depth */
}

/* Hover Effect */
.form-control:hover {
    border-color: #9ca3af; /* Slightly darker gray on hover */
}

/* Focus Effect (Ring Style) */
.form-control:focus {
    border-color: var(--primary);
    /* The "Ring" effect seen in modern frameworks */
    box-shadow: 0 0 0 4px var(--primary-soft); 
}

/* Placeholder */
.form-control::placeholder { color: #9ca3af; font-size: 14px; }

/* Select Dropdown */
select.form-control { 
    cursor: pointer; 
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
    background-position: right 0.5rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em;
    padding-right: 2.5rem;
    -webkit-appearance: none;
    appearance: none;
}

.row-inputs { display: flex; gap: 15px; }
.row-inputs > div { flex: 1; }

/* Download Button */
.btn-download {
    width: 100%; padding: 14px; margin-top: 25px;
    border-radius: 10px; border: none;
    background: #111827; /* Solid Black/Dark Blue looks very premium */
    color: white; font-weight: 600; cursor: pointer;
    font-size: 15px; 
    box-shadow: var(--shadow-md);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-download:hover { 
    background: #000000; 
    transform: translateY(-2px); 
    box-shadow: var(--shadow-lg); 
}

/* --- PREVIEW BOX --- */
.preview-box {
    flex: 1.2; min-width: 350px;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 10px;
}

/* --- MCQ CARD (Remains mostly same but ensured contrast) --- */
#mcqWrapper {
    width: 100%; max-width: 480px;
    border-radius: 3px;
    padding: 14px; 
    display: flex; flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border: none;
    position: relative;
    transition: background 0.3s ease;
    color: white; 
}

.question-box { display: flex; gap: 6px; margin-bottom: 12px; }
.q-prefix { font-size: 18px; font-weight: 900; line-height: 0.9; flex-shrink: 0; }
.q-text { font-size: 16px; font-weight: 900; line-height: 0.9; }

.options-list { display: flex; flex-direction: column; gap: 7px; }

.opt-item {
    display: flex; align-items: center;
    background: rgba(255, 255, 255, 0.1); /* Better contrast */
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px; 
    padding: 5px 8px; 
}

.opt-circle {
    width: 22px; height: 22px; flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex; justify-content: center; align-items: center;
    font-size: 11px; font-weight: 700; margin-right: 12px;
    border: 1px solid rgba(255,255,255,0.3);
}
.opt-text { font-size: 13px; font-weight: 500; }

.card-footer { margin-top: 14px; text-align: center; }
.card-line { width: 120px; height: 3px; margin: 0 auto 10px; border-radius: 2px; }
.card-brand { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; opacity: 0.8; }

/* Footer */
footer {
    width: 100%; padding: 25px; text-align: center;
    background: #ffffff;
    border-top: 1px solid var(--border-light);
    margin-top: auto; font-size: 13px; color: var(--text-muted);
}

@media (max-width: 768px) {
    .container { flex-direction: column; padding: 20px; gap: 20px; }
    .editor-box, .preview-box { min-width: 100%; }
}
    </style>
</head>

                <div class="card-footer">
                    <div class="card-line"></div>
                    <div class="card-brand">Interactive Learning</div>
                </div>
            </div>
        </div>
    </div>

            tSelect.appendChild(opt);
        });

        // --- LIVE UPDATE LOGIC ---
        function updateLive() {
            // Get Values
            const q = document.getElementById('qInput').value || "এখানে প্রশ্ন দেখা যাবে...";
            document.getElementById('pQ').innerText = q;
            document.getElementById('pA').innerText = document.getElementById('optA').value || "Option A";

            document.getElementById('pC').innerText = document.getElementById('optC').value || "Option C";
            document.getElementById('pD').innerText = document.getElementById('optD').value || "Option D";

            // Set Style
            document.getElementById('pPrefix').innerText = document.getElementById('qStyle').value;
            const optStyle = document.getElementById('optStyle').value;
            const labels = optionTypes[optStyle];
            document.getElementById('oc1').innerText = labels[0];
            document.getElementById('oc2').innerText = labels[1];
            document.getElementById('oc3').innerText = labels[2];
            document.getElementById('oc4').innerText = labels[3];

            // Apply Theme
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            const wrapper = document.getElementById('mcqWrapper');
            
            wrapper.style.background = theme.bg;
            document.querySelector('.q-prefix').style.color = theme.accent;
            document.querySelector('.card-line').style.background = theme.accent;

            // Smart Text Color
            const isLight = ["Silver", "Gold Rush", "Morning", "Ice Cold", "Teal Love", "Piggy Pink", "Mega Tron", "Argon", "A Lost Memory"].includes(theme.name);
            const textColor = isLight ? "#222" : "#fff";
            const subColor = isLight ? "#444" : "#e2e8f0";
            const borderColor = isLight ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.1)";
            const itemBg = isLight ? "rgba(0,0,0,0.05)" : "rgba(255,255,255,0.08)";

            document.querySelector('.q-text').style.color = textColor;
            document.querySelectorAll('.opt-text').forEach(el => el.style.color = subColor);
            
            document.querySelectorAll('.opt-circle').forEach(el => {
                el.style.color = textColor;
                el.style.background = isLight ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.15)";
                el.style.borderColor = isLight ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.2)";
            });
            
            document.querySelectorAll('.opt-item').forEach(el => {
                el.style.borderColor = borderColor;
                el.style.background = itemBg;
            });
            document.querySelector('.card-brand').style.color = isLight ? "#555" : "rgba(255,255,255,0.6)";
        }

        // --- RESET & UNDO ---
        let lastState = null;

        function resetAll() {
            lastState = {
                q: document.getElementById('qInput').value,
                a: document.getElementById('optA').value,
                b: document.getElementById('optB').value,
                c: document.getElementById('optC').value,
                d: document.getElementById('optD').value,
                qStyle: document.getElementById('qStyle').value,
                optStyle: document.getElementById('optStyle').value,
                theme: document.getElementById('themeSelector').value
            };
            
            document.getElementById('qInput').value = '';
            document.getElementById('optA').value = '';
            document.getElementById('optB').value = '';
            document.getElementById('optC').value = '';
            document.getElementById('optD').value = '';
            
            document.getElementById('undoBtn').style.display = 'flex';
            updateLive();
        }

        function undoReset() {
            if(!lastState) return;
            document.getElementById('qInput').value = lastState.q;
            document.getElementById('optA').value = lastState.a;
            document.getElementById('optB').value = lastState.b;
            document.getElementById('optC').value = lastState.c;
            document.getElementById('optD').value = lastState.d;
            document.getElementById('qStyle').value = lastState.qStyle;
            document.getElementById('optStyle').value = lastState.optStyle;
            document.getElementById('themeSelector').value = lastState.theme;
            
            document.getElementById('undoBtn').style.display = 'none';
            updateLive();
        }

        function downloadImage() {
            const wrapper = document.getElementById('mcqWrapper');
            const btn = document.getElementById('dlBtn');
            btn.innerText = "Processing...";
            
            html2canvas(wrapper, {
                scale: 4, // Ultra HD
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'mcq_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fas fa-download"></i> Download Image';
            });
        }

        // Initialize Live Preview
        updateLive();
        // Show mcqWrapper initially
        document.getElementById('mcqWrapper').style.display = 'flex';

    </script>
</body>
</html>
