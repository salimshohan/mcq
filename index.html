<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #f0f2f5; 
            font-family: 'Hind Siliguri', 'Lexend', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Input Section Styles */
        .app-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: 30px;
        }

        .h23 { 
            text-align: center; 
            color: #065f46; 
            background: #65f6af; 
            padding: 12px; 
            border-radius: 12px; 
            font-weight: 700; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .input-box { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        .input-box b { font-size: 14px; color: #444; display: block; margin-top: 10px;}
        .input-box input { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0 0; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            font-size: 14px; 
            font-family: 'Hind Siliguri', sans-serif;
        }
        
        .btn-generate { 
            width: 100%; 
            padding: 12px; 
            margin-top: 20px;
            border-radius: 10px; 
            border: none; 
            background: linear-gradient(135deg, #6366f1, #8b5cf6); 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        .btn-generate:active { transform: scale(0.98); }

        /* --- PREVIEW AREA DESIGN (Matches the Image) --- */
        
        /* This wrapper acts as the colorful background */
        #mcqWrapper {
            display: none; /* Hidden initially */
            width: 450px; /* Fixed width for image generation */
            height: 450px; /* Square ratio like Instagram */
            position: relative;
            /* The vibrant gradient background */
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 50%, #f472b6 100%);
            padding: 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* The Header Badge "Quick Quiz" */
        .quiz-badge {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            padding: 8px 30px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
            margin-bottom: 15px;
            z-index: 10;
            font-family: 'Lexend', sans-serif;
        }

        /* The Main White Card */
        .mcq-card-inner {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 20px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .question { 
            font-size: 22px; 
            font-weight: 700; 
            margin-bottom: 20px; 
            color: #111;
            line-height: 1.4;
        }

        /* Options Style */
        .option { 
            display: flex; 
            align-items: center; 
            background: #ffffff; 
            border-radius: 15px; 
            padding: 10px 15px; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .option span { 
            width: 32px; 
            height: 32px; 
            background: #e2e8f0;
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-right: 15px; 
            color: #1e293b; 
            font-weight: 700; 
            font-size: 16px;
            font-family: 'Lexend', sans-serif;
        }

        .option p { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 500;
            color: #333;
        }

        /* Watermark */
        .watermark { 
            margin-top: auto; 
            position: absolute;
            bottom: 15px;
            right: 20px;
            text-align: right; 
            font-size: 12px; 
            font-weight: 600; 
            color: #000;
            font-family: 'Lexend', sans-serif;
        }

        /* Download Button */
        .download-btn { 
            width: 100%; 
            max-width: 450px;
            margin-top: 16px; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            background: #10b981; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            display: none; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
    </style>
</head>
<body>

    <div class="app-container">
        <div class="h23">Create MCQ</div>
        <div class="input-box">
            <b>Enter Question (Bengali/English)</b>
            <input id="question" placeholder="প্রশ্ন লিখুন...">
            <b>Option A</b>
            <input id="optA" placeholder="অপশন ক">
            <b>Option B</b>
            <input id="optB" placeholder="অপশন খ">
            <b>Option C</b>
            <input id="optC" placeholder="অপশন গ">
            <b>Option D</b>
            <input id="optD" placeholder="অপশন ঘ">
            <button class="btn-generate" onclick="generateMCQ()">Generate MCQ</button>
        </div>
    </div>

    <div id="mcqWrapper">
        <div class="quiz-badge">Quick Quiz</div>
        
        <div class="mcq-card-inner">
            <div class="question" id="qText"></div>
            
            <div class="option">
                <span>A</span>
                <p id="aText"></p>
            </div>
            <div class="option">
                <span>B</span>
                <p id="bText"></p>
            </div>
            <div class="option">
                <span>C</span>
                <p id="cText"></p>
            </div>
            <div class="option">
                <span>D</span>
                <p id="dText"></p>
            </div>
        </div>

        <div class="watermark">Follow: Interactive Learning</div>
    </div>

    <button class="download-btn" id="mcqBtn" onclick="downloadMCQ()">Download Image</button>

    <script>
        function generateMCQ() {
            const q = document.getElementById('question').value;
            const a = document.getElementById('optA').value;
            const b = document.getElementById('optB').value;
            const c = document.getElementById('optC').value;
            const d = document.getElementById('optD').value;

            if (!q || !a || !b || !c || !d) {
                alert("সব ঘর পূরণ করো");
                return;
            }

            const wrapper = document.getElementById('mcqWrapper');
            const downloadBtn = document.getElementById('mcqBtn');

            // Show the preview area
            wrapper.style.display = "flex";
            downloadBtn.style.display = "block";

            // Set text content
            document.getElementById('qText').innerText = "☆ " + q;
            document.getElementById('aText').innerText = a;
            document.getElementById('bText').innerText = b;
            document.getElementById('cText').innerText = c;
            document.getElementById('dText').innerText = d;
            
            // Scroll to preview
            wrapper.scrollIntoView({ behavior: 'smooth' });
        }

        function downloadMCQ() {
            const wrapper = document.getElementById("mcqWrapper");
            const randomName = "quiz_" + Date.now();

            // Capture the colorful wrapper, not just the inner card
            html2canvas(wrapper, {
                scale: 2, // Higher quality
                useCORS: true,
                backgroundColor: null // Keeps gradient
            }).then(canvas => {
                const link = document.createElement("a");
                link.download = randomName + ".png";
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }
    </script>
</body>
</html>
