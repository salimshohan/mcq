        :root {
            --primary: #8b5cf6;
            --dark-bg: #0f172a;

            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            
            /* Dynamic Card Variables */
            --card-gradient: linear-gradient(135deg, #242066, #171542);
            --card-accent: #fbbf24;
            --card-text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }

        body { 
            background-color: var(--dark-bg);
            background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0, transparent 50%), 
                              radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- STYLISH HEADER --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .hamburger {
            cursor: pointer;
            width: 30px;
            height: 20px;
            position: relative;
            z-index: 1100;
        }
        
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            position: absolute;
            transition: 0.3s;
            border-radius: 2px;
        }
        
        .hamburger span:nth-child(1) { top: 0; }
        .hamburger span:nth-child(2) { top: 9px; }
        .hamburger span:nth-child(3) { top: 18px; }

        .hamburger.active span:nth-child(1) { transform: rotate(45deg); top: 9px; }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg); top: 9px; }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: rgba(30, 41, 59, 0.98); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border-color);
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-size: 16px; font-weight: 500; border-bottom: 1px solid var(--border-color);
            transition: 0.3s;
        }
        .nav-menu a:hover { background: rgba(139, 92, 246, 0.1); color: #a78bfa; padding-left: 35px; }

        /* --- MAIN LAYOUT --- */
        .container {
            margin-top: 90px;
            width: 95%;
            max-width: 1000px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding-bottom: 40px;
            flex: 1;
        }

        /* --- EDITOR SECTION --- */
        .editor-box {
            flex: 1; min-width: 340px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .editor-header {
            font-size: 18px; font-weight: 700; margin-bottom: 25px;
            color: #a78bfa; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }

        /* Stylish Input Labels */
        .input-group { margin-bottom: 18px; position: relative; }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex; align-items: center; gap: 6px;
        }
        .input-group label i { color: #8b5cf6; }

        .input-group input, .theme-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
        }
        .input-group input:focus, .theme-select:focus {
            outline: none; border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        /* Theme Selector Styles */
        .theme-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a78bfa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 10px auto;
            border-color: #6366f1;
            font-weight: 500;
        }

        .btn-generate {
            width: 100%; padding: 14px; margin-top: 10px;
            border-radius: 10px; border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; font-weight: 600; font-size: 15px;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-generate:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-download {
            width: 100%; padding: 14px; margin-top: 15px;
            border-radius: 50px; border: none;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: white; font-weight: 700; font-size: 14px;
            cursor: pointer; display: none;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }

        /* --- PREVIEW SECTION --- */
        .preview-box {
            flex: 1; min-width: 340px;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 20px;
        }

        /* --- MCQ CARD (COMPACT) --- */
        #mcqWrapper {
            width: 100%; max-width: 360px; /* Width Controlled */
            background: var(--card-gradient);
            border-radius: 12px;
            padding: 20px 15px; /* Compact Padding */
            display: none; flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            /* Corner Fix */
            overflow: hidden; 
        }

        /* Question */
        .question-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .q-prefix { color: var(--card-accent); font-size: 18px; font-weight: 800; line-height: 1.3; flex-shrink: 0; }
        .q-text { color: var(--card-text); font-size: 16px; font-weight: 600; line-height: 1.4; }

        /* Options */
        .options-list { display: flex; flex-direction: column; gap: 6px; }
        .opt-item {
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px 10px; /* Small Padding */
        }
        .opt-circle {
            width: 20px; height: 20px; flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: var(--card-text);
            display: flex; justify-content: center; align-items: center;
            font-size: 10px; font-weight: 700; margin-right: 8px;
        }
        .opt-text { color: var(--card-text); font-size: 13px; font-weight: 500; }

        /* Footer Decoration */
        .card-line { width: 30px; height: 3px; background: var(--card-accent); margin: 15px auto 6px; border-radius: 2px; }
        .card-brand { text-align: center; color: rgba(255, 255, 255, 0.6); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; }

        /* --- STYLISH FOOTER --- */
        footer {
            width: 100%; margin-top: auto;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 20px; text-align: center;
            color: #64748b; font-size: 13px;
        }
        footer span { color: #8b5cf6; font-weight: 600; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .preview-box { order: -1; } /* Preview on top in mobile */

</head>

                </div>
                <div class="card-line"></div>
                <div class="card-brand">Follow: Interactive Learning</div>
            </div>
        </div>
    </div>

            { name: "Piggy Pink", bg: "linear-gradient(135deg, #ee9ca7, #ffdde1)", accent: "#333" },
            { name: "Pale Wood", bg: "linear-gradient(135deg, #eacda3, #d6ae7b)", accent: "#333" },
            { name: "Haikus", bg: "linear-gradient(135deg, #fd746c, #ff9068)", accent: "#fff" },
            { name: "Pizelex", bg: "linear-gradient(135deg, #114357, #F29492)", accent: "#fff" },
            { name: "Sky Glider", bg: "linear-gradient(135deg, #88d3ce, #6e45e2)", accent: "#fff" },
            { name: "Horizon", bg: "linear-gradient(135deg, #003973, #E5E5BE)", accent: "#fff" },
            { name: "Neuromancer", bg: "linear-gradient(135deg, #f953c6, #b91d73)", accent: "#fff" },
            { name: "Witching Hour", bg: "linear-gradient(135deg, #c31432, #240b36)", accent: "#fff" },
            { name: "Superman", bg: "linear-gradient(135deg, #0099F7, #F11712)", accent: "#fff" },
            { name: "Solid Vault", bg: "linear-gradient(135deg, #3a7bd5, #3a6073)", accent: "#fff" },
            { name: "Passion", bg: "linear-gradient(135deg, #e53935, #e35d5b)", accent: "#fff" },
            { name: "Dark Knight", bg: "linear-gradient(135deg, #BA8B02, #181818)", accent: "#fff" },
            { name: "Piglet", bg: "linear-gradient(135deg, #ee9ca7, #ffdde1)", accent: "#555" },
            { name: "Timber", bg: "linear-gradient(135deg, #fc00ff, #00dbde)", accent: "#fff" },
            { name: "Mantle", bg: "linear-gradient(135deg, #24c6dc, #514a9d)", accent: "#fff" },
            { name: "Dracula", bg: "linear-gradient(135deg, #DC2424, #4A569D)", accent: "#fff" },
            { name: "Mossy", bg: "linear-gradient(135deg, #134E5E, #71B280)", accent: "#fff" }
        ];

        // Populate Dropdown
        const selector = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let option = document.createElement("option");
            option.value = i;
            option.text = `${i + 1}. ${t.name}`;
            selector.appendChild(option);
        });

        // Apply Theme
        function applyTheme() {
            const idx = document.getElementById('themeSelector').value;
            const theme = themes[idx];
            const wrapper = document.getElementById('mcqWrapper');
            
            wrapper.style.background = theme.bg;
            
            // Set styles dynamically
            document.querySelector('.q-prefix').style.color = theme.accent;
            document.querySelector('.card-line').style.background = theme.accent;
            document.querySelector('.q-text').style.color = theme.name.includes("Light") || theme.name.includes("Days") ? "#111" : "#fff";
            
            // Update Circles
            const circles = document.querySelectorAll('.opt-circle');
            circles.forEach(c => c.style.color = theme.name.includes("Light") ? "#111" : "#fff");
            
            // Update Text color for light themes
            const texts = document.querySelectorAll('.opt-text');
            texts.forEach(t => t.style.color = theme.name.includes("Light") ? "#333" : "#fff");
        }

        // Generate
        function generate() {
            const q = document.getElementById('qInput').value;
            const a = document.getElementById('optA').value;
            const b = document.getElementById('optB').value;
            const c = document.getElementById('optC').value;
            const d = document.getElementById('optD').value;

            if(!q || !a || !b || !c || !d) { alert("Please fill all fields!"); return; }

            document.getElementById('pQ').innerText = q;
            document.getElementById('pA').innerText = a;
            document.getElementById('pB').innerText = b;
            document.getElementById('pC').innerText = c;
            document.getElementById('pD').innerText = d;

            const wrapper = document.getElementById('mcqWrapper');
            wrapper.style.display = 'flex';
            document.getElementById('dlBtn').style.display = 'block';

            applyTheme();

            if(window.innerWidth < 768) {
                wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Download
        function downloadImage() {
            const wrapper = document.getElementById('mcqWrapper');
            html2canvas(wrapper, { scale: 3, backgroundColor: null, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'MCQ-Card.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
