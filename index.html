<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #f0f2f5; 
            font-family: 'Hind Siliguri', 'Lexend', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            margin-bottom: 30px;
        }

        /* --- Shared Color Animation Keyframes --- */
        @keyframes colorChange {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Header --- */
        .h23 { 
            text-align: center; 
            color: white; 
            background: linear-gradient(45deg, #6366f1, #8b5cf6, #ec4899, #3b82f6);
            background-size: 300% 300%;
            animation: colorChange 6s ease infinite;
            padding: 15px; 
            border-radius: 12px; 
            font-weight: 700; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            font-size: 20px;
        }

        .input-box { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        .input-box b { font-size: 14px; color: #444; display: block; margin-top: 10px;}
        
        .input-box input { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0 0; 
            border-radius: 8px; 
            border: 2px solid #e2e8f0; 
            font-size: 14px; 
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s ease;
        }
        
        .input-box input:hover { border-color: #cbd5e1; }
        .input-box input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            background: #fdfcff;
        }
        
        /* --- Animated Generate Button --- */
        .btn-generate { 
            width: 100%; 
            padding: 14px; 
            margin-top: 20px;
            border-radius: 10px; 
            border: none; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            background: linear-gradient(45deg, #6366f1, #8b5cf6, #ec4899, #3b82f6);
            background-size: 300% 300%;
            animation: colorChange 4s ease infinite;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-generate:hover {
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        .btn-generate:active { transform: scale(0.98); }

        /* --- PREVIEW AREA --- */
        
        /* REQUIREMENT: Outer box gets the animation now */
        #mcqWrapper {
            display: none; 
            width: 100%;          
            max-width: 400px;
            position: relative;
            
            /* Animated Gradient Background applied here */
            background: linear-gradient(45deg, #6366f1, #8b5cf6, #ec4899, #3b82f6);
            background-size: 300% 300%;
            animation: colorChange 6s ease infinite;
            
            padding: 12px; 
            border-radius: 2px; /* Square outer box */
            
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .quiz-badge {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            padding: 4px 18px; 
            margin-bottom: 8px; 
            border-radius: 20px;
            font-size: 14px; 
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
            font-family: 'Lexend', sans-serif;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* REQUIREMENT: Inner box reverted to static white */
        .mcq-card-inner {
            background: rgba(255, 255, 255, 0.98); /* Static white */
            border-radius: 16px;
            padding: 18px 12px 10px 12px; 
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        /* Question text color reverted to dark */
        .question { 
            font-size: 18px; 
            font-weight: 700; 
            margin-bottom: 15px; 
            color: #1e293b; /* Dark color */
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
        }
        
        /* Q prefix styled for light background */
        .q-prefix {
            color: #6366f1;
            font-size: 20px;
            margin-right: 8px;
            font-weight: 800;
            background: #e0e7ff; /* Light purple background */
            padding: 0 8px;
            border-radius: 6px;
            line-height: 26px;
        }

        .option { 
            display: flex; 
            align-items: center; 
            background: #ffffff; 
            border-radius: 10px; 
            padding: 5px 6px; 
            margin-bottom: 5px; 
            border: 1px solid #e2e8f0; /* Subtle gray border */
        }

        .option span { 
            min-width: 26px; 
            height: 26px; 
            background: #f1f5f9;
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-right: 7px; 
            color: #475569; 
            font-weight: 700; 
            font-size: 11px;
        border: 1px solid #cbd5e1;
        }

        .option p { 
            margin: 0; 
            font-size: 15px; 
            font-weight: 500;
            color: #334155;
        }

        /* Watermark color reverted to gray */
        .watermark { 
            margin-top: 8px;      
            width: 100%;           
            text-align: center;     
            font-size: 10px; 
            font-weight: 600; 
            font-family: 'Lexend', sans-serif;
            letter-spacing: 0.5px;
            color: #94a3b8; /* Gray color */
        }

        /* Animated Download Button */
        .download-btn { 
            width: 100%; 
            max-width: 420px;
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            display: none; 
            background: linear-gradient(45deg, #6366f1, #8b5cf6, #ec4899, #3b82f6);
            background-size: 300% 300%;
            animation: colorChange 4s ease infinite;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .download-btn:hover {
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        .download-btn:active { transform: scale(0.98); }
        
    </style>
</head>
<body>

    <div class="app-container">
        <div class="h23">Create MCQ</div>
        
        <div class="input-box">
            <b>Enter Question</b>
            <input id="question" placeholder="প্রশ্নটি এখানে লিখুন...">
            <b>Option A</b>
            <input id="optA" placeholder="অপশন ক">
            <b>Option B</b>
            <input id="optB" placeholder="অপশন খ">
            <b>Option C</b>
            <input id="optC" placeholder="অপশন গ">
            <b>Option D</b>
            <input id="optD" placeholder="অপশন ঘ">
            <button class="btn-generate" onclick="generateMCQ()">Generate MCQ</button>
        </div>
    </div>

    <div id="mcqWrapper">
        <div class="quiz-badge">Quick Quiz</div>
        
        <div class="mcq-card-inner">
            <div class="question">
                <span class="q-prefix">Q.</span>
                <span id="qText"></span>
            </div>
            
            <div class="option">
                <span>A</span>
                <p id="aText"></p>
            </div>
            <div class="option">
                <span>B</span>
                <p id="bText"></p>
            </div>
            <div class="option">
                <span>C</span>
                <p id="cText"></p>
            </div>
            <div class="option">
                <span>D</span>
                <p id="dText"></p>
            </div>

            <div class="watermark">Follow: Interactive Learning</div>
        </div>
    </div>

    <button class="download-btn" id="mcqBtn" onclick="downloadMCQ()">Download Image</button>

    <script>
        function generateMCQ() {
            const q = document.getElementById('question').value;
            const a = document.getElementById('optA').value;
            const b = document.getElementById('optB').value;
            const c = document.getElementById('optC').value;
            const d = document.getElementById('optD').value;

            if (!q || !a || !b || !c || !d) {
                alert("সব ঘর পূরণ করো");
                return;
            }

            const wrapper = document.getElementById('mcqWrapper');
            const downloadBtn = document.getElementById('mcqBtn');

            wrapper.style.display = "flex";
            downloadBtn.style.display = "block";

            document.getElementById('qText').innerText = q;
            document.getElementById('aText').innerText = a;
            document.getElementById('bText').innerText = b;
            document.getElementById('cText').innerText = c;
            document.getElementById('dText').innerText = d;
            
            wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function downloadMCQ() {
            const wrapper = document.getElementById("mcqWrapper");
            const randomName = "quiz_" + Date.now();

            html2canvas(wrapper, {
                scale: 35, 
                useCORS: true,
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement("a");
                link.download = randomName + ".png";
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }
    </script>
</body>
</html>
