<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator | Interactive Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            /* --- DARK MODE (DEFAULT) --- */
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7); /* Glassy Panel */
            --header-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-border: rgba(255, 255, 255, 0.15);
            --primary: #8b5cf6;
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            
            /* Card Defaults */
            --card-gradient: linear-gradient(135deg, #242066, #171542);
            --card-accent: #fbbf24;
            --card-text: #ffffff;
        }

        /* --- LIGHT MODE OVERRIDE --- */
        body.light-mode {
            --bg-color: #eef2f6; /* Soft Blue-Grey */
            --panel-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }

        body { 
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* --- STYLISH NAVBAR --- */
        header {
            width: 100%;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap; /* Prevent line break */
        }

        .header-actions { display: flex; align-items: center; gap: 15px; }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .theme-toggle:hover { background: var(--input-bg); color: var(--primary); border-color: var(--primary); }

        .hamburger { cursor: pointer; font-size: 22px; color: var(--text-main); }

        /* Menu */
        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: var(--bg-color); /* Match body bg */
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 30px rgba(0,0,0,0.3);
            border-left: 1px solid var(--border-color);
            z-index: 999;
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-color);
            transition: 0.2s;
        }
        .nav-menu a:hover { padding-left: 35px; color: var(--primary); background: var(--input-bg); }

        /* --- CONTAINER --- */
        .container {
            margin-top: 90px;
            width: 95%;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding-bottom: 40px;
            flex: 1;
        }

        /* --- EDITOR STYLING --- */
        .editor-box {
            flex: 1; min-width: 350px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 20px; font-weight: 700; margin-bottom: 25px;
            color: var(--primary); display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }

        /* Stylish Inputs */
        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-size: 12px; font-weight: 700;
            color: var(--text-muted); margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            background: var(--bg-color);
        }
        
        .row-inputs { display: flex; gap: 15px; }
        .row-inputs > div { flex: 1; }

        /* Buttons */
        .btn-generate {
            width: 100%; padding: 15px; margin-top: 10px;
            border-radius: 12px; border: none;
            background: var(--primary-gradient);
            color: white; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            font-size: 15px; letter-spacing: 0.5px;
            transition: transform 0.2s;
        }
        .btn-generate:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-download {
            width: 100%; padding: 15px; margin-top: 15px;
            border-radius: 50px; border: none;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: white; font-weight: 700; cursor: pointer; display: none;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        /* --- PREVIEW SECTION --- */
        .preview-box {
            flex: 1; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 10px;
        }

        /* --- MCQ CARD --- */
        #mcqWrapper {
            width: 100%; max-width: 400px;
            background: var(--card-gradient);
            border-radius: 16px;
            padding: 30px 25px;
            display: none; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }

        .question-box { display: flex; gap: 12px; margin-bottom: 20px; }
        .q-prefix { color: var(--card-accent); font-size: 22px; font-weight: 800; line-height: 1.3; flex-shrink: 0; }
        .q-text { color: var(--card-text); font-size: 18px; font-weight: 600; line-height: 1.4; }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .opt-item {
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; padding: 10px 14px;
            transition: 0.3s;
        }
        .opt-circle {
            width: 26px; height: 26px; flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: var(--card-text);
            display: flex; justify-content: center; align-items: center;
            font-size: 12px; font-weight: 700; margin-right: 12px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .opt-text { color: var(--card-text); font-size: 15px; font-weight: 500; }

        .card-footer { margin-top: 25px; text-align: center; }
        .card-line { width: 40px; height: 4px; background: var(--card-accent); margin: 0 auto 10px; border-radius: 4px; }
        .card-brand { color: rgba(255, 255, 255, 0.6); font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }

        /* Footer */
        footer {
            width: 100%; padding: 25px; text-align: center;
            background: var(--header-bg); border-top: 1px solid var(--border-color);
            margin-top: auto; font-size: 13px; color: var(--text-muted);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .brand-logo { font-size: 18px; } /* Smaller font on mobile */
            .editor-box, .preview-box { min-width: 100%; }
        }
    </style>
</head>
<body class=""> <header>
        <div class="brand-logo">
            <i class="fas fa-layer-group" style="margin-right: 8px;"></i> Interactive Learning
        </div>
        
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()" title="Switch Theme">
                <i class="fas fa-sun" id="themeIcon"></i>
            </button>
            
            <div class="hamburger" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
        </div>

        <div class="nav-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="notice.html">Notice</a>
            <a href="quotation.html">Quotation</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-box">
            <div class="section-title"><i class="fas fa-edit"></i> MCQ Generator</div>

            <div class="row-inputs">
                <div class="input-group">
                    <label>Prefix Style</label>
                    <select id="qStyle" class="form-control" onchange="updatePreviewLive()">
                        <option value="Q.">Q.</option>
                        <option value="?">?</option>
                        <option value="প্রশ্ন:">প্রশ্ন:</option>
                        <option value="Question:">Question:</option>
                        <option value="">None</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Option Style</label>
                    <select id="optStyle" class="form-control" onchange="updatePreviewLive()">
                        <option value="english">A, B, C, D</option>
                        <option value="bengali">ক, খ, গ, ঘ</option>
                        <option value="roman">i, ii, iii, iv</option>
                        <option value="number">1, 2, 3, 4</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Select Theme (100+ Styles)</label>
                <select id="themeSelector" class="form-control" onchange="updatePreviewLive()">
                    </select>
            </div>

            <div class="input-group">
                <label>Question Text</label>
                <input id="qInput" class="form-control" placeholder="Type your question here..." oninput="updatePreviewLive()">
            </div>

            <div class="input-group">
                <label>Options</label>
                <input id="optA" class="form-control" placeholder="Option 1" style="margin-bottom:10px;" oninput="updatePreviewLive()">
                <input id="optB" class="form-control" placeholder="Option 2" style="margin-bottom:10px;" oninput="updatePreviewLive()">
                <input id="optC" class="form-control" placeholder="Option 3" style="margin-bottom:10px;" oninput="updatePreviewLive()">
                <input id="optD" class="form-control" placeholder="Option 4" oninput="updatePreviewLive()">
            </div>

            <button class="btn-generate" onclick="generate()">
                <i class="fas fa-magic"></i> Generate Card
            </button>
            <button class="btn-download" id="dlBtn" onclick="downloadImage()">
                <i class="fas fa-download"></i> Download Image
            </button>
        </div>

        <div class="preview-box">
            <div id="mcqWrapper">
                <div class="question-box">
                    <span id="pPrefix" class="q-prefix">Q.</span>
                    <span id="pQ" class="q-text">Your question will appear here...</span>
                </div>
                <div class="options-list">
                    <div class="opt-item"><div class="opt-circle" id="oc1">A</div><div id="pA" class="opt-text">Option 1</div></div>
                    <div class="opt-item"><div class="opt-circle" id="oc2">B</div><div id="pB" class="opt-text">Option 2</div></div>
                    <div class="opt-item"><div class="opt-circle" id="oc3">C</div><div id="pC" class="opt-text">Option 3</div></div>
                    <div class="opt-item"><div class="opt-circle" id="oc4">D</div><div id="pD" class="opt-text">Option 4</div></div>
                </div>
                <div class="card-footer">
                    <div class="card-line"></div>
                    <div class="card-brand">Follow: Interactive Learning</div>
                </div>
            </div>
        </div>
    </div>

    <footer>&copy; <span id="year"></span> Interactive Learning.</footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        // --- THEME TOGGLE (Dark Default) ---
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            
            body.classList.toggle('light-mode');
            
            if(body.classList.contains('light-mode')) {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
        }

        // --- 100 THEMES LOGIC ---
        const themes = [
            { name: "Royal Blue (Pro)", bg: "linear-gradient(135deg, #242066, #171542)", accent: "#fbbf24" },
            { name: "Forest Emerald", bg: "linear-gradient(135deg, #064e3b, #065f46)", accent: "#34d399" },
            { name: "Ruby Red", bg: "linear-gradient(135deg, #7f1d1d, #991b1b)", accent: "#fca5a5" },
            { name: "Midnight Sky", bg: "linear-gradient(135deg, #0f172a, #1e293b)", accent: "#38bdf8" },
            { name: "Sunset Orange", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Deep Purple", bg: "linear-gradient(135deg, #4c1d95, #7c3aed)", accent: "#c4b5fd" },
            { name: "Ocean Teal", bg: "linear-gradient(135deg, #115e59, #14b8a6)", accent: "#5eead4" },
            { name: "Charcoal Grey", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" }
        ];

        // Generate more themes
        for(let i=themes.length; i<100; i++) {
             const hue = Math.floor(Math.random() * 360);
             themes.push({
                 name: `Style ${i+1}`,
                 bg: `linear-gradient(135deg, hsl(${hue}, 60%, 20%), hsl(${hue}, 60%, 10%))`,
                 accent: `hsl(${(hue+180)%360}, 80%, 60%)`
             });
        }

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        // --- OPTIONS MAP ---
        const optionTypes = {
            english: ['A', 'B', 'C', 'D'],
            bengali: ['ক', 'খ', 'গ', 'ঘ'],
            roman: ['i', 'ii', 'iii', 'iv'],
            number: ['1', '2', '3', '4']
        };

        // --- PREVIEW UPDATE ---
        function updatePreviewLive() {
            const q = document.getElementById('qInput').value || "Your question will appear here...";
            document.getElementById('pQ').innerText = q;

            document.getElementById('pA').innerText = document.getElementById('optA').value || "Option 1";
            document.getElementById('pB').innerText = document.getElementById('optB').value || "Option 2";
            document.getElementById('pC').innerText = document.getElementById('optC').value || "Option 3";
            document.getElementById('pD').innerText = document.getElementById('optD').value || "Option 4";

            // Prefix
            document.getElementById('pPrefix').innerText = document.getElementById('qStyle').value;

            // Option Labels
            const optStyle = document.getElementById('optStyle').value;
            const labels = optionTypes[optStyle];
            document.getElementById('oc1').innerText = labels[0];
            document.getElementById('oc2').innerText = labels[1];
            document.getElementById('oc3').innerText = labels[2];
            document.getElementById('oc4').innerText = labels[3];

            // Theme
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            const wrapper = document.getElementById('mcqWrapper');
            
            wrapper.style.background = theme.bg;
            document.querySelector('.q-prefix').style.color = theme.accent;
            document.querySelector('.card-line').style.background = theme.accent;
        }

        function generate() {
            updatePreviewLive();
            const wrapper = document.getElementById('mcqWrapper');
            wrapper.style.display = 'flex';
            document.getElementById('dlBtn').style.display = 'block';
            if(window.innerWidth < 768) wrapper.scrollIntoView({behavior: 'smooth', block: 'center'});
        }

        function downloadImage() {
            const wrapper = document.getElementById('mcqWrapper');
            html2canvas(wrapper, {scale: 3, backgroundColor: null, useCORS: true}).then(canvas => {
                const link = document.createElement('a');
                link.download = 'MCQ_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
