<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator Pro Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #020617;
            --panel-glass: rgba(30, 41, 59, 0.4);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #8b5cf6;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }

        body { 
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hamburger {
            cursor: pointer;
            width: 30px;
            height: 20px;
            position: relative;
            z-index: 1100;
        }
        
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: white;
            position: absolute;
            transition: 0.3s;
            border-radius: 2px;
        }
        .hamburger span:nth-child(1) { top: 0; }
        .hamburger span:nth-child(2) { top: 9px; }
        .hamburger span:nth-child(3) { top: 18px; }

        .hamburger.active span:nth-child(1) { transform: rotate(45deg); top: 9px; }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg); top: 9px; }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: #0f172a;
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border-glass);
        }
        .nav-menu.open { right: 0; }
        
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-glass);
            transition: 0.2s;
        }
        .nav-menu a:hover { padding-left: 35px; color: var(--primary); background: rgba(255,255,255,0.03); }

        /* --- CONTAINER --- */
        .container {
            margin-top: 90px;
            width: 95%;
            max-width: 1000px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding-bottom: 40px;
            flex: 1;
        }

        /* --- EDITOR --- */
        .editor-box {
            flex: 1; min-width: 340px;
            background: var(--panel-glass);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--border-glass); padding-bottom: 15px;
        }
        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        
        /* Reset Buttons */
        .action-buttons { display: flex; gap: 10px; }
        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass);
            color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: white; }
        .btn-reset:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); border-color: var(--danger); }
        .btn-undo { display: none; color: var(--success); border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .btn-undo:hover { background: rgba(16, 185, 129, 0.2); }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: var(--text-muted); margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
            transition: 0.3s;
        }
        .form-control:focus { outline: none; border-color: var(--primary); background: rgba(0,0,0,0.5); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1); }

        .row-inputs { display: flex; gap: 15px; }
        .row-inputs > div { flex: 1; }

        /* Generate Button */
        .btn-generate {
            width: 100%; padding: 15px; margin-top: 15px;
            border-radius: 12px; border: none;
            color: white; font-weight: 700; cursor: pointer;
            font-size: 15px; letter-spacing: 0.5px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            background-size: 200% 200%;
            animation: gradientAnim 4s ease infinite;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }
        .btn-generate:hover { transform: translateY(-2px); }

        @keyframes gradientAnim { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .btn-download {
            width: 100%; padding: 15px; margin-top: 15px;
            border-radius: 50px; border: none;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: white; font-weight: 700; cursor: pointer; display: none;
            text-transform: uppercase; font-size: 13px;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
        }

        /* --- PREVIEW --- */
        .preview-box {
            flex: 1; min-width: 340px;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 10px;
        }

        /* --- STYLISH MCQ CARD --- */
        #mcqWrapper {
            width: 100%; max-width: 400px;
            /* Background set dynamically */
            border-radius: 20px;
            padding: 30px 25px;
            display: none; flex-direction: column;
            position: relative;
            /* Glassy Border Effect */
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden; /* Ensures content stays inside radius */
        }
        
        /* Inner Glow/Shine Element */
        #mcqWrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 40%);
            pointer-events: none; z-index: 0;
        }

        .card-content { position: relative; z-index: 1; }

        .question-box { display: flex; gap: 12px; margin-bottom: 20px; }
        .q-prefix { color: #fbbf24; font-size: 20px; font-weight: 800; line-height: 1.3; flex-shrink: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .q-text { color: #fff; font-size: 18px; font-weight: 600; line-height: 1.4; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        
        .opt-item {
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.05); /* Very subtle fill */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 10px 14px;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .opt-circle {
            width: 28px; height: 28px; flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 12px; font-weight: 700; margin-right: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .opt-text { color: #f1f5f9; font-size: 15px; font-weight: 500; }

        .card-footer { margin-top: 25px; text-align: center; }
        .card-line { width: 40px; height: 4px; background: #fbbf24; margin: 0 auto 10px; border-radius: 10px; box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .card-brand { color: rgba(255, 255, 255, 0.6); font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

        /* Footer */
        footer {
            width: 100%; padding: 25px; text-align: center;
            background: rgba(15, 23, 42, 0.9); border-top: 1px solid var(--border-glass);
            margin-top: auto; font-size: 12px; color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">Interactive Learning</div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="notice.html">Notice</a>
            <a href="quotation.html">Quotation</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-box">
            <div class="section-header">
                <div class="section-title">MCQ Creator</div>
                <div class="action-buttons">
                    <button class="btn-icon btn-undo" id="undoBtn" onclick="undoReset()" title="Undo">
                        <i class="fas fa-undo"></i>
                    </button>
                    <button class="btn-icon btn-reset" onclick="resetAll()" title="Reset All">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <div class="row-inputs">
                <div class="input-group">
                    <label>Prefix Style</label>
                    <select id="qStyle" class="form-control" onchange="updateLive()">
                        <option value="Q.">Q.</option>
                        <option value="?">?</option>
                        <option value="প্রশ্ন:">প্রশ্ন:</option>
                        <option value="">None</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Option Style</label>
                    <select id="optStyle" class="form-control" onchange="updateLive()">
                        <option value="abcd">a, b, c, d</option>
                        <option value="ABCD">A, B, C, D</option>
                        <option value="roman">i, ii, iii, iv</option>
                        <option value="number">1, 2, 3, 4</option>
                        <option value="bangla">১, ২, ৩, ৪</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Theme Selection</label>
                <select id="themeSelector" class="form-control" onchange="updateLive()">
                    </select>
            </div>

            <div class="input-group">
                <label>Question</label>
                <input id="qInput" class="form-control" placeholder="Type your question..." oninput="updateLive()">
            </div>

            <div class="input-group">
                <label>Options (Inputs)</label>
                <input id="optA" class="form-control" placeholder="Option 1" style="margin-bottom:10px;" oninput="updateLive()">
                <input id="optB" class="form-control" placeholder="Option 2" style="margin-bottom:10px;" oninput="updateLive()">
                <input id="optC" class="form-control" placeholder="Option 3" style="margin-bottom:10px;" oninput="updateLive()">
                <input id="optD" class="form-control" placeholder="Option 4" oninput="updateLive()">
            </div>

            <button class="btn-generate" onclick="generate()">Generate Stylish Card</button>
            <button class="btn-download" id="dlBtn" onclick="downloadImage()">Download Image</button>
        </div>

        <div class="preview-box">
            <div id="mcqWrapper">
                <div class="card-content">
                    <div class="question-box">
                        <span id="pPrefix" class="q-prefix">Q.</span>
                        <span id="pQ" class="q-text">Your question will appear here...</span>
                    </div>
                    <div class="options-list">
                        <div class="opt-item"><div class="opt-circle" id="oc1">a</div><div id="pA" class="opt-text">Option 1</div></div>
                        <div class="opt-item"><div class="opt-circle" id="oc2">b</div><div id="pB" class="opt-text">Option 2</div></div>
                        <div class="opt-item"><div class="opt-circle" id="oc3">c</div><div id="pC" class="opt-text">Option 3</div></div>
                        <div class="opt-item"><div class="opt-circle" id="oc4">d</div><div id="pD" class="opt-text">Option 4</div></div>
                    </div>
                    <div class="card-footer">
                        <div class="card-line"></div>
                        <div class="card-brand">Follow: Interactive Learning</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>&copy; <span id="year"></span> Interactive Learning</footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        // --- MENU LOGIC ---
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // --- THEMES (60 Styles) ---
        const themes = [
            { name: "Royal Blue", bg: "linear-gradient(135deg, #242066, #171542)", accent: "#fbbf24" },
            { name: "Emerald City", bg: "linear-gradient(135deg, #064e3b, #10b981)", accent: "#6ee7b7" },
            { name: "Crimson Red", bg: "linear-gradient(135deg, #7f1d1d, #991b1b)", accent: "#fca5a5" },
            { name: "Midnight Sky", bg: "linear-gradient(135deg, #0f172a, #1e293b)", accent: "#38bdf8" },
            { name: "Sunset Blaze", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Deep Violet", bg: "linear-gradient(135deg, #4c1d95, #7c3aed)", accent: "#c4b5fd" },
            { name: "Ocean Teal", bg: "linear-gradient(135deg, #115e59, #14b8a6)", accent: "#5eead4" },
            { name: "Charcoal Grey", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Pure Black", bg: "linear-gradient(135deg, #000000, #111111)", accent: "#ffffff" },
            { name: "Facebook Blue", bg: "linear-gradient(135deg, #1877f2, #0d47a1)", accent: "#ffffff" },
            { name: "Spotify Green", bg: "linear-gradient(135deg, #191414, #1DB954)", accent: "#ffffff" },
            { name: "Youtube Red", bg: "linear-gradient(135deg, #FF0000, #282828)", accent: "#ffffff" },
            { name: "Twitter Dark", bg: "linear-gradient(135deg, #15202b, #192734)", accent: "#1da1f2" },
            { name: "Instagram", bg: "linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)", accent: "#ffffff" },
            { name: "Amethyst", bg: "linear-gradient(135deg, #9d50bb, #6e48aa)", accent: "#ffffff" },
            { name: "Neon Cyber", bg: "linear-gradient(135deg, #2d0036, #0f0c29)", accent: "#00ffff" },
            { name: "Forest Night", bg: "linear-gradient(135deg, #022c22, #065f46)", accent: "#34d399" },
            { name: "Blood Moon", bg: "linear-gradient(135deg, #870000, #190a05)", accent: "#ff0000" },
            { name: "Pumpkin", bg: "linear-gradient(135deg, #d35400, #e67e22)", accent: "#f1c40f" },
            { name: "Seafoam", bg: "linear-gradient(135deg, #00d2ff, #3a7bd5)", accent: "#ffffff" },
            { name: "Gold Rush", bg: "linear-gradient(135deg, #bf953f, #aa771c)", accent: "#000000" },
            { name: "Silver", bg: "linear-gradient(135deg, #C9D6FF, #E2E2E2)", accent: "#333333" },
            { name: "Dark Knight", bg: "linear-gradient(135deg, #000000, #434343)", accent: "#f1c40f" },
            { name: "Space Dust", bg: "linear-gradient(135deg, #20002c, #cbb4d4)", accent: "#ffffff" },
            { name: "Lush", bg: "linear-gradient(135deg, #56ab2f, #a8e063)", accent: "#ffffff" },
            { name: "Cosmic", bg: "linear-gradient(135deg, #ff00cc, #333399)", accent: "#ffffff" },
            { name: "Cool Blues", bg: "linear-gradient(135deg, #2193b0, #6dd5ed)", accent: "#ffffff" },
            { name: "Morning", bg: "linear-gradient(135deg, #FF5F6D, #FFC371)", accent: "#ffffff" },
            { name: "Vampire", bg: "linear-gradient(135deg, #16222A, #3A6073)", accent: "#ffffff" },
            { name: "Frost", bg: "linear-gradient(135deg, #004e92, #000428)", accent: "#ffffff" },
            // Adding duplicates with slight var to reach higher count perception
            { name: "Deep Navy", bg: "linear-gradient(135deg, #001f3f, #003366)", accent: "#FFD700" },
            { name: "Electric Violet", bg: "linear-gradient(135deg, #471175, #7c3aed)", accent: "#c4b5fd" },
            { name: "Dark Moss", bg: "linear-gradient(135deg, #1a2e05, #365314)", accent: "#bef264" },
            { name: "Cherry Bomb", bg: "linear-gradient(135deg, #590d22, #a4133c)", accent: "#ffb3c1" },
            { name: "Brown Sugar", bg: "linear-gradient(135deg, #3f2e3e, #8c52ff)", accent: "#fcd34d" },
            { name: "Blueberry", bg: "linear-gradient(135deg, #172554, #1e3a8a)", accent: "#60a5fa" },
            { name: "Teal Deep", bg: "linear-gradient(135deg, #134e4a, #115e59)", accent: "#5eead4" },
            { name: "Rose Gold", bg: "linear-gradient(135deg, #881337, #9f1239)", accent: "#fda4af" },
            { name: "Graphite", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Shadow", bg: "linear-gradient(135deg, #0f0f0f, #232323)", accent: "#666666" },
            { name: "Northern Lights", bg: "linear-gradient(135deg, #43cea2, #185a9d)", accent: "#ffffff" },
            { name: "Mystic Mauve", bg: "linear-gradient(135deg, #302b63, #24243e)", accent: "#ff0099" },
            { name: "Royal Gold", bg: "linear-gradient(135deg, #bf953f, #fcf6ba)", accent: "#000000" },
            { name: "Flare", bg: "linear-gradient(135deg, #f12711, #f5af19)", accent: "#fff" },
            { name: "Amin", bg: "linear-gradient(135deg, #8e2de2, #4a00e0)", accent: "#fff" },
            { name: "Harmonic", bg: "linear-gradient(135deg, #5433ff, #20bdff)", accent: "#a5fecb" },
            { name: "Radar", bg: "linear-gradient(135deg, #A770EF, #CF8BF3)", accent: "#fff" },
            { name: "Mauve", bg: "linear-gradient(135deg, #42275a, #734b6d)", accent: "#fff" },
            { name: "Horizon", bg: "linear-gradient(135deg, #003973, #E5E5BE)", accent: "#fff" },
            { name: "Neuromancer", bg: "linear-gradient(135deg, #f953c6, #b91d73)", accent: "#fff" }
        ];

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        // --- OPTION MAPPING ---
        const optionTypes = {
            abcd: ['a', 'b', 'c', 'd'],
            ABCD: ['A', 'B', 'C', 'D'],
            roman: ['i', 'ii', 'iii', 'iv'],
            number: ['1', '2', '3', '4'],
            bangla: ['১', '২', '৩', '৪']
        };

        // --- RESET & UNDO LOGIC ---
        let lastState = null;

        function resetAll() {
            // Save state before reset
            lastState = {
                q: document.getElementById('qInput').value,
                a: document.getElementById('optA').value,
                b: document.getElementById('optB').value,
                c: document.getElementById('optC').value,
                d: document.getElementById('optD').value,
                qStyle: document.getElementById('qStyle').value,
                optStyle: document.getElementById('optStyle').value,
                theme: document.getElementById('themeSelector').value
            };

            // Clear fields
            document.getElementById('qInput').value = '';
            document.getElementById('optA').value = '';
            document.getElementById('optB').value = '';
            document.getElementById('optC').value = '';
            document.getElementById('optD').value = '';
            document.getElementById('qStyle').selectedIndex = 0;
            document.getElementById('optStyle').selectedIndex = 0;
            document.getElementById('themeSelector').selectedIndex = 0;

            // Show Undo
            document.getElementById('undoBtn').style.display = 'flex';
            updateLive();
        }

        function undoReset() {
            if (!lastState) return;

            document.getElementById('qInput').value = lastState.q;
            document.getElementById('optA').value = lastState.a;
            document.getElementById('optB').value = lastState.b;
            document.getElementById('optC').value = lastState.c;
            document.getElementById('optD').value = lastState.d;
            document.getElementById('qStyle').value = lastState.qStyle;
            document.getElementById('optStyle').value = lastState.optStyle;
            document.getElementById('themeSelector').value = lastState.theme;

            // Hide Undo
            document.getElementById('undoBtn').style.display = 'none';
            updateLive();
        }

        // --- UPDATE LIVE PREVIEW ---
        function updateLive() {
            const q = document.getElementById('qInput').value || "Your question will appear here...";
            document.getElementById('pQ').innerText = q;
            document.getElementById('pA').innerText = document.getElementById('optA').value || "Option 1";
            document.getElementById('pB').innerText = document.getElementById('optB').value || "Option 2";
            document.getElementById('pC').innerText = document.getElementById('optC').value || "Option 3";
            document.getElementById('pD').innerText = document.getElementById('optD').value || "Option 4";

            document.getElementById('pPrefix').innerText = document.getElementById('qStyle').value;

            const optStyle = document.getElementById('optStyle').value;
            const labels = optionTypes[optStyle];
            document.getElementById('oc1').innerText = labels[0];
            document.getElementById('oc2').innerText = labels[1];
            document.getElementById('oc3').innerText = labels[2];
            document.getElementById('oc4').innerText = labels[3];

            // Apply Theme
            const idx = document.getElementById('themeSelector').value;
            const theme = themes[idx];
            const wrapper = document.getElementById('mcqWrapper');
            
            wrapper.style.background = theme.bg;
            document.querySelector('.q-prefix').style.color = theme.accent;
            document.querySelector('.card-line').style.background = theme.accent;
            document.querySelector('.card-line').style.boxShadow = `0 0 10px ${theme.accent}66`;

            // Adjust for light themes
            const isLight = ["Silver", "Gold Rush", "Morning", "Ice Cold"].includes(theme.name);
            const txtColor = isLight ? "#222" : "#fff";
            
            document.querySelector('.q-text').style.color = txtColor;
            document.querySelectorAll('.opt-text').forEach(t => t.style.color = txtColor);
            
            document.querySelectorAll('.opt-circle').forEach(c => {
                c.style.color = txtColor;
                c.style.background = isLight ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.1)";
                c.style.borderColor = isLight ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.2)";
            });

            document.querySelectorAll('.opt-item').forEach(i => {
                i.style.background = isLight ? "rgba(0,0,0,0.05)" : "rgba(255,255,255,0.05)";
                i.style.borderColor = isLight ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.1)";
            });

            document.querySelector('.card-brand').style.color = isLight ? "#555" : "rgba(255,255,255,0.6)";
        }

        function generate() {
            updateLive();
            const wrapper = document.getElementById('mcqWrapper');
            wrapper.style.display = 'flex';
            document.getElementById('dlBtn').style.display = 'block';
            if(window.innerWidth < 768) wrapper.scrollIntoView({behavior: 'smooth', block: 'center'});
        }

        function downloadImage() {
            const wrapper = document.getElementById('mcqWrapper');
            // Radius Fix: backgroundColor: null and scaling
            html2canvas(wrapper, {
                scale: 3,
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'MCQ_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
