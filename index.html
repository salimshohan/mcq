<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary-color: #6366f1;
            --header-bg: rgba(30, 41, 59, 0.95);
            --body-bg: #0f172a;
            --footer-bg: #020617;
            
            /* Default Card Variables (Will be updated by JS) */
            --card-bg: linear-gradient(135deg, #242066, #171542);
            --text-c: #ffffff;
            --accent: #fbbf24;
            --opt-bg: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Anek Bangla', 'Lexend', sans-serif; }

        body { 
            background: var(--body-bg); 
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER (Distinct Color) --- */
        header {
            width: 100%;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #a5b4fc, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hamburger */
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 5px; z-index: 1100; }
        .hamburger span { width: 25px; height: 3px; background: white; border-radius: 2px; transition: 0.3s; }
        
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

        /* Nav Links */
        .nav-links {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 250px;
            background: #1e293b; display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s; box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        .nav-links.open { right: 0; }
        .nav-links a { color: white; text-decoration: none; padding: 15px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-links a:hover { background: #334155; color: #fbbf24; padding-left: 40px; }

        /* --- MAIN LAYOUT --- */
        .main-content {
            margin-top: 80px;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            flex: 1;
        }

        /* Editor Section */
        .editor-section {
            flex: 1; min-width: 320px;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .editor-section h3 { color: #1e293b; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }

        /* Theme Selector */
        .theme-select {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border-radius: 8px; border: 2px solid #6366f1;
            background: #eef2ff; color: #4338ca; font-weight: 600; cursor: pointer;
        }

        .input-group { margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #333; }
        .input-group input:focus { outline: none; border-color: #6366f1; }

        .btn-generate {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white;
            font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3); }

        .btn-download {
            width: 100%; padding: 14px; margin-top: 15px; border-radius: 50px; border: none;
            background: linear-gradient(90deg, #f59e0b, #d97706); color: white;
            font-weight: 800; cursor: pointer; display: none;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.4);
        }

        /* --- PREVIEW SECTION --- */
        .preview-section {
            flex: 1; min-width: 320px;
            display: flex; justify-content: center; align-items: flex-start;
        }

        /* --- MCQ CARD STYLING (Compact & Stylish) --- */
        #mcqWrapper {
            width: 100%;
            max-width: 380px; /* Reduced Width */
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 15px; /* Reduced Padding (Top/Bottom/Left/Right) */
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* Removed Quick Quiz Badge */

        /* Question */
        .question-box {
            display: flex; gap: 8px; margin-bottom: 15px; /* Reduced Margin */
        }
        .q-mark { color: var(--accent); font-size: 20px; font-weight: 800; line-height: 1.3; }
        .question-text {
            color: var(--text-c); font-size: 17px; font-weight: 600; line-height: 1.4;
        }

        /* Options */
        .options-container { display: flex; flex-direction: column; gap: 6px; } /* Tighter Gap */
        
        .option-item {
            display: flex; align-items: center;
            background: var(--opt-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px 10px; /* Compact Padding */
        }
        
        .option-circle {
            min-width: 22px; height: 22px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2); color: var(--text-c);
            display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 10px; margin-right: 8px;
        }
        .option-text { color: var(--text-c); font-size: 14px; font-weight: 500; }

        /* Footer Elements */
        .divider-line {
            width: 30px; height: 3px; background-color: var(--accent);
            margin: 15px auto 8px auto; border-radius: 2px;
        }
        .card-watermark {
            text-align: center; color: rgba(255, 255, 255, 0.6);
            font-size: 9px; font-weight: 500; letter-spacing: 1px;
        }

        /* --- FOOTER (Distinct Color) --- */
        footer {
            width: 100%; background: var(--footer-bg);
            color: #64748b; text-align: center; padding: 25px;
            margin-top: auto; border-top: 1px solid #1e293b; font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">Interactive Learning</div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="#">Home</a>
            <a href="notice.html">Notice</a>
            <a href="quotation.html">Quotation</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="main-content">
        <div class="editor-section">
            <h3>MCQ Creator Studio</h3>

            <div class="input-group">
                <label>Select Style (200 Variations)</label>
                <select id="themeSelector" class="theme-select" onchange="applyTheme()">
                    </select>
            </div>
            
            <div class="input-group"><input id="question" placeholder="প্রশ্ন (Question)"></div>
            <div class="input-group"><input id="optA" placeholder="Option A"></div>
            <div class="input-group"><input id="optB" placeholder="Option B"></div>
            <div class="input-group"><input id="optC" placeholder="Option C"></div>
            <div class="input-group"><input id="optD" placeholder="Option D"></div>

            <button class="btn-generate" onclick="generateMCQ()">Generate Card</button>
            <button class="btn-download" id="dlBtn" onclick="downloadMCQ()">Download Image</button>
        </div>

        <div class="preview-section">
            <div id="mcqWrapper">
                <div class="question-box">
                    <span class="q-mark">Q.</span>
                    <span id="qText" class="question-text">প্রশ্ন এখানে দেখা যাবে...</span>
                </div>
                <div class="options-container">
                    <div class="option-item"><div class="option-circle">A</div><div class="option-text" id="aText">Option A</div></div>
                    <div class="option-item"><div class="option-circle">B</div><div class="option-text" id="bText">Option B</div></div>
                    <div class="option-item"><div class="option-circle">C</div><div class="option-text" id="cText">Option C</div></div>
                    <div class="option-item"><div class="option-circle">D</div><div class="option-text" id="dText">Option D</div></div>
                </div>
                <div class="divider-line"></div>
                <div class="card-watermark">Follow: Interactive Learning</div>
            </div>
        </div>
    </div>

    <footer>&copy; <span id="year"></span> Interactive Learning. All rights reserved.</footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('open');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // --- GENERATE 200 THEMES DYNAMICALLY ---
        const themeSelect = document.getElementById('themeSelector');
        const themes = [];

        // 1. Manually Curated Best Themes (First 15)
        const curatedThemes = [
            { name: "Royal Blue", bg: "linear-gradient(135deg, #242066, #171542)", accent: "#fbbf24" },
            { name: "Emerald Forest", bg: "linear-gradient(135deg, #064e3b, #065f46)", accent: "#34d399" },
            { name: "Crimson Red", bg: "linear-gradient(135deg, #7f1d1d, #991b1b)", accent: "#fca5a5" },
            { name: "Midnight Black", bg: "linear-gradient(135deg, #000000, #1a1a1a)", accent: "#22d3ee" },
            { name: "Sunset Orange", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Deep Ocean", bg: "linear-gradient(135deg, #0e7490, #155e75)", accent: "#cffafe" },
            { name: "Berry Purple", bg: "linear-gradient(135deg, #701a75, #86198f)", accent: "#f0abfc" },
            { name: "Dark Chocolate", bg: "linear-gradient(135deg, #451a03, #78350f)", accent: "#fde68a" },
            { name: "Slate Grey", bg: "linear-gradient(135deg, #334155, #475569)", accent: "#94a3b8" },
            { name: "Cyber Indigo", bg: "linear-gradient(135deg, #312e81, #4338ca)", accent: "#a5b4fc" },
            { name: "Teal Deep", bg: "linear-gradient(135deg, #134e4a, #115e59)", accent: "#5eead4" },
            { name: "Rose Gold", bg: "linear-gradient(135deg, #881337, #9f1239)", accent: "#fda4af" },
            { name: "Violet Night", bg: "linear-gradient(135deg, #4c1d95, #5b21b6)", accent: "#c4b5fd" },
            { name: "Graphite", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Blueberry", bg: "linear-gradient(135deg, #172554, #1e3a8a)", accent: "#60a5fa" }
        ];

        // 2. Algorithmically Generate the rest up to 200
        for (let i = 0; i < 200; i++) {
            let theme;
            if (i < curatedThemes.length) {
                theme = curatedThemes[i];
            } else {
                // Generate random dark gradients
                const hue = Math.floor(Math.random() * 360);
                const sat = 60 + Math.floor(Math.random() * 40); // 60-100%
                const lig1 = 10 + Math.floor(Math.random() * 20); // 10-30% (Dark)
                const lig2 = lig1 + 10;
                
                const color1 = `hsl(${hue}, ${sat}%, ${lig1}%)`;
                const color2 = `hsl(${hue}, ${sat}%, ${lig2}%)`;
                const accent = `hsl(${(hue + 180) % 360}, 90%, 70%)`; // Complementary accent

                theme = { name: `Custom Style ${i+1}`, bg: `linear-gradient(135deg, ${color1}, ${color2})`, accent: accent };
            }
            themes.push(theme);
            
            // Add to dropdown
            const option = document.createElement('option');
            option.value = i;
            option.text = `${i+1}. ${theme.name}`;
            themeSelect.appendChild(option);
        }

        // Apply Theme Function
        function applyTheme() {
            const index = themeSelect.value;
            const theme = themes[index];
            const wrapper = document.getElementById('mcqWrapper');
            
            // Set CSS Variables dynamically
            wrapper.style.setProperty('--card-bg', theme.bg);
            wrapper.style.setProperty('--accent', theme.accent);
        }

        function generateMCQ() {
            const q = document.getElementById('question').value;
            const a = document.getElementById('optA').value;
            const b = document.getElementById('optB').value;
            const c = document.getElementById('optC').value;
            const d = document.getElementById('optD').value;

            if (!q || !a || !b || !c || !d) { alert("সব ঘর পূরণ করুন!"); return; }

            document.getElementById('qText').innerText = q;
            document.getElementById('aText').innerText = a;
            document.getElementById('bText').innerText = b;
            document.getElementById('cText').innerText = c;
            document.getElementById('dText').innerText = d;

            const wrapper = document.getElementById('mcqWrapper');
            wrapper.style.display = "flex";
            document.getElementById('dlBtn').style.display = "block";
            
            applyTheme(); // Ensure theme is applied

            if(window.innerWidth < 768) wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function downloadMCQ() {
            const wrapper = document.getElementById("mcqWrapper");
            html2canvas(wrapper, { scale: 3, backgroundColor: null, useCORS: true }).then(canvas => {
                const link = document.createElement("a");
                link.download = "MCQ_" + Date.now() + ".png";
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }
    </script>
</body>
</html>
