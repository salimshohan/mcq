<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCQ Demo Site</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef1f6, #dfe3eb);
    }

    .box {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;

    }

      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Hello Vercel 👋</h1>
    <p>My first site is live</p>
  </div>

</body>
</html>
