<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #f0f2f5; 
            font-family: 'Hind Siliguri', 'Lexend', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            margin-bottom: 30px;
        }

        .h23 { 
            text-align: center; 
            color: #065f46; 
            background: #65f6af; 
            padding: 12px; 
            border-radius: 12px; 
            font-weight: 700; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .input-box { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        .input-box b { font-size: 14px; color: #444; display: block; margin-top: 10px;}
        .input-box input { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0 0; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            font-size: 14px; 
            font-family: 'Hind Siliguri', sans-serif;
        }
        
        .btn-generate { 
            width: 100%; 
            padding: 14px; 
            margin-top: 20px;
            border-radius: 10px; 
            border: none; 
            background: linear-gradient(135deg, #6366f1, #8b5cf6); 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        /* --- PREVIEW AREA FIXES --- */
        
        #mcqWrapper {
            display: none; 
            width: 100%;          
            max-width: 400px;
            /* aspect-ratio removed mainly to allow height to grow if needed */
            min-height: 400px; 
            position: relative;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%); /* Slight adjustment for better contrast */
            padding: 25px;
            border-radius: 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .quiz-badge {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
            margin-bottom: 20px; /* Space below badge */
            z-index: 10;
            font-family: 'Lexend', sans-serif;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .mcq-card-inner {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 18px;
            padding: 20px 15px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question { 
            font-size: 19px; 
            font-weight: 700; 
            margin-bottom: 15px; 
            color: #111;
            line-height: 1.4;
        }

        .option { 
            display: flex; 
            align-items: center; 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 8px 12px; 
            margin-bottom: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .option span { 
            min-width: 28px; 
            height: 28px; 
            background: #e2e8f0;
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-right: 10px; 
            color: #1e293b; 
            font-weight: 700; 
            font-size: 14px;
            font-family: 'Lexend', sans-serif;
        }

        .option p { 
            margin: 0; 
            font-size: 16px; 
            font-weight: 500;
            color: #333;
        }

        /* --- UPDATED WATERMARK --- */
        .watermark { 
            margin-top: 15px;      /* Gap between card and text */
            width: 100%;           /* Full width to align right */
            text-align: right; 
            font-size: 12px; 
            font-weight: 800; 
            font-family: 'Lexend', sans-serif;
            letter-spacing: 0.5px;
            
            /* Colorful Gradient Text */
            background: linear-gradient(90deg, #fff, #fbbf24); /* White to Gold Gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Fallback for non-webkit */
            color: #fbbf24; 
        }

        .download-btn { 
            width: 100%; 
            max-width: 420px;
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            background: #10b981; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            display: none; 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25);
        }
        
    </style>
</head>
<body>

    <div class="app-container">
        <div class="h23">MCQ Generator</div>
        <div class="input-box">
            <b>Enter Question</b>
            <input id="question" placeholder="প্রশ্নটি এখানে লিখুন...">
            <b>Option A</b>
            <input id="optA" placeholder="অপশন ক">
            <b>Option B</b>
            <input id="optB" placeholder="অপশন খ">
            <b>Option C</b>
            <input id="optC" placeholder="অপশন গ">
            <b>Option D</b>
            <input id="optD" placeholder="অপশন ঘ">
            <button class="btn-generate" onclick="generateMCQ()">Generate MCQ</button>
        </div>
    </div>

    <div id="mcqWrapper">
        <div class="quiz-badge">Quick Quiz</div>
        
        <div class="mcq-card-inner">
            <div class="question" id="qText"></div>
            
            <div class="option">
                <span>A</span>
                <p id="aText"></p>
            </div>
            <div class="option">
                <span>B</span>
                <p id="bText"></p>
            </div>
            <div class="option">
                <span>C</span>
                <p id="cText"></p>
            </div>
            <div class="option">
                <span>D</span>
                <p id="dText"></p>
            </div>
        </div>

        <div class="watermark">Follow: Interactive Learning</div>
    </div>

    <button class="download-btn" id="mcqBtn" onclick="downloadMCQ()">Download Image</button>

    <script>
        function generateMCQ() {
            const q = document.getElementById('question').value;
            const a = document.getElementById('optA').value;
            const b = document.getElementById('optB').value;
            const c = document.getElementById('optC').value;
            const d = document.getElementById('optD').value;

            if (!q || !a || !b || !c || !d) {
                alert("সব ঘর পূরণ করো");
                return;
            }

            const wrapper = document.getElementById('mcqWrapper');
            const downloadBtn = document.getElementById('mcqBtn');

            wrapper.style.display = "flex";
            downloadBtn.style.display = "block";

            document.getElementById('qText').innerText = "☆ " + q;
            document.getElementById('aText').innerText = a;
            document.getElementById('bText').innerText = b;
            document.getElementById('cText').innerText = c;
            document.getElementById('dText').innerText = d;
            
            wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function downloadMCQ() {
            const wrapper = document.getElementById("mcqWrapper");
            const randomName = "quiz_" + Date.now();

            html2canvas(wrapper, {
                scale: 3, 
                useCORS: true,
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement("a");
                link.download = randomName + ".png";
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }
    </script>
</body>
</html>
