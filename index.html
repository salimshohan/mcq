<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MCQ Generator | Interactive Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Lexend', sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* App Wrapper */
    .app {
      width: 100%;
      max-width: 400px;
    }

    /* Header */
    .h23 {
      text-align: center;
      color: #065f46;
      background: #65f6af;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Input Box */
    .input-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .input-box b {
      font-size: 13px;
    }

    .input-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 14px;
      border-radius: 10px;
      border: 1px solid #6af;
      font-size: 14px;
    }

    .input-box button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* MCQ Card */
    .mcq-card {
      margin-top: 20px;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      display: none;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
    }

    .quiz-header {
      width: fit-content;
      padding: 8px 16px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(99,102,241,0.35);
      text-align: center;
    }

    .question {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .option {
      display: flex;
      align-items: center;
      background: #f1f3f5;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
      opacity: 0.9;
      font-weight: 600;
    }

    .option span {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 2px solid #aaa;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 10px;
      color: #012;
      font-weight: 700;
    }

    .option p {
      margin: 0;
      font-size: 14px;
    }

    /* Watermark */
    .watermark {
      margin-top: 14px;
      text-align: right;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }

    /* Download Button */
    .download-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: #10b981;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="h23">Create MCQ</div>

    <div class="input-box">
      <b>Enter Question</b>
      <input id="question" placeholder="Enter question">

      <b>Option A</b>
      <input id="optA" placeholder="Option A">

      <b>Option B</b>
      <input id="optB" placeholder="Option B">

      <b>Option C</b>
      <input id="optC" placeholder="Option C">

      <b>Option D</b>
      <input id="optD" placeholder="Option D">

      <button onclick="generateMCQ()">Generate MCQ</button>
    </div>

    <div id="mcqWrapper">
      <div class="mcq-card" id="mcqCard">
        <div class="quiz-header">Quick Quiz</div>

        <div class="question" id="qText"></div>

        <div class="option"><span>A</span><p id="aText"></p></div>
        <div class="option"><span>B</span><p id="bText"></p></div>
        <div class="option"><span>C</span><p id="cText"></p></div>
        <div class="option"><span>D</span><p id="dText"></p></div>

        <div class="watermark">Follow: Interactive Learning</div>
      </div>
    </div>

    <button class="download-btn" id="mcqBtn" onclick="downloadMCQ()">Download Image</button>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    function generateMCQ() {
      const q = question.value;
      const a = optA.value;
      const b = optB.value;
      const c = optC.value;
      const d = optD.value;

      if (!q || !a || !b || !c || !d) {
        alert("সব ঘর পূরণ করো");
        return;
      }

      mcqCard.style.display = "block";
      mcqBtn.style.display = "block";

      qText.innerText = "☆ " + q;
      aText.innerText = a;
      bText.innerText = b;
      cText.innerText = c;
      dText.innerText = d;
    }

    function downloadMCQ() {
      const randomName =
        "mcq_" + Date.now() + "_" + Math.random().toString(36).substring(2, 8);

      html2canvas(document.getElementById("mcqWrapper"), {
        scale: 35,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = randomName + ".png";
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();
      });
    }
  </script>

</body>
</html>
