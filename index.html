<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MCQ Generator | Interactive Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
  body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Lexend', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(
    135deg,
    #6b6bff,
    #5ec6ff,
    #9f7cff,
    #ff8fcf
  );
  background-size: 300% 300%;
  animation: bgMove 16s ease infinite;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* outer glow */
.quiz-card {
  width: 94%;
  max-width: 430px;
  padding: 18px 16px 22px;
  border-radius: 26px;

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.95),
    rgba(255,255,255,0.88)
  );

  box-shadow:
    0 25px 60px rgba(0,0,0,0.18),
    0 0 0 6px rgba(255,255,255,0.25);
}

/* badge */
.badge {
  width: fit-content;
  margin: 0 auto 14px;
  padding: 12px 28px;
  border-radius: 999px;
  background: linear-gradient(135deg, #6b5cff, #7f7cff);
  color: #fff;
  font-size: 18px;
  font-weight: 600;
}

/* question strip */
.question {
  font-size: 18px;
  font-weight: 600;
  padding: 14px 16px;
  margin-bottom: 18px;
  border-radius: 14px;

  background: linear-gradient(
    135deg,
    #efeaff,
    #e8f4ff
  );
}

/* option cards */
.option {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  border-radius: 18px;

  background: #f7f8fc;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.7),
    0 6px 14px rgba(0,0,0,0.08);
}

/* option circle */
.circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 3px solid #cfcfe6;
  background: #fff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 600;
  font-size: 16px;
}

/* footer */
.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
}
  </style>
</head>

<body>

  <div class="app">

    <div class="h23">Create MCQ</div>

    <div class="input-box">
      <b>Enter Question</b>
      <input id="question" placeholder="Enter question">

      <b>Option A</b>
      <input id="optA" placeholder="Option A">

      <b>Option B</b>
      <input id="optB" placeholder="Option B">

      <b>Option C</b>
      <input id="optC" placeholder="Option C">

      <b>Option D</b>
      <input id="optD" placeholder="Option D">

      <button onclick="generateMCQ()">Generate MCQ</button>
    </div>

    <div id="mcqWrapper">
      <div class="mcq-card" id="mcqCard">
        <div class="quiz-header">Quick Quiz</div>

        <div class="question" id="qText"></div>

        <div class="option"><span>A</span><p id="aText"></p></div>
        <div class="option"><span>B</span><p id="bText"></p></div>
        <div class="option"><span>C</span><p id="cText"></p></div>
        <div class="option"><span>D</span><p id="dText"></p></div>

        <div class="watermark">Follow: Interactive Learning</div>
      </div>
    </div>

    <button class="download-btn" id="mcqBtn" onclick="downloadMCQ()">Download Image</button>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    function generateMCQ() {
      const q = question.value;
      const a = optA.value;
      const b = optB.value;
      const c = optC.value;
      const d = optD.value;

      if (!q || !a || !b || !c || !d) {
        alert("সব ঘর পূরণ করো");
        return;
      }

      mcqCard.style.display = "block";
      mcqBtn.style.display = "block";

      qText.innerText = "☆ " + q;
      aText.innerText = a;
      bText.innerText = b;
      cText.innerText = c;
      dText.innerText = d;
    }

    function downloadMCQ() {
      const randomName =
        "mcq_" + Date.now() + "_" + Math.random().toString(36).substring(2, 8);

      html2canvas(document.getElementById("mcqWrapper"), {
        scale: 35,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = randomName + ".png";
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();
      });
    }
  </script>

</body>
</html>
