<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator | Interactive Learning</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
  :root {
    --bg-body: #f3f4f6;       
    --panel-bg: #ffffff;      
    --primary: #4f46e5;       
    --primary-soft: rgba(79, 70, 229, 0.1);
    --text-main: #111827;     
    --text-muted: #6b7280;    
    --border-light: #e5e7eb;  
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

body { 
    font-family: 'Lexend', 'Anek Bangla', sans-serif;
    background-color: var(--bg-body);
    background-image: radial-gradient(#d1d5db 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text-main);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
}

/* --- CONTAINER --- */
.container {
    margin-top: 40px;
    width: 97%; max-width: 1200px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 12px; padding-bottom: 20px; flex: 1;
}

/* --- EDITOR BOX --- */
.editor-box {
    flex: 1; min-width: 360px; max-width: 500px;
    background: var(--panel-bg);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: var(--shadow-lg);
}

.section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; 
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
}
.section-title { 
    font-size: 18px; font-weight: 700; 
    color: #1f2937;
    display: flex; align-items: center; gap: 8px;
}
.section-title i { color: var(--primary); }

/* Save Status */
.save-status { 
    font-size: 11px; font-weight: 600; 
    opacity: 0; transition: opacity 0.5s; 
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 4px;
}
.status-saving { color: #f59e0b; background: #fffbeb; border: 1px solid #fcd34d; }
.status-saved { color: #10b981; background: #ecfdf5; border: 1px solid #6ee7b7; }
.status-restored { color: #3b82f6; background: #eff6ff; border: 1px solid #93c5fd; }

.action-buttons { display: flex; gap: 8px; align-items: center; }
.btn-icon {
    background: white; 
    border: 1px solid var(--border-light);
    color: var(--text-muted); width: 34px; height: 34px; border-radius: 8px;
    cursor: pointer; transition: all 0.2s ease; 
    display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { border-color: var(--primary); color: var(--primary); }

/* --- INPUT FIELDS --- */
.input-group { margin-bottom: 15px; }
.input-group label {
    display: block; font-size: 12.5px; font-weight: 600;
    color: #374151; margin-bottom: 6px;
}

.form-control {
    width: 100%;
    background: #ffffff;
    border: 1px solid #d1d5db; 
    padding: 10px 14px;
    border-radius: 8px; 
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s ease-in-out;
}
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

textarea.form-control { resize: vertical; min-height: 70px; }

.row-inputs { display: flex; gap: 10px; }
.row-inputs > div { flex: 1; }

.btn-download {
    width: 100%; padding: 12px;
    border-radius: 8px; border: none;
    color: white; font-weight: 600; cursor: pointer;
    font-size: 14px; 
    background: #111827;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}

/* --- PREMIUM CARD DESIGN (COMPACT) --- */
.preview-box { flex: 1.2; min-width: 350px; display: flex; justify-content: center; }

#mcqWrapper {
    width: 100%; max-width: 480px;
    border-radius: 12px;
    padding: 20px; 
    display: flex; flex-direction: column;
    color: white; 
    position: relative;
    overflow: hidden;
}

.question-box { display: flex; gap: 10px; margin-bottom: 12px; }
.q-prefix-box {
    width: 32px; height: 32px; flex-shrink: 0;
    background: rgba(255,255,255,0.2);
    border-radius: 6px;
    display: flex; justify-content: center; align-items: center;
    font-size: 14px; font-weight: 800;
    border: 1px solid rgba(255,255,255,0.3);
}
.q-text { font-size: 16px; font-weight: 700; line-height: 1.4; white-space: pre-wrap; }

.options-list { display: flex; flex-direction: column; gap: 6px; }
.opt-item {
    display: flex; align-items: center;
    background: rgba(255, 255, 255, 0.08); 
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px; 
    padding: 8px 12px; 
}
.opt-circle {
    width: 22px; height: 22px; flex-shrink: 0;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.15);
    display: flex; justify-content: center; align-items: center;
    font-size: 11px; font-weight: 700; margin-right: 10px;
    border: 1px solid rgba(255,255,255,0.2);
}
.opt-text { font-size: 14px; font-weight: 500; }

.card-footer { 
    margin-top: 12px; text-align: center; 
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 10px;
}
.card-brand { font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; display: inline-block; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; }
.card-promo { font-size: 10px !important; opacity: 0.8; font-weight: 500; }

footer { width: 100%; padding: 15px; text-align: center; background: #1f2937; margin-top: auto; font-size: 13px; color: white; }

@media (max-width: 768px) { .container { flex-direction: column; } .editor-box, .preview-box { min-width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-box">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-layer-group"></i> MCQ Creator</div>
                <div class="action-buttons">
                    <span id="saveStatus" class="save-status"></span>
                    <button class="btn-icon" onclick="undo()" title="Undo"><i class="fas fa-undo"></i></button>
                    <button class="btn-icon" onclick="resetAll()" title="Reset All"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>

            <div class="row-inputs">
                <div class="input-group">
                    <label>Prefix</label>
                    <select id="qStyle" class="form-control" onchange="updateLive()">
                        <option value="Q.">Q.</option>
                        <option value="?">?</option>
                        <option value="প্রশ্ন:">প্রশ্ন:</option>
                        <option value="fa-question">Icon: Question</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Option Style</label>
                    <select id="optStyle" class="form-control" onchange="updateLive()">
                        <option value="abcd">a, b, c, d</option>
                        <option value="ABCD">A, B, C, D</option>
                        <option value="bangla2">ক, খ, গ, ঘ</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Theme</label>
                <select id="themeSelector" class="form-control" onchange="updateLive()"></select>
            </div>

            <div class="input-group">
                <label>Question</label>
                <textarea id="qInput" class="form-control" placeholder="Type question..." oninput="updateLive()"></textarea>
            </div>

            <div class="input-group">
                <label>Options</label>
                <input id="optA" class="form-control" placeholder="Option 1" style="margin-bottom:8px;" oninput="updateLive()">
                <input id="optB" class="form-control" placeholder="Option 2" style="margin-bottom:8px;" oninput="updateLive()">
                <input id="optC" class="form-control" placeholder="Option 3" style="margin-bottom:8px;" oninput="updateLive()">
                <input id="optD" class="form-control" placeholder="Option 4" oninput="updateLive()">
            </div>

            <button class="btn-download" onclick="downloadImage()"><i class="fas fa-download"></i> Download PNG</button>
        </div>

        <div class="preview-box">
            <div id="mcqWrapper">
                <div class="card-content-layer">
                    <div class="question-box">
                        <div class="q-prefix-box"><span id="pPrefix">Q.</span></div>
                        <span id="pQ" class="q-text">Question Preview...</span>
                    </div>
                    <div class="options-list">
                        <div class="opt-item"><div class="opt-circle" id="oc1">a</div><div id="pA" class="opt-text">Option A</div></div>
                        <div class="opt-item"><div class="opt-circle" id="oc2">b</div><div id="pB" class="opt-text">Option B</div></div>
                        <div class="opt-item"><div class="opt-circle" id="oc3">c</div><div id="pC" class="opt-text">Option C</div></div>
                        <div class="opt-item"><div class="opt-circle" id="oc4">d</div><div id="pD" class="opt-text">Option D</div></div>
                    </div>
                    <div class="card-footer">
                        <div class="card-brand">Interactive Learning</div>
                        <div class="card-promo">সেরা প্রস্তুতিতে এক ধাপ এগিয়ে থাকতে আজই যুক্ত হোন।</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const themes = [
            { name: "Midnight Navy", bg: "linear-gradient(135deg, #020617, #1e293b)", text: "#fff" },
            { name: "Royal Blue", bg: "linear-gradient(135deg, #242066, #171542)", text: "#fff" },
            { name: "Deep Ocean", bg: "linear-gradient(135deg, #0f172a, #0e7490)", text: "#fff" },
            { name: "Electric Blue", bg: "linear-gradient(135deg, #172554, #2563eb)", text: "#fff" },
            { name: "Emerald", bg: "linear-gradient(135deg, #064e3b, #10b981)", text: "#fff" }
        ];

        const optionTypes = {
            abcd: ['a', 'b', 'c', 'd'],
            ABCD: ['A', 'B', 'C', 'D'],
            bangla2: ['ক','খ','গ','ঘ']
        };

        let historyStack = [];
        let historyIndex = -1;
        let isRestoring = false;
        let debounceTimer;

        // --- INIT ---
        function init() {
            // Fill Theme Selector
            const tSelect = document.getElementById('themeSelector');
            themes.forEach((t, i) => {
                let opt = document.createElement('option');
                opt.value = i;
                opt.text = t.name;
                tSelect.appendChild(opt);
            });

            // Restore from LocalStorage
            const saved = localStorage.getItem('mcqCurrent');
            if(saved) {
                applyState(JSON.parse(saved));
            } else {
                updateLive(true); 
            }
        }

        function applyState(state) {
            isRestoring = true;
            document.getElementById('qInput').value = state.q || '';
            document.getElementById('optA').value = state.a || '';
            document.getElementById('optB').value = state.b || '';
            document.getElementById('optC').value = state.c || '';
            document.getElementById('optD').value = state.d || '';
            document.getElementById('qStyle').value = state.qStyle || 'Q.';
            document.getElementById('optStyle').value = state.optStyle || 'abcd';
            document.getElementById('themeSelector').value = state.theme || 0;
            isRestoring = false;
            updateLive(false); 
            showStatus('restored');
        }

        function saveState() {
            if(isRestoring) return;
            const state = {
                q: document.getElementById('qInput').value,
                a: document.getElementById('optA').value,
                b: document.getElementById('optB').value,
                c: document.getElementById('optC').value,
                d: document.getElementById('optD').value,
                qStyle: document.getElementById('qStyle').value,
                optStyle: document.getElementById('optStyle').value,
                theme: document.getElementById('themeSelector').value
            };
            localStorage.setItem('mcqCurrent', JSON.stringify(state));
            showStatus('saved');

            // History Management
            if (historyIndex < historyStack.length - 1) historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(state);
            if (historyStack.length > 20) historyStack.shift();
            else historyIndex++;
        }

        function updateLive(shouldSave = true) {
            // Update Text
            document.getElementById('pQ').innerText = document.getElementById('qInput').value || "এখানে প্রশ্ন দেখা যাবে...";
            document.getElementById('pA').innerText = document.getElementById('optA').value || "Option A";
            document.getElementById('pB').innerText = document.getElementById('optB').value || "Option B";
            document.getElementById('pC').innerText = document.getElementById('optC').value || "Option C";
            document.getElementById('pD').innerText = document.getElementById('optD').value || "Option D";

            // Update Prefix
            const pVal = document.getElementById('qStyle').value;
            const pEl = document.getElementById('pPrefix');
            pEl.innerHTML = pVal.startsWith('fa-') ? `<i class="fas ${pVal}"></i>` : pVal;

            // Update Option Labels
            const labels = optionTypes[document.getElementById('optStyle').value];
            [1,2,3,4].forEach((n, i) => document.getElementById('oc'+n).innerText = labels[i]);

            // Update Theme
            const theme = themes[document.getElementById('themeSelector').value];
            const wrap = document.getElementById('mcqWrapper');
            wrap.style.background = theme.bg;
            wrap.style.color = theme.text;

            if(shouldSave) {
                showStatus('saving');
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(saveState, 800);
            }
        }

        function showStatus(type) {
            const s = document.getElementById('saveStatus');
            s.style.opacity = '1';
            if(type === 'saving') { s.className = 'save-status status-saving'; s.innerHTML = 'Saving...'; }
            if(type === 'saved') { s.className = 'save-status status-saved'; s.innerHTML = 'Saved'; setTimeout(()=>s.style.opacity='0', 1500); }
            if(type === 'restored') { s.className = 'save-status status-restored'; s.innerHTML = 'Restored'; setTimeout(()=>s.style.opacity='0', 1500); }
        }

        function undo() { if (historyIndex > 0) { historyIndex--; applyState(historyStack[historyIndex]); } }
        
        function resetAll() {
            if(confirm("সব মুছে ফেলতে চান?")) {
                document.getElementById('qInput').value = '';
                ['optA','optB','optC','optD'].forEach(id => document.getElementById(id).value = '');
                saveState(); updateLive();
            }
        }

        function downloadImage() {
            const wrap = document.getElementById('mcqWrapper');
            html2canvas(wrap, { scale: 3, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = `mcq_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        init();
    </script>
</body>
</html>
