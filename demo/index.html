    <style>
  :root {
    --bg-body: #f3f4f6;       
    --panel-bg: #ffffff;      
    --primary: #4f46e5;       
    --primary-soft: rgba(79, 70, 229, 0.1);
    --text-main: #111827;     
    --text-muted: #6b7280;    
    --border-light: #e5e7eb;  
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

body { 
    font-family: 'Lexend', 'Anek Bangla', sans-serif;
    background-color: var(--bg-body);
    background-image: radial-gradient(#d1d5db 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text-main);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
}

/* --- CONTAINER --- */
.container {
    margin-top: 80px;
    width: 97%; max-width: 1200px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 12px; padding-bottom: 20px; flex: 1;
}

/* --- EDITOR BOX --- */
.editor-box {
    flex: 1; min-width: 360px; max-width: 500px;
    background: var(--panel-bg);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: var(--shadow-lg);
}

.section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 25px; 
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border-light);
}
.section-title { 
    font-size: 20px; font-weight: 700; 
    color: #1f2937;
    letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 10px;
}
.section-title i { color: var(--primary); }

/* Action Buttons */
.action-buttons { display: flex; gap: 10px; }
.btn-icon {
    background: white; 
    border: 1px solid var(--border-light);
    color: var(--text-muted); width: 38px; height: 38px; border-radius: 10px;
    cursor: pointer; transition: all 0.2s ease; 
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
}
.btn-icon:hover { 
    border-color: var(--primary); color: var(--primary); 
    transform: translateY(-2px); box-shadow: var(--shadow-md);
}

/* --- INPUT FIELDS --- */
.input-group { margin-bottom: 20px; }

.input-group label {
    display: block; font-size: 13px; font-weight: 600;
    color: #374151; margin-bottom: 8px;
    letter-spacing: 0.3px;
}
.input-group label i { margin-right: 6px; color: var(--primary); width: 15px; text-align: center; }

.form-control {
    width: 100%;
    background: #ffffff;
    border: 1px solid #d1d5db; 
    color: #111827;
    padding: 12px 16px;
    border-radius: 8px; 
    font-size: 15px;
    font-family: inherit;
    transition: all 0.2s ease-in-out;
    box-shadow: var(--shadow-sm);
}

.form-control:hover { border-color: #9ca3af; }
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.form-control::placeholder { color: #9ca3af; font-size: 14px; }

select.form-control { cursor: pointer; }

.row-inputs { display: flex; gap: 15px; }
.row-inputs > div { flex: 1; }

/* Download Buttons */
.download-group { display: flex; gap: 10px; margin-top: 25px; }

.btn-download {
    flex: 1; padding: 14px;
    border-radius: 10px; border: none;
    color: white; font-weight: 600; cursor: pointer;
    font-size: 14px; 
    box-shadow: var(--shadow-md);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-user { background: #111827; }
.btn-user:hover { background: #000000; transform: translateY(-2px); }

.btn-admin { background: #059669; }
.btn-admin:hover { background: #047857; transform: translateY(-2px); }

/* --- PREVIEW BOX --- */
.preview-box {
    flex: 1.2; min-width: 350px;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 10px;
}

/* --- MCQ CARD --- */
#mcqWrapper {
    width: 100%; max-width: 480px;
    border-radius: 6px;
    padding: 20px; 
    display: flex; flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border: none;
    position: relative;
    transition: background 0.3s ease;
    color: white; 
}

.question-box { display: flex; gap: 8px; margin-bottom: 20px; margin-top: 5px;}
.q-prefix { font-size: 18px; font-weight: 900; line-height: 1.2; flex-shrink: 0; }
.q-text { font-size: 17px; font-weight: 700; line-height: 1.4; }

.options-list { display: flex; flex-direction: column; gap: 8px; }

.opt-item {
    display: flex; align-items: center;
    background: rgba(255, 255, 255, 0.1); 
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px; 
    padding: 8px 12px; 
    transition: 0.2s;
}

/* Admin Mode Correct Answer Style (Applied via JS) */
.opt-item.correct-ans {
    background: #10b981 !important; 
    border-color: #059669 !important;
    color: white !important;
    font-weight: 700;
}
.opt-item.correct-ans .opt-circle {
    background: white; color: #059669; border-color: white;
}
.opt-item.correct-ans .opt-text { color: white !important; }


.opt-circle {
    width: 24px; height: 24px; flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex; justify-content: center; align-items: center;
    font-size: 12px; font-weight: 700; margin-right: 12px;
    border: 1px solid rgba(255,255,255,0.3);
}
.opt-text { font-size: 14px; font-weight: 500; }

.card-footer { margin-top: 15px; text-align: center; }
.card-line { width: 45px; height: 3px; margin: 0 auto 10px; border-radius: 2px; }
.card-brand { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; opacity: 0.7; text-transform: uppercase; }

/* Footer */
footer {
    width: 100%; padding: 15px; text-align: center;
    background: #1f2937;
    border-top: 1px solid #dadada;
    margin-top: auto; font-size: 14px; color: white;
}

@media (max-width: 768px) {
    .container { flex-direction: column; padding: 20px; gap: 20px; }
    .editor-box, .preview-box { min-width: 100%; }
}
    </style>

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        const optionTypes = {
            abcd: ['a', 'b', 'c', 'd'],
            ABCD: ['A', 'B', 'C', 'D'],
            roman: ['i', 'ii', 'iii', 'iv'],
            number: ['1', '2', '3', '4'],
            bangla: ['১', '২', '৩', '৪'],
            bangla2: ['ক','খ','গ','ঘ']
        };

        function updateLive() {
            const q = document.getElementById('qInput').value || "এখানে প্রশ্ন দেখা যাবে...";
            document.getElementById('pQ').innerText = q;
            document.getElementById('pA').innerText = document.getElementById('optA').value || "Option A";
            document.getElementById('pB').innerText = document.getElementById('optB').value || "Option B";
            document.getElementById('pC').innerText = document.getElementById('optC').value || "Option C";
            document.getElementById('pD').innerText = document.getElementById('optD').value || "Option D";

            document.getElementById('pPrefix').innerText = document.getElementById('qStyle').value;
            const optStyle = document.getElementById('optStyle').value;
            const labels = optionTypes[optStyle];
            document.getElementById('oc1').innerText = labels[0];
            document.getElementById('oc2').innerText = labels[1];
            document.getElementById('oc3').innerText = labels[2];
            document.getElementById('oc4').innerText = labels[3];

            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            const wrapper = document.getElementById('mcqWrapper');
            
            wrapper.style.background = theme.bg;
            document.querySelector('.q-prefix').style.color = theme.accent;
            document.querySelector('.card-line').style.background = theme.accent;

            const isLight = ["Silver", "Gold Rush", "Morning", "Ice Cold", "Teal Love", "Piggy Pink", "Mega Tron", "Argon", "A Lost Memory"].includes(theme.name);
            const textColor = isLight ? "#222" : "#fff";
            const subColor = isLight ? "#444" : "#e2e8f0";
            const borderColor = isLight ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.1)";
            const itemBg = isLight ? "rgba(0,0,0,0.05)" : "rgba(255,255,255,0.08)";

            document.querySelector('.q-text').style.color = textColor;
            document.querySelectorAll('.opt-text').forEach(el => el.style.color = subColor);
            
            document.querySelectorAll('.opt-circle').forEach(el => {
                el.style.color = textColor;
                el.style.background = isLight ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.15)";
                el.style.borderColor = isLight ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.2)";
            });
            
            document.querySelectorAll('.opt-item').forEach(el => {
                // Keep background dynamic based on theme, unless marked correct by admin download process
                if(!el.classList.contains('correct-ans')) {
                    el.style.borderColor = borderColor;
                    el.style.background = itemBg;
                }
            });
            document.querySelector('.card-brand').style.color = isLight ? "#555" : "rgba(255,255,255,0.6)";
        }

        let lastState = null;

        function resetAll() {
            lastState = {
                q: document.getElementById('qInput').value,
                a: document.getElementById('optA').value,
                b: document.getElementById('optB').value,
                c: document.getElementById('optC').value,
                d: document.getElementById('optD').value,
                qStyle: document.getElementById('qStyle').value,
                optStyle: document.getElementById('optStyle').value,
                theme: document.getElementById('themeSelector').value,
                correct: document.getElementById('correctOpt').value
            };
            
            document.getElementById('qInput').value = '';
            document.getElementById('optA').value = '';
            document.getElementById('optB').value = '';
            document.getElementById('optC').value = '';
            document.getElementById('optD').value = '';
            document.getElementById('correctOpt').value = '';
            
            document.getElementById('undoBtn').style.display = 'flex';
            updateLive();
        }

        function undoReset() {
            if(!lastState) return;
            document.getElementById('qInput').value = lastState.q;
            document.getElementById('optA').value = lastState.a;
            document.getElementById('optB').value = lastState.b;
            document.getElementById('optC').value = lastState.c;
            document.getElementById('optD').value = lastState.d;
            document.getElementById('qStyle').value = lastState.qStyle;
            document.getElementById('optStyle').value = lastState.optStyle;
            document.getElementById('themeSelector').value = lastState.theme;
            document.getElementById('correctOpt').value = lastState.correct;
            
            document.getElementById('undoBtn').style.display = 'none';
            updateLive();
        }

        // --- DOWNLOAD LOGIC (USER vs ADMIN) ---
        function downloadImage(mode) {
            const wrapper = document.getElementById('mcqWrapper');
            
            // 1. If Admin Mode, apply highlight
            if(mode === 'admin') {
                const correctVal = document.getElementById('correctOpt').value;
                if(correctVal) {
                    const item = document.getElementById('item' + correctVal);
                    if(item) item.classList.add('correct-ans');
                } else {
                    alert("Please select a Correct Answer first!");
                    return;
                }
            }

            // 2. Generate Image
            html2canvas(wrapper, {
                scale: 5, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                const timestamp = Date.now();
                link.download = `mcq_${mode}_${timestamp}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                // 3. Remove highlight immediately
                if(mode === 'admin') {
                    const correctVal = document.getElementById('correctOpt').value;
                    if(correctVal) {
                        const item = document.getElementById('item' + correctVal);
                        if(item) item.classList.remove('correct-ans');
                        updateLive(); // Restore default theme colors
                    }
                }
            });
        }

        updateLive();
        document.getElementById('mcqWrapper').style.display = 'flex';

    </script>
</body>
</html>
