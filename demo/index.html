    <style>
  :root {
    --bg-body: #f3f4f6;       
    --panel-bg: #ffffff;      
    --primary: #4f46e5;       
    --primary-soft: rgba(79, 70, 229, 0.1);
    --text-main: #111827;     
    --text-muted: #6b7280;    
    --border-light: #e5e7eb;  
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

body { 
    font-family: 'Lexend', 'Anek Bangla', sans-serif;
    background-color: var(--bg-body);
    background-image: radial-gradient(#d1d5db 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text-main);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
}

/* --- CONTAINER --- */
.container {
    margin-top: 80px;
    width: 97%; max-width: 1200px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 12px; padding-bottom: 20px; flex: 1;
}

/* --- EDITOR BOX --- */
.editor-box {
    flex: 1; min-width: 360px; max-width: 500px;
    background: var(--panel-bg);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: var(--shadow-lg);
}

.section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 25px; 
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border-light);
}
.section-title { 
    font-size: 20px; font-weight: 700; 
    color: #1f2937;
    letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 10px;
}
.section-title i { color: var(--primary); }

/* Save Status */
.save-status { font-size: 11px; color: #10b981; font-weight: 600; opacity: 0; transition: opacity 0.5s; display: flex; align-items: center; gap: 4px; }

/* Action Buttons */
.action-buttons { display: flex; gap: 10px; align-items: center; }
.btn-icon {
    background: white; 
    border: 1px solid var(--border-light);
    color: var(--text-muted); width: 38px; height: 38px; border-radius: 10px;
    cursor: pointer; transition: all 0.2s ease; 
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
}
.btn-icon:hover { 
    border-color: var(--primary); color: var(--primary); 
    transform: translateY(-2px); box-shadow: var(--shadow-md);
}

/* --- INPUT FIELDS --- */
.input-group { margin-bottom: 20px; }

.input-group label {
    display: block; font-size: 13px; font-weight: 600;
    color: #374151; margin-bottom: 8px;
    letter-spacing: 0.3px;
}
.input-group label i { margin-right: 6px; color: var(--primary); width: 15px; text-align: center; }

.form-control {
    width: 100%;
    background: #ffffff;
    border: 1px solid #d1d5db; 
    color: #111827;
    padding: 12px 16px;
    border-radius: 8px; 
    font-size: 15px;
    font-family: inherit;
    transition: all 0.2s ease-in-out;
    box-shadow: var(--shadow-sm);
}

/* Increased Height for Question Box */
textarea.form-control { resize: vertical; min-height: 80px; line-height: 1.4; }

.form-control:hover { border-color: #9ca3af; }
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.form-control::placeholder { color: #9ca3af; font-size: 14px; }

select.form-control { cursor: pointer; }
input[type="range"] { width: 100%; cursor: pointer; }

.row-inputs { display: flex; gap: 15px; }
.row-inputs > div { flex: 1; }

/* Download Buttons */
.download-group { display: flex; gap: 10px; margin-top: 25px; }

.btn-download {
    flex: 1; padding: 14px;
    border-radius: 10px; border: none;
    color: white; font-weight: 600; cursor: pointer;
    font-size: 14px; 
    box-shadow: var(--shadow-md);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-user { background: #111827; }
.btn-user:hover { background: #000000; transform: translateY(-2px); }

.btn-admin { background: #059669; }
.btn-admin:hover { background: #047857; transform: translateY(-2px); }

/* --- PREVIEW BOX --- */
.preview-box {
    flex: 1.2; min-width: 350px;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 10px;
}

/* --- MCQ CARD --- */
#mcqWrapper {
    width: 100%; max-width: 480px;
    border-radius: 6px;
    padding: 20px; 
    display: flex; flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border: none;
    position: relative;
    transition: background 0.3s ease;
    color: white; 
}

.question-box { display: flex; gap: 8px; margin-bottom: 20px; margin-top: 5px;}
.q-prefix { font-size: 18px; font-weight: 900; line-height: 1.2; flex-shrink: 0; }
.q-text { font-size: 17px; font-weight: 700; line-height: 1.4; white-space: pre-wrap; }

.options-list { display: flex; flex-direction: column; gap: 8px; }

.opt-item {
    display: flex; align-items: center;
    background: rgba(255, 255, 255, 0.1); 
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px; 
    padding: 8px 12px; 
    transition: 0.2s;
}

/* Admin Mode Correct Answer Style (Applied via JS) */
.opt-item.correct-ans {
    background: #10b981 !important; 
    border-color: #059669 !important;
    color: white !important;
    font-weight: 700;
}
.opt-item.correct-ans .opt-circle {
    background: white; color: #059669; border-color: white;
}
.opt-item.correct-ans .opt-text { color: white !important; }


.opt-circle {
    width: 24px; height: 24px; flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex; justify-content: center; align-items: center;
    font-size: 12px; font-weight: 700; margin-right: 12px;
    border: 1px solid rgba(255,255,255,0.3);
}
.opt-text { font-size: 14px; font-weight: 500; }

.card-footer { margin-top: 15px; text-align: center; }
.card-line { width: 45px; height: 3px; margin: 0 auto 10px; border-radius: 2px; }
.card-brand { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; opacity: 0.7; text-transform: uppercase; }
/* UPDATED FONT SIZE */
.card-promo { font-size: 13px; margin-top: 4px; opacity: 0.9; font-weight: 700; }

/* Footer */
footer {
    width: 100%; padding: 15px; text-align: center;
    background: #1f2937;
    border-top: 1px solid #dadada;
    margin-top: auto; font-size: 14px; color: white;
}

@media (max-width: 768px) {
    .container { flex-direction: column; padding: 20px; gap: 20px; }
    .editor-box, .preview-box { min-width: 100%; }
}

    <div class="container">

            <div class="row-inputs">

                <div class="input-group">

                        <option value="ABCD">A, B, C, D</option>
                        <option value="roman">i, ii, iii, iv</option>
                        <option value="number">1, 2, 3, 4</option>
                        <option value="bangla">১, ২, ৩, ৪</option>
                        <option value="bangla2">ক, খ, গ, ঘ</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-palette"></i> Theme (200 Options)</label>
                <select id="themeSelector" class="form-control" onchange="updateLive()">
                    </select>
            </div>

            <div class="input-group">
                <label><i class="fas fa-text-height"></i> Font Size</label>
                <input type="range" id="fontSize" min="14" max="24" value="17" step="1" oninput="updateLive()">
            </div>

            <div class="input-group">
                <label><i class="fas fa-question-circle"></i> Question</label>
                <textarea id="qInput" class="form-control" placeholder="Type your question..." oninput="updateLive()"></textarea>
            </div>

            <div class="input-group">
                <label><i class="fas fa-list"></i> Options</label>
                <input id="optA" class="form-control" placeholder="Option 1" style="margin-bottom:10px;" oninput="updateLive()">
                <input id="optB" class="form-control" placeholder="Option 2" style="margin-bottom:10px;" oninput="updateLive()">
                <input id="optC" class="form-control" placeholder="Option 3" style="margin-bottom:10px;" oninput="updateLive()">
                <input id="optD" class="form-control" placeholder="Option 4" oninput="updateLive()">
            </div>

            <div class="input-group">
                <label><i class="fas fa-check-circle"></i> Correct Answer (Admin)</label>
                <select id="correctOpt" class="form-control" onchange="updateLive()">
                    <option value="">Select Correct Option</option>
                    <option value="1">Option 1</option>
                    <option value="2">Option 2</option>
                    <option value="3">Option 3</option>
                    <option value="4">Option 4</option>
                </select>
            </div>

            <div class="download-group">
                <button class="btn-download btn-user" onclick="processDownload('user')">
                    <i class="fas fa-share-alt"></i> Share/User PNG
                </button>
                <button class="btn-download btn-admin" onclick="processDownload('admin')">
                    <i class="fas fa-share-alt"></i> Share/Admin PNG
                </button>
            </div>
        </div>

        <div class="preview-box">
            <div id="mcqWrapper">
                <div class="question-box">
                    <span id="pPrefix" class="q-prefix">Q.</span>
                    <span id="pQ" class="q-text">Question Preview...</span>
                </div>
                <div class="options-list">
                    <div class="opt-item" id="item1"><div class="opt-circle" id="oc1">a</div><div id="pA" class="opt-text">Option A</div></div>
                    <div class="opt-item" id="item2"><div class="opt-circle" id="oc2">b</div><div id="pB" class="opt-text">Option B</div></div>
                    <div class="opt-item" id="item3"><div class="opt-circle" id="oc3">c</div><div id="pC" class="opt-text">Option C</div></div>
                    <div class="opt-item" id="item4"><div class="opt-circle" id="oc4">d</div><div id="pD" class="opt-text">Option D</div></div>
                </div>
                <div class="card-footer">
                    <div class="card-line"></div>
                    <div class="card-brand">Interactive Learning</div>
                    <div class="card-promo">সেরা প্রস্তুতিতে এক ধাপ এগিয়ে থাকতে আজই আমাদের ফ্রি এক্সাম ব্যাচে যুক্ত হোন।</div>
                </div>
            </div>
        </div>
    </div>

            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        const optionTypes = {
            abcd: ['a', 'b', 'c', 'd'],
            ABCD: ['A', 'B', 'C', 'D'],
            roman: ['i', 'ii', 'iii', 'iv'],
            number: ['1', '2', '3', '4'],
            bangla: ['১', '২', '৩', '৪'],
            bangla2: ['ক','খ','গ','ঘ']
        };

        // --- HISTORY & STATE MANAGEMENT ---
        const MAX_HISTORY = 20;
        let historyStack = [];
        let historyIndex = -1;
        let isRestoring = false;

        function init() {
            // Restore from Local Storage on Load
            const saved = localStorage.getItem('mcqCurrent');
            if(saved) {
                applyState(JSON.parse(saved));
            } else {
                updateLive(true); // Initial save
            }
        }

        function applyState(state) {
            isRestoring = true;
            document.getElementById('qInput').value = state.q || '';
            document.getElementById('optA').value = state.a || '';
            document.getElementById('optB').value = state.b || '';
            document.getElementById('optC').value = state.c || '';
            document.getElementById('optD').value = state.d || '';
            document.getElementById('qStyle').value = state.qStyle || 'Q.';
            document.getElementById('optStyle').value = state.optStyle || 'abcd';
            document.getElementById('themeSelector').value = state.theme || 0;
            document.getElementById('correctOpt').value = state.correct || '';
            document.getElementById('fontSize').value = state.fontSize || 17;
            isRestoring = false;
            updateLive(false); // Update preview without saving again
        }

        function saveState() {
            if(isRestoring) return;

            const currentState = {
                q: document.getElementById('qInput').value,
                a: document.getElementById('optA').value,
                b: document.getElementById('optB').value,
                c: document.getElementById('optC').value,
                d: document.getElementById('optD').value,
                qStyle: document.getElementById('qStyle').value,
                optStyle: document.getElementById('optStyle').value,
                theme: document.getElementById('themeSelector').value,
                correct: document.getElementById('correctOpt').value,
                fontSize: document.getElementById('fontSize').value
            };

            // Save to LocalStorage
            localStorage.setItem('mcqCurrent', JSON.stringify(currentState));
            showSaveStatus();

            // Push to History
            // Remove future history if we are in middle
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            historyStack.push(currentState);
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            } else {
                historyIndex++;
            }
        }

        let saveTimeout;
        function showSaveStatus() {
            const status = document.getElementById('saveStatus');
            status.style.opacity = '1';
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                status.style.opacity = '0';
            }, 2000);
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                applyState(historyStack[historyIndex]);
            }
        }

        function resetAll() {
            if(confirm("Are you sure you want to reset everything?")) {
                document.getElementById('qInput').value = '';
                document.getElementById('optA').value = '';
                document.getElementById('optB').value = '';
                document.getElementById('optC').value = '';
                document.getElementById('optD').value = '';
                document.getElementById('correctOpt').value = '';
                document.getElementById('fontSize').value = 17;
                saveState(); // Save empty state
                updateLive();
            }
        }

        // --- UPDATE PREVIEW ---
        let debounceTimer;
        function updateLive(save = true) {
            // Preview Logic
            const q = document.getElementById('qInput').value || "এখানে প্রশ্ন দেখা যাবে...";
            document.getElementById('pQ').innerText = q;
            document.getElementById('pA').innerText = document.getElementById('optA').value || "Option A";
            document.getElementById('pB').innerText = document.getElementById('optB').value || "Option B";
            document.getElementById('pC').innerText = document.getElementById('optC').value || "Option C";
            document.getElementById('pD').innerText = document.getElementById('optD').value || "Option D";

            document.getElementById('pPrefix').innerText = document.getElementById('qStyle').value;
            const optStyle = document.getElementById('optStyle').value;
            const labels = optionTypes[optStyle];
            document.getElementById('oc1').innerText = labels[0];
            document.getElementById('oc2').innerText = labels[1];
            document.getElementById('oc3').innerText = labels[2];
            document.getElementById('oc4').innerText = labels[3];

            // Theme Logic
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            const wrapper = document.getElementById('mcqWrapper');
            
            wrapper.style.background = theme.bg;
            document.querySelector('.q-prefix').style.color = theme.accent;
            document.querySelector('.card-line').style.background = theme.accent;

            // Apply Text Color Directly from Theme Object
            const textColor = theme.text;
            // Derive sub-colors based on main text color
            const isLightText = textColor === '#fff' || textColor === '#ffffff';
            const subColor = isLightText ? "#e2e8f0" : "#444";
            const borderColor = isLightText ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)";
            const itemBg = isLightText ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.05)";
            const circleBg = isLightText ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.1)";

            document.querySelector('.q-text').style.color = textColor;
            document.querySelectorAll('.opt-text').forEach(el => el.style.color = subColor);
            
            document.querySelectorAll('.opt-circle').forEach(el => {
                el.style.color = textColor;
                el.style.background = circleBg;
                el.style.borderColor = isLightText ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.2)";
            });
            
            document.querySelectorAll('.opt-item').forEach(el => {
                if(!el.classList.contains('correct-ans')) {
                    el.style.borderColor = borderColor;
                    el.style.background = itemBg;
                }
            });
            document.querySelector('.card-brand').style.color = isLightText ? "rgba(255,255,255,0.6)" : "#555";
            document.querySelector('.card-promo').style.color = isLightText ? "rgba(255,255,255,0.5)" : "#666";

            // Font Size Logic
            const fs = document.getElementById('fontSize').value;
            wrapper.style.fontSize = fs + 'px';
            document.querySelector('.q-text').style.fontSize = fs + 'px';
            document.querySelectorAll('.opt-text').forEach(el => el.style.fontSize = (fs - 2) + 'px');

            // Auto Save Debounce
            if(save) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(saveState, 500);
            }
        }

        // --- DOWNLOAD PROCESS ---
        function processDownload(mode) {
            const originalWrapper = document.getElementById('mcqWrapper');
            
            // 1. Create a CLONE to ensure fixed size and prevent mobile layout issues
            const clone = originalWrapper.cloneNode(true);
            
            // 2. Set dimensions to match original to ensure consistency
            clone.style.width = originalWrapper.offsetWidth + "px";
            clone.style.position = "absolute";
            clone.style.top = "-9999px";
            clone.style.left = "0";
            clone.style.margin = "0"; // Reset margin
            
            // 3. Admin Highlight on Clone
            if(mode === 'admin') {
                const correctVal = document.getElementById('correctOpt').value;
                if(!correctVal) {
                    alert("Please select a Correct Answer first!");
                    return;
                }
                const targetId = 'item' + correctVal;
                // Find element in clone
                const targetEl = clone.querySelector('#' + targetId);
                if(targetEl) {
                    targetEl.style.background = "#10b981";
                    targetEl.style.borderColor = "#059669";
                    targetEl.style.color = "white";
                    targetEl.style.fontWeight = "700";
                    targetEl.querySelector('.opt-circle').style.background = "white";
                    targetEl.querySelector('.opt-circle').style.color = "#059669";
                    targetEl.querySelector('.opt-text').style.color = "white";
                }
            }

            document.body.appendChild(clone);

            // 4. Capture
            html2canvas(clone, {
                scale: 10, // Retina quality
                useCORS: true,
                backgroundColor: null, // Transparent background fix
            }).then(canvas => {
                // 5. Handle Output (Share or Download)
                canvas.toBlob(blob => {
                    const file = new File([blob], `mcq_${mode}_${Date.now()}.png`, { type: 'image/png' });

                    // Share Logic for Both User and Admin on Mobile
                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: 'MCQ Card',
                            text: 'Check out this MCQ!'
                        }).catch(console.error);
                    } else {
                        // Fallback Download for Desktop or incompatible browsers
                        const link = document.createElement('a');
                        link.download = `mcq_${mode}_${Date.now()}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }
                    
                    document.body.removeChild(clone);
                });
            });
        }

        init();
    </script>
</body>
</html>
