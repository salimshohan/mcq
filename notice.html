<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Maker | Interactive Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@100..800&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', 'Apple Color Emoji', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 50% 0%, rgba(56, 189, 248, 0.1) 0, transparent 50%), 
                radial-gradient(at 50% 100%, rgba(236, 72, 153, 0.05) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- COMPACT HEADER --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            padding: 10px 5%; /* Reduced Padding */
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            display: flex; align-items: center;
            font-size: 16px; /* Smaller Font */
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .logo-img {
            height: 28px; width: 28px; /* Smaller Logo */
            margin-right: 8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
        }

        .hamburger {
            cursor: pointer; z-index: 1100; width: 24px; height: 18px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hamburger span { display: block; height: 2px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 4px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -4px); }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: #0f172a;
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s; box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border-color);
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-color);
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 70px;
            width: 95%; max-width: 1100px;
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR --- */
        .editor-box {
            flex: 1; min-width: 350px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
        }
        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); text-transform: uppercase; }

        .action-buttons { display: flex; gap: 8px; }
        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: white; }
        
        .align-options { display: flex; gap: 10px; margin-top: 5px; }
        .align-btn {
            padding: 5px 10px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2);
            color: #fff; cursor: pointer; border-radius: 5px; font-size: 12px;
        }
        .align-btn.active { background: var(--primary); border-color: var(--primary); }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase;
        }

        .form-control {
            width: 100%; background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(148, 163, 184, 0.2); color: #f1f5f9;
            padding: 12px 15px; border-radius: 10px; font-size: 14px; transition: 0.3s;
        }
        textarea.form-control { resize: vertical; height: 140px; }
        .form-control:focus { outline: none; border-color: #8b5cf6; background: rgba(15, 23, 42, 0.9); }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-group input { width: 16px; height: 16px; accent-color: var(--primary); }
        .checkbox-group label { margin: 0; font-size: 13px; color: #fff; text-transform: none; font-weight: 500;}

        .btn-download {
            width: 100%; padding: 14px; margin-top: 15px; border-radius: 50px; border: none;
            background: linear-gradient(45deg, #FF512F 0%, #DD2476 100%);
            color: white; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(221, 36, 118, 0.4); transition: 0.3s;
        }
        .btn-download:hover { box-shadow: 0 8px 25px rgba(221, 36, 118, 0.6); transform: scale(1.02); }

        /* --- PREVIEW AREA --- */
        .preview-box {
            flex: 1; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 10px;
        }

        /* --- ANNOUNCEMENT CARD --- */
        #noticeWrapper {
            width: 100%; max-width: 420px;
            border-radius: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            overflow: hidden; position: relative;
        }
        
        #noticeWrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 40%);
            pointer-events: none; z-index: 0;
        }

        .notice-content-wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

        /* Top Announcement Label */
        .top-label {
            background: rgba(0,0,0,0.3); text-align: center; color: rgba(255,255,255,0.8);
            font-size: 10px; font-weight: 700; letter-spacing: 2px; padding: 8px;
            text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Header */
        .notice-header {
            padding: 20px 30px; /* More padding */
            display: flex; justify-content: space-between; align-items: center;
        }
        .notice-cat-badge {
            font-size: 12px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent); 
            background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 4px;
        }
        .notice-date { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6); }

        /* Body - HUGE PADDING */
        .notice-body { 
            padding: 50px 35px; /* Requested Huge Padding */
            flex: 1; display: flex; flex-direction: column; justify-content: center;
        }
        
        .notice-text {
            font-size: 19px; line-height: 1.7; color: #fff;
            white-space: pre-wrap; font-weight: 400;
        }

        /* Footer */
        .notice-footer {
            padding: 15px 30px;
            background: rgba(0,0,0,0.2);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: rgba(255,255,255,0.6);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        /* New Source Style */
        .notice-source { 
            font-weight: 700; color: #fff; display: flex; align-items: center; gap: 5px;
        }
        .verified-badge { color: #38bdf8; font-size: 14px; display: none; } /* Blue Tick */

        .notice-brand { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; font-size: 10px; }

        footer {
            width: 100%; padding: 20px; text-align: center;
            background: var(--header-bg); border-top: 1px solid var(--border-color);
            margin-top: auto; font-size: 12px; color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="https://cdn-icons-png.flaticon.com/512/8443/8443268.png" alt="Logo" class="logo-img">
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="notice.html" style="color: var(--primary);">Notice Maker</a>
            <a href="quotation.html">Quotation</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-box">
            <div class="section-header">
                <div class="section-title">Announcement Creator</div>
                <div class="action-buttons">
                    <button class="btn-icon btn-undo" id="undoBtn" onclick="undoReset()" title="Undo"><i class="fas fa-undo"></i></button>
                    <button class="btn-icon btn-reset" onclick="resetAll()" title="Reset All"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>

            <div class="input-group">
                <label>Theme</label>
                <select id="themeSelector" class="form-control" onchange="updateLive()">
                    </select>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="noticeCat" class="form-control" onchange="updateLive()">
                    <option>📢 BREAKING NEWS</option>
                    <option>🔴 URGENT NOTICE</option>
                    <option>📝 ACADEMIC UPDATE</option>
                    <option>🎉 ANNOUNCEMENT</option>
                    <option>⚠️ IMPORTANT ALERT</option>
                    <option>🏫 SCHOOL CLOSED</option>
                    <option>💡 INFORMATION</option>
                    <option>📌 ADMISSION</option>
                    <option>✅ APPROVED</option>
                    <option>🚫 REJECTED</option>
                    <option>🏆 WINNER</option>
                    <option>⏰ REMINDER</option>
                </select>
            </div>

            <div class="input-group">
                <label>Announcement Body</label>
                <textarea id="noticeBody" class="form-control" placeholder="Write the announcement here..." oninput="updateLive()"></textarea>
                
                <div class="align-options">
                    <div class="align-btn active" onclick="setAlignment('left', this)">Left</div>
                    <div class="align-btn" onclick="setAlignment('center', this)">Center</div>
                    <div class="align-btn" onclick="setAlignment('right', this)">Right</div>
                </div>
            </div>

             <div class="input-group">
                <label>Source Name (Optional)</label>
                <input id="noticeSource" class="form-control" placeholder="e.g. Authority" oninput="updateLive()">
                
                <div class="checkbox-group">
                    <input type="checkbox" id="verifiedCheck" onchange="updateLive()">
                    <label for="verifiedCheck">Show Verified Badge <i class="fas fa-check-circle" style="color:#38bdf8;"></i></label>
                </div>
            </div>

            <button class="btn-download" onclick="downloadImage()">Download HD Image</button>
        </div>

        <div class="preview-box">
            <div id="noticeWrapper">
                <div class="top-label"><i class="fas fa-bullhorn"></i> ANNOUNCEMENT</div>
                <div class="notice-content-wrapper">
                    <div class="notice-header">
                        <div class="notice-cat-badge" id="pCat">BREAKING NEWS</div>
                        <div class="notice-date" id="pDate"></div>
                    </div>
                    <div class="notice-body">
                        <div class="notice-text" id="pBody">Write your announcement content here. It will look spacious and premium.</div>
                    </div>
                    <div class="notice-footer" id="footerSection">
                        <div class="notice-source" id="pSourceContainer">
                            Source: <span id="pSource">Authority</span> 
                            <i class="fas fa-check-circle verified-badge" id="pVerified"></i>
                        </div>
                        <div class="notice-brand">Interactive Learning</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>&copy; <span id="year"></span> Interactive Learning</footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
        
        // Auto Date
        const dateObj = new Date();
        document.getElementById('pDate').innerText = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // --- 60 THEMES ---
        const themes = [
            { name: "Royal Blue", bg: "linear-gradient(135deg, #242066, #171542)", accent: "#fbbf24" },
            { name: "Deep Ocean", bg: "linear-gradient(135deg, #0f172a, #0e7490)", accent: "#67e8f9" },
            { name: "Midnight Navy", bg: "linear-gradient(135deg, #020617, #1e293b)", accent: "#38bdf8" },
            { name: "Electric Blue", bg: "linear-gradient(135deg, #172554, #2563eb)", accent: "#93c5fd" },
            { name: "Red Alert", bg: "linear-gradient(135deg, #7f1d1d, #991b1b)", accent: "#fca5a5" },
            { name: "Facebook Style", bg: "linear-gradient(135deg, #1877f2, #0d47a1)", accent: "#ffffff" },
            { name: "Twitter Dark", bg: "linear-gradient(135deg, #15202b, #192734)", accent: "#1da1f2" },
            { name: "Emerald", bg: "linear-gradient(135deg, #064e3b, #10b981)", accent: "#6ee7b7" },
            { name: "Forest", bg: "linear-gradient(135deg, #022c22, #065f46)", accent: "#34d399" },
            { name: "Sunset", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Deep Violet", bg: "linear-gradient(135deg, #4c1d95, #7c3aed)", accent: "#c4b5fd" },
            { name: "Cyber Purple", bg: "linear-gradient(135deg, #2d0036, #0f0c29)", accent: "#ff00ff" },
            { name: "Pure Black", bg: "linear-gradient(135deg, #000000, #111111)", accent: "#ffffff" },
            { name: "Charcoal", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Blood Moon", bg: "linear-gradient(135deg, #870000, #190a05)", accent: "#ff0000" },
            { name: "Youtube", bg: "linear-gradient(135deg, #FF0000, #282828)", accent: "#ffffff" },
            { name: "Spotify", bg: "linear-gradient(135deg, #191414, #1DB954)", accent: "#ffffff" },
            { name: "Instagram", bg: "linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)", accent: "#ffffff" },
            { name: "Gold Rush", bg: "linear-gradient(135deg, #bf953f, #fcf6ba, #b38728)", accent: "#000000" },
            { name: "Silver", bg: "linear-gradient(135deg, #C9D6FF, #E2E2E2)", accent: "#333333" },
            // ... (Add more themes as needed from previous list)
        ];
        
        // Fill themes for demo
        for(let i=themes.length; i<60; i++) {
             const hue = Math.floor(Math.random() * 360);
             themes.push({
                 name: `Style ${i+1}`,
                 bg: `linear-gradient(135deg, hsl(${hue}, 60%, 20%), hsl(${hue}, 60%, 10%))`,
                 accent: `hsl(${(hue+180)%360}, 80%, 60%)`
             });
        }

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        // --- ALIGNMENT ---
        let currentAlign = 'left';
        function setAlignment(align, btn) {
            currentAlign = align;
            document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateLive();
        }

        // --- RESET ---
        let lastState = null;
        function resetAll() {
            lastState = {
                cat: document.getElementById('noticeCat').value,
                body: document.getElementById('noticeBody').value,
                source: document.getElementById('noticeSource').value,
                theme: document.getElementById('themeSelector').value,
                verified: document.getElementById('verifiedCheck').checked
            };
            document.getElementById('noticeCat').selectedIndex = 0;
            document.getElementById('noticeBody').value = '';
            document.getElementById('noticeSource').value = '';
            document.getElementById('themeSelector').selectedIndex = 0;
            document.getElementById('verifiedCheck').checked = false;
            document.getElementById('undoBtn').style.display = 'flex';
            updateLive();
        }

        function undoReset() {
            if(!lastState) return;
            document.getElementById('noticeCat').value = lastState.cat;
            document.getElementById('noticeBody').value = lastState.body;
            document.getElementById('noticeSource').value = lastState.source;
            document.getElementById('themeSelector').value = lastState.theme;
            document.getElementById('verifiedCheck').checked = lastState.verified;
            document.getElementById('undoBtn').style.display = 'none';
            updateLive();
        }

        function updateLive() {
            document.getElementById('pCat').innerText = document.getElementById('noticeCat').value.replace(/^[^\s]+\s/, ''); // Remove emoji for clean look if wanted, or keep it. Current: keeps it.
            document.getElementById('pBody').innerText = document.getElementById('noticeBody').value || "Content goes here...";
            document.getElementById('pBody').style.textAlign = currentAlign;
            
            // Source Logic
            const src = document.getElementById('noticeSource').value;
            const pSourceContainer = document.getElementById('pSourceContainer');
            
            if(src && src.trim() !== "") {
                pSourceContainer.style.display = 'flex';
                document.getElementById('pSource').innerText = src;
            } else {
                pSourceContainer.style.display = 'none';
            }

            // Verified Badge
            const isVerified = document.getElementById('verifiedCheck').checked;
            document.getElementById('pVerified').style.display = isVerified ? 'inline-block' : 'none';

            // Theme
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            
            document.getElementById('noticeWrapper').style.background = theme.bg;
            document.getElementById('pCat').style.color = theme.accent;
            document.querySelector('.top-label').style.color = theme.accent;

            // Light Theme Handling
            const isLight = ["Silver", "Gold Rush", "Ice Cold"].includes(theme.name);
            const textCol = isLight ? "#222" : "#fff";
            document.getElementById('pBody').style.color = textCol;
            document.getElementById('pSource').style.color = textCol;
            document.querySelector('.notice-source').style.color = textCol; 
            document.querySelector('.top-label').style.background = isLight ? "rgba(0,0,0,0.1)" : "rgba(0,0,0,0.3)";
        }

        function downloadImage() {
            const wrapper = document.getElementById('noticeWrapper');
            wrapper.style.display = 'flex';
            html2canvas(wrapper, {
                scale: 4, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Notice_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Init
        document.getElementById('noticeWrapper').style.display = 'flex';
        updateLive();
    </script>
</body>
</html>
