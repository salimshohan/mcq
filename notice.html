<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Maker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Anek Bangla', 'Lexend', sans-serif; }
        body { 
            margin: 0; 
            background: #fdf2f8; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: 30px;
        }

        /* --- Animations --- */
        @keyframes headerAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .h23 { 
            text-align: center; 
            color: white; 
            background: linear-gradient(45deg, #f43f5e, #f97316, #fbbf24, #ef4444);
            background-size: 300% 300%;
            animation: headerAnim 6s ease infinite;
            padding: 15px; 
            border-radius: 12px; 
            font-weight: 700; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
            font-size: 22px;
        }

        .input-box { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        .input-box b { font-size: 14px; color: #4b5563; display: block; margin-top: 12px; font-weight: 600;}
        
        .input-box textarea, .input-box input, .input-box select { 
            width: 100%; 
            padding: 12px; 
            margin: 6px 0 0; 
            border-radius: 8px; 
            border: 2px solid #e2e8f0; 
            font-size: 16px; 
            font-family: 'Anek Bangla', sans-serif;
            transition: all 0.3s ease;
            background: #fff;
        }
        
        .input-box textarea:focus, .input-box input:focus, .input-box select:focus {
            outline: none;
            border-color: #f43f5e;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.1);
            background: #fff1f2;
        }
        
        .btn-generate { 
            width: 100%; 
            padding: 14px; 
            margin-top: 25px;
            border-radius: 10px; 
            border: none; 
            color: white; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer; 
            background: linear-gradient(45deg, #f43f5e, #f97316, #fbbf24, #ef4444);
            background-size: 300% 300%;
            animation: headerAnim 4s ease infinite;
            transition: transform 0.2s;
        }
        .btn-generate:active { transform: scale(0.98); }

        /* --- PREVIEW AREA --- */
        
        #announceWrapper {
            display: none; 
            width: 100%;          
            max-width: 420px;
            position: relative;
            background: linear-gradient(45deg, #f43f5e, #f97316, #fbbf24, #ef4444);
            background-size: 300% 300%;
            animation: headerAnim 6s ease infinite;
            padding: 12px; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .announce-badge {
            background: #fff;
            color: #ef4444;
            padding: 6px 20px; 
            margin-bottom: 12px; 
            border-radius: 30px; /* Ager moto rounded */
            font-size: 14px; 
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            font-family: 'Lexend', sans-serif;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .announce-card-inner {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            padding: 25px 20px; 
            width: 100%;
            min-height: 220px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .announce-headline { 
            font-size: 20px; 
            font-weight: 800; 
            margin-bottom: 15px; 
            color: #be123c; 
            line-height: 1.3;
            width: 100%;
            border-bottom: 2px dashed #fecdd3;
            padding-bottom: 15px;
            font-family: 'Lexend', sans-serif; /* Title looks better in English font usually, or Bangla if mixed */
        }

        .announce-body { 
            font-size: 18px; 
            font-weight: 500; 
            color: #374151; 
            line-height: 1.6;
            white-space: pre-wrap; 
            width: 100%;
            margin-bottom: 20px;
        }

        .source-box {
            width: 100%;
            background: #f3f4f6;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            color: #4b5563;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        
        .source-label {
            color: #ef4444;
            font-weight: 800;
            text-transform: uppercase;
        }

        .watermark { 
            margin-top: 15px;      
            width: 100%;           
            text-align: center;     
            font-size: 12px; 
            font-weight: 600; 
            font-family: 'Lexend', sans-serif;
            color: #cbd5e1; 
            letter-spacing: 1px;
        }

        .download-btn { 
            width: 100%; 
            max-width: 420px;
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            display: none; 
            background: linear-gradient(45deg, #f43f5e, #f97316, #fbbf24, #ef4444);
            background-size: 300% 300%;
            animation: headerAnim 4s ease infinite;
            transition: transform 0.2s;
        }
        .download-btn:active { transform: scale(0.98); }
        
    </style>
</head>
<body>

    <div class="app-container">
        <div class="h23">📢 Announcement Maker</div>
        
        <div class="input-box">
            <b>Category / Title</b>
            <select id="catSelect">
                <option value="Breaking News">Breaking News</option>
                <option value="Admission Update">Admission Update</option>
                <option value="Job Circular">Job Circular</option>
                <option value="Exam Result">Exam Result</option>
                <option value="Important Notice">Important Notice</option>
                <option value="Scholarship">Scholarship</option>
                <option value="Reminder">Reminder</option>
                <option value="Daily News">Daily News</option>
                <option value="Office Order">Office Order</option>
            </select>
            
            <b>Details / বিস্তারিত</b>
            <textarea id="msgInput" rows="4" placeholder="এখানে বিস্তারিত খবর লিখুন..."></textarea>
            
            <b>Source / তথ্যসূত্র</b>
            <input id="sourceInput" placeholder="যেমন: Prothom Alo, UGC website...">
            
            <button class="btn-generate" onclick="generatePost()">Generate Post</button>
        </div>
    </div>

    <div id="announceWrapper">
        <div class="announce-badge">ANNOUNCEMENT</div>
        
        <div class="announce-card-inner">
            <div class="announce-headline" id="previewHeadline">TITLE HERE</div>
            
            <div class="announce-body" id="previewMsg">Message content...</div>
            
            <div class="source-box" id="sourceContainer" style="display:none;">
                <span class="source-label">Source:</span> <span id="previewSource">N/A</span>
            </div>
        </div>

        <div class="watermark">Follow: Interactive Learning</div>
    </div>

    <button class="download-btn" id="dlBtn" onclick="downloadPost()">Download Image</button>

    <script>
        function generatePost() {
            // ভ্যালু নেওয়া
            const category = document.getElementById('catSelect').value;
            const msg = document.getElementById('msgInput').value;
            const source = document.getElementById('sourceInput').value;

            // ভ্যালিডেশন
            if (!msg) {
                alert("দয়া করে বিস্তারিত মেসেজ লিখুন!");
                return;
            }

            // এলিমেন্ট ধরা
            const wrapper = document.getElementById('announceWrapper');
            const dlBtn = document.getElementById('dlBtn');
            const sourceContainer = document.getElementById('sourceContainer');

            // ডিসপ্লে অন করা
            wrapper.style.display = "flex";
            dlBtn.style.display = "block";

            // ডাটা সেট করা
            // Category tai ekhon Headline hisebe kaj korbe
            document.getElementById('previewHeadline').innerText = category;
            document.getElementById('previewMsg').innerText = msg;
            
            // সোর্স যদি থাকে তবেই দেখাবে
            if(source.trim() !== "") {
                sourceContainer.style.display = "flex";
                document.getElementById('previewSource').innerText = source;
            } else {
                sourceContainer.style.display = "none";
            }
            
            // স্ক্রল করা
            wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function downloadPost() {
            const wrapper = document.getElementById("announceWrapper");
            const randomName = "notice_" + Date.now();

            html2canvas(wrapper, {
                scale: 35, 
                useCORS: true,
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement("a");
                link.download = randomName + ".png";
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }
    </script>
</body>
</html>
