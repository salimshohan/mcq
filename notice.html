<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Maker Pro | Interactive Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@100..800&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            /* iPhone Emoji Priority Font Stack */
            font-family: 'Lexend', 'Anek Bangla', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 50% 0%, rgba(56, 189, 248, 0.1) 0, transparent 50%), 
                radial-gradient(at 50% 100%, rgba(236, 72, 153, 0.05) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- STYLISH HEADER --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            display: flex; align-items: center;
            font-size: 20px; /* Reduced Font Size */
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        
        /* Circular Logo */
        .logo-img {
            height: 32px; width: 32px;
            margin-right: 10px;
            border-radius: 50%; /* Circle */
            border: 2px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
        }

        /* Hamburger Menu */
        .hamburger {
            cursor: pointer; z-index: 1100;
            width: 28px; height: 20px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hamburger span {
            display: block; height: 2px; width: 100%;
            background: white; border-radius: 2px; transition: 0.3s;
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: #0f172a;
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border-color);
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-color); transition: 0.2s;
        }
        .nav-menu a:hover { padding-left: 35px; color: var(--primary); background: rgba(255,255,255,0.03); }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px;
            width: 95%; max-width: 1100px;
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX --- */
        .editor-box {
            flex: 1; min-width: 350px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            height: fit-content;
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
        }
        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .action-buttons { display: flex; gap: 8px; }
        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: white; border-color: #64748b; }
        .btn-reset:hover { color: #ef4444; border-color: #ef4444; }
        .btn-undo { display: none; color: #10b981; border-color: #10b981; }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 11px; font-weight: 700;
            color: #94a3b8; margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* Glassy Inputs */
        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #f1f5f9;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        textarea.form-control { resize: vertical; height: 140px; }
        .form-control::placeholder { color: #64748b; font-size: 13px; }
        .form-control:focus {
            outline: none; border-color: #8b5cf6;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        select.form-control { cursor: pointer; }

        /* Download Button */
        .btn-download {
            width: 100%; padding: 14px; margin-top: 15px;
            border-radius: 50px; border: none;
            background: linear-gradient(45deg, #FF512F 0%, #DD2476 100%);
            color: white; font-weight: 700; cursor: pointer;
            text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(221, 36, 118, 0.4);
            transition: all 0.3s ease;
        }
        .btn-download:hover { box-shadow: 0 8px 25px rgba(221, 36, 118, 0.6); transform: scale(1.02); }

        /* --- PREVIEW AREA --- */
        .preview-box {
            flex: 1; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 10px;
        }

        /* --- STYLISH NOTICE CARD --- */
        #noticeWrapper {
            width: 100%; max-width: 420px;
            /* Background set by JS */
            border-radius: 20px;
            display: flex; flex-direction: column;
            /* Glassy / Premium Border */
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            overflow: hidden; position: relative;
        }
        
        /* Inner Glow */
        #noticeWrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 40%);
            pointer-events: none; z-index: 0;
        }

        /* Notice Content */
        .notice-content-wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

        /* Header Strip */
        .notice-header {
            padding: 18px 25px;
            background: rgba(0,0,0,0.2); 
            backdrop-filter: blur(5px);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .notice-cat-badge {
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--accent); 
            background: rgba(255,255,255,0.1);
            padding: 4px 10px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .notice-date { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 5px; }

        /* Body */
        .notice-body { 
            padding: 30px 25px; 
            flex: 1;
            display: flex; flex-direction: column; justify-content: center;
        }
        
        .notice-text {
            font-size: 18px; line-height: 1.6; color: #fff;
            white-space: pre-wrap; font-weight: 500;
            text-align: left;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Footer */
        .notice-footer {
            padding: 15px 25px;
            background: rgba(0,0,0,0.15);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 10px; color: rgba(255,255,255,0.5);
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .notice-source { font-style: italic; color: rgba(255,255,255,0.8); }
        .notice-brand { font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }

        /* Page Footer */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: var(--header-bg); border-top: 1px solid var(--border-color);
            margin-top: auto; font-size: 12px; color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .brand-logo { font-size: 18px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="https://cdn-icons-png.flaticon.com/512/8443/8443268.png" alt="Logo" class="logo-img">
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">Home (MCQ)</a>
            <a href="notice.html" style="color: var(--primary);">Notice Maker</a>
            <a href="quotation.html">Quotation</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-box">
            <div class="section-header">
                <div class="section-title">Notice Creator</div>
                <div class="action-buttons">
                    <button class="btn-icon btn-undo" id="undoBtn" onclick="undoReset()" title="Undo"><i class="fas fa-undo"></i></button>
                    <button class="btn-icon btn-reset" onclick="resetAll()" title="Reset All"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="noticeCat" class="form-control" onchange="updateLive()">
                    <option>📢 BREAKING NEWS</option>
                    <option>🔴 URGENT NOTICE</option>
                    <option>📝 ACADEMIC UPDATE</option>
                    <option>📅 EXAM SCHEDULE</option>
                    <option>🎉 EVENT ALERT</option>
                    <option>🏆 RESULT PUBLISHED</option>
                    <option>⚠️ IMPORTANT</option>
                    <option>🏫 SCHOOL CLOSED</option>
                    <option>💡 GENERAL INFO</option>
                    <option>📌 ADMISSION</option>
                    <option>📕 SYLLABUS</option>
                    <option>⏰ ROUTINE</option>
                    <option>🚫 HOLIDAY</option>
                    <option>✅ FORM FILL-UP</option>
                    <option>⚽ SPORTS</option>
                    <option>🎭 CULTURAL</option>
                    <option>🗳️ ELECTION</option>
                    <option>🤝 COLLABORATION</option>
                    <option>👋 FAREWELL</option>
                </select>
            </div>

            <div class="input-group">
                <label>Theme</label>
                <select id="themeSelector" class="form-control" onchange="updateLive()">
                    </select>
            </div>

            <div class="input-group">
                <label>Notice Details (Body Only)</label>
                <textarea id="noticeBody" class="form-control" placeholder="Write your notice here..." oninput="updateLive()"></textarea>
            </div>

             <div class="input-group">
                <label>Source (Optional)</label>
                <input id="noticeSource" class="form-control" placeholder="e.g. Principal" oninput="updateLive()">
            </div>

            <button class="btn-download" onclick="downloadImage()">Download HD Image</button>
        </div>

        <div class="preview-box">
            <div id="noticeWrapper">
                <div class="notice-content-wrapper">
                    <div class="notice-header">
                        <div class="notice-cat-badge" id="pCat">BREAKING NEWS</div>
                        <div class="notice-date"><i class="far fa-calendar-alt"></i> <span id="pDate"></span></div>
                    </div>
                    <div class="notice-body">
                        <div class="notice-text" id="pBody">Your notice text will appear here. Start typing in the box to see the magic happen!</div>
                    </div>
                    <div class="notice-footer" id="footerSection">
                        <div class="notice-source" id="pSource"></div>
                        <div class="notice-brand">Interactive Learning</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>&copy; <span id="year"></span> Interactive Learning</footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
        
        // Auto Set Today's Date in Preview
        const dateObj = new Date();
        const dateStr = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('pDate').innerText = dateStr;

        // --- MENU ---
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // --- THEMES (Same 60 Styles) ---
        const themes = [
            { name: "Royal Blue", bg: "linear-gradient(135deg, #242066, #171542)", accent: "#fbbf24" },
            { name: "Deep Ocean", bg: "linear-gradient(135deg, #0f172a, #0e7490)", accent: "#67e8f9" },
            { name: "Midnight Navy", bg: "linear-gradient(135deg, #020617, #1e293b)", accent: "#38bdf8" },
            { name: "Electric Blue", bg: "linear-gradient(135deg, #172554, #2563eb)", accent: "#93c5fd" },
            { name: "Facebook Style", bg: "linear-gradient(135deg, #1877f2, #0d47a1)", accent: "#ffffff" },
            { name: "Twitter Dark", bg: "linear-gradient(135deg, #15202b, #192734)", accent: "#1da1f2" },
            { name: "Ice Cold", bg: "linear-gradient(135deg, #2c3e50, #4ca1af)", accent: "#ffffff" },
            { name: "Blue Berry", bg: "linear-gradient(135deg, #1e3c72, #2a5298)", accent: "#ffcb05" },
            { name: "Sky High", bg: "linear-gradient(135deg, #004e92, #000428)", accent: "#00d2ff" },
            { name: "LinkedIn", bg: "linear-gradient(135deg, #0077b5, #004182)", accent: "#ffffff" },
            { name: "Deep Violet", bg: "linear-gradient(135deg, #4c1d95, #7c3aed)", accent: "#c4b5fd" },
            { name: "Cyber Purple", bg: "linear-gradient(135deg, #2d0036, #0f0c29)", accent: "#ff00ff" },
            { name: "Amethyst", bg: "linear-gradient(135deg, #9d50bb, #6e48aa)", accent: "#ffffff" },
            { name: "Twitch", bg: "linear-gradient(135deg, #6441a5, #2a0845)", accent: "#ffffff" },
            { name: "Galaxy", bg: "linear-gradient(135deg, #240b36, #c31432)", accent: "#ffffff" },
            { name: "Lavender", bg: "linear-gradient(135deg, #667db6, #0082c8, #0082c8, #667db6)", accent: "#ffffff" },
            { name: "Plum", bg: "linear-gradient(135deg, #dd2476, #ff512f)", accent: "#ffffff" },
            { name: "Neon Violet", bg: "linear-gradient(135deg, #654ea3, #eaafc8)", accent: "#ffffff" },
            { name: "Majestic", bg: "linear-gradient(135deg, #5614B0, #DBD65C)", accent: "#ffffff" },
            { name: "Discord", bg: "linear-gradient(135deg, #5865F2, #404EED)", accent: "#ffffff" },
            { name: "Emerald", bg: "linear-gradient(135deg, #064e3b, #10b981)", accent: "#6ee7b7" },
            { name: "Forest", bg: "linear-gradient(135deg, #022c22, #065f46)", accent: "#34d399" },
            { name: "Spotify", bg: "linear-gradient(135deg, #191414, #1DB954)", accent: "#ffffff" },
            { name: "Mint", bg: "linear-gradient(135deg, #11998e, #38ef7d)", accent: "#ffffff" },
            { name: "Lush", bg: "linear-gradient(135deg, #56ab2f, #a8e063)", accent: "#ffffff" },
            { name: "Dark Moss", bg: "linear-gradient(135deg, #134E5E, #71B280)", accent: "#ffffff" },
            { name: "Jungle", bg: "linear-gradient(135deg, #1a2980, #26d0ce)", accent: "#ffffff" },
            { name: "Seafoam", bg: "linear-gradient(135deg, #00d2ff, #3a7bd5)", accent: "#ffffff" },
            { name: "Olive", bg: "linear-gradient(135deg, #3f4e4f, #2c3639)", accent: "#a27b5c" },
            { name: "Nature", bg: "linear-gradient(135deg, #2ebf91, #8360c3)", accent: "#ffffff" },
            { name: "Crimson", bg: "linear-gradient(135deg, #7f1d1d, #991b1b)", accent: "#fca5a5" },
            { name: "Sunset", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Youtube", bg: "linear-gradient(135deg, #FF0000, #282828)", accent: "#ffffff" },
            { name: "Fire", bg: "linear-gradient(135deg, #f12711, #f5af19)", accent: "#ffffff" },
            { name: "Blood Moon", bg: "linear-gradient(135deg, #870000, #190a05)", accent: "#ff0000" },
            { name: "Cherry", bg: "linear-gradient(135deg, #eb3349, #f45c43)", accent: "#ffffff" },
            { name: "Pumpkin", bg: "linear-gradient(135deg, #d35400, #e67e22)", accent: "#f1c40f" },
            { name: "Red Mist", bg: "linear-gradient(135deg, #000000, #e74c3c)", accent: "#ffffff" },
            { name: "Netflix", bg: "linear-gradient(135deg, #000000, #E50914)", accent: "#ffffff" },
            { name: "Rose", bg: "linear-gradient(135deg, #e52d27, #b31217)", accent: "#ffffff" },
            { name: "Pure Black", bg: "linear-gradient(135deg, #000000, #111111)", accent: "#ffffff" },
            { name: "Charcoal", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Midnight", bg: "linear-gradient(135deg, #232526, #414345)", accent: "#ffffff" },
            { name: "Metal", bg: "linear-gradient(135deg, #2c3e50, #000000)", accent: "#bdc3c7" },
            { name: "Shadow", bg: "linear-gradient(135deg, #0f2027, #203a43, #2c5364)", accent: "#ffffff" },
            { name: "Carbon", bg: "linear-gradient(135deg, #093028, #237a57)", accent: "#ffffff" },
            { name: "Vampire", bg: "linear-gradient(135deg, #16222A, #3A6073)", accent: "#ffffff" },
            { name: "Dark Knight", bg: "linear-gradient(135deg, #000000, #434343)", accent: "#f1c40f" },
            { name: "Sleek", bg: "linear-gradient(135deg, #141E30, #243B55)", accent: "#ffffff" },
            { name: "Onyx", bg: "linear-gradient(135deg, #3E5151, #DECBA4)", accent: "#ffffff" },
            { name: "Instagram", bg: "linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)", accent: "#ffffff" },
            { name: "Gold Rush", bg: "linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c)", accent: "#000000" },
            { name: "Silver", bg: "linear-gradient(135deg, #C9D6FF, #E2E2E2)", accent: "#333333" },
            { name: "Haiku", bg: "linear-gradient(135deg, #fd746c, #ff9068)", accent: "#ffffff" },
            { name: "Superman", bg: "linear-gradient(135deg, #0099F7, #F11712)", accent: "#ffffff" },
            { name: "Timber", bg: "linear-gradient(135deg, #fc00ff, #00dbde)", accent: "#ffffff" },
            { name: "Passion", bg: "linear-gradient(135deg, #e53935, #e35d5b)", accent: "#ffffff" },
            { name: "Radar", bg: "linear-gradient(135deg, #A770EF, #CF8BF3, #FDB99B)", accent: "#ffffff" },
            { name: "Cosmic", bg: "linear-gradient(135deg, #ff00cc, #333399)", accent: "#ffffff" },
            { name: "Morning", bg: "linear-gradient(135deg, #FF5F6D, #FFC371)", accent: "#ffffff" }
        ];

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        // --- RESET & UNDO ---
        let lastState = null;

        function resetAll() {
            lastState = {
                cat: document.getElementById('noticeCat').value,
                body: document.getElementById('noticeBody').value,
                source: document.getElementById('noticeSource').value,
                theme: document.getElementById('themeSelector').value
            };
            
            document.getElementById('noticeCat').selectedIndex = 0;
            document.getElementById('noticeBody').value = '';
            document.getElementById('noticeSource').value = '';
            document.getElementById('themeSelector').selectedIndex = 0;
            
            document.getElementById('undoBtn').style.display = 'flex';
            updateLive();
        }

        function undoReset() {
            if(!lastState) return;
            document.getElementById('noticeCat').value = lastState.cat;
            document.getElementById('noticeBody').value = lastState.body;
            document.getElementById('noticeSource').value = lastState.source;
            document.getElementById('themeSelector').value = lastState.theme;
            
            document.getElementById('undoBtn').style.display = 'none';
            updateLive();
        }

        function updateLive() {
            document.getElementById('pCat').innerText = document.getElementById('noticeCat').value;
            document.getElementById('pBody').innerText = document.getElementById('noticeBody').value || "Notice text will appear here...";
            
            // Source Visibility
            const src = document.getElementById('noticeSource').value;
            if(src && src.trim() !== "") {
                document.getElementById('pSource').style.display = 'block';
                document.getElementById('pSource').innerText = src;
            } else {
                document.getElementById('pSource').style.display = 'none';
            }

            // Theme Apply
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            
            document.getElementById('noticeWrapper').style.background = theme.bg;
            document.getElementById('pCat').style.color = theme.accent;

            // Light Theme Logic
            const isLight = ["Silver", "Gold Rush", "Morning", "Ice Cold"].includes(theme.name);
            const textColor = isLight ? "#222" : "#fff";
            const mutedColor = isLight ? "#444" : "rgba(255,255,255,0.7)";

            document.getElementById('pBody').style.color = textColor;
            document.querySelector('.notice-date').style.color = mutedColor;
            document.querySelector('.notice-footer').style.color = mutedColor;
            document.querySelector('.notice-source').style.color = isLight ? "#111" : "rgba(255,255,255,0.9)";
            
            document.querySelector('.notice-header').style.background = isLight ? "rgba(0,0,0,0.05)" : "rgba(0,0,0,0.2)";
            document.querySelector('.notice-footer').style.background = isLight ? "rgba(0,0,0,0.05)" : "rgba(0,0,0,0.15)";
            document.querySelector('.notice-brand').style.color = isLight ? "#666" : "rgba(255,255,255,0.5)";
        }

        function downloadImage() {
            const wrapper = document.getElementById('noticeWrapper');
            // Ensure display is flex before capture
            wrapper.style.display = 'flex';
            html2canvas(wrapper, {
                scale: 4, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Notice_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
        
        // Init
        document.getElementById('noticeWrapper').style.display = 'flex';
        updateLive();
    </script>
</body>
</html>
