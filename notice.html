<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Maker | Interactive Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@100..800&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #020617;
            --panel-bg: rgba(30, 41, 59, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 50% 0%, rgba(139, 92, 246, 0.1) 0, transparent 50%), 
                radial-gradient(at 50% 100%, rgba(56, 189, 248, 0.1) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(15px);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            display: flex; align-items: center;
            font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .logo-img {
            height: 30px; width: 30px; margin-right: 10px;
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
        }

        .hamburger {
            cursor: pointer; z-index: 1100; width: 24px; height: 18px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hamburger span { display: block; height: 2px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 4px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -4px); }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: var(--bg-dark);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s; box-shadow: -5px 0 30px rgba(0,0,0,0.6);
            border-left: 1px solid var(--border-color);
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-color);
        }

        /* --- CONTAINER (CENTERED) --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1000px;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: flex-start;
            gap: 40px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); backdrop-filter: blur(12px);
            padding: 30px; border-radius: 24px; border: 1px solid var(--border-color);
            height: fit-content; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
        }
        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .action-buttons { display: flex; gap: 10px; }
        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            color: var(--text-muted); width: 34px; height: 34px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.15); color: white; }
        .btn-reset:hover { color: #ef4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-undo { display: none; color: #10b981; border-color: #10b981; background: rgba(16, 185, 129, 0.1); }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%; background: rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--border-color); color: #f1f5f9;
            padding: 14px 16px; border-radius: 12px; font-size: 14px; transition: 0.3s;
        }
        textarea.form-control { resize: vertical; height: 140px; }
        .form-control:focus { outline: none; border-color: var(--primary); background: rgba(0, 0, 0, 0.5); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1); }
        
        .features-grid { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .feature-item { 
            display: flex; align-items: center; gap: 8px; flex: 1;
            background: rgba(255,255,255,0.03); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s;
        }
        .feature-item:hover { background: rgba(255,255,255,0.06); }
        .feature-item input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        .feature-item label { margin: 0; font-size: 13px; color: #e2e8f0; cursor: pointer; font-weight: 500; display: flex; align-items: center;}

        /* Download Button */
        .btn-download {
            display: none; width: 100%; padding: 16px; margin-top: 10px; border-radius: 50px; border: none;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); background-size: 200% auto;
            color: white; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4); transition: 0.3s; animation: gradientAnim 3s infinite alternate;
        }
        @keyframes gradientAnim { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(139, 92, 246, 0.6); }

        /* --- PREVIEW AREA --- */
        .preview-box {
            flex: 1; min-width: 350px; max-width: 500px;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 10px;
        }

        /* --- NOTICE CARD --- */
        #noticeWrapper {
            width: 100%; max-width: 420px;
            border-radius: 24px;
            display: flex; flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            overflow: hidden; position: relative;
            background: #1e293b;
            transition: box-shadow 0.3s ease;
            margin: 0 auto;
        }
        
        .top-label {
            background: rgba(0,0,0,0.3); text-align: center; color: rgba(255,255,255,0.9);
            font-size: 10px; font-weight: 800; letter-spacing: 3px; padding: 12px;
            text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(4px);
        }

        .notice-content-wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

        /* Header */
        .notice-header {
            padding: 20px 25px 5px 25px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .notice-cat-badge {
            font-size: 13px; font-weight: 700; text-transform: capitalize;
            letter-spacing: 0.5px; color: var(--accent); 
            background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        .notice-date-time { 
            font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); 
            text-align: right;
        }
        .live-time { font-size: 11px; opacity: 0.7; display: block; margin-top: 2px; font-weight: 400;}

        /* Body */
        .notice-body { 
            padding: 20px 35px 30px 35px;
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            position: relative;
        }
        
        .notice-text {
            font-size: 19px; line-height: 1.6; color: #fff;
            white-space: pre-wrap; font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        /* WATERMARK - Body Bottom Right */
        .watermark-body {
            position: absolute; bottom: 5px; right: 25px;
            font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3); pointer-events: none; z-index: 2;
        }

        /* Footer */
        .notice-footer {
            padding: 15px 30px 20px 30px; 
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            display: none; /* Hidden by default */
            justify-content: flex-start; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            min-height: 50px;
        }
        
        .source-container { 
            display: flex; flex-direction: column; gap: 2px; 
            flex: 1;
        }
        .source-label { font-size: 9px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        
        .notice-source { 
            font-weight: 700; color: #fff; font-size: 15px;
            display: flex; align-items: center; gap: 6px;
            line-height: 1.2;
        }
        .verified-badge { color: #38bdf8; font-size: 15px; margin-top: 2px; flex-shrink: 0; }

        /* BRAND with LOGO inside CARD */
        .notice-brand { 
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px; 
            opacity: 0.6; font-size: 11px; color: white; text-align: right; line-height: 1.2;
            margin-left: auto;
            display: flex; align-items: center; justify-content: flex-end; gap: 8px;
        }
        
        .card-brand-logo {
            width: 20px; height: 20px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
        }

        footer {
            width: 100%; padding: 25px; text-align: center;
            background: rgba(2, 6, 23, 0.95); border-top: 1px solid var(--border-color);
            margin-top: auto; font-size: 13px; color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
            .editor-box, .preview-box { min-width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" alt="Logo" class="logo-img">
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="notice.html" style="color: var(--primary);">Notice Maker</a>
            <a href="quotation.html">Quotation</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-box">
            <div class="section-header">
                <div class="section-title">Announcement Creator</div>
                <div class="action-buttons">
                    <button class="btn-icon btn-undo" id="undoBtn" onclick="undoReset()" title="Undo"><i class="fas fa-undo"></i></button>
                    <button class="btn-icon btn-reset" onclick="resetAll()" title="Reset All"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>

            <div class="input-group">
                <label>Theme</label>
                <select id="themeSelector" class="form-control" onchange="updateLive()">
                    </select>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="noticeCat" class="form-control" onchange="updateLive()">
                    <option>Breaking News</option>
                    <option>Urgent Notice</option>
                    <option>Academic Update</option>
                    <option>Announcement</option>
                    <option>Important Alert</option>
                    <option>School Closed</option>
                    <option>Information</option>
                    <option>Admission</option>
                    <option>Approved</option>
                    <option>Rejected</option>
                    <option>Winner</option>
                    <option>Reminder</option>
                </select>
            </div>

            <div class="input-group">
                <label>Announcement Body</label>
                <textarea id="noticeBody" class="form-control" placeholder="Write the announcement here (min 10 chars)..." oninput="updateLive()"></textarea>
            </div>

             <div class="input-group">
                <label>Source Name (Optional)</label>
                <input id="noticeSource" class="form-control" list="sourceList" placeholder="e.g. The Daily Campus" oninput="updateLive()">
                <datalist id="sourceList">
                    <option value="The Daily Campus">
                    <option value="Prothom Alo">
                    <option value="The Daily Star">
                    <option value="Dhaka Tribune">
                    <option value="Kaler Kantho">
                    <option value="Samakal">
                    <option value="Jugantor">
                    <option value="Ittefaq">
                    <option value="Manab Zamin">
                    <option value="Naya Diganta">
                    <option value="Daily Inqilab">
                    <option value="Bhorer Kagoj">
                    <option value="Jaijaidin">
                    <option value="Bangladesh Pratidin">
                    <option value="The Business Standard">
                    <option value="Bangla Tribune">
                    <option value="Jago News 24">
                    <option value="Somoy News">
                    <option value="DBC News">
                    <option value="RU Insiders">
                    <option value="DU Insiders">
                    <option value="JU Insiders">
                    <option value="CU Insiders">
                    <option value="BUET Insiders">
                    <option value="Rajshahi University">
                    <option value="Dhaka University">
                    <option value="Jahangirnagar University">
                    <option value="Chittagong University">
                    <option value="Ministry of Education">
                    <option value="UGC">
                </datalist>
            </div>

            <div class="features-grid">
                <div class="feature-item">
                    <input type="checkbox" id="verifiedCheck" onchange="updateLive()">
                    <label for="verifiedCheck">Verified Badge</label>
                </div>
            </div>

            <button class="btn-download" id="dlBtn" onclick="downloadImage()">Download HD Image</button>
        </div>

        <div class="preview-box">
            <div id="noticeWrapper">
                <div class="top-label"><i class="fas fa-bullhorn"></i> ANNOUNCEMENT</div>
                <div class="notice-content-wrapper">
                    <div class="notice-header">
                        <div class="notice-cat-badge" id="pCat">Breaking News</div>
                        <div class="notice-date-time">
                            <div id="pDate"></div>
                            <div id="pTime" class="live-time"></div>
                        </div>
                    </div>
                    
                    <div class="notice-body" id="bodySection">
                        <div class="notice-text" id="pBody">Write your announcement content here.</div>
                        <div class="watermark-body">Interactive Learning</div>
                    </div>

                    <div class="notice-footer" id="footerSection">
                        <div class="source-container" id="pSourceContainer">
                            <span class="source-label">Source</span>
                            <div class="notice-source">
                                <span id="pSource">Authority</span> 
                                <i class="fas fa-check-circle verified-badge" id="pVerified" style="display:none;"></i>
                            </div>
                        </div>
                        
                        <div class="notice-brand" id="pBrand">
                            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" class="card-brand-logo">
                            Interactive<br>Learning
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>&copy; <span id="year"></span> Interactive Learning</footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
        
        // --- REAL TIME CLOCK ---
        function updateTime() {
            const now = new Date();
            document.getElementById('pDate').innerText = now.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            document.getElementById('pTime').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // --- THEMES ---
        const themes = [
            { name: "Royal Blue", bg: "linear-gradient(135deg, #242066, #171542)", accent: "#fbbf24" },
            { name: "Deep Ocean", bg: "linear-gradient(135deg, #0f172a, #0e7490)", accent: "#67e8f9" },
            { name: "Midnight Navy", bg: "linear-gradient(135deg, #020617, #1e293b)", accent: "#38bdf8" },
            { name: "Electric Blue", bg: "linear-gradient(135deg, #172554, #2563eb)", accent: "#93c5fd" },
            { name: "Red Alert", bg: "linear-gradient(135deg, #7f1d1d, #991b1b)", accent: "#fca5a5" },
            { name: "Facebook Style", bg: "linear-gradient(135deg, #1877f2, #0d47a1)", accent: "#ffffff" },
            { name: "Twitter Dark", bg: "linear-gradient(135deg, #15202b, #192734)", accent: "#1da1f2" },
            { name: "Emerald", bg: "linear-gradient(135deg, #064e3b, #10b981)", accent: "#6ee7b7" },
            { name: "Forest", bg: "linear-gradient(135deg, #022c22, #065f46)", accent: "#34d399" },
            { name: "Sunset", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Deep Violet", bg: "linear-gradient(135deg, #4c1d95, #7c3aed)", accent: "#c4b5fd" },
            { name: "Cyber Purple", bg: "linear-gradient(135deg, #2d0036, #0f0c29)", accent: "#ff00ff" },
            { name: "Pure Black", bg: "linear-gradient(135deg, #000000, #111111)", accent: "#ffffff" },
            { name: "Charcoal", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Blood Moon", bg: "linear-gradient(135deg, #870000, #190a05)", accent: "#ff0000" },
            { name: "Youtube", bg: "linear-gradient(135deg, #FF0000, #282828)", accent: "#ffffff" },
            { name: "Spotify", bg: "linear-gradient(135deg, #191414, #1DB954)", accent: "#ffffff" },
            { name: "Instagram", bg: "linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)", accent: "#ffffff" },
            { name: "Gold Rush", bg: "linear-gradient(135deg, #bf953f, #fcf6ba, #b38728)", accent: "#000000" },
            { name: "Silver", bg: "linear-gradient(135deg, #C9D6FF, #E2E2E2)", accent: "#333333" },
            { name: "Glass White", bg: "linear-gradient(135deg, #e0e7ff, #f3f4f6)", accent: "#333" },
            { name: "Cyber Black", bg: "linear-gradient(135deg, #000, #111)", accent: "#00ff00" },
            { name: "Rose Gold", bg: "linear-gradient(135deg, #B76E79, #E6BE8A)", accent: "#fff" },
            { name: "Minty Fresh", bg: "linear-gradient(135deg, #4ade80, #86efac)", accent: "#064e3b" },
            { name: "Vaporwave", bg: "linear-gradient(135deg, #ff71ce, #01cdfe)", accent: "#fff" }
        ];
        
        for(let i=themes.length; i<60; i++) {
             const hue = Math.floor(Math.random() * 360);
             themes.push({
                 name: `Style ${i+1}`,
                 bg: `linear-gradient(135deg, hsl(${hue}, 60%, 20%), hsl(${hue}, 60%, 10%))`,
                 accent: `hsl(${(hue+180)%360}, 80%, 60%)`
             });
        }

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            tSelect.appendChild(opt);
        });

        // --- RESET & UNDO ---
        let lastState = null;
        function resetAll() {
            lastState = {
                cat: document.getElementById('noticeCat').value,
                body: document.getElementById('noticeBody').value,
                source: document.getElementById('noticeSource').value,
                theme: document.getElementById('themeSelector').value,
                verified: document.getElementById('verifiedCheck').checked
            };
            document.getElementById('noticeCat').selectedIndex = 0;
            document.getElementById('noticeBody').value = '';
            document.getElementById('noticeSource').value = '';
            document.getElementById('themeSelector').selectedIndex = 0;
            document.getElementById('verifiedCheck').checked = false;
            document.getElementById('undoBtn').style.display = 'flex';
            updateLive();
        }

        function undoReset() {
            if(!lastState) return;
            document.getElementById('noticeCat').value = lastState.cat;
            document.getElementById('noticeBody').value = lastState.body;
            document.getElementById('noticeSource').value = lastState.source;
            document.getElementById('themeSelector').value = lastState.theme;
            document.getElementById('verifiedCheck').checked = lastState.verified;
            document.getElementById('undoBtn').style.display = 'none';
            updateLive();
        }

        function updateLive() {
            document.getElementById('pCat').innerText = document.getElementById('noticeCat').value.replace(/^[^\s]+\s/, ''); 
            
            const bodyText = document.getElementById('noticeBody').value || "Content goes here...";
            document.getElementById('pBody').innerText = bodyText;
            
            // --- DOWNLOAD BUTTON VISIBILITY ---
            if (document.getElementById('noticeBody').value.length > 10) {
                document.getElementById('dlBtn').style.display = 'block';
            } else {
                document.getElementById('dlBtn').style.display = 'none';
            }
            
            // --- DYNAMIC PADDING ---
            const bodySection = document.getElementById('bodySection');
            if(bodyText.length < 50) {
                bodySection.style.padding = "20px 35px 30px 35px";
            } else if(bodyText.length < 150) {
                bodySection.style.padding = "20px 35px 30px 35px";
            } else if(bodyText.length > 300) {
                bodySection.style.padding = "20px 35px 30px 35px";
            } else {
                bodySection.style.padding = "20px 35px 30px 35px";
            }

            // --- SOURCE VISIBILITY ---
            const src = document.getElementById('noticeSource').value.trim();
            const footerSection = document.getElementById('footerSection');
            
            if(src.length > 0) {
                footerSection.style.display = 'flex';
                document.getElementById('pSourceContainer').style.display = 'flex';
                document.getElementById('pSource').innerText = src;
            } else {
                footerSection.style.display = 'flex'; // Footer always shows for brand
                document.getElementById('pSourceContainer').style.display = 'none';
            }

            // Features
            document.getElementById('pVerified').style.display = document.getElementById('verifiedCheck').checked ? 'inline-block' : 'none';
            
            // Theme
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            
            document.getElementById('noticeWrapper').style.background = theme.bg;
            document.getElementById('pCat').style.color = theme.accent;
            document.querySelector('.top-label').style.color = theme.accent;

            // Light Theme Logic
            const isLight = ["Silver", "Gold Rush", "Ice Cold", "Glass White", "Rose Gold", "Minty Fresh", "Vaporwave"].includes(theme.name);
            const textCol = isLight ? "#222" : "#fff";
            document.getElementById('pBody').style.color = textCol;
            document.querySelector('.notice-source').style.color = textCol; 
            document.querySelector('.top-label').style.background = isLight ? "rgba(0,0,0,0.1)" : "rgba(0,0,0,0.3)";
            document.querySelector('.source-label').style.color = isLight ? "#666" : "rgba(255,255,255,0.5)";
            
            // Watermark color
            document.querySelector('.watermark-body').style.color = isLight ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.2)";
            
            // Brand Color
            document.querySelector('.notice-brand').style.color = isLight ? "#444" : "white";
        }

        function downloadImage() {
            const wrapper = document.getElementById('noticeWrapper');
            wrapper.style.display = 'flex';
            html2canvas(wrapper, {
                scale: 35, // User requested scale
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'notice_mcqmake_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Init
        document.getElementById('noticeWrapper').style.display = 'flex';
        updateLive();
    </script>
</body>
</html>
