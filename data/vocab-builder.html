<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Card | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&family=Merriweather:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-body: #f1f5f9;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --text-dark: #1e293b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 40px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX --- */
        .editor-box {
            flex: 1; min-width: 340px; max-width: 450px;
            background: var(--panel-bg); padding: 30px; border-radius: 16px;
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .section-title { 
            font-size: 18px; font-weight: 700; color: #0f172a; 
            margin-bottom: 25px; padding-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { 
            display: block; font-size: 12px; font-weight: 600; 
            color: #64748b; margin-bottom: 6px; text-transform: uppercase; 
        }
        
        .form-control {
            width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; 
            color: #334155; padding: 12px 15px; border-radius: 8px; font-size: 14px; 
            font-family: 'Hind Siliguri', sans-serif; transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        textarea.form-control { resize: vertical; min-height: 80px; }
        select.form-control { cursor: pointer; font-weight: 500; }

        .btn-download { 
            width: 100%; padding: 15px; border-radius: 8px; border: none;
            background: #0f172a; color: white; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-top: 20px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.2s; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        /* --- PREVIEW AREA --- */
        .preview-wrapper {
            flex: 1.5; min-width: 350px; 
            display: flex; justify-content: center; align-items: flex-start;
            padding: 10px;
        }

        /* --- VOCAB CARD DESIGN --- */
        #vocabCard {
            width: 100%; max-width: 500px;
            min-height: 500px;
            position: relative;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
            text-align: center;
            overflow: hidden;
        }

        /* Inner White Card */
        .inner-card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%; height: 100%;
            border-radius: 8px;
            padding: 30px 25px;
            display: flex; flex-direction: column; align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Top Section: Word & POS */
        .word-header { margin-bottom: 5px; }
        
        .main-word {
            font-family: 'Merriweather', serif;
            font-size: 36px; font-weight: 700; color: #1e293b;
            line-height: 1.2; text-transform: capitalize;
        }

        .pos-badge {
            display: inline-block; background: #e0e7ff; color: #4338ca;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            padding: 4px 10px; border-radius: 20px; letter-spacing: 1px;
            margin-top: 8px;
        }

        /* Meaning */
        .meaning-box {
            margin: 15px 0 25px 0; width: 100%;
            border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;
            padding: 15px 0;
        }
        .meaning-text {
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 22px; color: #334155; font-weight: 600;
        }

        /* Syn/Ant Grid */
        .relations-grid {
            display: flex; width: 100%; justify-content: space-between; gap: 15px;
            margin-bottom: 25px;
        }
        .relation-box { flex: 1; text-align: left; background: #f8fafc; padding: 10px; border-radius: 6px; }
        .relation-label { 
            font-size: 10px; font-weight: 800; color: #94a3b8; 
            text-transform: uppercase; display: block; margin-bottom: 3px;
        }
        .relation-text {
            font-size: 13px; font-weight: 600; color: #475569; line-height: 1.4;
        }
        .text-green { color: #059669; } /* Synonym Color */
        .text-red { color: #dc2626; }   /* Antonym Color */

        /* Example */
        .example-section {
            background: #fffbeb; border-left: 3px solid #f59e0b;
            padding: 12px 15px; width: 100%; text-align: left;
            border-radius: 0 4px 4px 0;
        }
        .example-text {
            font-family: 'Merriweather', serif; font-style: italic;
            font-size: 13px; color: #78350f; line-height: 1.5;
        }

        /* Footer Watermark */
        .card-footer {
            margin-top: auto; padding-top: 20px; width: 100%;
            display: flex; justify-content: center;
        }
        .watermark {
            font-size: 10px; font-weight: 700; color: #cbd5e1;
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- FOOTER --- */
        footer {
            width: 100%; padding: 25px; text-align: center;
            background: #0f172a; border-top: 1px solid #1e293b;
            margin-top: auto; font-size: 13px; color: #94a3b8;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-box, .preview-wrapper { width: 100%; }
            #vocabCard { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>
    
    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">Card Builder</div>
            
            <div class="input-group">
                <label>Card Theme</label>
                <select id="themeSelector" class="form-control" onchange="changeTheme()">
                    </select>
            </div>

            <div class="input-group">
                <label>Word (শব্দ)</label>
                <input id="wordInput" class="form-control" placeholder="e.g. Benevolent" oninput="updateCard()">
            </div>

            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Meaning (অর্থ)</label>
                    <input id="meanInput" class="form-control" placeholder="দয়ালু" oninput="updateCard()">
                </div>
                <div style="flex:0.6;">
                    <label>Type</label>
                    <select id="posInput" class="form-control" onchange="updateCard()">
                        <option>Noun</option>
                        <option>Verb</option>
                        <option>Adjective</option>
                        <option>Adverb</option>
                        <option>Idiom</option>
                    </select>
                </div>
            </div>

            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Synonym</label>
                    <input id="synInput" class="form-control" placeholder="Kind, Generous" oninput="updateCard()">
                </div>
                <div style="flex:1;">
                    <label>Antonym</label>
                    <input id="antInput" class="form-control" placeholder="Cruel, Selfish" oninput="updateCard()">
                </div>
            </div>

            <div class="input-group">
                <label>Example Sentence</label>
                <textarea id="exInput" class="form-control" placeholder="He was a benevolent leader..." oninput="updateCard()"></textarea>
            </div>

            <button class="btn-download" onclick="downloadCard()">
                <i class="fas fa-image"></i> Download Card
            </button>
        </div>

        <div class="preview-wrapper">
            <div id="vocabCard">
                <div class="inner-card">
                    
                    <div class="word-header">
                        <div class="main-word" id="prevWord">Benevolent</div>
                        <div class="pos-badge" id="prevPos">Adjective</div>
                    </div>

                    <div class="meaning-box">
                        <div class="meaning-text" id="prevMean">দয়ালু</div>
                    </div>

                    <div class="relations-grid">
                        <div class="relation-box">
                            <span class="relation-label text-green">Synonyms</span>
                            <div class="relation-text" id="prevSyn">Kind, Generous</div>
                        </div>
                        <div class="relation-box">
                            <span class="relation-label text-red">Antonyms</span>
                            <div class="relation-text" id="prevAnt">Cruel, Selfish</div>
                        </div>
                    </div>

                    <div class="example-section" id="exSection">
                        <div class="example-text" id="prevEx">"He was a benevolent leader who cared for his people."</div>
                    </div>

                    <div class="card-footer">
                        <div class="watermark">Interactive Learning</div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning. All Rights Reserved.</footer>

    <script>
        // --- THEMES ---
        const themes = [
            { name: "Midnight Blue", bg: "linear-gradient(135deg, #1e3a8a 0%, #1e293b 100%)" },
            { name: "Royal Purple", bg: "linear-gradient(135deg, #581c87 0%, #3b0764 100%)" },
            { name: "Lush Green", bg: "linear-gradient(135deg, #047857 0%, #064e3b 100%)" },
            { name: "Crimson Red", bg: "linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%)" },
            { name: "Sunset Orange", bg: "linear-gradient(135deg, #ea580c 0%, #9a3412 100%)" },
            { name: "Teal Ocean", bg: "linear-gradient(135deg, #0f766e 0%, #115e59 100%)" },
            { name: "Charcoal Grey", bg: "linear-gradient(135deg, #374151 0%, #111827 100%)" },
            { name: "Insta Gradient", bg: "linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)" },
            { name: "Deep Space", bg: "linear-gradient(135deg, #000000 0%, #434343 100%)" },
            { name: "Chocolate", bg: "linear-gradient(135deg, #451a03 0%, #291206 100%)" }
        ];

        // Init Themes
        const selector = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = t.name;
            selector.appendChild(opt);
        });

        function changeTheme() {
            const idx = selector.value;
            document.getElementById('vocabCard').style.background = themes[idx].bg;
        }

        // Live Update
        function updateCard() {
            const word = document.getElementById('wordInput').value || 'Benevolent';
            const mean = document.getElementById('meanInput').value || 'দয়ালু';
            const pos = document.getElementById('posInput').value || 'Adjective';
            const syn = document.getElementById('synInput').value || 'Kind, Generous';
            const ant = document.getElementById('antInput').value || 'Cruel, Selfish';
            const ex = document.getElementById('exInput').value || '"He was a benevolent leader who cared for his people."';

            document.getElementById('prevWord').innerText = word;
            document.getElementById('prevMean').innerText = mean;
            document.getElementById('prevPos').innerText = pos;
            
            // Handle Syn/Ant visibility
            const synEl = document.getElementById('prevSyn');
            const antEl = document.getElementById('prevAnt');
            
            synEl.innerText = syn;
            antEl.innerText = ant;
            
            // Example
            const exSection = document.getElementById('exSection');
            if (ex.trim()) {
                exSection.style.display = 'block';
                document.getElementById('prevEx').innerText = ex.startsWith('"') ? ex : `"${ex}"`;
            } else {
                exSection.style.display = 'none';
            }
        }

        // Download
        function downloadCard() {
            const element = document.getElementById('vocabCard');
            const btn = document.querySelector('.btn-download');
            const word = document.getElementById('wordInput').value || 'Vocab';
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            html2canvas(element, {
                scale: 3, 
                useCORS: true,
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${word}_Card.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fas fa-image"></i> Download Card';
            });
        }

        // Initialize
        updateCard();
    </script>
</body>
</html>
