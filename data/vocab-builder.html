<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Card | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-body: #f1f5f9;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --text-dark: #0f172a;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 40px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX --- */
        .editor-box {
            flex: 1; min-width: 320px; max-width: 400px;
            background: var(--panel-bg); padding: 25px; border-radius: 12px;
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .section-title { 
            font-size: 16px; font-weight: 700; color: #334155; 
            margin-bottom: 20px; padding-bottom: 10px;
            border-bottom: 2px solid #f8fafc;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { 
            display: block; font-size: 11px; font-weight: 600; 
            color: #64748b; margin-bottom: 5px; text-transform: uppercase; 
        }
        
        .form-control {
            width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; 
            color: #334155; padding: 10px 12px; border-radius: 6px; font-size: 13px; 
            font-family: 'Hind Siliguri', sans-serif; transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
        
        textarea.form-control { resize: vertical; min-height: 80px; }
        select.form-control { cursor: pointer; font-weight: 500; }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        
        .btn-action {
            flex: 1; padding: 10px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-reset { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .btn-reset:hover { background: #fecaca; }
        
        .btn-undo { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; display: none; }
        .btn-undo:hover { background: #bbf7d0; }

        .btn-download { 
            width: 100%; padding: 12px; border-radius: 6px; border: none;
            background: #0f172a; color: white; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-top: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-download:hover { transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        /* --- PREVIEW AREA --- */
        .preview-wrapper {
            flex: 1.5; min-width: 350px; 
            display: flex; justify-content: center; align-items: flex-start;
            padding: 10px;
        }

        /* --- PREMIUM COMPACT CARD (NO BORDER) --- */
        #vocabCard {
            width: 100%; max-width: 420px;
            
            /* No Border, Full Color */
            padding: 0; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            
            border-radius: 12px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
            text-align: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* Inner Content Padding */
        .card-content {
            padding: 30px 25px;
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        /* Date Badge */
        .date-badge {
            position: absolute; top: 15px; right: 15px;
            font-size: 9px; font-weight: 600; 
            background: rgba(255,255,255,0.15); 
            padding: 3px 8px; border-radius: 4px;
            backdrop-filter: blur(4px); letter-spacing: 0.5px;
        }

        /* Word Section */
        .word-header { margin-top: 5px; margin-bottom: 5px; }
        
        .main-word {
            font-family: 'Playfair Display', serif; 
            font-size: 32px; 
            font-weight: 700; color: #ffffff;
            line-height: 1.1; margin-bottom: 5px;
            text-transform: capitalize;
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .pos-badge {
            display: inline-block; 
            font-family: 'Inter', sans-serif;
            font-size: 9px; font-weight: 700; 
            background: rgba(255,255,255,0.2);
            color: #ffffff; text-transform: uppercase; letter-spacing: 1px;
            padding: 2px 8px; border-radius: 4px;
        }

        /* Meaning Section */
        .meaning-box {
            margin: 10px 0 15px 0; width: 100%;
            border-top: 1px solid rgba(255,255,255,0.15);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: 8px 0;
        }
        .meaning-text {
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 18px; 
            color: #ffffff; font-weight: 500;
        }

        /* Syn/Ant Grid */
        .relations-grid {
            display: flex; width: 100%; justify-content: center; gap: 20px;
            margin-bottom: 15px; display: none; /* Auto-hide */
        }
        .relation-box { text-align: center; }
        
        .relation-label { 
            font-size: 8px; font-weight: 700; 
            color: rgba(255,255,255,0.6); 
            text-transform: uppercase; display: block; margin-bottom: 2px; letter-spacing: 1px;
        }
        .relation-text {
            font-family: 'Inter', sans-serif;
            font-size: 11px; font-weight: 500; color: #ffffff;
        }
        .text-green { color: #86efac; } 
        .text-red { color: #fca5a5; }

        /* Example Section */
        .example-section {
            background: rgba(255,255,255,0.08); 
            border-left: 2px solid rgba(255,255,255,0.4);
            padding: 8px 12px; width: 100%; text-align: left;
            border-radius: 0 4px 4px 0; margin-bottom: 10px;
            backdrop-filter: blur(4px);
            display: none; /* Auto-hide */
        }
        .example-text {
            font-family: 'Playfair Display', serif; font-style: italic;
            font-size: 12px; color: rgba(255,255,255,0.9); line-height: 1.4;
        }

        /* Footer Watermark */
        .watermark {
            margin-top: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.3);
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- FOOTER --- */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: #0f172a; border-top: 1px solid #1e293b;
            margin-top: auto; font-size: 12px; color: #64748b;
        }

        /* Mobile */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-box, .preview-wrapper { width: 100%; }
            #vocabCard { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>
    
    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">Card Builder</div>
            
            <div class="btn-group" style="margin-bottom: 15px; margin-top: 0;">
                <button class="btn-action btn-reset" onclick="resetText()"><i class="fas fa-rotate-right"></i> Reset</button>
                <button class="btn-action btn-undo" id="undoBtn" onclick="undoReset()"><i class="fas fa-rotate-left"></i> Undo</button>
            </div>

            <div class="input-group">
                <label>Card Theme</label>
                <select id="themeSelector" class="form-control" onchange="changeTheme()">
                    </select>
            </div>

            <div class="input-group">
                <label>Word (শব্দ)</label>
                <input id="wordInput" class="form-control" placeholder="Type word..." oninput="updateCard()">
            </div>

            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Meaning (অর্থ)</label>
                    <input id="meanInput" class="form-control" placeholder="Type meaning..." oninput="updateCard()">
                </div>
                <div style="flex:0.6;">
                    <label>Type</label>
                    <select id="posInput" class="form-control" onchange="updateCard()">
                        <option value="">Select</option>
                        <option>Adj</option>
                        <option>Noun</option>
                        <option>Verb</option>
                        <option>Adv</option>
                        <option>Idiom</option>
                    </select>
                </div>
            </div>

            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Synonym</label>
                    <input id="synInput" class="form-control" placeholder="Optional" oninput="updateCard()">
                </div>
                <div style="flex:1;">
                    <label>Antonym</label>
                    <input id="antInput" class="form-control" placeholder="Optional" oninput="updateCard()">
                </div>
            </div>

            <div class="input-group">
                <label>Example Sentence</label>
                <textarea id="exInput" class="form-control" placeholder="Optional..." oninput="updateCard()"></textarea>
            </div>

            <button class="btn-download" onclick="downloadCard()">
                <i class="fas fa-image"></i> Download Card
            </button>
        </div>

        <div class="preview-wrapper">
            <div id="vocabCard">
                <div class="date-badge" id="cardDate"></div>

                <div class="card-content">
                    <div class="word-header" id="wordHeader">
                        <div class="main-word" id="prevWord"></div>
                        <div class="pos-badge" id="prevPos"></div>
                    </div>

                    <div class="meaning-box" id="meanBox">
                        <div class="meaning-text" id="prevMean"></div>
                    </div>

                    <div class="relations-grid" id="relGrid">
                        <div class="relation-box" id="synBox">
                            <span class="relation-label">Synonyms</span>
                            <div class="relation-text text-green" id="prevSyn"></div>
                        </div>
                        <div class="relation-box" id="antBox">
                            <span class="relation-label">Antonyms</span>
                            <div class="relation-text text-red" id="prevAnt"></div>
                        </div>
                    </div>

                    <div class="example-section" id="exSection">
                        <div class="example-text" id="prevEx"></div>
                    </div>

                    <div class="watermark">Interactive Learning</div>
                </div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning. All Rights Reserved.</footer>

    <script>
        // Set Date
        const date = new Date();
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        document.getElementById('cardDate').innerText = date.toLocaleDateString('en-GB', options);

        // --- THEMES ---
        const themes = [
            { name: "Midnight Navy", bg: "#0f172a" },
            { name: "Royal Purple", bg: "linear-gradient(135deg, #4c1d95 0%, #3b0764 100%)" },
            { name: "Emerald Green", bg: "linear-gradient(135deg, #064e3b 0%, #065f46 100%)" },
            { name: "Crimson Red", bg: "linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%)" },
            { name: "Burnt Orange", bg: "linear-gradient(135deg, #ea580c 0%, #c2410c 100%)" },
            { name: "Deep Teal", bg: "linear-gradient(135deg, #115e59 0%, #0f766e 100%)" },
            { name: "Charcoal", bg: "#18181b" },
            { name: "Insta Vibes", bg: "linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)" },
            { name: "Ocean Blue", bg: "linear-gradient(135deg, #1e3a8a 0%, #172554 100%)" },
            { name: "Chocolate", bg: "linear-gradient(135deg, #451a03 0%, #291206 100%)" }
        ];

        const selector = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = t.name;
            selector.appendChild(opt);
        });

        function changeTheme() {
            const idx = selector.value;
            document.getElementById('vocabCard').style.background = themes[idx].bg;
        }

        // --- RESET & UNDO ---
        let lastState = null;

        function resetText() {
            lastState = {
                word: document.getElementById('wordInput').value,
                mean: document.getElementById('meanInput').value,
                pos: document.getElementById('posInput').value,
                syn: document.getElementById('synInput').value,
                ant: document.getElementById('antInput').value,
                ex: document.getElementById('exInput').value
            };

            document.getElementById('wordInput').value = '';
            document.getElementById('meanInput').value = '';
            document.getElementById('posInput').value = '';
            document.getElementById('synInput').value = '';
            document.getElementById('antInput').value = '';
            document.getElementById('exInput').value = '';

            document.getElementById('undoBtn').style.display = 'inline-flex';
            updateCard();
        }

        function undoReset() {
            if(lastState) {
                document.getElementById('wordInput').value = lastState.word;
                document.getElementById('meanInput').value = lastState.mean;
                document.getElementById('posInput').value = lastState.pos;
                document.getElementById('synInput').value = lastState.syn;
                document.getElementById('antInput').value = lastState.ant;
                document.getElementById('exInput').value = lastState.ex;

                updateCard();
                document.getElementById('undoBtn').style.display = 'none';
            }
        }

        // --- UPDATE LOGIC (With Default Preview) ---
        function updateCard() {
            const wordIn = document.getElementById('wordInput').value;
            const meanIn = document.getElementById('meanInput').value;
            const posIn = document.getElementById('posInput').value;
            const synIn = document.getElementById('synInput').value;
            const antIn = document.getElementById('antInput').value;
            const exIn = document.getElementById('exInput').value;

            // --- DEFAULTS FOR PREVIEW ONLY ---
            // If main inputs are empty, show Defaults
            const showDefaults = !wordIn && !meanIn;

            const displayWord = wordIn || (showDefaults ? "Serendipity" : "");
            const displayMean = meanIn || (showDefaults ? "আকস্মিক সুভাগ্য" : "");
            const displayPos = posIn || (showDefaults ? "Noun" : "");

            // 1. Word Header
            if (displayWord) {
                document.getElementById('wordHeader').style.display = 'block';
                document.getElementById('prevWord').innerText = displayWord;
                
                const posBadge = document.getElementById('prevPos');
                if (displayPos) {
                    posBadge.style.display = 'inline-block';
                    posBadge.innerText = displayPos;
                } else {
                    posBadge.style.display = 'none';
                }
            } else {
                document.getElementById('wordHeader').style.display = 'none';
            }

            // 2. Meaning
            const meanBox = document.getElementById('meanBox');
            if (displayMean) {
                meanBox.style.display = 'block';
                document.getElementById('prevMean').innerText = displayMean;
            } else {
                meanBox.style.display = 'none';
            }

            // 3. Syn/Ant (Hidden if empty, no default to keep clean unless user types)
            const synBox = document.getElementById('synBox');
            if (synIn) {
                synBox.style.display = 'block';
                document.getElementById('prevSyn').innerText = synIn;
            } else {
                synBox.style.display = 'none';
            }

            const antBox = document.getElementById('antBox');
            if (antIn) {
                antBox.style.display = 'block';
                document.getElementById('prevAnt').innerText = antIn;
            } else {
                antBox.style.display = 'none';
            }

            const grid = document.getElementById('relGrid');
            if (!synIn && !antIn) {
                grid.style.display = 'none';
            } else {
                grid.style.display = 'flex';
            }

            // 4. Example (Hidden if empty)
            const exSection = document.getElementById('exSection');
            if (exIn) {
                exSection.style.display = 'block';
                document.getElementById('prevEx').innerText = exIn.startsWith('"') ? exIn : `"${exIn}"`;
            } else {
                exSection.style.display = 'none';
            }
        }

        // Download
        function downloadCard() {
            const element = document.getElementById('vocabCard');
            const btn = document.querySelector('.btn-download');
            // Use inputted word or default if empty
            const wordVal = document.getElementById('wordInput').value;
            const word = wordVal || 'Serendipity';
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            html2canvas(element, {
                scale: 3, 
                useCORS: true, 
                backgroundColor: null, 
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${word}_Card.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fas fa-image"></i> Download Card';
            });
        }

        // Initialize
        updateCard();
    </script>
</body>
</html>
