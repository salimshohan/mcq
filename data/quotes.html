<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quote Maker | Interactive Learning</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Poppins', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER & NAVBAR --- */
        header {
            width: 100%;
            background: linear-gradient(90deg, #1e1b4b, #312e81);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 700; color: white;
        }
        
        .logo-icon { 
            width: 35px; height: 35px; background: var(--primary); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white;
        }

        .hamburger {
            cursor: pointer; width: 30px; height: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 2001;
        }
        .hamburger span { 
            display: block; height: 3px; width: 100%; background: white; 
            border-radius: 2px; transition: 0.3s; 
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 250px; height: 100vh;
            background: #1e1b4b; border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s ease-in-out; z-index: 1999;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a {
            color: #cbd5e1; text-decoration: none; padding: 15px 30px;
            font-size: 16px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }
        .mobile-menu a:hover { background: rgba(255,255,255,0.1); color: var(--primary); }

        /* --- CONTAINER --- */
        .container {
            margin-top: 90px; flex: 1; width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; gap: 30px;
            padding-bottom: 40px; justify-content: center;
        }

        /* --- EDITOR SECTION (LEFT) --- */
        .editor-section {
            flex: 1; min-width: 300px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { 
            font-size: 18px; font-weight: 700; color: var(--primary); 
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color); 
            padding-bottom: 10px; display: flex; align-items: center; gap: 10px;
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .form-control {
            width: 100%; background: var(--input-bg); border: 1px solid #334155; 
            color: #f1f5f9; padding: 15px; font-size: 15px; border-radius: 10px;
            transition: 0.3s; font-family: 'Anek Bangla', sans-serif;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        textarea.form-control { resize: vertical; min-height: 100px; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        
        .btn {
            flex: 1; padding: 14px; border-radius: 50px; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .btn-theme { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3); }
        .btn-download { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3); }
        
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: scale(0.98); }

        /* --- PREVIEW SECTION (RIGHT) --- */
        .preview-section {
            flex: 1.5; min-width: 320px; display: flex; justify-content: center; align-items: flex-start;
        }

        #quoteWrapper {
            width: 100%; max-width: 500px; aspect-ratio: 1/1; /* Square for Social Media */
            position: relative;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); /* Default Theme */
            padding: 40px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.5s ease;
        }

        /* Big Quote Mark */
        .big-quote-bg {
            position: absolute; top: -10px; left: 20px;
            font-size: 150px; font-family: serif;
            color: rgba(255, 255, 255, 0.08);
            z-index: 0; line-height: 1; pointer-events: none;
        }

        .quote-content { position: relative; z-index: 2; text-align: center; width: 100%; }

        .quote-icon { font-size: 30px; color: rgba(255,255,255,0.8); margin-bottom: 20px; display: block; }

        .quote-text {
            font-family: 'Tiro Bangla', serif;
            font-size: 24px; line-height: 1.6; font-weight: 500;
            color: #ffffff; text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 25px; white-space: pre-wrap;
        }

        .divider {
            width: 50px; height: 3px; background: rgba(255,255,255,0.6);
            margin: 0 auto 20px auto; border-radius: 2px;
        }

        .quote-author {
            font-size: 16px; font-weight: 600; color: #cbd5e1;
            text-transform: uppercase; letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
        }

        .watermark {
            position: absolute; bottom: 15px;
            font-size: 11px; opacity: 0.5; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px;
            color: white; z-index: 2;
        }

        /* --- FOOTER --- */
        footer {
            margin-top: auto; width: 100%;
            background: #020617; padding: 20px;
            text-align: center; border-top: 1px solid #334155;
            font-size: 13px; color: #64748b;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .preview-section { width: 100%; }
            #quoteWrapper { aspect-ratio: auto; min-height: 400px; }
            .quote-text { font-size: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <div class="logo-icon">IL</div>
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="../index.html">Home</a>
        <a href="pdf.html">PDF Tool</a>
        <a href="quotes.html">Quote Maker</a>
        <a href="#">Contact</a>
    </div>

    <div class="container">
        
        <div class="editor-section">
            <div class="section-title">
                <i class="fas fa-edit"></i> Edit Content
            </div>
            
            <div class="input-group">
                <label>Quote / উক্তি</label>
                <textarea id="quoteInput" class="form-control" placeholder="এখানে উক্তি লিখুন..." oninput="updatePreview()"></textarea>
            </div>
            
            <div class="input-group">
                <label>Author / বক্তা</label>
                <input id="authorInput" class="form-control" placeholder="নাম লিখুন..." oninput="updatePreview()">
            </div>

            <div class="btn-group">
                <button class="btn btn-theme" onclick="changeTheme()">
                    <i class="fas fa-palette"></i> Theme
                </button>
                <button class="btn btn-download" onclick="downloadQuote()">
                    <i class="fas fa-download"></i> Save
                </button>
            </div>
        </div>

        <div class="preview-section">
            <div id="quoteWrapper">
                <div class="big-quote-bg">❝</div>
                
                <div class="quote-content">
                    <span class="quote-icon"><i class="fas fa-quote-left"></i></span>
                    <div class="quote-text" id="previewText">
                        "সাফল্য তখনই আসে যখন প্রস্তুতি এবং সুযোগের মিলন ঘটে।"
                    </div>
                    <div class="divider"></div>
                    <div class="quote-author" id="previewAuthor">
                        — সংগ্রহীত
                    </div>
                </div>

                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 Interactive Learning. All Rights Reserved.
    </footer>

    <script>
        // Toggle Navbar
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // Live Update
        function updatePreview() {
            const quote = document.getElementById('quoteInput').value;
            const author = document.getElementById('authorInput').value;

            document.getElementById('previewText').innerText = quote ? `"${quote}"` : '"এখানে উক্তি লিখুন..."';
            document.getElementById('previewAuthor').innerText = author ? `— ${author}` : '— নাম';
        }

        // 100+ Custom Themes Generator (Random Gradients)
        function changeTheme() {
            const card = document.getElementById('quoteWrapper');
            
            // Random HSL Colors for smooth gradients
            const h1 = Math.floor(Math.random() * 360);
            const h2 = (h1 + 40) % 360; 
            const h3 = (h1 + 180) % 360; 

            // Different Gradient Types
            const types = ['135deg', '45deg', 'to right', 'to bottom', 'circle at center'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            // Darker colors for white text readability (L < 40%)
            const c1 = `hsl(${h1}, 70%, 20%)`;
            const c2 = `hsl(${h2}, 80%, 25%)`;
            const c3 = `hsl(${h3}, 60%, 15%)`;

            let bg;
            if(type.includes('circle')) {
                bg = `radial-gradient(${type}, ${c1}, ${c2})`;
            } else {
                bg = `linear-gradient(${type}, ${c1}, ${c2}, ${c3})`;
            }

            card.style.background = bg;
        }

        // HD Download
        function downloadQuote() {
            const element = document.getElementById('quoteWrapper');
            const btn = document.querySelector('.btn-download');
            
            btn.innerText = "Processing...";
            
            html2canvas(element, {
                scale: 4, // Ultra HD
                useCORS: true,
                backgroundColor: null, // Transparent edges
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Quote_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fas fa-download"></i> Save';
            });
        }

        // Initial Theme
        changeTheme();
    </script>
</body>
</html>
