<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quote Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Poppins', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        
        /* --- CONTAINER --- */
        .container {
            margin-top: 5px; flex: 1; width: 95%; max-width: 1100px;
            display: flex; flex-wrap: wrap; gap: 10px;
            padding-bottom: 20px; justify-content: center;
        }

        /* --- EDITOR SECTION (LEFT) --- */
        .editor-section {
            flex: 1; min-width: 300px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { 
            font-size: 16px; font-weight: 700; color: var(--primary); 
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color); 
            padding-bottom: 10px; display: flex; align-items: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control {
            width: 100%; background: var(--input-bg); border: 1px solid #334155; 
            color: #f1f5f9; padding: 12px; font-size: 14px; border-radius: 8px;
            transition: 0.3s; font-family: 'Anek Bangla', sans-serif;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        
        .btn {
            flex: 1; padding: 12px; border-radius: 50px; border: none;
            font-size: 13px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .btn-theme { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-download { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: scale(0.98); }

        /* --- PREVIEW SECTION (RIGHT) --- */
        .preview-section {
            flex: 1.5; min-width: 320px; display: flex; justify-content: center; align-items: flex-start;
        }

        /* Fixed Ratio or Auto Height */
        #quoteWrapper {
            width: 100%; max-width: 500px;
            min-height: 300px; /* Reduced Height */
            position: relative;
            /* Default Theme */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.5s ease;
        }

        .quote-content { position: relative; z-index: 2; text-align: center; width: 100%; }

        .quote-icon { font-size: 30px; color: rgba(255,255,255,0.7); margin-bottom: 15px; display: block; }

        .quote-text {
            font-family: 'Tiro Bangla', serif;
            font-size: 24px; line-height: 1.5; font-weight: 500;
            color: white; text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-bottom: 15px; white-space: pre-wrap;
        }

        .divider {
            width: 40px; height: 3px; background: rgba(255,255,255,0.6);
            margin: 0 auto 15px auto; border-radius: 2px;
            display: none; /* Hidden by default */
        }

        .quote-author {
            font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.95);
            text-transform: uppercase; letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
            display: none; /* Hidden by default */
        }

        .watermark {
            position: absolute; bottom: 12px;
            font-size: 10px; opacity: 0.5; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: white; z-index: 2;
        }

        /* --- FOOTER --- */
        footer {
    width: 100%; padding: 15px; text-align: center;
    background: #1f2937;
    border-top: 1px solid #dadada;
    margin-top: auto; font-size: 14px; color: white;
}
        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .container { flex-direction: column; margin-top: 70px; }
            .preview-section { width: 100%; }
            #quoteWrapper { min-height: 280px; padding: 30px 20px; }
            .quote-text { font-size: 20px; }
        }
    </style>
</head>
<body>
<div id="header"></div>
<script type="text/javascript" src="/js/header.js"></script>
    

    <div class="container">
        
        <div class="editor-section">
            <div class="section-title">
                <i class="fas fa-edit"></i> Customize Quote
            </div>
            
            <div class="input-group">
                <label>Quote / উক্তি</label>
                <textarea id="quoteInput" class="form-control" placeholder="এখানে উক্তি লিখুন..." oninput="updatePreview()"></textarea>
            </div>
            
            <div class="input-group">
                <label>Author / বক্তা (Optional)</label>
                <input id="authorInput" class="form-control" placeholder="নাম লিখুন..." oninput="updatePreview()">
            </div>

            <div class="btn-group">
                <button class="btn btn-theme" onclick="changeTheme()">
                    <i class="fas fa-palette"></i> Change Theme
                </button>
                <button class="btn btn-download" onclick="downloadQuote()">
                    <i class="fas fa-download"></i> Save Image
                </button>
            </div>
        </div>

        <div class="preview-section">
            <div id="quoteWrapper">
                
                <div class="quote-content">
                    <span class="quote-icon"><i class="fas fa-quote-left"></i></span>
                    <div class="quote-text" id="previewText">
                        "সাফল্য তখনই আসে যখন প্রস্তুতি এবং সুযোগের মিলন ঘটে।"
                    </div>
                    <div class="divider"></div>
                    <div class="quote-author" id="previewAuthor">
                        — সংগ্রহীত
                    </div>
                </div>

                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 Interactive Learning.<br>All Rights Reserved.
    </footer>

    <script>
      

        // Live Update & Auto Hide Logic
        function updatePreview() {
            const quote = document.getElementById('quoteInput').value;
            const author = document.getElementById('authorInput').value.trim();

            document.getElementById('previewText').innerText = quote ? `"${quote}"` : '"এখানে উক্তি লিখুন..."';
            
            // Logic to hide Author & Divider if input is empty
            const authorEl = document.getElementById('previewAuthor');
            const dividerEl = document.querySelector('.divider');

            if (author) {
                authorEl.innerText = `— ${author}`;
                authorEl.style.display = 'block';
                dividerEl.style.display = 'block';
            } else {
                authorEl.style.display = 'none';
                dividerEl.style.display = 'none';
            }
        }

        // Curated Premium Themes (No muddy colors)
        const themes = [
            "linear-gradient(135deg, #667eea 0%, #764ba2 100%)", // Purple Bliss
            "linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)", // Deep Blue
            "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)", // Greenish
            "linear-gradient(135deg, #FC466B 0%, #3F5EFB 100%)", // Pink Blue
            "linear-gradient(135deg, #FDBB2D 0%, #22C1C3 100%)", // Gold Teal
            "linear-gradient(135deg, #360033 0%, #0b8793 100%)", // Deep Purple Teal
            "linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%)", // Instagram Style
            "linear-gradient(135deg, #20002c 0%, #cbb4d4 100%)", // Dark Violet
            "linear-gradient(135deg, #3a1c71 0%, #d76d77 50%, #ffaf7b 100%)", // Sunset
            "linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)", // Dark Ocean
            "linear-gradient(135deg, #00b09b 0%, #96c93d 100%)", // Fresh Green
            "linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%)", // Electric Violet
            "linear-gradient(135deg, #b92b27 0%, #1565C0 100%)", // Red Blue
            "linear-gradient(135deg, #cc2b5e 0%, #753a88 100%)", // Pink Purple
            "linear-gradient(135deg, #42275a 0%, #734b6d 100%)", // Grape
            "linear-gradient(135deg, #2C3E50 0%, #4CA1AF 100%)", // Calm Blue
            "linear-gradient(135deg, #232526 0%, #414345 100%)", // Midnight City
            "linear-gradient(135deg, #1A2980 0%, #26D0CE 100%)", // Aqua Marine
            "linear-gradient(135deg, #FF512F 0%, #DD2476 100%)", // Bloody Mary
            "linear-gradient(135deg, #4568DC 0%, #B06AB3 100%)"  // Soft Violet
        ];

        function changeTheme() {
            const card = document.getElementById('quoteWrapper');
            // Pick a random theme from the curated list
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            card.style.background = randomTheme;
        }

        // HD Download
        function downloadQuote() {
            const element = document.getElementById('quoteWrapper');
            const btn = document.querySelector('.btn-download');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            html2canvas(element, {
                scale: 3, // High quality
                useCORS: true,
                backgroundColor: null, 
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Quote_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fas fa-download"></i> Save Image';
            });
        }

        // Initialize empty state logic
        updatePreview();
        // Set first theme
        changeTheme();
    </script>
</body>
</html>
