<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quote Generator | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --primary: #6366f1;
            --text-main: #f8fafc;
            --nav-grad: linear-gradient(90deg, #1e1b4b, #312e81);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Poppins', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        header {
            width: 100%;
            background: var(--nav-grad);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 800; color: white;
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        .logo-icon { 
            width: 35px; height: 35px; background: var(--primary); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white;
        }

        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        /* --- MAIN CONTAINER --- */
        .main-container {
            margin-top: 80px;
            flex: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
            width: 100%;
        }

        /* --- QUOTE CARD AREA --- */
        .quote-wrapper {
            background: #1e293b;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%; max-width: 700px;
            position: relative;
        }

        /* The actual downloadable card */
        .quote-card {
            width: 100%;
            min-height: 400px;
            padding: 40px;
            border-radius: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            position: relative;
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
            /* Default Theme */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Watermark */
        .watermark {
            position: absolute; bottom: 15px; right: 20px;
            font-size: 12px; opacity: 0.7; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }

        .quote-icon { font-size: 30px; margin-bottom: 20px; opacity: 0.8; }
        
        .quote-text {
            font-family: 'Playfair Display', 'Anek Bangla', serif;
            font-size: 28px; line-height: 1.5; font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .quote-author {
            font-size: 16px; font-weight: 500; font-style: italic;
            border-top: 1px solid rgba(255,255,255,0.5);
            padding-top: 10px; margin-top: 10px;
        }

        /* --- CONTROLS --- */
        .controls-area {
            width: 100%; max-width: 700px;
            margin-top: 30px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
        }

        .btn-control {
            padding: 15px; border: none; border-radius: 12px;
            background: rgba(255,255,255,0.05); color: white;
            font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-control:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); border-color: var(--primary); }
        .btn-control i { font-size: 20px; color: var(--primary); }

        .btn-generate {
            grid-column: span 4;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            font-size: 18px; text-transform: uppercase; letter-spacing: 2px;
            padding: 18px; margin-top: 10px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        .btn-generate:hover { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; }
        .btn-generate i { color: white; }

        /* Font Size Slider */
        .font-control {
            grid-column: span 4;
            display: flex; align-items: center; gap: 15px;
            background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 50px;
            margin-bottom: 10px;
        }
        .font-control input { flex: 1; cursor: pointer; accent-color: var(--primary); }

        /* --- FOOTER --- */
        footer {
            text-align: center; padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.95); width: 100%; margin-top: auto;
            font-size: 13px; color: #94a3b8;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            .controls-area { grid-template-columns: 1fr 1fr; }
            .btn-generate, .font-control { grid-column: span 2; }
            .quote-text { font-size: 22px; }
            .main-container { padding: 10px; margin-top: 70px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <div class="logo-icon">IL</div>
            Interactive Learning
        </div>
        <div class="nav-links">
            <a href="../index.html"><i class="fas fa-home"></i> Home</a>
        </div>
    </header>

    <div class="main-container">
        
        <div class="quote-wrapper" id="captureArea">
            <div class="quote-card" id="quoteCard">
                <i class="fas fa-quote-left quote-icon"></i>
                <div class="quote-text" id="quoteText">সফলতা কোনো গন্তব্য নয়, এটি একটি যাত্রাপথ।</div>
                <div class="quote-author" id="quoteAuthor">- আলবার্ট আইনস্টাইন</div>
                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

        <div class="controls-area">
            
            <div class="font-control">
                <i class="fas fa-font"></i>
                <input type="range" min="18" max="50" value="28" oninput="resizeFont(this.value)">
                <span style="font-size: 18px;">A</span>
            </div>

            <button class="btn-control" onclick="changeTheme()">
                <i class="fas fa-palette"></i> Theme
            </button>
            <button class="btn-control" onclick="copyQuote()">
                <i class="fas fa-copy"></i> Copy
            </button>
            <button class="btn-control" onclick="downloadImage()">
                <i class="fas fa-download"></i> Image
            </button>
            <button class="btn-control" onclick="shareQuote()">
                <i class="fas fa-share-alt"></i> Share
            </button>

            <button class="btn-control btn-generate" onclick="newQuote()">
                <i class="fas fa-magic"></i> New Quote
            </button>
        </div>

    </div>

    <footer>
        &copy; 2026 Interactive Learning. All Rights Reserved.
    </footer>

    <script>
        // --- DATA ---
        const quotes = [
            { t: "সফলতা কোনো গন্তব্য নয়, এটি একটি যাত্রাপথ।", a: "জিগ জিগলার" },
            { t: "The only way to do great work is to love what you do.", a: "Steve Jobs" },
            { t: "হাজার মাইল পথ চলা শুরু হয় একটি ছোট্ট পদক্ষেপের মাধ্যমে।", a: "লাও জু" },
            { t: "Education is the most powerful weapon which you can use to change the world.", a: "Nelson Mandela" },
            { t: "স্বপ্ন সেটা নয় যা তুমি ঘুমিয়ে দেখো, স্বপ্ন হলো সেটা যা তোমাকে ঘুমোতে দেয় না।", a: "এ পি জে আব্দুল কালাম" },
            { t: "Stay hungry, stay foolish.", a: "Steve Jobs" },
            { t: "জ্ঞান অর্জন করো, কারণ তা তোমাকে শক্তিশালী করবে।", a: "ইমাম আলী (রাঃ)" },
            { t: "Believe you can and you're halfway there.", a: "Theodore Roosevelt" },
            { t: "যে নিজেকে দমন করতে পারে, সেই প্রকৃত শক্তিশালী।", a: "গৌতম বুদ্ধ" },
            { t: "Success is not final, failure is not fatal: It is the courage to continue that counts.", a: "Winston Churchill" },
            // Add more quotes here...
        ];

        // --- 100+ THEMES GENERATOR (Algorithm) ---
        // Instead of hardcoding 100 classes, we generate beautiful gradients procedurally.
        const colors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', 
            '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e', '#1e293b'
        ];
        
        const directions = ['to right', 'to left', 'to bottom', 'to top', '135deg', '45deg', 'circle', 'radial'];

        function getRandomTheme() {
            const mode = Math.floor(Math.random() * 3); // 0: Linear, 1: Radial, 2: Three Color
            const c1 = colors[Math.floor(Math.random() * colors.length)];
            const c2 = colors[Math.floor(Math.random() * colors.length)];
            const c3 = colors[Math.floor(Math.random() * colors.length)];
            const dir = directions[Math.floor(Math.random() * directions.length)];

            if (mode === 0) return `linear-gradient(${dir}, ${c1}, ${c2})`;
            if (mode === 1) return `radial-gradient(circle, ${c1}, ${c2})`;
            return `linear-gradient(${dir}, ${c1}, ${c2}, ${c3})`;
        }

        // --- FUNCTIONS ---

        function newQuote() {
            const rnd = Math.floor(Math.random() * quotes.length);
            const q = quotes[rnd];
            
            // Animation
            const card = document.getElementById('quoteCard');
            card.style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('quoteText').innerText = q.t;
                document.getElementById('quoteAuthor').innerText = `- ${q.a}`;
                card.style.opacity = '1';
                changeTheme(); // Also change theme on new quote
            }, 300);
        }

        function changeTheme() {
            const card = document.getElementById('quoteCard');
            const theme = getRandomTheme();
            card.style.background = theme;
            
            // Text color adjustment (Basic logic: lighter text for dark gradients)
            // Ideally all gradients above are dark/saturated enough for white text.
            card.style.color = '#ffffff'; 
        }

        function resizeFont(size) {
            document.getElementById('quoteText').style.fontSize = size + 'px';
        }

        function copyQuote() {
            const text = document.getElementById('quoteText').innerText;
            const author = document.getElementById('quoteAuthor').innerText;
            navigator.clipboard.writeText(`"${text}" ${author}`).then(() => {
                alert('Quote copied to clipboard!');
            });
        }

        function shareQuote() {
            const text = document.getElementById('quoteText').innerText;
            const author = document.getElementById('quoteAuthor').innerText;
            if (navigator.share) {
                navigator.share({
                    title: 'Interactive Learning Quote',
                    text: `"${text}" ${author}`,
                    url: window.location.href
                });
            } else {
                copyQuote();
            }
        }

        function downloadImage() {
            const element = document.getElementById('quoteCard'); // Download just the card
            
            // Temporarily fix size for HD export
            const originalWidth = element.style.width;
            const originalTransform = element.style.transform;
            
            // Scale up for Retina quality
            html2canvas(element, {
                scale: 3, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Quote_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // Init
        newQuote();

    </script>
</body>
</html>
