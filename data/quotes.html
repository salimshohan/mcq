<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quote Generator | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;600;700&family=Tiro+Bangla:ital@0;1&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Poppins', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER & NAVBAR (SAME AS HOME) --- */
        header {
            width: 100%;
            background: linear-gradient(90deg, #1e1b4b, #312e81);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 700; color: white;
        }
        
        .logo-icon { 
            width: 35px; height: 35px; background: var(--primary); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white;
        }

        .hamburger {
            cursor: pointer; width: 30px; height: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 2001;
        }
        .hamburger span { 
            display: block; height: 3px; width: 100%; background: white; 
            border-radius: 2px; transition: 0.3s; 
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 250px; height: 100vh;
            background: #1e1b4b; border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s ease-in-out; z-index: 1999;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a {
            color: #cbd5e1; text-decoration: none; padding: 15px 30px;
            font-size: 16px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }
        .mobile-menu a:hover { background: rgba(255,255,255,0.1); color: var(--primary); }

        /* --- MAIN CONTENT --- */
        .container {
            margin-top: 90px; flex: 1; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }

        /* --- QUOTE CARD DESIGN --- */
        .quote-wrapper {
            background: #1e293b;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 100%; max-width: 600px;
            position: relative;
            border: 1px solid #334155;
        }

        .quote-card {
            width: 100%;
            min-height: 400px; /* Standard Post Size */
            padding: 40px 30px;
            border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            position: relative;
            background: linear-gradient(135deg, #4f46e5, #9333ea); /* Default */
            transition: background 0.5s ease;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }

        .quote-icon {
            font-size: 40px; margin-bottom: 20px; opacity: 0.6; color: rgba(255,255,255,0.8);
        }

        .quote-text {
            font-family: 'Tiro Bangla', serif; /* Classic Bangla Font */
            font-size: 26px; line-height: 1.6; font-weight: 600;
            color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        .quote-author {
            font-size: 16px; font-weight: 500; font-style: italic;
            color: rgba(255,255,255,0.9);
            position: relative; padding-top: 15px;
        }
        .quote-author::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 50px; height: 2px; background: rgba(255,255,255,0.5);
        }

        .watermark {
            position: absolute; bottom: 15px;
            font-size: 11px; opacity: 0.6; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px;
            color: white;
        }

        /* --- CONTROLS --- */
        .controls {
            margin-top: 30px;
            display: flex; gap: 15px; flex-wrap: wrap;
            justify-content: center; width: 100%; max-width: 600px;
        }

        .btn {
            padding: 12px 25px; border-radius: 50px; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .btn-theme { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-theme:hover { background: rgba(255,255,255,0.2); }

        .btn-new { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4); }
        .btn-new:hover { transform: translateY(-2px); background: #4f46e5; }

        .btn-download { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }

        /* --- FOOTER --- */
        footer {
            margin-top: auto; width: 100%;
            background: #020617; padding: 20px;
            text-align: center; border-top: 1px solid #334155;
            font-size: 13px; color: #64748b;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .quote-text { font-size: 20px; }
            .quote-card { min-height: 350px; padding: 30px 20px; }
            .controls { flex-direction: column; width: 100%; }
            .btn { width: 100%; justify-content: center; padding: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <div class="logo-icon">IL</div>
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="../index.html">Home</a>
        <a href="pdf.html">PDF Tool</a>
        <a href="quotes.html">Quote Maker</a>
        <a href="#">Contact</a>
    </div>

    <div class="container">
        
        <div class="quote-wrapper">
            <div class="quote-card" id="quoteCard">
                <i class="fas fa-quote-left quote-icon"></i>
                <div class="quote-text" id="quoteText">সফলতা কোনো গন্তব্য নয়, এটি একটি যাত্রাপথ।</div>
                <div class="quote-author" id="quoteAuthor">জিগ জিগলার</div>
                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-theme" onclick="changeTheme()">
                <i class="fas fa-palette"></i> Theme
            </button>
            <button class="btn btn-new" onclick="generateQuote()">
                <i class="fas fa-magic"></i> New Quote
            </button>
            <button class="btn btn-download" onclick="downloadImage()">
                <i class="fas fa-download"></i> Download
            </button>
        </div>

    </div>

    <footer>
        &copy; 2026 Interactive Learning. All Rights Reserved.
    </footer>

    <script>
        // Toggle Navbar
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // Data: Quotes
        const quotes = [
            { t: "সফলতা কোনো গন্তব্য নয়, এটি একটি যাত্রাপথ।", a: "জিগ জিগলার" },
            { t: "হাজার মাইল পথ চলা শুরু হয় একটি ছোট্ট পদক্ষেপের মাধ্যমে।", a: "লাও জু" },
            { t: "The only way to do great work is to love what you do.", a: "Steve Jobs" },
            { t: "জ্ঞান অর্জন করো, কারণ তা তোমাকে শক্তিশালী করবে।", a: "ইমাম আলী (রাঃ)" },
            { t: "স্বপ্ন সেটা নয় যা তুমি ঘুমিয়ে দেখো, স্বপ্ন হলো সেটা যা তোমাকে ঘুমোতে দেয় না।", a: "এ পি জে আব্দুল কালাম" },
            { t: "Believe you can and you're halfway there.", a: "Theodore Roosevelt" },
            { t: "যে নিজেকে দমন করতে পারে, সেই প্রকৃত শক্তিশালী।", a: "গৌতম বুদ্ধ" },
            { t: "Success is not final, failure is not fatal: It is the courage to continue that counts.", a: "Winston Churchill" },
            { t: "পরিশ্রম সৌভাগ্যের প্রসূতি।", a: "প্রবাদ" },
            { t: "সময় ও স্রোত কারো জন্য অপেক্ষা করে না।", a: "প্রবাদ" }
        ];

        // Logic: 100+ Theme Generator using HSL
        function changeTheme() {
            const card = document.getElementById('quoteCard');
            // Random Hue (0-360), Saturation (60-90%), Lightness (20-40% for dark bg)
            const h1 = Math.floor(Math.random() * 360);
            const h2 = (h1 + 40) % 360; // Complementary-ish color
            
            const c1 = `hsl(${h1}, 70%, 30%)`;
            const c2 = `hsl(${h2}, 80%, 20%)`;
            const c3 = `hsl(${h1}, 60%, 15%)`;

            // Random Angle
            const angle = Math.floor(Math.random() * 360);
            
            // Apply Gradient
            card.style.background = `linear-gradient(${angle}deg, ${c1}, ${c2}, ${c3})`;
        }

        function generateQuote() {
            const rnd = Math.floor(Math.random() * quotes.length);
            const q = quotes[rnd];
            
            const textEl = document.getElementById('quoteText');
            const authEl = document.getElementById('quoteAuthor');
            
            // Simple Fade Animation
            textEl.style.opacity = 0;
            authEl.style.opacity = 0;
            
            setTimeout(() => {
                textEl.innerText = q.t;
                authEl.innerText = q.a;
                textEl.style.opacity = 1;
                authEl.style.opacity = 1;
            }, 300);

            changeTheme(); // New quote = New theme
        }

        function downloadImage() {
            const element = document.getElementById('quoteCard');
            
            html2canvas(element, {
                scale: 3, // HD Quality
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Quote_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // Init
        generateQuote();
    </script>
</body>
</html>
