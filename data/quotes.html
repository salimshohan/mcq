<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quote Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Poppins:wght@300;400;600&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --text-main: #111827;
            --border-light: #e5e7eb;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX (LEFT) --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light); 
            box-shadow: var(--shadow-lg);
            height: fit-content;
        }

        .section-title { 
            font-size: 18px; font-weight: 700; color: var(--primary); 
            margin-bottom: 20px; border-bottom: 1px solid var(--border-light); 
            padding-bottom: 10px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        
        .form-control {
            width: 100%; background: #ffffff; border: 1px solid #d1d5db; 
            color: #111827; padding: 12px; border-radius: 8px; font-size: 14px; 
            font-family: 'Anek Bangla', sans-serif; transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        textarea.form-control { resize: vertical; min-height: 100px; }
        select.form-control { cursor: pointer; }

        /* Button */
        .btn-download { 
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: #111827; color: white; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-download:hover { transform: translateY(-2px); opacity: 0.9; }

        /* --- PREVIEW WRAPPER (RIGHT) --- */
        .preview-wrapper {
            flex: 1.5; min-width: 350px; 
            display: flex; justify-content: center; align-items: flex-start;
            /* Light Background as requested */
            background: #e2e8f0; 
            padding: 40px; border-radius: 12px;
            border: 1px solid #cbd5e1;
        }

        /* Improved Quote Card Design */
        #quoteWrapper {
            width: 100%; max-width: 500px;
            min-height: 450px; /* Portrait Ratio */
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 40px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            /* Premium Shadow & Radius */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border-radius: 2px; /* Slight rounded or square looks professional */
            border: 8px solid rgba(255, 255, 255, 0.15); /* Frame effect */
            transition: background 0.3s ease;
        }

        .quote-content { position: relative; z-index: 2; text-align: center; width: 100%; }

        .quote-icon { 
            font-size: 36px; color: rgba(255,255,255,0.9); 
            margin-bottom: 25px; display: block; 
        }

        .quote-text {
            font-family: 'Tiro Bangla', serif;
            font-size: 28px; line-height: 1.6; font-weight: 500;
            color: #ffffff; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 30px; white-space: pre-wrap;
        }

        .divider {
            width: 60px; height: 4px; background: #ffffff;
            margin: 0 auto 20px auto; border-radius: 10px;
            display: none; opacity: 0.8;
        }

        .quote-author {
            font-size: 18px; font-weight: 700; color: #ffffff;
            text-transform: uppercase; letter-spacing: 2px;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: none;
        }

        .watermark {
            position: absolute; bottom: 20px;
            font-size: 12px; opacity: 0.6; font-weight: 600;
            text-transform: uppercase; letter-spacing: 3px;
            color: white; z-index: 2;
        }

        /* --- FOOTER (Original Dark) --- */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: #1f2937; border-top: 1px solid #374151;
            margin-top: auto; font-size: 13px; color: white;
        }

        /* Mobile Scale */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-box, .preview-wrapper { width: 100%; }
            .preview-wrapper { padding: 20px; }
            #quoteWrapper { padding: 30px 20px; min-height: 400px; }
            .quote-text { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>
    
    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">Design Your Quote</div>
            
            <div class="input-group">
                <label>Select Theme (80+ Styles)</label>
                <select id="themeSelector" class="form-control" onchange="applyTheme()">
                    </select>
            </div>

            <div class="input-group">
                <label>Quote / উক্তি</label>
                <textarea id="quoteInput" class="form-control" placeholder="এখানে উক্তি লিখুন..." oninput="updatePreview()"></textarea>
            </div>
            
            <div class="input-group">
                <label>Author / বক্তা (Optional)</label>
                <input id="authorInput" class="form-control" placeholder="নাম লিখুন..." oninput="updatePreview()">
            </div>

            <button class="btn-download" onclick="downloadQuote()">
                <i class="fas fa-download"></i> Download Image
            </button>
        </div>

        <div class="preview-wrapper">
            <div id="quoteWrapper">
                
                <div class="quote-content">
                    <span class="quote-icon"><i class="fas fa-quote-left"></i></span>
                    <div class="quote-text" id="previewText">
                        "সাফল্য তখনই আসে যখন প্রস্তুতি এবং সুযোগের মিলন ঘটে।"
                    </div>
                    <div class="divider"></div>
                    <div class="quote-author" id="previewAuthor">
                        — সংগ্রহীত
                    </div>
                </div>

                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning<br>All rights reserved.</footer>

    <script>
        // --- 80+ PREMIUM GRADIENT THEMES ---

            { name: "Midnight City", bg: "linear-gradient(135deg, #232526 0%, #414345 100%)" },
            { name: "Royal Blue", bg: "linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)" },
            { name: "Lush Green", bg: "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)" },
            { name: "Sunset Vibes", bg: "linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%)" },
            { name: "Insta Brand", bg: "linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%)" },
            { name: "Dark Ocean", bg: "linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)" },
            { name: "Electric Violet", bg: "linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%)" },

            { name: "Cool Sky", bg: "linear-gradient(135deg, #2980B9 0%, #6DD5FA 100%)" },
            { name: "Mega Tron", bg: "linear-gradient(135deg, #C6FFDD 0%, #FBD786 50%, #f7797d 100%)" },
            { name: "Dark Teal", bg: "linear-gradient(135deg, #360033 0%, #0b8793 100%)" },
            { name: "Red Mist", bg: "linear-gradient(135deg, #000000 0%, #e74c3c 100%)" },
            { name: "Golden Hour", bg: "linear-gradient(135deg, #fceabb 0%, #f8b500 100%)" },
            { name: "Deep Space", bg: "linear-gradient(135deg, #000000 0%, #434343 100%)" },
            { name: "Aqua Marine", bg: "linear-gradient(135deg, #1A2980 0%, #26D0CE 100%)" },
            { name: "Bloody Mary", bg: "linear-gradient(135deg, #FF512F 0%, #DD2476 100%)" },
            { name: "Soft Violet", bg: "linear-gradient(135deg, #4568DC 0%, #B06AB3 100%)" },
            { name: "Emerald", bg: "linear-gradient(135deg, #348F50 0%, #56B4D3 100%)" },
            { name: "Kyoo Pal", bg: "linear-gradient(135deg, #dd3e54 0%, #6be585 100%)" },
            { name: "Kye Meh", bg: "linear-gradient(135deg, #8360c3 0%, #2ebf91 100%)" },
            { name: "By Design", bg: "linear-gradient(135deg, #009fff 0%, #ec2f4b 100%)" },
            { name: "Ultra Voilet", bg: "linear-gradient(135deg, #654ea3 0%, #eaafc8 100%)" },
            { name: "Burning Orange", bg: "linear-gradient(135deg, #ff416c 0%, #ff4b1f 100%)" },
            { name: "Wiretap", bg: "linear-gradient(135deg, #8A2387 0%, #E94057 50%, #F27121 100%)" },
            { name: "Summer Dog", bg: "linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%)" },
            { name: "Rastafari", bg: "linear-gradient(135deg, #1E9600 0%, #FFF200 50%, #FF0000 100%)" },
            { name: "Sin City", bg: "linear-gradient(135deg, #ED213A 0%, #93291E 100%)" },
            { name: "Citrus Peel", bg: "linear-gradient(135deg, #fdc830 0%, #f37335 100%)" },
            { name: "Blue Raspberry", bg: "linear-gradient(135deg, #00b09b 0%, #96c93d 100%)" },
            { name: "Margo", bg: "linear-gradient(135deg, #ffefba 0%, #ffffff 100%)" }, // Light
            { name: "Magic", bg: "linear-gradient(135deg, #59C173 0%, #a17fe0 50%, #5D26C1 100%)" },
            { name: "Evening Sunshine", bg: "linear-gradient(135deg, #b92b27 0%, #1565C0 100%)" },
            { name: "Jodhpur", bg: "linear-gradient(135deg, #9CECFB 0%, #65C7F7 50%, #0052D4 100%)" },
            { name: "Yoda", bg: "linear-gradient(135deg, #FF0099 0%, #493240 100%)" },
            { name: "Memariani", bg: "linear-gradient(135deg, #aa4b6b 0%, #6b6b83 50%, #3b8d99 100%)" },
            { name: "Amin", bg: "linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%)" },
            { name: "Harvey", bg: "linear-gradient(135deg, #1f4037 0%, #99f2c8 100%)" },
            { name: "Neuromancer", bg: "linear-gradient(135deg, #f953c6 0%, #b91d73 100%)" },
            { name: "Azimuth", bg: "linear-gradient(135deg, #2980b9 0%, #2c3e50 100%)" },
            { name: "Metro", bg: "linear-gradient(135deg, #c2e59c 0%, #64b3f4 100%)" },
            { name: "Vanusa", bg: "linear-gradient(135deg, #DA4453 0%, #89216B 100%)" },
            { name: "Dusk", bg: "linear-gradient(135deg, #2C3E50 0%, #FD746C 100%)" },
            { name: "Solid Purple", bg: "#7e22ce" },
            { name: "Solid Black", bg: "#111827" },
            { name: "Solid Blue", bg: "#2563eb" },
            { name: "Solid Red", bg: "#dc2626" },
            { name: "Solid Teal", bg: "#0d9488" },
            { name: "Navy Blue", bg: "#1e3a8a" },
            { name: "Deep Forest", bg: "#064e3b" },
            { name: "Maroon", bg: "#7f1d1d" },
            { name: "Charcoal", bg: "#374151" },
            { name: "Chocolate", bg: "#451a03" },
            { name: "Slate", bg: "#475569" },
            { name: "Indigo", bg: "#4338ca" },
            { name: "Violet", bg: "#7c3aed" },
            { name: "Fuchsia", bg: "#a21caf" },
            { name: "Rose", bg: "#be123c" },
            { name: "Orange", bg: "#c2410c" },
            { name: "Amber", bg: "#b45309" },
            { name: "Yellow", bg: "#a16207" },
            { name: "Lime", bg: "#4d7c0f" },
            { name: "Green", bg: "#15803d" },
            { name: "Emerald", bg: "#047857" },
            { name: "Teal", bg: "#0f766e" },
            { name: "Cyan", bg: "#0e7490" },
            { name: "Sky", bg: "#0369a1" },
            { name: "Blue", bg: "#1d4ed8" },
            { name: "Rose Gold", bg: "linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 100%)" },
            { name: "Perfect White", bg: "linear-gradient(135deg, #E3FDF5 0%, #FFE6FA 100%)" }, // Light Text needed? Code handles white mostly.
            { name: "Almost", bg: "linear-gradient(135deg, #ddd6f3 0%, #faaca8 100%)" },
            { name: "Noon", bg: "linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)" },
            { name: "Kimoby", bg: "linear-gradient(135deg, #396afc 0%, #2948ff 100%)" },
            { name: "Slight", bg: "linear-gradient(135deg, #eb3349 0%, #f45c43 100%)" },
            { name: "Bighead", bg: "linear-gradient(135deg, #c94b4b 0%, #4b134f 100%)" },
            { name: "Taran", bg: "linear-gradient(135deg, #23074d 0%, #cc5333 100%)" },
            { name: "Relaxing", bg: "linear-gradient(135deg, #fffbd5 0%, #b20a2c 100%)" },
            { name: "Broad", bg: "linear-gradient(135deg, #800080 0%, #ffc0cb 100%)" },
            { name: "Baby Blue", bg: "linear-gradient(135deg, #000000 0%, #00f260 100%)" }
        ];

        // Populate Dropdown
        const selector = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            selector.appendChild(opt);
        });

        // Apply Theme
        function applyTheme() {
            const idx = selector.value;
            const theme = themes[idx];
            const card = document.getElementById('quoteWrapper');
            card.style.background = theme.bg;
        }

        // Live Preview Logic
        function updatePreview() {
            const quote = document.getElementById('quoteInput').value;
            const author = document.getElementById('authorInput').value.trim();

            document.getElementById('previewText').innerText = quote ? `"${quote}"` : '"এখানে উক্তি লিখুন..."';
            
            const authorEl = document.getElementById('previewAuthor');
            const dividerEl = document.querySelector('.divider');

            if (author) {
                authorEl.innerText = `— ${author}`;
                authorEl.style.display = 'block';
                dividerEl.style.display = 'block';
            } else {
                authorEl.style.display = 'none';
                dividerEl.style.display = 'none';
            }
        }

        // Download
        function downloadQuote() {
            const element = document.getElementById('quoteWrapper');
            const btn = document.querySelector('.btn-download');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            html2canvas(element, {
                scale: 3, 
                useCORS: true,
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Quote_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fas fa-download"></i> Download Image';
            });
        }

        // Init
        updatePreview();
        applyTheme();
    </script>
</body>
</html>
