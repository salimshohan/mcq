<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quote Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Poppins:wght@300;400;600&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* --- THEME VARIABLES (MATCHING NOTES-TO-PDF) --- */
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX (LEFT) --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light); 
            box-shadow: var(--shadow-lg);
            height: fit-content;
        }

        .section-title { 
            font-size: 18px; font-weight: 700; color: var(--primary); 
            margin-bottom: 20px; border-bottom: 1px solid var(--border-light); 
            padding-bottom: 10px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        
        .form-control {
            width: 100%; background: #ffffff; border: 1px solid #d1d5db; 
            color: #111827; padding: 12px; border-radius: 8px; font-size: 14px; 
            font-family: 'Anek Bangla', sans-serif; transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        textarea.form-control { resize: vertical; min-height: 100px; }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        
        .btn {
            flex: 1; padding: 12px; border-radius: 8px; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s; 
        }

        .btn-theme { 
            background: #e0e7ff; color: var(--primary); 
            border: 1px dashed var(--primary);
        }
        .btn-theme:hover { background: #c7d2fe; }

        .btn-download { 
            background: #111827; color: white; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-download:hover { transform: translateY(-2px); opacity: 0.9; }

        /* --- PREVIEW WRAPPER (RIGHT) --- */
        .preview-wrapper {
            flex: 1.5; min-width: 350px; 
            display: flex; justify-content: center; align-items: flex-start;
            background: #52525b; /* Dark bg to make quote pop */
            padding: 40px; border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* Quote Card */
        #quoteWrapper {
            width: 100%; max-width: 500px;
            min-height: 400px; /* Standard Square/Portraitish */
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: background 0.5s ease;
        }

        .quote-content { position: relative; z-index: 2; text-align: center; width: 100%; }

        .quote-icon { font-size: 30px; color: rgba(255,255,255,0.8); margin-bottom: 20px; display: block; }

        .quote-text {
            font-family: 'Tiro Bangla', serif;
            font-size: 26px; line-height: 1.6; font-weight: 500;
            color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 25px; white-space: pre-wrap;
        }

        .divider {
            width: 50px; height: 3px; background: rgba(255,255,255,0.7);
            margin: 0 auto 20px auto; border-radius: 2px;
            display: none;
        }

        .quote-author {
            font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.95);
            text-transform: uppercase; letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
            display: none;
        }

        .watermark {
            position: absolute; bottom: 15px;
            font-size: 11px; opacity: 0.6; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            color: white; z-index: 2;
        }

        /* --- FOOTER --- */
        footer {
            width: 100%; padding: 20px; text-align: center;
            /* Transparent/Clean footer to match light theme */
            background: transparent; border-top: 1px solid #e5e7eb;
            margin-top: auto; font-size: 13px; color: #6b7280;
        }

        /* Mobile Scale */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-box, .preview-wrapper { width: 100%; }
            .preview-wrapper { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>
    
    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">
                Customize Quote
            </div>
            
            <div class="input-group">
                <label>Quote / উক্তি</label>
                <textarea id="quoteInput" class="form-control" placeholder="এখানে উক্তি লিখুন..." oninput="updatePreview()"></textarea>
            </div>
            
            <div class="input-group">
                <label>Author / বক্তা (Optional)</label>
                <input id="authorInput" class="form-control" placeholder="নাম লিখুন..." oninput="updatePreview()">
            </div>

            <div class="btn-group">
                <button class="btn btn-theme" onclick="changeTheme()">
                    <i class="fas fa-palette"></i> Change Theme
                </button>
                <button class="btn btn-download" onclick="downloadQuote()">
                    <i class="fas fa-download"></i> Download Image
                </button>
            </div>
        </div>

        <div class="preview-wrapper">
            <div id="quoteWrapper">
                
                <div class="quote-content">
                    <span class="quote-icon"><i class="fas fa-quote-left"></i></span>
                    <div class="quote-text" id="previewText">
                        "সাফল্য তখনই আসে যখন প্রস্তুতি এবং সুযোগের মিলন ঘটে।"
                    </div>
                    <div class="divider"></div>
                    <div class="quote-author" id="previewAuthor">
                        — সংগ্রহীত
                    </div>
                </div>

                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 Interactive Learning.<br>All Rights Reserved.
    </footer>

    <script>
        // Live Update
        function updatePreview() {
            const quote = document.getElementById('quoteInput').value;
            const author = document.getElementById('authorInput').value.trim();

            document.getElementById('previewText').innerText = quote ? `"${quote}"` : '"এখানে উক্তি লিখুন..."';
            
            const authorEl = document.getElementById('previewAuthor');
            const dividerEl = document.querySelector('.divider');

            if (author) {
                authorEl.innerText = `— ${author}`;
                authorEl.style.display = 'block';
                dividerEl.style.display = 'block';
            } else {
                authorEl.style.display = 'none';
                dividerEl.style.display = 'none';
            }
        }

        // Premium Themes
        const themes = [
            "linear-gradient(135deg, #667eea 0%, #764ba2 100%)", // Purple
            "linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)", // Blue
            "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)", // Green
            "linear-gradient(135deg, #FC466B 0%, #3F5EFB 100%)", // Pink/Blue
            "linear-gradient(135deg, #FDBB2D 0%, #22C1C3 100%)", // Gold/Teal
            "linear-gradient(135deg, #360033 0%, #0b8793 100%)", // Dark Teal
            "linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%)", // Insta
            "linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)", // Dark Ocean
            "linear-gradient(135deg, #00b09b 0%, #96c93d 100%)", // Fresh
            "linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%)", // Electric
            "linear-gradient(135deg, #b92b27 0%, #1565C0 100%)", // Red/Blue
            "linear-gradient(135deg, #1A2980 0%, #26D0CE 100%)", // Aqua
            "linear-gradient(135deg, #FF512F 0%, #DD2476 100%)", // Bloody
            "linear-gradient(135deg, #4568DC 0%, #B06AB3 100%)", // Soft
            "linear-gradient(135deg, #232526 0%, #414345 100%)"  // Black/Gray
        ];

        function changeTheme() {
            const card = document.getElementById('quoteWrapper');
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            card.style.background = randomTheme;
        }

        // Download Image
        function downloadQuote() {
            const element = document.getElementById('quoteWrapper');
            const btn = document.querySelector('.btn-download');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            html2canvas(element, {
                scale: 3, 
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Quote_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fas fa-download"></i> Download Image';
            });
        }

        // Init
        updatePreview();
        changeTheme();
    </script>
</body>
</html>
