<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* --- HOME PAGE VARIABLES (LIGHT THEME) --- */
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-soft: rgba(79, 70, 229, 0.1);
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --accent: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            /* Dotted Pattern from Home Page */
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- MAIN LAYOUT --- */
        .container {
            margin-top: 80px;
            width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 20px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX (White Panel like Home) --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg);
            padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-lg);
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-light);
        }
        .section-title { font-size: 20px; font-weight: 700; color: #1f2937; letter-spacing: -0.5px; }

        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: #374151; margin-bottom: 8px; letter-spacing: 0.3px;
        }

        /* --- MODERN INPUTS (Same as Home) --- */
        .form-control {
            width: 100%; background: #ffffff;
            border: 1px solid #d1d5db; color: #111827;
            padding: 12px 16px; border-radius: 8px; font-size: 15px;
            transition: all 0.2s ease-in-out;
            box-shadow: var(--shadow-sm); font-family: inherit;
        }
        .form-control:hover { border-color: #9ca3af; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
        .form-control::placeholder { color: #9ca3af; font-size: 14px; }
        textarea.form-control { resize: vertical; min-height: 120px; }
        select.form-control { cursor: pointer; }

        /* --- DOWNLOAD BUTTON (Dark like Home) --- */
        .btn-download {
            width: 100%; padding: 14px; margin-top: 10px;
            border-radius: 10px; border: none;
            background: #111827; color: white;
            font-weight: 600; cursor: pointer; font-size: 15px;
            box-shadow: var(--shadow-md); transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-download:hover { background: #000000; transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        /* --- PREVIEW SECTION --- */
        .preview-box {
            flex: 1.2; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 10px;
        }

        /* --- NOTICE CARD (Original Design) --- */
        #noticeCard {
            width: 100%; max-width: 450px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 6px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            overflow: hidden; position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: background 0.3s ease;
        }

        .card-top {
            background: rgba(0,0,0,0.3); padding: 12px;
            text-align: center; color: rgba(255,255,255,0.9);
            font-size: 11px; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .card-body { padding: 25px 30px; position: relative; z-index: 2; min-height: 300px; display: flex; flex-direction: column; }

        .notice-badge {
            display: inline-block; padding: 6px 14px; border-radius: 50px;
            background: rgba(255,255,255,0.15); color: var(--accent);
            font-size: 13px; font-weight: 700; margin-bottom: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .date-info { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 20px; font-weight: 500; }

        .notice-text {
            font-size: 22px; line-height: 1.5; color: #fff; font-weight: 500;
            margin-bottom: auto; white-space: pre-wrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .source-box {
            margin-top: 30px; padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none; /* Logic handles visibility */
        }
        .source-label { font-size: 10px; text-transform: uppercase; opacity: 0.6; letter-spacing: 1px; }
        .source-name { font-size: 14px; font-weight: 700; color: white; display: flex; align-items: center; gap: 5px; }
        .verified { color: #38bdf8; font-size: 14px; }

        .watermark {
            position: absolute; bottom: 15px; right: 20px;
            font-size: 11px; color: rgba(255,255,255,0.25);
            font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            pointer-events: none; z-index: 1;
        }

        /* Footer */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: #1f2937; border-top: 1px solid #374151;
            margin-top: auto; font-size: 14px; color: white;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 20px; }
            .editor-box, .preview-box { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script src="../js/header.js"></script>

    <div class="container">
        
        <div class="editor-box">
            <div class="section-header">
                <div class="section-title">Notice Creator</div>
            </div>
            
            <div class="input-group">
                <label>Category</label>
                <select id="catInput" class="form-control" onchange="updatePreview()">
                    <option>Breaking News</option>
                    <option>Urgent Notice</option>
                    <option>Exam Routine</option>
                    <option>Admit Card</option>
                    <option>Result Published</option>
                    <option>Holiday Notice</option>
                    <option>Admission Update</option>
                    <option>Scholarship Info</option>
                    <option>Class Suspension</option>
                    <option>Important Alert</option>
                </select>
            </div>

            <div class="input-group">
                <label>Theme (100+ Styles)</label>
                <select id="themeSelector" class="form-control" onchange="updatePreview()">
                    </select>
            </div>

            <div class="input-group">
                <label>Announcement Text</label>
                <textarea id="bodyInput" class="form-control" placeholder="Write notice details here..." oninput="updatePreview()"></textarea>
            </div>

            <div class="input-group">
                <label>Source Name (Optional)</label>
                <input id="sourceInput" class="form-control" placeholder="e.g. Daily Campus" oninput="updatePreview()">
            </div>

            <button class="btn-download" onclick="downloadImage()">
                <i class="fas fa-download"></i> Download PNG
            </button>
        </div>

        <div class="preview-box">
            <div id="noticeCard">
                <div class="card-top"><i class="fas fa-bullhorn"></i> Announcement</div>
                
                <div class="card-body">
                    <div>
                        <span id="pCat" class="notice-badge">Breaking News</span>
                        <div id="pDate" class="date-info">24 Jan, 2026</div>
                    </div>
                    
                    <div id="pBody" class="notice-text">
                        Write your announcement content here.
                    </div>

                    <div class="source-box" id="sourceBox">
                        <div class="source-label">Source</div>
                        <div class="source-name">
                            <span id="pSource">Source Name</span>
                            <i class="fas fa-check-circle verified"></i>
                        </div>
                    </div>
                </div>

                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning<br>All rights reserved.</footer>

    <script>
        // --- 100 THEMES ---
        const themes = [
            { name: "Royal Blue", bg: "linear-gradient(135deg, #1e1b4b, #312e81)", accent: "#fbbf24" },
            { name: "Deep Ocean", bg: "linear-gradient(135deg, #0f172a, #0e7490)", accent: "#67e8f9" },
            { name: "Red Alert", bg: "linear-gradient(135deg, #450a0a, #7f1d1d)", accent: "#f87171" },
            { name: "Emerald City", bg: "linear-gradient(135deg, #064e3b, #10b981)", accent: "#6ee7b7" },
            { name: "Midnight Purple", bg: "linear-gradient(135deg, #240b36, #c31432)", accent: "#ff0099" },
            { name: "Charcoal", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Cyberpunk", bg: "linear-gradient(135deg, #2d0036, #0f0c29)", accent: "#00fff2" },
            { name: "Sunset Vibes", bg: "linear-gradient(135deg, #c2410c, #ea580c)", accent: "#fcd34d" },
            { name: "Spotify Green", bg: "linear-gradient(135deg, #191414, #1DB954)", accent: "#1ed760" },
            { name: "Ice Cold", bg: "linear-gradient(135deg, #2c3e50, #4ca1af)", accent: "#ffffff" },
            { name: "Seafoam", bg: "linear-gradient(135deg, #00d2ff, #3a7bd5)", accent: "#ffffff" },
            { name: "Rose Gold", bg: "linear-gradient(135deg, #B76E79, #E6BE8A)", accent: "#fff" },
            { name: "Morning Sky", bg: "linear-gradient(135deg, #FF5F6D, #FFC371)", accent: "#fff" },
            { name: "Minty Fresh", bg: "linear-gradient(135deg, #4ade80, #86efac)", accent: "#064e3b" },
            { name: "Pure Black", bg: "#000000", accent: "#ffffff" },
            { name: "Amethyst", bg: "linear-gradient(135deg, #9d50bb, #6e48aa)", accent: "#fff" },
            { name: "Cosmic", bg: "linear-gradient(135deg, #ff00cc, #333399)", accent: "#fff" },
            { name: "Forest", bg: "linear-gradient(135deg, #134E5E, #71B280)", accent: "#fff" },
            { name: "Fire", bg: "linear-gradient(135deg, #f12711, #f5af19)", accent: "#fff" },
            { name: "YouTube Red", bg: "linear-gradient(135deg, #FF0000, #282828)", accent: "#fff" },
            { name: "Facebook Blue", bg: "linear-gradient(135deg, #1877f2, #0d47a1)", accent: "#fff" },
            { name: "Twitter", bg: "linear-gradient(135deg, #15202b, #192734)", accent: "#1da1f2" },
            { name: "Instagram", bg: "linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)", accent: "#fff" },
            { name: "Gold", bg: "linear-gradient(135deg, #bf953f, #fcf6ba, #b38728)", accent: "#000" },
            { name: "Silver", bg: "linear-gradient(135deg, #C9D6FF, #E2E2E2)", accent: "#333" },
            { name: "Dark Moss", bg: "linear-gradient(135deg, #134E5E, #71B280)", accent: "#fff" },
            { name: "Pumpkin", bg: "linear-gradient(135deg, #d35400, #e67e22)", accent: "#fff" },
            { name: "Cherry", bg: "linear-gradient(135deg, #eb3349, #f45c43)", accent: "#fff" },
            { name: "Vampire", bg: "linear-gradient(135deg, #16222A, #3A6073)", accent: "#fff" },
            { name: "Dark Knight", bg: "linear-gradient(135deg, #000000, #434343)", accent: "#f1c40f" },
            { name: "Sleek", bg: "linear-gradient(135deg, #141E30, #243B55)", accent: "#fff" },
            { name: "Onyx", bg: "linear-gradient(135deg, #3E5151, #DECBA4)", accent: "#fff" },
            { name: "Lavender", bg: "linear-gradient(135deg, #667db6, #0082c8)", accent: "#fff" },
            { name: "Plum", bg: "linear-gradient(135deg, #dd2476, #ff512f)", accent: "#fff" },
            { name: "Jungle", bg: "linear-gradient(135deg, #1a2980, #26d0ce)", accent: "#fff" },
            { name: "Olive", bg: "linear-gradient(135deg, #3f4e4f, #2c3639)", accent: "#fff" },
            { name: "Nature", bg: "linear-gradient(135deg, #2ebf91, #8360c3)", accent: "#fff" },
            { name: "Netflix", bg: "linear-gradient(135deg, #000000, #E50914)", accent: "#fff" },
            { name: "Twitch", bg: "linear-gradient(135deg, #6441a5, #2a0845)", accent: "#fff" },
            { name: "Neon Violet", bg: "linear-gradient(135deg, #654ea3, #eaafc8)", accent: "#fff" },
            { name: "Majestic", bg: "linear-gradient(135deg, #5614B0, #DBD65C)", accent: "#fff" },
            { name: "Haiku", bg: "linear-gradient(135deg, #fd746c, #ff9068)", accent: "#fff" },
            { name: "Superman", bg: "linear-gradient(135deg, #0099F7, #F11712)", accent: "#fff" },
            { name: "Timber", bg: "linear-gradient(135deg, #fc00ff, #00dbde)", accent: "#fff" },
            { name: "Passion", bg: "linear-gradient(135deg, #e53935, #e35d5b)", accent: "#fff" },
            { name: "Radar", bg: "linear-gradient(135deg, #A770EF, #CF8BF3)", accent: "#fff" },
            { name: "Teal Love", bg: "linear-gradient(135deg, #AAFFA9, #11FFBD)", accent: "#000" },
            { name: "Purple Bliss", bg: "linear-gradient(135deg, #360033, #0b8793)", accent: "#fff" },
            { name: "Evening", bg: "linear-gradient(135deg, #b92b27, #1565C0)", accent: "#fff" },
            { name: "Grade Grey", bg: "linear-gradient(135deg, #bdc3c7, #2c3e50)", accent: "#fff" },
            { name: "Piggy Pink", bg: "linear-gradient(135deg, #ee9ca7, #ffdde1)", accent: "#333" },
            { name: "Cool Blues", bg: "linear-gradient(135deg, #2193b0, #6dd5ed)", accent: "#fff" },
            { name: "Mega Tron", bg: "linear-gradient(135deg, #C6FFDD, #FBD786)", accent: "#333" },
            { name: "Moonlit", bg: "linear-gradient(135deg, #0f2027, #203a43)", accent: "#fff" },
            { name: "Argon", bg: "linear-gradient(135deg, #03001e, #7303c0)", accent: "#fff" },
            { name: "Black Rosé", bg: "linear-gradient(135deg, #f4c4f3, #fc67fa)", accent: "#333" },
            { name: "Pinot Noir", bg: "linear-gradient(135deg, #4b6cb7, #182848)", accent: "#fff" },
            { name: "Day Tripper", bg: "linear-gradient(135deg, #f857a6, #ff5858)", accent: "#fff" },
            { name: "Namn", bg: "linear-gradient(135deg, #a73737, #7a2828)", accent: "#fff" },
            { name: "Blurry Beach", bg: "linear-gradient(135deg, #d53369, #cbad6d)", accent: "#fff" },
            { name: "Vasily", bg: "linear-gradient(135deg, #e9d362, #333333)", accent: "#fff" },
            { name: "Lost Memory", bg: "linear-gradient(135deg, #DE6262, #FFB88C)", accent: "#fff" },
            { name: "Petrichor", bg: "linear-gradient(135deg, #666600, #999966)", accent: "#fff" },
            { name: "Miaka", bg: "linear-gradient(135deg, #FC354C, #0ABFBC)", accent: "#fff" },
            { name: "Reef", bg: "linear-gradient(135deg, #00d2ff, #3a7bd5)", accent: "#fff" },
            { name: "Mantle", bg: "linear-gradient(135deg, #24c6dc, #514a9d)", accent: "#fff" },
            { name: "Dracula", bg: "linear-gradient(135deg, #DC2424, #4A569D)", accent: "#fff" },
            { name: "Mouse", bg: "linear-gradient(135deg, #200122, #6f0000)", accent: "#fff" },
            { name: "Stellar", bg: "linear-gradient(135deg, #7474BF, #348AC7)", accent: "#fff" },
            { name: "Clouds", bg: "linear-gradient(135deg, #ECE9E6, #FFFFFF)", accent: "#333" },
            { name: "Chocolate", bg: "linear-gradient(135deg, #56392d, #9e6f59)", accent: "#fff" },
            { name: "Candy", bg: "linear-gradient(135deg, #D4145A, #FBB03B)", accent: "#fff" },
            { name: "Moss", bg: "linear-gradient(135deg, #134E5E, #71B280)", accent: "#fff" },
            { name: "Mirage", bg: "linear-gradient(135deg, #16222A, #3A6073)", accent: "#fff" },
            { name: "Steel", bg: "linear-gradient(135deg, #1F1C2C, #928DAB)", accent: "#fff" }
        ];

        const select = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            select.appendChild(opt);
        });

        // --- PREVIEW LOGIC ---
        function updatePreview() {
            const cat = document.getElementById('catInput').value;
            const body = document.getElementById('bodyInput').value || "Your notice preview will appear here.";
            const source = document.getElementById('sourceInput').value.trim();
            
            document.getElementById('pCat').innerText = cat;
            document.getElementById('pBody').innerText = body;

            // Source Visibility Logic
            const sourceBox = document.getElementById('sourceBox');
            if (source === "") {
                sourceBox.style.display = "none";
            } else {
                sourceBox.style.display = "block";
                document.getElementById('pSource').innerText = source;
            }

            // Date
            const now = new Date();
            document.getElementById('pDate').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

            // Apply Theme
            const themeIdx = document.getElementById('themeSelector').value;
            const theme = themes[themeIdx];
            const card = document.getElementById('noticeCard');
            const badge = document.querySelector('.notice-badge');
            
            card.style.background = theme.bg;
            badge.style.color = theme.accent;
            badge.style.borderColor = theme.accent;

            // Smart Text Color for Light Themes
            const isLight = ["Silver", "Gold", "Ice Cold", "Rose Gold", "Minty Fresh", "Clouds", "Piggy Pink", "Mega Tron"].includes(theme.name);
            const textCol = isLight ? "#222" : "#fff";
            
            document.getElementById('pBody').style.color = textCol;
            document.querySelector('.source-name').style.color = textCol;
            document.querySelector('.date-info').style.color = isLight ? "rgba(0,0,0,0.6)" : "rgba(255,255,255,0.6)";
            
            document.querySelector('.watermark').style.color = isLight ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.25)";
        }

        // --- DOWNLOAD ---
        function downloadImage() {
            const element = document.getElementById('noticeCard');
            const btn = document.querySelector('.btn-download');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
            
            html2canvas(element, { scale: 3, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Notice_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = `<i class="fas fa-download"></i> Download PNG`;
            });
        }

        updatePreview();
    </script>
</body>
</html>
