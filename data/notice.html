<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* --- HOME PAGE VARIABLES (LIGHT THEME) --- */
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-soft: rgba(79, 70, 229, 0.1);
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --accent: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- MAIN LAYOUT --- */
        .container {
            margin-top: 80px;
            width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 20px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg);
            padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-lg);
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-light);
        }
        .section-title { font-size: 20px; font-weight: 700; color: #1f2937; letter-spacing: -0.5px; }

        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: #374151; margin-bottom: 8px; letter-spacing: 0.3px;
        }

        .form-control {
            width: 100%; background: #ffffff;
            border: 1px solid #d1d5db; color: #111827;
            padding: 12px 16px; border-radius: 8px; font-size: 15px;
            transition: all 0.2s ease-in-out;
            box-shadow: var(--shadow-sm); font-family: inherit;
        }
        .form-control:hover { border-color: #9ca3af; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
        textarea.form-control { resize: vertical; min-height: 120px; }
        select.form-control { cursor: pointer; }

        .btn-download {
            width: 100%; padding: 14px; margin-top: 10px;
            border-radius: 10px; border: none;
            background: #111827; color: white;
            font-weight: 600; cursor: pointer; font-size: 15px;
            box-shadow: var(--shadow-md); transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-download:hover { background: #000000; transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        /* --- PREVIEW SECTION --- */
        .preview-box {
            flex: 1.2; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 10px;
        }

      /* --- PREMIUM NOTICE CARD DESIGN --- */
#noticeCard {
    width: 100%; max-width: 450px;
    /* Deep Matte Dark Background */
    background: #0f172a; 
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-family: 'Anek Bangla', sans-serif;
    transition: all 0.3s ease;
}

/* Decorative Gradient Blur at Top */
#noticeCard::before {
    content: ''; position: absolute; top: -50px; left: -50px;
    width: 200px; height: 200px;
    background: var(--primary);
    filter: blur(80px); opacity: 0.4; z-index: 0;
    border-radius: 50%;
}
#noticeCard::after {
    content: ''; position: absolute; bottom: -50px; right: -50px;
    width: 200px; height: 200px;
    background: var(--accent);
    filter: blur(80px); opacity: 0.2; z-index: 0;
    border-radius: 50%;
}

/* Card Content Container */
.card-inner {
    position: relative; z-index: 2;
    padding: 30px;
    display: flex; flex-direction: column;
    min-height: 400px;
    background: rgba(15, 23, 42, 0.3); /* Tint */
    backdrop-filter: blur(10px); /* Glass Effect */
}

/* --- HEADER SECTION --- */
.card-header-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 15px;
}

.header-brand {
    display: flex; align-items: center; gap: 8px;
}
.header-icon-box {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 14px;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
}
.header-title {
    font-size: 12px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(255,255,255,0.9);
}

.header-dots {
    display: flex; gap: 4px;
}
.header-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
}

/* --- BODY SECTION --- */
.meta-tags {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
}

.category-pill {
    padding: 6px 16px; border-radius: 50px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--accent); font-size: 13px; font-weight: 600;
    letter-spacing: 0.5px;
}

.date-pill {
    padding: 6px 0;
    color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 500;
}

.main-notice-text {
    font-size: 24px; line-height: 1.5; color: #ffffff;
    font-weight: 500; margin-bottom: auto;
    white-space: pre-wrap;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

/* --- FOOTER SECTION --- */
.card-footer-row {
    margin-top: 40px;
    display: flex; justify-content: space-between; align-items: flex-end;
}

.source-profile {
    display: none; /* JS will show this */
    flex-direction: column; gap: 4px;
}
.source-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: rgba(255,255,255,0.4); font-weight: 600;
}
.source-info {
    display: flex; align-items: center; gap: 6px;
    font-size: 15px; font-weight: 700; color: white;
}
.verified-tick { color: #38bdf8; font-size: 14px; }

.footer-brand {
    text-align: right;
}
.brand-watermark {
    font-size: 14px; font-weight: 800; color: rgba(255,255,255,0.8);
    letter-spacing: -0.5px;
}
.brand-sub {
    font-size: 9px; text-transform: uppercase; letter-spacing: 2px;
    color: rgba(255,255,255,0.3); display: block; margin-top: 2px;
}
        .watermark {
            font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5;
        }

        /* Footer */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: #1f2937; border-top: 1px solid #374151;
            margin-top: auto; font-size: 14px; color: white;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 20px; }
            .editor-box, .preview-box { min-width: 100%; }
        }
    </style>
</head>
<body>

            </div>
            
            <div class="input-group">
                <label>Category</label>
                <select id="catInput" class="form-control" onchange="updatePreview()">
                    <option>Breaking News</option>
                    <option>Urgent Notice</option>
                    <option>Exam Routine</option>
                    <option>Admit Card</option>
                    <option>Result Published</option>
                    <option>Holiday Notice</option>
                    <option>Admission Update</option>
                    <option>Scholarship Info</option>
                    <option>Class Suspension</option>
                    <option>Important Alert</option>
                </select>
            </div>

            <div class="input-group">
                <label>Theme (100+ Styles)</label>
                <select id="themeSelector" class="form-control" onchange="updatePreview()">
                    </select>
            </div>

            <div class="input-group">
                <label>Announcement Text</label>
                <textarea id="bodyInput" class="form-control" placeholder="Write notice details here..." oninput="updatePreview()"></textarea>
            </div>

            <div class="input-group">
                <label>Source Name (Optional)</label>
                <input id="sourceInput" class="form-control" placeholder="e.g. Daily Campus" oninput="updatePreview()">
            </div>

            <button class="btn-download" onclick="downloadImage()">
                <i class="fas fa-download"></i> Download PNG
            </button>
        </div>
<div class="preview-wrapper">
    <div id="noticeCard">
        <div class="card-inner">
            <div class="card-header-row">
                <div class="header-brand">
                    <div class="header-icon-box" id="headerIconBg">
                        <i class="fas fa-bullhorn"></i>
                    </div>
                    <span class="header-title">Announcement</span>
                </div>
                <div class="header-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="meta-tags">
                <span id="pCat" class="category-pill">Update</span>
                <span id="pDate" class="date-pill">24 Jan, 2026</span>
            </div>

            <div id="pBody" class="main-notice-text">
                Your announcement text will appear here with a premium look.
            </div>

            <div class="card-footer-row">
                <div class="source-profile" id="sourceBox">
                    <span class="source-label">Source</span>
                    <div class="source-info">
                        <span id="pSource">Official</span>
                        <i class="fas fa-check-circle verified-tick"></i>
                    </div>
                </div>
                <div class="footer-brand">
                    <div class="brand-watermark">Interactive Learning</div>
                    <span class="brand-sub">Official Notice</span>
                </div>
            </div>
        </div>
    </div>
</div>

            select.appendChild(opt);

        function updatePreview() {
    // ... (Get values like before) ...
    const cat = document.getElementById('catInput').value;
    const body = document.getElementById('bodyInput').value || "Write notice details here...";
    const source = document.getElementById('sourceInput').value.trim();

    // Set Text
    document.getElementById('pCat').innerText = cat;
    document.getElementById('pBody').innerText = body;
    
    // Source Hide/Show Logic
    const sourceBox = document.getElementById('sourceBox');
    if(source === "") {
        sourceBox.style.display = 'none';
    } else {
        sourceBox.style.display = 'flex';
        document.getElementById('pSource').innerText = source;
    }

    // Date
    const now = new Date();
    document.getElementById('pDate').innerText = "• " + now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    // Theme Update Logic inside Preview
    const themeIdx = document.getElementById('themeSelector').value;
    const theme = themes[themeIdx];
    
    const card = document.getElementById('noticeCard');
    const iconBg = document.getElementById('headerIconBg');
    const catPill = document.getElementById('pCat');

    // Apply Background
    card.style.background = theme.bg;
    
    // Apply Accent Colors
    document.documentElement.style.setProperty('--primary', theme.accent); // Updates glow
    iconBg.style.background = theme.accent;
    iconBg.style.boxShadow = `0 4px 15px ${theme.accent}66`; // Add glow to icon
    catPill.style.color = theme.accent;
    catPill.style.borderColor = theme.accent;

    // Light Theme Text Handling
    const isLight = ["Silver", "Gold", "Ice Cold", "Rose Gold", "Minty Fresh", "Clouds", "Piggy Pink", "Mega Tron"].includes(theme.name);
    const textCol = isLight ? "#1e293b" : "#ffffff";
    const subCol = isLight ? "#64748b" : "rgba(255,255,255,0.6)";

    document.getElementById('pBody').style.color = textCol;
    document.querySelector('.brand-watermark').style.color = isLight ? "#334155" : "rgba(255,255,255,0.9)";
    document.querySelector('.header-title').style.color = subCol;
    document.getElementById('pDate').style.color = subCol;
    
    // Source text color
    document.querySelector('.source-info').style.color = textCol;
    document.querySelector('.source-label').style.color = subCol;
}

        // --- DOWNLOAD ---
        function downloadImage() {
            const element = document.getElementById('noticeCard');
            const btn = document.querySelector('.btn-download');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
            
            html2canvas(element, { scale: 3, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Notice_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = `<i class="fas fa-download"></i> Download PNG`;
            });
        }

        updatePreview();
    </script>
