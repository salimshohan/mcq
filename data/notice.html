<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        header {
            width: 100%;
            background: linear-gradient(90deg, #1e1b4b, #312e81);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 700; color: white;
        }
        
        .logo-icon { 
            width: 35px; height: 35px; background: var(--primary); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white;
        }

        .hamburger {
            cursor: pointer; width: 30px; height: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 2001;
        }
        .hamburger span { 
            display: block; height: 3px; width: 100%; background: white; 
            border-radius: 2px; transition: 0.3s; 
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 250px; height: 100vh;
            background: #1e1b4b; border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s ease-in-out; z-index: 1999;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a {
            color: #cbd5e1; text-decoration: none; padding: 15px 30px;
            font-size: 16px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 90px; width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR --- */
        .editor-section {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 5px; }
        .form-control {
            width: 100%; background: var(--input-bg); border: 1px solid #334155; 
            color: #f1f5f9; padding: 12px; font-size: 14px; border-radius: 8px;
        }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 100px; }

        /* --- BUTTONS --- */
        .btn-download {
            width: 100%; padding: 15px; margin-top: 15px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #6366f1, #3b82f6); color: white;
            font-weight: 700; cursor: pointer; box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
            text-transform: uppercase; letter-spacing: 1px; font-size: 13px;
        }

        /* --- PREVIEW --- */
        .preview-wrapper {
            flex: 1.5; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding-top: 10px;
        }

        /* --- NOTICE CARD (New Design) --- */
        #noticeCard {
            width: 100%; max-width: 450px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            overflow: hidden; position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Header Strip */
        .card-top {
            background: var(--primary); padding: 8px;
            text-align: center; color: white; font-size: 11px; font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* Content Body */
        .card-body { padding: 30px 25px; position: relative; z-index: 2; }

        .notice-badge {
            display: inline-block; padding: 5px 12px; border-radius: 50px;
            background: rgba(255,255,255,0.1); color: var(--accent);
            font-size: 12px; font-weight: 700; margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .notice-text {
            font-size: 20px; line-height: 1.6; color: #fff; font-weight: 500;
            margin-bottom: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .meta-info {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px; font-size: 12px; color: #94a3b8;
        }

        /* Source Tag */
        .source-tag { 
            display: flex; align-items: center; gap: 5px; 
            font-weight: 600; color: #cbd5e1; 
        }
        .verified-icon { color: #38bdf8; font-size: 14px; }

        /* Watermark */
        .watermark {
            position: absolute; bottom: 10px; right: 20px;
            font-size: 10px; color: rgba(255,255,255,0.1);
            font-weight: 900; text-transform: uppercase;
            pointer-events: none; z-index: 1;
        }

        /* Footer */
        footer {
            margin-top: auto; width: 100%;
            background: #020617; padding: 20px;
            text-align: center; border-top: 1px solid #334155;
            font-size: 13px; color: #64748b;
        }

        /* Mobile */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-section, .preview-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <div class="logo-icon">IL</div>
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="data/pdf.html">PDF Tool</a>
        <a href="data/quotes.html">Quote Maker</a>
        <a href="notice.html">Notice Maker</a>
    </div>

    <div class="container">
        
        <div class="editor-section">
            <div class="section-title">Create Notice</div>
            
            <div class="input-group">
                <label>Category</label>
                <select id="catInput" class="form-control" onchange="updatePreview()">
                    <option>Breaking News</option>
                    <option>Urgent Notice</option>
                    <option>Exam Routine</option>
                    <option>Admit Card</option>
                    <option>Result Published</option>
                    <option>Holiday Notice</option>
                    <option>Admission Update</option>
                    <option>Scholarship Info</option>
                    <option>Class Suspension</option>
                    <option>Important Alert</option>
                </select>
            </div>

            <div class="input-group">
                <label>Announcement Text</label>
                <textarea id="bodyInput" class="form-control" placeholder="Write your notice here..." oninput="updatePreview()"></textarea>
            </div>

            <div class="input-group">
                <label>Source Name (Optional)</label>
                <input id="sourceInput" class="form-control" placeholder="e.g. Daily Campus" oninput="updatePreview()">
            </div>

            <div class="input-group">
                <label>Theme Color</label>
                <select id="themeInput" class="form-control" onchange="updateTheme()">
                    <option value="blue">Royal Blue</option>
                    <option value="red">Red Alert</option>
                    <option value="green">Emerald Green</option>
                    <option value="purple">Deep Purple</option>
                    <option value="dark">Midnight Black</option>
                </select>
            </div>

            <button class="btn-download" onclick="downloadImage()">Download Image</button>
        </div>

        <div class="preview-wrapper">
            <div id="noticeCard">
                <div class="card-top">Official Announcement</div>
                
                <div class="card-body">
                    <span id="pCat" class="notice-badge">Breaking News</span>
                    <div id="pBody" class="notice-text">
                        Write your announcement content here. It will update automatically.
                    </div>

                    <div class="meta-info">
                        <div class="source-tag">
                            <span id="pSource">Source Name</span>
                            <i class="fas fa-check-circle verified-icon"></i>
                        </div>
                        <div id="pDate">24 Jan, 2026</div>
                    </div>
                </div>

                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning</footer>

    <script>
        // Menu Toggle
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.querySelector('.hamburger').classList.toggle('active');
        }

        // Live Update
        function updatePreview() {
            const cat = document.getElementById('catInput').value;
            const body = document.getElementById('bodyInput').value || "Write your announcement content here...";
            const source = document.getElementById('sourceInput').value || "Source Name";
            
            document.getElementById('pCat').innerText = cat;
            document.getElementById('pBody').innerText = body;
            document.getElementById('pSource').innerText = source;

            // Date
            const now = new Date();
            document.getElementById('pDate').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // Themes
        function updateTheme() {
            const theme = document.getElementById('themeInput').value;
            const card = document.getElementById('noticeCard');
            const top = document.querySelector('.card-top');
            const badge = document.querySelector('.notice-badge');

            let bg, accent;

            if(theme === 'blue') { bg = "linear-gradient(145deg, #1e293b, #0f172a)"; accent = "#3b82f6"; }
            else if(theme === 'red') { bg = "linear-gradient(145deg, #450a0a, #1f0505)"; accent = "#ef4444"; }
            else if(theme === 'green') { bg = "linear-gradient(145deg, #064e3b, #022c22)"; accent = "#10b981"; }
            else if(theme === 'purple') { bg = "linear-gradient(145deg, #3b0764, #1e0336)"; accent = "#a855f7"; }
            else { bg = "#000000"; accent = "#ffffff"; }

            card.style.background = bg;
            top.style.background = accent;
            badge.style.color = accent;
            badge.style.borderColor = accent;
        }

        // Download
        function downloadImage() {
            const element = document.getElementById('noticeCard');
            html2canvas(element, {
                scale: 3,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Notice_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Init
        updatePreview();
    </script>
</body>
</html>
