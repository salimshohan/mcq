<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* --- HOME PAGE VARIABLES (LIGHT THEME) --- */
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-soft: rgba(79, 70, 229, 0.1);
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --accent: #fbbf24; /* Dynamic Accent */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- HEADER (DARK VIBE) --- */
        header {
            width: 100%;
            background: linear-gradient(90deg, #1e1b4b, #312e81);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-link { text-decoration: none; display: flex; align-items: center; gap: 10px; }
        
        .brand-logo {
            font-size: 16px; font-weight: 700; color: white; /* Smaller Font */
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        .logo-img { 
            height: 32px; width: 32px; border-radius: 50%; 
            object-fit: cover; border: 2px solid rgba(255,255,255,0.2);
        }

        .hamburger {
            cursor: pointer; width: 26px; height: 18px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 1100;
        }
        .hamburger span { display: block; height: 2px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 250px;
            background: #0f172a; display: flex; flex-direction: column; padding-top: 70px;
            transition: 0.4s; box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: #cbd5e1; text-decoration: none; padding: 12px 25px;
            font-size: 14px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .nav-menu a:hover { padding-left: 30px; color: #8b5cf6; background: rgba(255,255,255,0.03); }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px;
            width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 25px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX (White Panel) --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg);
            padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-lg);
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-light);
        }
        .section-title { font-size: 18px; font-weight: 700; color: #1f2937; letter-spacing: -0.5px; }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: #374151; margin-bottom: 6px; letter-spacing: 0.3px;
        }

        .form-control {
            width: 100%; background: #ffffff;
            border: 1px solid #d1d5db; color: #111827;
            padding: 12px 16px; border-radius: 8px; font-size: 14px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); font-family: inherit;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
        textarea.form-control { resize: vertical; min-height: 120px; }
        select.form-control { cursor: pointer; }

        .btn-download {
            width: 100%; padding: 14px; margin-top: 10px;
            border-radius: 10px; border: none;
            background: #111827; color: white;
            font-weight: 700; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-download:hover { background: #000000; transform: translateY(-2px); }

        /* --- PREVIEW SECTION --- */
        .preview-box {
            flex: 1.2; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 10px;
        }

        /* --- NOTICE CARD (The Requested Design) --- */
        #noticeCard {
            width: 100%; max-width: 450px;
            /* Dark Gradient Background */
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 12px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden; position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
            color: white; font-family: 'Anek Bangla', sans-serif;
            transition: all 0.3s ease;
        }

        /* 1. Header Bar (Centered, Accent BG) */
        .card-header-strip {
            background: var(--accent); /* Dynamic Color */
            padding: 15px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative; z-index: 5;
        }
        .header-icon { font-size: 22px; color: white; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }
        .header-text { 
            font-size: 16px; font-weight: 800; color: white; 
            text-transform: uppercase; letter-spacing: 2px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* 2. Content Body */
        .card-body-content { 
            padding: 25px 30px; 
            position: relative; z-index: 2; 
            flex: 1; display: flex; flex-direction: column;
            min-height: 350px;
        }

        /* Meta Info (Category pill) */
        .meta-row { margin-bottom: 25px; }
        .cat-pill {
            display: inline-block; padding: 6px 14px; border-radius: 50px;
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); font-size: 12px; font-weight: 700;
            letter-spacing: 0.5px; backdrop-filter: blur(5px);
        }

        /* Main Notice Text */
        .notice-main-text {
            font-size: 22px; line-height: 1.5; font-weight: 500;
            color: rgba(255,255,255,0.95);
            white-space: pre-wrap; margin-bottom: auto;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 3. Footer (Source Left, Date/Watermark Right) */
        .card-footer-area {
            margin-top: 40px; padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        /* Source (Left) */
        .source-wrapper { display: flex; flex-direction: column; gap: 4px; }
        .source-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); font-weight: 600; }
        .source-val { font-size: 14px; font-weight: 700; color: white; display: flex; align-items: center; gap: 5px; }
        .verified-badge { color: #38bdf8; font-size: 14px; }

        /* Meta Right (Date + Watermark) */
        .meta-right { text-align: right; display: flex; flex-direction: column; gap: 4px; }
        .date-val { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); }
        .watermark-text {
            font-size: 11px; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 1px; color: rgba(255,255,255,0.4); /* High Visibility */
        }

        /* Footer */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: #1f2937; border-top: 1px solid #374151;
            margin-top: auto; font-size: 13px; color: #9ca3af;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 20px; }
            .editor-box, .preview-box { min-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="brand-link">
            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" alt="Logo" class="logo-img">
            <span class="brand-text">Interactive Learning</span>
        </a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="../index.html">Home</a>
            <a href="pdf.html">PDF Tool</a>
            <a href="quotes.html">Quote Maker</a>
            <a href="notice.html">Notice Maker</a>
        </div>
    </header>

    <div class="container">
        
        <div class="editor-box">
            <div class="section-header">
                <div class="section-title">Notice Creator</div>
            </div>
            
            <div class="input-group">
                <label>Category</label>
                <select id="catInput" class="form-control" onchange="updatePreview()">
                    <option>Breaking News</option>
                    <option>Urgent Notice</option>
                    <option>Exam Routine</option>
                    <option>Admit Card</option>
                    <option>Result Published</option>
                    <option>Holiday Notice</option>
                    <option>Admission Update</option>
                    <option>Scholarship Info</option>
                    <option>Class Suspension</option>
                    <option>Important Alert</option>
                </select>
            </div>

            <div class="input-group">
                <label>Theme (100+ Styles)</label>
                <select id="themeSelector" class="form-control" onchange="updatePreview()">
                    </select>
            </div>

            <div class="input-group">
                <label>Announcement Text</label>
                <textarea id="bodyInput" class="form-control" placeholder="Write notice details here..." oninput="updatePreview()"></textarea>
            </div>

            <div class="input-group">
                <label>Source Name (Optional)</label>
                <input id="sourceInput" class="form-control" placeholder="e.g. Daily Campus" oninput="updatePreview()">
            </div>

            <button class="btn-download" onclick="downloadImage()">
                <i class="fas fa-download"></i> Download PNG
            </button>
        </div>

        <div class="preview-box">
            <div id="noticeCard">
                <div class="card-top-strip" id="cardHeader">
                    <i class="fas fa-bullhorn header-icon"></i>
                    <span class="header-text">Announcement</span>
                </div>
                
                <div class="card-body-content">
                    <div class="meta-row">
                        <span id="pCat" class="cat-pill">Breaking News</span>
                    </div>
                    
                    <div id="pBody" class="notice-main-text">
                        Write your announcement content here.
                    </div>

                    <div class="card-footer-area">
                        <div class="source-wrapper" id="sourceBox">
                            <span class="source-title" id="srcLbl">Source</span>
                            <div class="source-val">
                                <span id="pSource">Source Name</span>
                                <i class="fas fa-check-circle verified-badge"></i>
                            </div>
                        </div>
                        
                        <div class="meta-right">
                            <div id="pDate" class="date-val">24 Jan 2026</div>
                            <div class="watermark-text">Interactive Learning</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning<br>All rights reserved.</footer>

            { name: "Clouds", bg: "linear-gradient(135deg, #ECE9E6, #FFFFFF)", accent: "#333" },
            { name: "Chocolate", bg: "linear-gradient(135deg, #56392d, #9e6f59)", accent: "#fff" },
            { name: "Candy", bg: "linear-gradient(135deg, #D4145A, #FBB03B)", accent: "#fff" },
            { name: "Moss", bg: "linear-gradient(135deg, #134E5E, #71B280)", accent: "#fff" },
            { name: "Mirage", bg: "linear-gradient(135deg, #16222A, #3A6073)", accent: "#fff" },
            { name: "Steel", bg: "linear-gradient(135deg, #1F1C2C, #928DAB)", accent: "#fff" }
        ];

        const select = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            select.appendChild(opt);
        });

        // --- PREVIEW LOGIC ---
        function updatePreview() {
            const cat = document.getElementById('catInput').value;
            const body = document.getElementById('bodyInput').value || "Write notice details here...";
            const source = document.getElementById('sourceInput').value.trim();
            
            document.getElementById('pCat').innerText = cat;
            document.getElementById('pBody').innerText = body;

            // Source Hiding
            const sourceBox = document.getElementById('sourceBox');
            if(source === "") {
                sourceBox.style.display = "none";
            } else {
                sourceBox.style.display = "flex";
                document.getElementById('pSource').innerText = source;
            }

            // Date
            const now = new Date();
            document.getElementById('pDate').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

            // Apply Theme
            const themeIdx = document.getElementById('themeSelector').value;
            const theme = themes[themeIdx];
            const card = document.getElementById('noticeCard');
            const header = document.getElementById('cardHeader');
            const catPill = document.getElementById('pCat');
            
            // Backgrounds
            card.style.background = theme.bg;
            header.style.background = theme.accent;
            
            // Text Color for Light Themes
            const isLight = ["Silver", "Gold", "Ice Cold", "Rose Gold", "Minty Fresh", "Clouds", "Piggy Pink", "Mega Tron"].includes(theme.name);
            const textCol = isLight ? "#1e293b" : "#ffffff";
            const mutedCol = isLight ? "#64748b" : "rgba(255,255,255,0.7)";
            const borderCol = isLight ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.1)";

            document.getElementById('pBody').style.color = textCol;
            document.querySelector('.source-name').style.color = textCol;
            document.getElementById('srcLbl').style.color = mutedCol;
            document.getElementById('pDate').style.color = mutedCol;
            document.querySelector('.watermark-text').style.color = mutedCol;
            document.querySelector('.card-footer-area').style.borderTopColor = borderCol;

            // Category Pill Style
            catPill.style.color = theme.accent;
            catPill.style.borderColor = theme.accent;
            if(isLight) {
                catPill.style.background = "rgba(0,0,0,0.05)";
                header.style.color = "#ffffff"; /* Header text always white on accent */
            } else {
                catPill.style.background = "rgba(255,255,255,0.1)";
            }
        }

        // --- DOWNLOAD ---
        function downloadImage() {
            const element = document.getElementById('noticeCard');
            const btn = document.querySelector('.btn-download');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
            
            html2canvas(element, { scale: 3, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Notice_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = `<i class="fas fa-download"></i> Download PNG`;
            });
        }

        updatePreview();
    </script>
</body>
</html>
