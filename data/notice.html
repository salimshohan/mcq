<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* --- HOME PAGE VARIABLES (LIGHT THEME) --- */
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-soft: rgba(79, 70, 229, 0.1);
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- NAVBAR (Home Style) --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-link { text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .brand-logo { font-size: 18px; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 1px; }
        .logo-img { height: 35px; width: 35px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.5); }

        .hamburger { cursor: pointer; width: 28px; height: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .hamburger span { display: block; height: 2px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 260px; height: 100vh;
            background: #0f172a; display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s; box-shadow: -5px 0 20px rgba(0,0,0,0.5); z-index: 999;
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-size: 15px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.1); color: #ccc;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 90px; width: 95%; max-width: 1200px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX (White) --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light); box-shadow: var(--shadow-lg);
        }
        .section-title { font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .form-control {
            width: 100%; background: #ffffff; border: 1px solid #d1d5db; color: #111827;
            padding: 12px; border-radius: 8px; font-size: 14px; transition: 0.2s; font-family: inherit;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .btn-download {
            width: 100%; padding: 14px; margin-top: 15px; border-radius: 10px; border: none;
            background: #111827; color: white; font-weight: 600; cursor: pointer;
            box-shadow: var(--shadow-md); transition: 0.2s;
        }
        .btn-download:hover { background: #000; transform: translateY(-2px); }

        /* --- PREVIEW WRAPPER --- */
        .preview-wrapper {
            flex: 1.2; min-width: 350px;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 10px;
        }

        /* =========================================
           NOTICE CARD DESIGN (MATCHING REFERENCE)
           ========================================= */
        #noticeCard {
            width: 100%; max-width: 480px;
            /* Base Background (Will be overridden by theme) */
            background: #2e0249; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            font-family: 'Anek Bangla', sans-serif;
            color: white;
            position: relative;
        }

        /* 1. Header Strip */
        .nc-header {
            /* Lighter accent color */
            background: #570a57; 
            padding: 12px 20px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 20px; font-weight: 700; letter-spacing: 0.5px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nc-header i { font-size: 24px; transform: rotate(-15deg); }

        /* 2. Body */
        .nc-body {
            padding: 25px 30px 20px 30px;
            min-height: 300px;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.1) 100%);
        }

        /* Category Pill */
        .nc-cat {
            display: inline-block;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 18px; border-radius: 50px;
            font-size: 14px; font-weight: 600; color: #e9d5ff;
            margin-bottom: 20px; width: fit-content;
        }

        /* Text */
        .nc-text {
            font-size: 24px; line-height: 1.5; font-weight: 500;
            color: #ffffff; margin-bottom: auto;
            white-space: pre-wrap;
        }

        /* Divider Line */
        .nc-line {
            height: 1px; width: 100%;
            background: rgba(255, 255, 255, 0.15);
            margin: 25px 0 15px 0;
        }

        /* Footer */
        .nc-footer {
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        /* Source */
        .nc-source-wrap { display: none; flex-direction: column; gap: 2px; }
        .nc-source-lbl { font-size: 11px; opacity: 0.6; text-transform: uppercase; }
        .nc-source { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .nc-verified { color: #38bdf8; font-size: 14px; }

        /* Meta (Right) */
        .nc-meta { text-align: right; display: flex; flex-direction: column; gap: 2px; }
        .nc-date { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.9); }
        .nc-watermark { font-size: 12px; font-weight: 600; opacity: 0.4; }

        /* Footer */
        footer {
            width: 100%; padding: 20px; text-align: center;
            background: #1f2937; border-top: 1px solid #374151;
            margin-top: auto; font-size: 13px; color: white;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 15px; }
            .editor-box, .preview-wrapper { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script src="../js/header.js"></script>

    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">Notice Creator</div>
            
            <div class="input-group">
                <label>Category</label>
                <select id="catInput" class="form-control" onchange="updatePreview()">
                    <option>Breaking News</option>
                    <option>Urgent Notice</option>
                    <option>Result Published</option>
                    <option>Exam Routine</option>
                    <option>Admit Card</option>
                    <option>Holiday Notice</option>
                    <option>Admission Update</option>
                    <option>Important Alert</option>
                </select>
            </div>

            <div class="input-group">
                <label>Theme (100+ Styles)</label>
                <select id="themeSelector" class="form-control" onchange="updatePreview()">
                    </select>
            </div>

            <div class="input-group">
                <label>Announcement Text</label>
                <textarea id="bodyInput" class="form-control" placeholder="Write announcement here..." oninput="updatePreview()"></textarea>
            </div>

            <div class="input-group">
                <label>Source Name</label>
                <input id="sourceInput" class="form-control" placeholder="e.g. Daily Campus" oninput="updatePreview()">
            </div>

            <button class="btn-download" onclick="downloadImage()">
                <i class="fas fa-download"></i> Download PNG
            </button>
        </div>

        <div class="preview-wrapper">
            <div id="noticeCard">
                <div class="nc-header" id="ncHeader">
                    <i class="fas fa-bullhorn"></i> Announcement
                </div>
                
                <div class="nc-body" id="ncBody">
                    <div id="pCat" class="nc-cat">Breaking News</div>
                    
                    <div id="pBody" class="nc-text">
                        অভিনন্দন! আপনার উত্তরটি সঠিক হয়েছে। প্রতিযোগিতামূলক পরীক্ষার উপযোগী কন্টেন্ট পেতে পেইজটির সাথে থাকুন।
                    </div>

                    <div class="nc-line"></div>

                    <div class="nc-footer">
                        <div class="nc-source-wrap" id="sourceBox">
                            <span class="nc-source-lbl">Source</span>
                            <div class="nc-source">
                                <span id="pSource">Trust Me Bro</span>
                                <i class="fas fa-check-circle nc-verified"></i>
                            </div>
                        </div>
                        <div class="nc-meta">
                            <div id="pDate" class="nc-date">24 Jan 2026</div>
                            <div class="nc-watermark">Interactive Learning</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning<br>All rights reserved.</footer>

    <script>
        // --- 100 PREMIUM THEMES (Header Color + Body Gradient) ---
        // Header needs to be lighter/distinct from body
        const themes = [
            { name: "Classic Purple", head: "#a855f7", body: "linear-gradient(135deg, #2e0249, #570a57)" },
            { name: "Royal Blue", head: "#3b82f6", body: "linear-gradient(135deg, #1e1b4b, #172554)" },
            { name: "Sunset Orange", head: "#f97316", body: "linear-gradient(135deg, #7c2d12, #c2410c)" },
            { name: "Emerald Green", head: "#10b981", body: "linear-gradient(135deg, #064e3b, #065f46)" },
            { name: "Deep Red", head: "#ef4444", body: "linear-gradient(135deg, #450a0a, #7f1d1d)" },
            { name: "Cyber Teal", head: "#06b6d4", body: "linear-gradient(135deg, #164e63, #0e7490)" },
            { name: "Midnight Black", head: "#4b5563", body: "linear-gradient(135deg, #000000, #111827)" },
            { name: "Hot Pink", head: "#ec4899", body: "linear-gradient(135deg, #831843, #be185d)" },
            { name: "Golden Hour", head: "#eab308", body: "linear-gradient(135deg, #713f12, #a16207)" },
            { name: "Slate Grey", head: "#64748b", body: "linear-gradient(135deg, #0f172a, #334155)" },
            // ... Generating variants ...
        ];
        
        // Algorithmically generate 90 more variations
        const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316', '#eab308', '#84cc16', '#10b981', '#06b6d4', '#3b82f6'];
        for(let i=0; i<90; i++) {
            let c = colors[i % colors.length];
            themes.push({
                name: `Theme ${i+11}`,
                head: c,
                body: `linear-gradient(${135 + i}deg, #1a1a2e, ${c}40)` // Dark body with colored tint
            });
        }

        const tSelect = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = t.name;
            tSelect.appendChild(opt);
        });

        // --- PREVIEW LOGIC ---
        function updatePreview() {
            const cat = document.getElementById('catInput').value;
            const body = document.getElementById('bodyInput').value || "Your announcement text will appear here.";
            const source = document.getElementById('sourceInput').value.trim();
            
            document.getElementById('pCat').innerText = cat;
            document.getElementById('pBody').innerText = body;

            // Source Logic
            const sourceBox = document.getElementById('sourceBox');
            if (source === "") {
                sourceBox.style.display = "none";
            } else {
                sourceBox.style.display = "flex";
                document.getElementById('pSource').innerText = source;
            }

            document.getElementById('pDate').innerText = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

            // Apply Theme
            const tIdx = document.getElementById('themeSelector').value;
            const theme = themes[tIdx];
            
            document.getElementById('noticeCard').style.background = theme.body;
            document.getElementById('ncHeader').style.background = theme.head;
            
            // Adjust Pill Color to match header (with transparency)
            // Simulating by using the header color for border/text if needed, but keeping white text on dark bg is safer
        }

        // --- DOWNLOAD ---
        function downloadImage() {
            const element = document.getElementById('noticeCard');
            const btn = document.querySelector('.btn-download');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
            
            html2canvas(element, { scale: 3, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Notice_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = `<i class="fas fa-download"></i> Download PNG`;
            });
        }

        // --- HEADER INJECTION ---
        // Since we are in the same folder structure, we assume header is handled.
        // For standalone file to work:
        function toggleMenu() { /* Handled by header.js if present, else manual */ }

        // Init
        updatePreview();
    </script>
</body>
</html>
