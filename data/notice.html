<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Maker | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER & NAVBAR --- */
        header {
            width: 100%;
            background: linear-gradient(90deg, #1e1b4b, #312e81);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-link {
            text-decoration: none; display: flex; align-items: center; gap: 12px;
            transition: 0.3s;
        }
        .brand-link:hover { opacity: 0.9; }

        .brand-text {
            font-size: 18px; font-weight: 700; color: white;
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        .logo-img { 
            height: 35px; width: 35px; border-radius: 50%; 
            object-fit: cover; border: 2px solid rgba(255,255,255,0.2);
        }

        .hamburger {
            cursor: pointer; width: 28px; height: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 2001;
        }
        .hamburger span { 
            display: block; height: 3px; width: 100%; background: white; 
            border-radius: 2px; transition: 0.3s; 
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 250px; height: 100vh;
            background: #1e1b4b; border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s ease-in-out; z-index: 1999;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a {
            color: #cbd5e1; text-decoration: none; padding: 15px 30px;
            font-size: 15px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }
        .mobile-menu a:hover { background: rgba(255,255,255,0.1); color: var(--primary); }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; flex: 1; width: 95%; max-width: 1100px;
            display: flex; flex-wrap: gap: 30px;
            padding-bottom: 40px; justify-content: center;
        }

        /* --- EDITOR SECTION --- */
        .editor-section {
            flex: 1; min-width: 320px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { 
            font-size: 16px; font-weight: 700; color: var(--primary); 
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color); 
            padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        
        .form-control {
            width: 100%; background: var(--input-bg); border: 1px solid #334155; 
            color: #f1f5f9; padding: 12px; font-size: 14px; border-radius: 8px;
            transition: 0.3s; font-family: 'Anek Bangla', sans-serif;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        textarea.form-control { resize: vertical; min-height: 120px; }

        .btn-download {
            width: 100%; padding: 15px; margin-top: 15px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #6366f1, #3b82f6); color: white;
            font-weight: 700; cursor: pointer; box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
            text-transform: uppercase; letter-spacing: 1px; font-size: 13px;
        }

        /* --- PREVIEW SECTION --- */
        .preview-wrapper {
            flex: 1.5; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding-top: 10px;
        }

        /* --- NOTICE CARD (Classic Style) --- */
        #noticeCard {
            width: 100%; max-width: 450px;
            /* Default Theme */
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 6px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            overflow: hidden; position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.3s ease;
        }

        /* Top Header Strip */
        .top-header {
            background: rgba(0,0,0,0.3); padding: 12px;
            text-align: center; color: rgba(255,255,255,0.9);
            font-size: 11px; font-weight: 800; letter-spacing: 3px;
            text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* Content Body */
        .card-body { padding: 25px 30px; position: relative; z-index: 2; min-height: 300px; display: flex; flex-direction: column; }

        .notice-badge {
            display: inline-block; padding: 6px 14px; border-radius: 50px;
            background: rgba(255,255,255,0.15); color: var(--accent);
            font-size: 13px; font-weight: 700; margin-bottom: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .date-info { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 20px; font-weight: 500; }

        .notice-text {
            font-size: 22px; line-height: 1.5; color: #fff; font-weight: 500;
            margin-bottom: auto; text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            white-space: pre-wrap;
        }

        /* Footer Source */
        .source-box {
            margin-top: 30px; padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none; /* Auto Hidden */
        }
        .source-label { font-size: 10px; text-transform: uppercase; opacity: 0.6; letter-spacing: 1px; }
        .source-name { font-size: 14px; font-weight: 700; color: white; display: flex; align-items: center; gap: 5px; }
        .verified { color: #38bdf8; font-size: 14px; }

        /* Watermark (Visible) */
        .watermark {
            position: absolute; bottom: 15px; right: 20px;
            font-size: 11px; color: rgba(255,255,255,0.25); /* Increased Visibility */
            font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            pointer-events: none; z-index: 1;
        }

        /* Footer */
        footer {
            margin-top: auto; width: 100%;
            background: #020617; padding: 20px;
            text-align: center; border-top: 1px solid #334155;
            font-size: 13px; color: #64748b;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-section, .preview-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-link">
            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" alt="Logo" class="logo-img">
            <span class="brand-text">Interactive Learning</span>
        </a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="data/pdf.html">PDF Tool</a>
        <a href="data/quotes.html">Quote Maker</a>
        <a href="notice.html">Notice Maker</a>
    </div>

    <div class="container">
        
        <div class="editor-section">
            <div class="section-title">Announcement Settings</div>
            
            <div class="input-group">
                <label>Theme (100 Curated Styles)</label>
                <select id="themeSelector" class="form-control" onchange="updatePreview()">
                    </select>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="catInput" class="form-control" onchange="updatePreview()">
                    <option>Breaking News</option>
                    <option>Urgent Notice</option>
                    <option>Exam Routine</option>
                    <option>Admit Card</option>
                    <option>Result Published</option>
                    <option>Holiday Notice</option>
                    <option>Admission Update</option>
                    <option>Scholarship Info</option>
                    <option>Class Suspension</option>
                    <option>Important Alert</option>
                </select>
            </div>

            <div class="input-group">
                <label>Announcement Text</label>
                <textarea id="bodyInput" class="form-control" placeholder="Write your notice here..." oninput="updatePreview()"></textarea>
            </div>

            <div class="input-group">
                <label>Source Name (Optional)</label>
                <input id="sourceInput" class="form-control" placeholder="e.g. Daily Campus" oninput="updatePreview()">
            </div>

            <button class="btn-download" onclick="downloadImage()">Download Image</button>
        </div>

        <div class="preview-wrapper">
            <div id="noticeCard">
                <div class="top-header"><i class="fas fa-bullhorn"></i> Announcement</div>
                
                <div class="card-body">
                    <div>
                        <span id="pCat" class="notice-badge">Breaking News</span>
                        <div id="pDate" class="date-info">24 Jan, 2026</div>
                    </div>
                    
                    <div id="pBody" class="notice-text">
                        Write your announcement content here. It will update automatically.
                    </div>

                    <div class="source-box" id="sourceBox">
                        <div class="source-label">Source</div>
                        <div class="source-name">
                            <span id="pSource">Source Name</span>
                            <i class="fas fa-check-circle verified"></i>
                        </div>
                    </div>
                </div>

                <div class="watermark">Interactive Learning</div>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Interactive Learning</footer>

    <script>
        // Menu Toggle
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.querySelector('.hamburger').classList.toggle('active');
        }

            { name: "Deep Ocean", bg: "linear-gradient(135deg, #0f172a, #0e7490)", accent: "#67e8f9" },
            { name: "Charcoal", bg: "linear-gradient(135deg, #18181b, #27272a)", accent: "#e4e4e7" },
            { name: "Red Alert", bg: "linear-gradient(135deg, #450a0a, #7f1d1d)", accent: "#f87171" },
            { name: "Emerald City", bg: "linear-gradient(135deg, #064e3b, #10b981)", accent: "#6ee7b7" },
            { name: "Cyberpunk", bg: "linear-gradient(135deg, #2d0036, #0f0c29)", accent: "#00fff2" },

            // Light Gradients

            { name: "Morning Sky", bg: "linear-gradient(135deg, #FF5F6D, #FFC371)", accent: "#fff" },
            { name: "Minty Fresh", bg: "linear-gradient(135deg, #4ade80, #86efac)", accent: "#064e3b" },
            
            // Solid Colors
            { name: "Pure Black", bg: "#000000", accent: "#ffffff" },
            { name: "Slate Grey", bg: "#334155", accent: "#94a3b8" },
            { name: "Hot Pink", bg: "#db2777", accent: "#fbcfe8" },
            
            // More Gradients (Generating varied styles)
            { name: "Amethyst", bg: "linear-gradient(135deg, #9d50bb, #6e48aa)", accent: "#fff" },
            { name: "Cosmic", bg: "linear-gradient(135deg, #ff00cc, #333399)", accent: "#fff" },

            { name: "Cherry", bg: "linear-gradient(135deg, #eb3349, #f45c43)", accent: "#fff" },
            { name: "Vampire", bg: "linear-gradient(135deg, #16222A, #3A6073)", accent: "#fff" },
            { name: "Dark Knight", bg: "linear-gradient(135deg, #000000, #434343)", accent: "#f1c40f" },
            { name: "Sleek", bg: "linear-gradient(135deg, #141E30, #243B55)", accent: "#fff" },
            { name: "Onyx", bg: "linear-gradient(135deg, #3E5151, #DECBA4)", accent: "#fff" },
            { name: "Lavender", bg: "linear-gradient(135deg, #667db6, #0082c8)", accent: "#fff" },
            { name: "Plum", bg: "linear-gradient(135deg, #dd2476, #ff512f)", accent: "#fff" },
            { name: "Jungle", bg: "linear-gradient(135deg, #1a2980, #26d0ce)", accent: "#fff" },

            { name: "Nature", bg: "linear-gradient(135deg, #2ebf91, #8360c3)", accent: "#fff" },
            { name: "Netflix", bg: "linear-gradient(135deg, #000000, #E50914)", accent: "#fff" },
            { name: "Twitch", bg: "linear-gradient(135deg, #6441a5, #2a0845)", accent: "#fff" },
            { name: "Neon Violet", bg: "linear-gradient(135deg, #654ea3, #eaafc8)", accent: "#fff" },
            { name: "Majestic", bg: "linear-gradient(135deg, #5614B0, #DBD65C)", accent: "#fff" },
            { name: "Haiku", bg: "linear-gradient(135deg, #fd746c, #ff9068)", accent: "#fff" },
            { name: "Superman", bg: "linear-gradient(135deg, #0099F7, #F11712)", accent: "#fff" },
            { name: "Timber", bg: "linear-gradient(135deg, #fc00ff, #00dbde)", accent: "#fff" },
            { name: "Passion", bg: "linear-gradient(135deg, #e53935, #e35d5b)", accent: "#fff" },
            { name: "Radar", bg: "linear-gradient(135deg, #A770EF, #CF8BF3)", accent: "#fff" },

            { name: "Piggy Pink", bg: "linear-gradient(135deg, #ee9ca7, #ffdde1)", accent: "#333" },

            { name: "Day Tripper", bg: "linear-gradient(135deg, #f857a6, #ff5858)", accent: "#fff" },
            { name: "Namn", bg: "linear-gradient(135deg, #a73737, #7a2828)", accent: "#fff" },
            { name: "Blurry Beach", bg: "linear-gradient(135deg, #d53369, #cbad6d)", accent: "#fff" },
            { name: "Vasily", bg: "linear-gradient(135deg, #e9d362, #333333)", accent: "#fff" },

            { name: "Petrichor", bg: "linear-gradient(135deg, #666600, #999966)", accent: "#fff" },
            { name: "Miaka", bg: "linear-gradient(135deg, #FC354C, #0ABFBC)", accent: "#fff" },
            { name: "Reef", bg: "linear-gradient(135deg, #00d2ff, #3a7bd5)", accent: "#fff" },
            { name: "Mantle", bg: "linear-gradient(135deg, #24c6dc, #514a9d)", accent: "#fff" },
            { name: "Dracula", bg: "linear-gradient(135deg, #DC2424, #4A569D)", accent: "#fff" },
            { name: "Mouse", bg: "linear-gradient(135deg, #200122, #6f0000)", accent: "#fff" },
            { name: "Stellar", bg: "linear-gradient(135deg, #7474BF, #348AC7)", accent: "#fff" },
            { name: "Clouds", bg: "linear-gradient(135deg, #ECE9E6, #FFFFFF)", accent: "#333" },
            { name: "Chocolate", bg: "linear-gradient(135deg, #56392d, #9e6f59)", accent: "#fff" },
            { name: "Candy", bg: "linear-gradient(135deg, #D4145A, #FBB03B)", accent: "#fff" },
            { name: "Moss", bg: "linear-gradient(135deg, #134E5E, #71B280)", accent: "#fff" },
            { name: "Mirage", bg: "linear-gradient(135deg, #16222A, #3A6073)", accent: "#fff" },
            { name: "Steel", bg: "linear-gradient(135deg, #1F1C2C, #928DAB)", accent: "#fff" }
        ];

        // Populate Theme Selector
        const select = document.getElementById('themeSelector');
        themes.forEach((t, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `${i+1}. ${t.name}`;
            select.appendChild(opt);
        });

        // Live Update
        function updatePreview() {
            // Text
            const cat = document.getElementById('catInput').value;
            const body = document.getElementById('bodyInput').value || "Write your announcement content here...";
            const source = document.getElementById('sourceInput').value.trim();
            
            document.getElementById('pCat').innerText = cat;
            document.getElementById('pBody').innerText = body;

            // Source Visibility Logic
            const sourceBox = document.getElementById('sourceBox');
            if (source === "") {
                sourceBox.style.display = "none";
            } else {
                sourceBox.style.display = "block";
                document.getElementById('pSource').innerText = source;
            }

            // Date
            const now = new Date();
            document.getElementById('pDate').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });

            // Theme Application
            const themeIdx = document.getElementById('themeSelector').value;
            const theme = themes[themeIdx];
            const card = document.getElementById('noticeCard');
            const badge = document.querySelector('.notice-badge');
            
            card.style.background = theme.bg;
            badge.style.color = theme.accent;
            badge.style.borderColor = theme.accent;

            // Text Color Logic for Light Themes
            const isLight = ["Silver", "Gold Rush", "Ice Cold", "Rose Gold", "Minty Fresh", "Clouds", "Piggy Pink", "Mega Tron"].includes(theme.name);
            const textCol = isLight ? "#222" : "#fff";
            
            document.getElementById('pBody').style.color = textCol;
            document.querySelector('.source-name').style.color = textCol;
            document.querySelector('.date-info').style.color = isLight ? "rgba(0,0,0,0.6)" : "rgba(255,255,255,0.6)";
            
            // Watermark Color
            document.querySelector('.watermark').style.color = isLight ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.25)";
        }

        // Download
        function downloadImage() {
            const element = document.getElementById('noticeCard');
            html2canvas(element, {
                scale: 3,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Notice_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Init
        updatePreview();
    </script>
</body>
</html>
