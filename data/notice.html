<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Maker | Interactive Learning</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
--bg-dark:#0f172a;
--panel-bg:rgba(30,41,59,.6);
--border-color:rgba(255,255,255,.1);
--primary:#8b5cf6;
--accent:#fbbf24;
--text-main:#f1f5f9;
--text-muted:#94a3b8;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Lexend','Anek Bangla',sans-serif;
background:var(--bg-dark);
color:var(--text-main);
min-height:100vh;
display:flex;
flex-direction:column;
}


/* ===== MAIN ===== */
.container{
margin-top:90px;
width:95%;
max-width:1200px;
margin-inline:auto;
display:flex;
flex-wrap:wrap;
gap:30px;
padding-bottom:40px;
flex:1;
}

.editor{
flex:1;
min-width:320px;
max-width:480px;
background:var(--panel-bg);
border:1px solid var(--border-color);
border-radius:18px;
padding:25px;
}

.editor h2{
color:var(--primary);
margin-bottom:20px;
}

.input-group{margin-bottom:15px}

label{
font-size:12px;
font-weight:600;
color:var(--text-muted);
margin-bottom:6px;
display:block;
}

.form-control{
width:100%;
background:rgba(15,23,42,.7);
border:1px solid rgba(255,255,255,.15);
color:#fff;
padding:12px;
border-radius:10px;
font-size:14px;
}

textarea.form-control{
min-height:120px;
resize:vertical;
}

.btn-download{
width:100%;
padding:15px;
border-radius:50px;
border:none;
background:linear-gradient(45deg,#6366f1,#3b82f6);
color:#fff;
font-weight:700;
cursor:pointer;
}

/* ===== PREVIEW ===== */
.preview{
flex:1.2;
display:flex;
justify-content:center;
}

#noticeCard{
width:100%;
max-width:430px;
border-radius:4px;
overflow:hidden;
border:1px solid var(--border-color);
box-shadow:0 20px 50px rgba(0,0,0,.6);
background:linear-gradient(145deg,#1e293b,#0f172a);
}

.card-top{
padding:10px;
text-align:center;
font-weight:800;
letter-spacing:1px;
display:flex;
gap:8px;
justify-content:center;
align-items:center;
background:var(--primary);
}

.card-body{padding:25px}

.notice-badge{
display:inline-block;
padding:5px 14px;
border-radius:50px;
border:1px solid rgba(255,255,255,.2);
font-size:12px;
font-weight:700;
margin-bottom:15px;
color:var(--accent);
}

.notice-text{
font-size:18px;
line-height:1.6;
margin-bottom:25px;
}

.meta-info{
display:flex;
justify-content:space-between;
align-items:flex-start;
border-top:1px solid var(--border-color);
padding-top:12px;
font-size:12px;
color:var(--text-muted);
}

.source-tag{
display:flex;
gap:6px;
align-items:center;
}

.verified{color:#38bdf8}

.right-meta{
text-align:right;
}

.watermark{
margin-top:4px;
font-size:10px;
opacity:.4;
}

/* ===== FOOTER (HOME SAME) ===== */
footer {
    width: 100%; padding: 15px; text-align: center;
    background: #1f2937;
    border-top: 1px solid #dadada;
    margin-top: auto; font-size: 14px; color: white;
}

/* ===== MOBILE ===== */
@media(max-width:900px){
.container{flex-direction:column}
}
</style>
</head>

<body>
<div id="header"></div>
<script src="/js/header.js" type="text/javascript">
</script>

<div class="container">

<div class="editor">
<h2>Create Notice</h2>

<div class="input-group">
<label>Category</label>
<select id="catInput" class="form-control" onchange="updatePreview()">
<option>Breaking News</option>
<option>Urgent Notice</option>
<option>Exam Routine</option>
<option>Result Published</option>
<option>Holiday Notice</option>
<option>Admission Update</option>
<option>Important Alert</option>
</select>
</div>

<div class="input-group">
<label>Notice Text</label>
<textarea id="bodyInput" class="form-control" placeholder="Write notice details..." oninput="updatePreview()"></textarea>
</div>

<div class="input-group">
<label>Source (Optional)</label>
<input id="sourceInput" class="form-control" placeholder="e.g. The Ironic Bro" oninput="updatePreview()">
</div>

<div class="input-group">
<label>Theme</label>
<select id="themeInput" class="form-control" onchange="applyTheme()"></select>
</div>

<button class="btn-download" onclick="downloadImage()">Download Image</button>
</div>

<div class="preview">
<div id="noticeCard">

<div class="card-top" id="cardTop"> 📢 Announcement
</div>

<div class="card-body">
<span id="pCat" class="notice-badge">Breaking News</span>

<div id="pBody" class="notice-text">
Your notice preview will appear here.
</div>

<div class="meta-info">
<div id="sourceWrap" class="source-tag">
<span>Source:</span>
<span id="pSource"></span>
<i class="fas fa-check-circle verified"></i>
</div>

<div class="right-meta">
<div id="pDate"></div>
<div class="watermark">Interactive Learning</div>
</div>
</div>

</div>
</div>
</div>

</div>

<footer>&copy; 2026 Interactive Learning<br>All rights reserved.</footer>

<script>
document.getElementById("year").innerText=new Date().getFullYear();

/* ===== NAVBAR TOGGLE (FIXED) ===== */
function toggleMenu(){
const menu=document.getElementById("navMenu");
const burger=document.querySelector(".hamburger");
menu.classList.toggle("open");
burger.classList.toggle("active");
}

/* ===== 1000 THEMES ===== */
const themes=[];
for(let i=0;i<1000;i++){
const h1=(i*7)%360;
const h2=(h1+40)%360;
themes.push({
bg:`linear-gradient(135deg,hsl(${h1},70%,22%),hsl(${h2},70%,14%))`,
accent:`hsl(${h1},80%,60%)`
});
}

themes.forEach((t,i)=>{
const opt=document.createElement("option");
opt.value=i;
opt.textContent=`Theme ${i+1}`;
themeInput.appendChild(opt);
});

/* ===== UPDATE PREVIEW ===== */
function updatePreview(){
pCat.innerText=catInput.value;
pBody.innerText=bodyInput.value||"Your notice preview will appear here.";

const src=sourceInput.value.trim();
if(src===""){
sourceWrap.style.display="none";
}else{
sourceWrap.style.display="flex";
pSource.innerText=src;
}

pDate.innerText=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}

/* ===== APPLY THEME ===== */
function applyTheme(){
const t=themes[themeInput.value];
noticeCard.style.background=t.bg;
cardTop.style.background=t.accent;
pCat.style.color=t.accent;
}

/* ===== DOWNLOAD ===== */
function downloadImage(){
html2canvas(noticeCard,{scale:3,backgroundColor:null}).then(c=>{
const a=document.createElement("a");
a.href=c.toDataURL();
a.download=`Notice_${Date.now()}.png`;
a.click();
});
}

updatePreview();
applyTheme();
</script>

</body>
</html>
