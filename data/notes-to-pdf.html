<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes Generator | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --text-main: #111827;
            --border-light: #e5e7eb;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: sticky; top: 90px; height: fit-content;
        }

        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 5px; }
        
        .form-control {
            width: 100%; background: #ffffff; border: 1px solid #d1d5db; color: #111827;
            padding: 10px; border-radius: 8px; font-size: 15px; transition: 0.2s; font-family: inherit;
        }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .form-control.error { border-color: var(--error); animation: shake 0.3s; }
        @keyframes shake { 0% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} 100% {transform: translateX(0);} }

        .btn-add {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: none;
            background: #e0e7ff; color: var(--primary); font-weight: 700; cursor: pointer;
            border: 1px dashed var(--primary); transition: 0.2s; font-size: 14px;
        }
        .btn-add:hover { background: #c7d2fe; }

        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-dl {
            flex: 1; padding: 12px; border-radius: 8px; border: none;
            color: white; font-weight: 600; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .btn-pdf { background: #ef4444; }
        .btn-img { background: #111827; }
        .btn-dl:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Items Manager */
        .items-manager { margin-top: 20px; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        .manage-item { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px; border-bottom: 1px solid #f3f4f6; font-size: 14px; background: #fff; gap: 5px;
        }
        .item-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .ctrl-btn { padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; color: white; border: none; }
        .btn-up, .btn-down { background: #3b82f6; }
        .btn-del { background: #ef4444; }

        /* --- PREVIEW WRAPPER --- */
        .preview-wrapper {
            flex: 1.5; display: flex; flex-direction: column; align-items: center;
            background: #52525b; padding: 40px; border-radius: 12px;
            overflow: auto; max-height: 90vh; 
        }
        
        .scale-box { 
            display: flex; flex-direction: column; 
            gap: 40px; 
            box-shadow: 0 10px 50px rgba(0,0,0,0.5); 
        }

        /* --- A4 PAGE DESIGN --- */
        .a4-page {
            width: 210mm; height: 297mm; /* Standard A4 */
            background: white; padding: 0;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            color: black; box-sizing: border-box;
        }

        /* Watermark (UPDATED OPACITY) */
        .watermark {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 60px; font-weight: 900; 
            color: #000; opacity: 0.15; /* Updated as requested */
            white-space: nowrap; pointer-events: none; z-index: 0;
            font-family: sans-serif; text-transform: uppercase; letter-spacing: 5px;
        }

        /* Header Styles */
        .pdf-header { 
            text-align: center; margin-bottom: 5px; flex-shrink: 0; 
            padding: 10mm 15mm 5px 15mm; z-index: 2; 
        }
        
        .brand-top { 
            font-size: 14px; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 2px; color: #000; margin-bottom: 2px; 
        }
        
        .main-subject { 
            border: 2px solid #000; display: inline-block; padding: 4px 30px; 
            font-size: 20px; font-weight: 800; margin: 3px 0; color: #000; line-height: 1.2;
        }
        .sub-topic { font-size: 15px; font-weight: 700; color: #333; margin-top: 2px; }
        .date-line { font-size: 12px; text-align: right; margin-top: 2px; color: #444; font-weight: 600; }
        
        .dotted-line { border-bottom: 2px dotted #aaa; width: 100%; margin-top: 5px; }

        .minimal-header { border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px; }

        /* Content Body */
        .page-content {
            padding: 0 15mm;
            flex-grow: 1;
            display: flex; flex-direction: column;
            overflow: hidden; 
            margin-bottom: 110px; /* Safety margin for footer */
            z-index: 2;
        }

        .pdf-body {
            display: flex; flex-direction: column; gap: 10px; 
            padding-top: 10px;
        }
        
        .note-row { display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
        .note-icon { color: #16a34a; font-size: 18px; margin-top: 3px; flex-shrink: 0; }
        .q-text { font-weight: 700; color: #000; font-size: 17px; }
        .a-text { font-weight: 700; color: #16a34a; font-size: 17px; }

        /* Footer (Fixed at Bottom) */
        .footer-fixed {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 100px; 
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 0 15mm 10mm 15mm;
            background: white; z-index: 10;
        }
        
        .promo-text {
            text-align: center; color: #ea580c; 
            font-size: 18px; font-weight: 800; margin-bottom: 8px;
        }

        .pdf-footer {
            border-top: 2px dotted #000; padding-top: 5px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: 700; color: #000;
        }

        /* Mobile Scale */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-box { width: 100%; position: relative; top: 0; }
            .preview-wrapper { width: 100%; padding: 10px; }
            .scale-box { transform: scale(0.44); transform-origin: top center; margin-bottom: -160mm; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script src="../js/header.js"></script>

    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">Page Setup</div>
            <div class="input-group">
                <label>বিষয় (Subject - File Name)</label>
                <input id="subjectInput" class="form-control" value="GK Recent Affairs" oninput="renderPages()">
            </div>
            <div class="input-group">
                <label>টপিক (Topic)</label>
                <input id="topicInput" class="form-control" value="International & National" oninput="renderPages()">
            </div>
            <div class="input-group">
                <label>তারিখ (Date)</label>
                <input type="text" id="dateInput" class="form-control" oninput="renderPages()">
            </div>

            <div class="section-title" style="margin-top: 20px;">Add Q&A</div>
            <div class="input-group">
                <label>প্রশ্ন (Question)</label>
                <textarea id="qInput" class="form-control" placeholder="এখানে প্রশ্ন লিখুন..." oninput="this.classList.remove('error')"></textarea>
            </div>
            <div class="input-group">
                <label>উত্তর (Answer)</label>
                <textarea id="aInput" class="form-control" placeholder="এখানে উত্তর লিখুন..." oninput="this.classList.remove('error')"></textarea>
            </div>
            <button class="btn-add" onclick="addItem()"><i class="fas fa-plus"></i> Add to List</button>

            <div class="items-manager" id="itemsManager">
                <div style="padding:10px; color:#999; text-align:center; font-size:12px;">No items added.</div>
            </div>

            <div class="action-btns">
                <button class="btn-dl btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
                <button class="btn-dl btn-img" onclick="downloadImagesZip()"><i class="fas fa-images"></i> Download Images</button>
            </div>
        </div>

        <div class="preview-wrapper">
            <div class="scale-box" id="pdfPreviewContainer">
                </div>
        </div>

    </div>

    <script>
        const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('dateInput').value = "আপডেট: " + today;

        let items = [];

        function renderPages() {
            const container = document.getElementById('pdfPreviewContainer');
            container.innerHTML = ''; 

            const subject = document.getElementById('subjectInput').value;
            const topic = document.getElementById('topicInput').value;
            const date = document.getElementById('dateInput').value;

            // Page Creator
            function createPage(pageNum) {
                const page = document.createElement('div');
                page.className = 'a4-page';
                page.id = `page-${pageNum}`;
                
                let headerHTML = '';
                if(pageNum === 1) {
                    headerHTML = `
                        <div class="pdf-header">
                            <div class="brand-top">INTERACTIVE LEARNING</div>
                            <div class="main-subject">${subject}</div>
                            <div class="sub-topic">${topic}</div>
                            <div class="date-line">${date}</div>
                            <div class="dotted-line"></div>
                        </div>`;
                } else {
                    headerHTML = `
                        <div class="pdf-header minimal-header">
                            <div class="brand-top">INTERACTIVE LEARNING</div>
                        </div>`;
                }

                page.innerHTML = `
                    <div class="watermark">INTERACTIVE LEARNING</div>
                    ${headerHTML}
                    <div class="page-content">
                        <div class="pdf-body"></div>
                    </div>
                    <div class="footer-fixed">
                        <div class="promo-text">সেরা প্রস্তুতিতে এক ধাপ এগিয়ে থাকতে আজই আমাদের ফ্রি এক্সাম ব্যাচে যুক্ত হোন।</div>
                        <div class="pdf-footer">
                            <span>Interactive Learning</span>
                            <span>Page ${pageNum}</span>
                        </div>
                    </div>
                `;
                return page;
            }

            // Always start with 1 page
            let pageNum = 1;
            let currentPage = createPage(pageNum);
            let currentBody = currentPage.querySelector('.pdf-body');
            let currentFooter = currentPage.querySelector('.footer-fixed');
            container.appendChild(currentPage);

            // Loop Items
            items.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'note-row';
                row.innerHTML = `
                    <i class="fas fa-check note-icon"></i>
                    <div class="note-content">
                        <div class="q-text">${item.q}</div>
                        <div class="a-text">- ${item.a}</div>
                    </div>
                `;
                
                currentBody.appendChild(row);

                // --- ROBUST OVERFLOW CHECK (Collision Detection) ---
                const rowRect = row.getBoundingClientRect();
                const footerRect = currentFooter.getBoundingClientRect();

                // If Row Bottom hits Footer Top (with 20px buffer)
                if (rowRect.bottom > footerRect.top - 20) {
                    currentBody.removeChild(row); // Remove from current page
                    
                    // Create new page
                    pageNum++;
                    currentPage = createPage(pageNum);
                    currentBody = currentPage.querySelector('.pdf-body');
                    currentFooter = currentPage.querySelector('.footer-fixed');
                    container.appendChild(currentPage);
                    
                    // Add to new page
                    currentBody.appendChild(row);
                }
            });

            renderManager();
        }

        function renderManager() {
            const manager = document.getElementById('itemsManager');
            manager.innerHTML = '';
            if(items.length === 0) {
                manager.innerHTML = '<div style="padding:10px; color:#999; text-align:center; font-size:12px;">No items added.</div>';
                return;
            }
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'manage-item';
                div.innerHTML = `
                    <div class="item-text"><b>${i+1}.</b> ${item.q}</div>
                    <div style="display:flex; gap:3px;">
                        <button class="ctrl-btn btn-up" onclick="moveItem(${i}, -1)"><i class="fas fa-arrow-up"></i></button>
                        <button class="ctrl-btn btn-down" onclick="moveItem(${i}, 1)"><i class="fas fa-arrow-down"></i></button>
                        <button class="ctrl-btn btn-del" onclick="deleteItem(${i})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                manager.appendChild(div);
            });
        }

        function addItem() {
            const qIn = document.getElementById('qInput');
            const aIn = document.getElementById('aInput');
            
            if(!qIn.value.trim()) { qIn.classList.add('error'); return; }
            if(!aIn.value.trim()) { aIn.classList.add('error'); return; }

            items.push({ q: qIn.value.trim(), a: aIn.value.trim() });
            qIn.value = ''; aIn.value = ''; qIn.focus();
            renderPages();
        }

        function deleteItem(i) { items.splice(i, 1); renderPages(); }

        function moveItem(i, dir) {
            if (i + dir >= 0 && i + dir < items.length) {
                [items[i], items[i + dir]] = [items[i + dir], items[i]];
                renderPages();
            }
        }

        // --- DOWNLOAD PDF (Fixes "Print != Preview") ---
        function downloadPDF() {
            const btn = document.querySelector('.btn-pdf');
            const container = document.getElementById('pdfPreviewContainer');
            
            const rand = Math.random().toString(36).substring(2, 7);
            const subject = document.getElementById('subjectInput').value.replace(/[^a-z0-9]/gi, '_') || 'Notes';
            const filename = `${subject}_${rand}.pdf`;

            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generating...`;

            // CLONE STRATEGY: Clone the container to manipulate it safely
            const clone = container.cloneNode(true);
            
            // Force strict styling on clone for PDF
            clone.style.transform = 'none'; // Remove any scale
            clone.style.gap = '0'; // Remove gaps between pages
            clone.style.margin = '0'; 
            clone.style.width = '210mm'; // Force A4 width
            
            // Create a temporary wrapper to hold the clone off-screen
            const tempWrapper = document.createElement('div');
            tempWrapper.style.position = 'absolute';
            tempWrapper.style.left = '-9999px';
            tempWrapper.style.top = '0';
            tempWrapper.appendChild(clone);
            document.body.appendChild(tempWrapper);

            // Configure html2pdf
            const opt = {
                margin: 0,
                filename: filename,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2, useCORS: true, scrollY: 0, windowWidth: 800 }, // Fixes mobile capture
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(clone).save().then(() => {
                document.body.removeChild(tempWrapper); // Clean up
                btn.innerHTML = `<i class="fas fa-file-pdf"></i> Download PDF`;
            });
        }

        // --- DOWNLOAD IMAGES (ZIP) ---
        async function downloadImagesZip() {
            const btn = document.querySelector('.btn-img');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Zipping...`;

            const pages = document.querySelectorAll('.a4-page');
            const zip = new JSZip();
            const rand = Math.random().toString(36).substring(2, 7);
            const subject = document.getElementById('subjectInput').value.replace(/[^a-z0-9]/gi, '_') || 'Notes';

            // Temporarily remove scale from the live view for capture
            const scaleBox = document.querySelector('.scale-box');
            const oldTransform = scaleBox.style.transform;
            scaleBox.style.transform = 'none';

            for (let i = 0; i < pages.length; i++) {
                const canvas = await html2canvas(pages[i], { scale: 2, useCORS: true });
                const data = canvas.toDataURL('image/png').split(',')[1];
                zip.file(`${subject}_Page-${i + 1}.png`, data, { base64: true });
            }

            // Restore scale
            scaleBox.style.transform = oldTransform;

            zip.generateAsync({ type: 'blob' }).then(function (content) {
                saveAs(content, `${subject}_${rand}.zip`);
                btn.innerHTML = `<i class="fas fa-images"></i> Download Images`;
            });
        }

        renderPages();
    </script>
</body>
</html>
