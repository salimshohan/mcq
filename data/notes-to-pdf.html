<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes Generator | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-soft: rgba(79, 70, 229, 0.1);
            --text-main: #111827;
            --border-light: #e5e7eb;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: sticky; top: 90px; height: fit-content;
        }

        .section-title { 
            font-size: 18px; font-weight: 700; color: var(--primary); 
            margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px; 
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 5px; }
        
        .form-control {
            width: 100%; background: #ffffff; border: 1px solid #d1d5db; color: #111827;
            padding: 12px; border-radius: 8px; font-size: 14px; transition: 0.2s; font-family: inherit;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        
        /* Error State */
        .form-control.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
            animation: shake 0.3s;
        }
        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); }
        }

        /* Buttons */
        .btn-add {
            width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none;
            background: #e0e7ff; color: var(--primary); font-weight: 700; cursor: pointer;
            border: 1px dashed var(--primary); transition: 0.2s;
        }
        .btn-add:hover { background: #c7d2fe; }

        .action-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-dl {
            flex: 1; padding: 14px; border-radius: 8px; border: none;
            color: white; font-weight: 600; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .btn-pdf { background: #ef4444; }
        .btn-img { background: #111827; }
        .btn-dl:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Items Manager */
        .items-manager { 
            margin-top: 20px; max-height: 200px; overflow-y: auto; 
            border: 1px solid #eee; border-radius: 8px; 
        }
        .manage-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; border-bottom: 1px solid #f3f4f6; 
            font-size: 12px; background: #fff;
        }
        .del-btn { color: #ef4444; cursor: pointer; padding: 4px; }

        /* --- PREVIEW WRAPPER --- */
        .preview-wrapper {
            flex: 1.5; display: flex; justify-content: center;
            background: #e5e7eb; padding: 20px; border-radius: 12px;
            overflow: auto;
        }

        /* --- A4 PDF PAGE DESIGN --- */
        .a4-page {
            width: 210mm; min-height: 297mm;
            background: white; padding: 15mm;
            position: relative; overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
            color: black;
        }

        /* Watermark (Middle, 45deg) */
        .watermark {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 50px; font-weight: 900; color: rgba(0,0,0,0.06);
            white-space: nowrap; pointer-events: none; z-index: 0;
            font-family: sans-serif; text-transform: uppercase;
        }

        /* PDF Header (Like 25410.jpg) */
        .pdf-header {
            text-align: center; margin-bottom: 20px;
            position: relative; z-index: 2;
        }
        .brand-top { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #000; }
        .main-subject { 
            border: 2px solid #000; display: inline-block; padding: 5px 30px; 
            font-size: 20px; font-weight: 800; margin: 5px 0; color: #000;
        }
        .sub-topic { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 5px; }
        .dotted-line { 
            border-bottom: 2px dotted #999; width: 100%; margin-top: 5px; 
        }
        .date-line { font-size: 12px; text-align: right; margin-top: 2px; color: #555; }

        /* PDF Content Body */
        .pdf-body {
            flex: 1; display: flex; flex-direction: column; gap: 12px;
            position: relative; z-index: 2; padding-top: 10px;
        }
        .note-row {
            display: flex; align-items: flex-start; gap: 10px;
            font-size: 15px; line-height: 1.5;
        }
        .note-icon { color: #16a34a; font-size: 16px; margin-top: 3px; flex-shrink: 0; } /* Green Check */
        .note-content { flex: 1; }
        .q-text { font-weight: 600; color: #000; margin-right: 5px; }
        .a-text { font-weight: 700; color: #dc2626; } /* Red Answer */

        /* PDF Footer (Like 25410.jpg) */
        .pdf-footer {
            margin-top: auto; padding-top: 5px;
            border-top: 2px dotted #999;
            text-align: center; font-size: 11px; font-weight: 700; color: #000;
            position: relative; z-index: 2;
        }

        /* Mobile Scale */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-box { width: 100%; position: relative; top: 0; }
            .preview-wrapper { overflow-x: auto; justify-content: flex-start; }
            .a4-page { transform: scale(0.6); transform-origin: top left; margin-bottom: -120%; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script src="../js/header.js"></script>

    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">Page Setup</div>
            
            <div class="input-group">
                <label>Subject / Box Title</label>
                <input id="subjectInput" class="form-control" value="GK Recent Affairs" oninput="updatePreview()">
            </div>
            
            <div class="input-group">
                <label>Topic / Sub Title</label>
                <input id="topicInput" class="form-control" value="International & National" oninput="updatePreview()">
            </div>

            <div class="input-group">
                <label>Date</label>
                <input type="text" id="dateInput" class="form-control" oninput="updatePreview()">
            </div>

            <div class="section-title" style="margin-top: 20px;">Add Q&A</div>
            
            <div class="input-group">
                <label>Question</label>
                <input id="qInput" class="form-control" placeholder="e.g. বাংলাদেশের বর্তমান প্রধানমন্ত্রী কে?" oninput="clearError(this)">
            </div>
            
            <div class="input-group">
                <label>Answer (Red Highlight)</label>
                <input id="aInput" class="form-control" placeholder="e.g. ড. মুহাম্মদ ইউনূস" oninput="clearError(this)">
            </div>

            <button class="btn-add" onclick="addItem()">
                <i class="fas fa-plus"></i> Add to List
            </button>

            <div class="items-manager" id="itemsManager">
                <div style="padding:10px; color:#999; text-align:center; font-size:12px;">No items added.</div>
            </div>

            <div class="action-btns">
                <button class="btn-dl btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
                <button class="btn-dl btn-img" onclick="downloadImage()"><i class="fas fa-image"></i> Download Image</button>
            </div>
        </div>

        <div class="preview-wrapper">
            <div class="a4-page" id="pdfContent">
                
                <div class="watermark">Interactive Learning</div>

                <div class="pdf-header">
                    <div class="brand-top">INTERACTIVE LEARNING</div>
                    <div class="main-subject" id="pSubject">GK Recent Affairs</div>
                    <div class="sub-topic" id="pTopic">International & National</div>
                    <div class="date-line" id="pDate">Date: 24 Jan 2026</div>
                    <div class="dotted-line"></div>
                </div>

                <div class="pdf-body" id="notesList">
                    </div>

                <div class="pdf-footer">
                    Interactive Learning • BCS, Job & Admission Preparation
                </div>
            </div>
        </div>

    </div>

    <script>
        // Default Date
        const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('dateInput').value = "Update: " + today;
        
        let items = [
            { q: "সম্প্রতি B ক্যাটাগরি হতে A ক্যাটাগরিতে উন্নীত হয়েছে কোন জেলা?", a: "সাতক্ষীরা" },
            { q: "বর্তমানে দেশে A ক্যাটাগরির জেলা কয়টি?", a: "২৭টি" }
        ];

        function updatePreview() {
            document.getElementById('pSubject').innerText = document.getElementById('subjectInput').value;
            document.getElementById('pTopic').innerText = document.getElementById('topicInput').value;
            document.getElementById('pDate').innerText = document.getElementById('dateInput').value;
            renderList();
        }

        function clearError(input) {
            input.classList.remove('error');
        }

        function addItem() {
            const qInput = document.getElementById('qInput');
            const aInput = document.getElementById('aInput');
            const q = qInput.value.trim();
            const a = aInput.value.trim();
            
            let isValid = true;

            if(!q) {
                qInput.classList.add('error');
                isValid = false;
            }
            if(!a) {
                aInput.classList.add('error');
                isValid = false;
            }

            if(isValid) {
                items.push({ q, a });
                qInput.value = '';
                aInput.value = '';
                qInput.focus();
                renderList();
            }
        }

        function deleteItem(index) {
            items.splice(index, 1);
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('notesList');
            const managerEl = document.getElementById('itemsManager');
            
            listEl.innerHTML = '';
            managerEl.innerHTML = '';

            if(items.length === 0) {
                managerEl.innerHTML = '<div style="padding:10px; color:#999; text-align:center; font-size:12px;">No items added.</div>';
            }

            items.forEach((item, index) => {
                // PDF Preview Item
                const row = document.createElement('div');
                row.className = 'note-row';
                row.innerHTML = `
                    <i class="fas fa-check note-icon"></i>
                    <div class="note-content">
                        <span class="q-text">${item.q}</span><br>
                        <span class="a-text">${item.a}</span>
                    </div>
                `;
                listEl.appendChild(row);

                // Manager Item
                const mgrRow = document.createElement('div');
                mgrRow.className = 'manage-item';
                mgrRow.innerHTML = `
                    <div style="width:90%">
                        <strong>${index + 1}.</strong> ${item.q.substring(0, 25)}...
                    </div>
                    <i class="fas fa-trash del-btn" onclick="deleteItem(${index})"></i>
                `;
                managerEl.appendChild(mgrRow);
            });
        }

        // --- DOWNLOAD PDF ---
        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const btn = document.querySelector('.btn-pdf');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generating...`;

            // Clone to remove scale transform for cleaner PDF
            const clone = element.cloneNode(true);
            clone.style.transform = 'none';
            clone.style.margin = '0';
            
            const opt = {
                margin: 0,
                filename: 'Notes.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = `<i class="fas fa-file-pdf"></i> Download PDF`;
            });
        }

        // --- DOWNLOAD IMAGE ---
        function downloadImage() {
            const element = document.getElementById('pdfContent');
            const btn = document.querySelector('.btn-img');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;

            html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Notes_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = `<i class="fas fa-image"></i> Download Image`;
            });
        }

        // Init
        updatePreview();
    </script>
</body>
</html>
