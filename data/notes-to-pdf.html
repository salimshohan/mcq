<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes Generator | Interactive Learning</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg-body: #f3f4f6;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --text-main: #111827;
            --border-light: #e5e7eb;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- EDITOR BOX --- */
        .editor-box {
            flex: 1; min-width: 350px; max-width: 450px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-light); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: sticky; top: 90px; height: fit-content;
        }

        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 5px; }
        
        .form-control {
            width: 100%; background: #ffffff; border: 1px solid #d1d5db; color: #111827;
            padding: 12px; border-radius: 8px; font-size: 15px; transition: 0.2s; font-family: inherit;
        }
        /* Bigger Textarea */
        textarea.form-control { min-height: 100px; resize: vertical; }
        
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .form-control.error { border-color: var(--error); animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        .btn-add {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: none;
            background: #e0e7ff; color: var(--primary); font-weight: 700; cursor: pointer;
            border: 1px dashed var(--primary); transition: 0.2s; font-size: 14px;
        }
        .btn-add:hover { background: #c7d2fe; }

        .action-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-dl {
            flex: 1; padding: 14px; border-radius: 8px; border: none;
            color: white; font-weight: 600; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .btn-pdf { background: #ef4444; }
        .btn-img { background: #111827; }
        .btn-dl:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Items Manager */
        .items-manager { margin-top: 20px; max-height: 250px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        .manage-item { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px; border-bottom: 1px solid #f3f4f6; font-size: 13px; background: #fff; gap: 5px;
        }
        .item-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .ctrl-btn { padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; color: white; border: none; }
        .btn-up, .btn-down { background: #3b82f6; }
        .btn-del { background: #ef4444; }

        /* --- PREVIEW WRAPPER --- */
        .preview-wrapper {
            flex: 1.5; display: flex; flex-direction: column; align-items: center;
            background: #52525b; padding: 30px; border-radius: 12px;
            overflow: auto; max-height: 90vh; gap: 30px;
        }

        /* --- A4 PAGE DESIGN --- */
        .a4-page {
            width: 210mm; height: 297mm; /* Standard A4 */
            background: white; padding: 10mm 15mm;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            color: black; flex-shrink: 0;
        }

        /* Watermark */
        .watermark {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 55px; font-weight: 900; color: rgba(0,0,0,0.05);
            white-space: nowrap; pointer-events: none; z-index: 0;
            font-family: sans-serif; text-transform: uppercase; letter-spacing: 5px;
        }

        /* Header Styles */
        .pdf-header { text-align: center; margin-bottom: 10px; position: relative; z-index: 2; flex-shrink: 0; }
        
        .brand-top { 
            font-size: 14px; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 2px; color: #000; margin-bottom: 5px; 
        }
        
        /* First Page Full Header */
        .main-subject { 
            border: 2px solid #000; display: inline-block; padding: 5px 35px; 
            font-size: 24px; font-weight: 800; margin: 5px 0; color: #000; line-height: 1.2;
        }
        .sub-topic { font-size: 16px; font-weight: 700; color: #333; margin-top: 2px; }
        .date-line { font-size: 13px; text-align: right; margin-top: 5px; color: #444; font-weight: 600; }
        
        /* Minimal Header for Page 2+ */
        .minimal-header {
            border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px;
        }

        .dotted-line { border-bottom: 2px dotted #aaa; width: 100%; margin-top: 8px; }

        /* Body Content (Tighter Spacing) */
        .pdf-body { flex: 1; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 6px; overflow: hidden; padding-top: 10px; }
        
        .note-row { display: flex; align-items: flex-start; gap: 8px; font-size: 15px; line-height: 1.3; break-inside: avoid; }
        .note-icon { color: #16a34a; font-size: 16px; margin-top: 2px; flex-shrink: 0; }
        .q-text { font-weight: 600; color: #000; }
        .a-text { font-weight: 700; color: #16a34a; /* Green Answer */ }

        /* Footer Section */
        .footer-wrapper {
            margin-top: auto; padding-top: 10px;
            position: relative; z-index: 2; flex-shrink: 0;
        }
        
        .promo-text {
            text-align: center; color: #ea580c; 
            font-size: 18px; /* Bigger Font */
            font-weight: 800; margin-bottom: 8px;
        }

        .pdf-footer {
            border-top: 2px dotted #aaa; padding-top: 8px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: 700; color: #000;
        }

        /* Mobile Scale */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-box { width: 100%; position: relative; top: 0; }
            .preview-wrapper { width: 100%; padding: 10px; }
            /* Preview Scale for Mobile View Only */
            .a4-page { transform: scale(0.44); transform-origin: top center; margin-bottom: -160mm; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script src="../js/header.js"></script>

    <div class="container">
        
        <div class="editor-box">
            <div class="section-title">Page Setup</div>
            <div class="input-group">
                <label>বিষয় (Subject)</label>
                <input id="subjectInput" class="form-control" value="সাধারণ জ্ঞান (সাম্প্রতিক)" oninput="renderPages()">
            </div>
            <div class="input-group">
                <label>টপিক (Topic)</label>
                <input id="topicInput" class="form-control" value="বাংলাদেশ ও আন্তর্জাতিক" oninput="renderPages()">
            </div>
            <div class="input-group">
                <label>তারিখ (Date)</label>
                <input type="text" id="dateInput" class="form-control" oninput="renderPages()">
            </div>

            <div class="section-title" style="margin-top: 20px;">Add Q&A</div>
            <div class="input-group">
                <label>প্রশ্ন (Question)</label>
                <textarea id="qInput" class="form-control" placeholder="এখানে প্রশ্ন লিখুন..." oninput="this.classList.remove('error')"></textarea>
            </div>
            <div class="input-group">
                <label>উত্তর (Green Highlight)</label>
                <textarea id="aInput" class="form-control" placeholder="এখানে উত্তর লিখুন..." oninput="this.classList.remove('error')"></textarea>
            </div>
            <button class="btn-add" onclick="addItem()"><i class="fas fa-plus"></i> Add to List</button>

            <div class="items-manager" id="itemsManager">
                <div style="padding:10px; color:#999; text-align:center; font-size:12px;">No items added.</div>
            </div>

            <div class="action-btns">
                <button class="btn-dl btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
                <button class="btn-dl btn-img" onclick="downloadImagesZip()"><i class="fas fa-images"></i> Images (ZIP)</button>
            </div>
        </div>

        <div class="preview-wrapper" id="previewContainer">
            </div>

    </div>

    <script>
        // Init Date
        const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('dateInput').value = "আপডেট: " + today;

        let items = [
            { q: "সম্প্রতি B ক্যাটাগরি হতে A ক্যাটাগরিতে উন্নীত হয়েছে কোন জেলা?", a: "সাতক্ষীরা" },
            { q: "বর্তমানে দেশে A ক্যাটাগরির জেলা কয়টি?", a: "২৭টি" },
            { q: "বর্তমানে দেশে B ক্যাটাগরির জেলা কয়টি?", a: "২৬টি" }
        ];

        // --- CORE RENDER FUNCTION ---
        function renderPages() {
            const container = document.getElementById('previewContainer');
            container.innerHTML = ''; 

            const subject = document.getElementById('subjectInput').value;
            const topic = document.getElementById('topicInput').value;
            const date = document.getElementById('dateInput').value;

            // Page Creator Helper
            function createPage(pageNum) {
                const page = document.createElement('div');
                page.className = 'a4-page';
                page.id = `page-${pageNum}`;
                
                // Header Logic
                let headerHTML = '';
                if(pageNum === 1) {
                    headerHTML = `
                        <div class="pdf-header">
                            <div class="brand-top">INTERACTIVE LEARNING</div>
                            <div class="subject-box">${subject}</div>
                            <div class="sub-topic">${topic}</div>
                            <div class="date-line">${date}</div>
                            <div class="dotted-line"></div>
                        </div>`;
                } else {
                    headerHTML = `
                        <div class="pdf-header minimal-header">
                            <div class="brand-top">INTERACTIVE LEARNING</div>
                        </div>`;
                }

                page.innerHTML = `
                    <div class="watermark">INTERACTIVE LEARNING</div>
                    ${headerHTML}
                    <div class="pdf-body"></div>
                    
                    <div class="footer-wrapper">
                        <div class="promo-text">সেরা প্রস্তুতিতে এক ধাপ এগিয়ে থাকতে আজই আমাদের ফ্রি এক্সাম ব্যাচে যুক্ত হোন।</div>
                        <div class="pdf-footer">
                            <span>Interactive Learning</span>
                            <span>Page ${pageNum}</span>
                        </div>
                    </div>
                `;
                return page;
            }

            // Initial Page
            let pageNum = 1;
            let currentPage = createPage(pageNum);
            let currentBody = currentPage.querySelector('.pdf-body');
            container.appendChild(currentPage);

            // Item Loop
            items.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'note-row';
                row.innerHTML = `
                    <i class="fas fa-check note-icon"></i>
                    <div class="note-content">
                        <div class="q-text">${item.q}</div>
                        <div class="a-text">- ${item.a}</div>
                    </div>
                `;
                
                currentBody.appendChild(row);

                // Calculation for overflow (Approx 900-950px usable height depending on header)
                const usableHeight = pageNum === 1 ? 880 : 960;

                if (currentBody.scrollHeight > usableHeight) {
                    currentBody.removeChild(row); // Remove overflowing item
                    
                    // Create New Page
                    pageNum++;
                    currentPage = createPage(pageNum);
                    currentBody = currentPage.querySelector('.pdf-body');
                    container.appendChild(currentPage);
                    
                    // Add item to new page
                    currentBody.appendChild(row);
                }
            });

            renderManager();
        }

        function renderManager() {
            const manager = document.getElementById('itemsManager');
            manager.innerHTML = '';
            if(items.length === 0) {
                manager.innerHTML = '<div style="padding:10px; color:#999; text-align:center; font-size:12px;">No items added.</div>';
                return;
            }
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'manage-item';
                div.innerHTML = `
                    <div class="item-text"><b>${i+1}.</b> ${item.q}</div>
                    <div style="display:flex; gap:3px;">
                        <button class="ctrl-btn btn-up" onclick="moveItem(${i}, -1)"><i class="fas fa-arrow-up"></i></button>
                        <button class="ctrl-btn btn-down" onclick="moveItem(${i}, 1)"><i class="fas fa-arrow-down"></i></button>
                        <button class="ctrl-btn btn-del" onclick="deleteItem(${i})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                manager.appendChild(div);
            });
        }

        function addItem() {
            const qIn = document.getElementById('qInput');
            const aIn = document.getElementById('aInput');
            
            if(!qIn.value.trim()) { qIn.classList.add('error'); return; }
            if(!aIn.value.trim()) { aIn.classList.add('error'); return; }

            items.push({ q: qIn.value.trim(), a: aIn.value.trim() });
            qIn.value = ''; aIn.value = ''; qIn.focus();
            renderPages();
        }

        function deleteItem(i) { items.splice(i, 1); renderPages(); }

        function moveItem(i, dir) {
            if (i + dir >= 0 && i + dir < items.length) {
                [items[i], items[i + dir]] = [items[i + dir], items[i]];
                renderPages();
            }
        }

        // --- DOWNLOAD PDF (Correct Multipage) ---
        function downloadPDF() {
            const btn = document.querySelector('.btn-pdf');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generating...`;

            const element = document.getElementById('previewContainer');
            
            // Remove gap/padding for seamless pdf gen
            const originalStyle = element.getAttribute('style');
            element.style.gap = '0';
            element.style.padding = '0';
            element.style.background = 'white';

            // Remove scale if on mobile to ensure full resolution capture
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach(p => {
                p.style.transform = 'none';
                p.style.marginBottom = '0';
            });

            const opt = {
                margin: 0,
                filename: 'Notes.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = `<i class="fas fa-file-pdf"></i> Download PDF`;
                // Restore styles
                element.setAttribute('style', originalStyle);
                renderPages(); // Re-render to restore scale/margins
            });
        }

        // --- DOWNLOAD IMAGES (ZIP) ---
        async function downloadImagesZip() {
            const btn = document.querySelector('.btn-img');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Zipping...`;

            const pages = document.querySelectorAll('.a4-page');
            const zip = new JSZip();

            // Temporarily remove scale for clear capture
            pages.forEach(p => p.style.transform = 'none');

            for (let i = 0; i < pages.length; i++) {
                const canvas = await html2canvas(pages[i], { scale: 2, useCORS: true });
                const data = canvas.toDataURL('image/png').split(',')[1];
                zip.file(`Page_${i + 1}.png`, data, { base64: true });
            }

            zip.generateAsync({ type: 'blob' }).then(function (content) {
                saveAs(content, `Notes_Images_${Date.now()}.zip`);
                btn.innerHTML = `<i class="fas fa-images"></i> Images (ZIP)`;
                renderPages(); // Restore view
            });
        }

        // Init
        renderPages();
    </script>
</body>
</html>
