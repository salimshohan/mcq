<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short Note Generator</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      height: 90px;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      resize: none;
      outline: none;
    }

    select, button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    button {
      background: #6366f1;
      color: white;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .output {
      margin-top: 20px;
      background: #020617;
      border-radius: 12px;
      padding: 15px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-line;
    }

    .copy {
      margin-top: 10px;
      background: #22c55e;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📘 Short Note Generator</h1>
    <p>Enter a topic and get exam-friendly short notes</p>

    <textarea id="topic" placeholder="Enter topic (e.g. Artificial Intelligence)"></textarea>

    <select id="lang">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
    </select>

    <button onclick="generateNote()">Generate Note</button>

    <div id="result" class="output" style="display:none;"></div>
    <button class="copy" id="copyBtn" style="display:none;" onclick="copyText()">Copy</button>
  </div>

  <script>
    function generateNote() {
      const topic = document.getElementById("topic").value.trim();
      const lang = document.getElementById("lang").value;
      const result = document.getElementById("result");
      const copyBtn = document.getElementById("copyBtn");

      if (!topic) {
        alert("Please enter a topic");
        return;
      }

      let note = "";

      if (lang === "en") {
        note = `${topic} is an important concept in modern education.

It refers to the basic idea, scope, and application of ${topic.toLowerCase()}.

This topic plays a significant role in academic and practical fields.

Understanding ${topic} helps students perform better in exams and real-life situations.

In short, ${topic} is essential for conceptual clarity and knowledge development.`;
      } else {
        note = `${topic} একটি গুরুত্বপূর্ণ বিষয়।

এটি ${topic}-এর মূল ধারণা, গুরুত্ব ও প্রয়োগ বোঝায়।

শিক্ষাক্ষেত্র ও বাস্তব জীবনে ${topic} এর ভূমিকা অত্যন্ত গুরুত্বপূর্ণ।

এই বিষয়টি ভালোভাবে বুঝলে পরীক্ষায় ভালো করা সহজ হয়।

সংক্ষেপে, ${topic} জ্ঞান বৃদ্ধিতে সহায়ক।`;
      }

      result.style.display = "block";
      copyBtn.style.display = "block";
      result.innerText = note;
    }

    function copyText() {
      const text = document.getElementById("result").innerText;
      navigator.clipboard.writeText(text);
      alert("Copied!");
    }
  </script>
</body>
</html>
