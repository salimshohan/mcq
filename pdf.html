<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Question Maker | Interactive Learning</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER (FIXED NAVBAR) --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 9999;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand-logo {
            display: flex; align-items: center;
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .logo-img { height: 35px; margin-right: 10px; border-radius: 50%; }

        /* --- CONTAINER --- */
        .container {
            margin-top: 100px; /* Space for fixed header */
            width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- LEFT: EDITOR SECTION --- */
        .editor-section {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); padding: 25px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            height: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

        #topicSummary {
            background: rgba(99, 102, 241, 0.15);
            padding: 12px; border-radius: 8px;
            margin-bottom: 20px; font-size: 13px; color: #e0e7ff;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* INPUT DESIGN */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control {
            width: 100%; 
            background: var(--input-bg); 
            border: 1px solid #334155; 
            color: #f1f5f9; padding: 12px 14px; font-size: 14px;
            transition: all 0.3s ease;
            border-radius: 8px;
        }
        .form-control:focus {
            outline: none;
            background: #0f172a;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 80px; }

        /* CARDS */
        .question-card {
            background: rgba(30, 41, 59, 0.5); 
            padding: 20px; border-radius: 12px;
            margin-bottom: 20px; border: 1px solid #334155;
            position: relative;
        }
        
        .header-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(15, 23, 42, 0.5));
            padding: 15px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid var(--primary);
            position: relative;
        }

        .break-card {
            background: rgba(239, 68, 68, 0.15);
            padding: 12px; border-radius: 8px;
            margin-bottom: 20px; border: 1px dashed #ef4444;
            color: #ef4444; font-weight: 700;
            text-align: center; display: flex; justify-content: space-between; align-items: center;
        }

        .q-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #cbd5e1; margin-bottom: 12px; font-weight: 700; }
        
        .control-icons { display: flex; gap: 8px; }
        .control-icon { 
            cursor: pointer; padding: 6px; border-radius: 4px; transition: 0.2s; 
            background: rgba(255,255,255,0.05);
        }
        .control-icon:hover { background: rgba(255,255,255,0.15); color: white; }
        .fa-trash { color: #f87171; }
        .fa-arrow-up, .fa-arrow-down { color: var(--primary); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-add {
            flex: 1; min-width: 120px; padding: 12px; border: 1px solid var(--primary); background: rgba(99, 102, 241, 0.1);
            color: var(--text-main); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: 0.3s;
        }
        .btn-add:hover { background: var(--primary); color: white; }
        .btn-break { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-break:hover { background: #ef4444; color: white; }

        .btn-download {
            width: 100%; padding: 16px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #6366f1, #3b82f6); color: white;
            font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s;
        }
        .btn-download:hover { transform: translateY(-2px); }

        /* --- RIGHT: PREVIEW WRAPPER --- */
        .preview-wrapper {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #475569; 
            padding: 30px;
            border-radius: 20px;
            overflow: auto; 
            min-height: 600px;
            gap: 30px;
        }

        .scale-box {
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        /* --- REAL A4 PAPER STYLING --- */
        .pdf-page {
            width: 210mm;
            height: 297mm; /* Exact A4 Height */
            background: white;
            color: black !important;
            padding: 15mm;
            position: relative; /* For absolute positioning of line and watermark */
            box-shadow: 0 5px 30px rgba(0,0,0,0.5);
            overflow: hidden; 
            margin-bottom: 20px;
        }

        /* WATERMARK LAYER (Under Content) */
        .watermark-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 60px;
            font-weight: 900;
            color: rgba(0,0,0,0.08); /* Very light grey */
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            font-family: 'Courier New', monospace;
        }

        /* VERTICAL LINE (Absolute Position) */
        .vertical-line {
            position: absolute;
            left: 50%; top: 20mm; bottom: 20mm; /* Adjust top/bottom to match content area */
            width: 0.5pt; /* Hairline width */
            background-color: #999;
            z-index: 1;
        }

        /* HEADER */
        .pdf-header {
            text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; 
            position: relative; z-index: 2;
        }
        .brand-name-pdf {
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 5px; display: block; color: #333 !important;
        }
        .pdf-main-title {
            background: transparent;
            border: 2px solid #000;
            color: #000 !important;
            display: inline-block;
            padding: 5px 30px; font-size: 24px; font-weight: 800; margin-bottom: 8px;
        }
        .pdf-sub-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .pdf-meta { font-size: 13px; font-weight: 500; display: flex; justify-content: center; gap: 20px; }

        /* CONTENT COLUMNS */
        .pdf-content-area {
            column-count: 2;
            column-gap: 10mm;
            column-fill: auto; /* Fills left column completely before going right */
            height: 230mm; /* Approximate content height for A4 minus header/footer */
            position: relative;
            z-index: 2; /* Above watermark */
        }

        /* Subject Header */
        .section-header-pdf {
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 10px;
            margin-top: 15px;
            break-inside: avoid;
            background: transparent; 
            padding: 5px;
            display: block;
            border-bottom: 1px solid #333;
            width: 100%;
        }

        .mcq-item {
            margin-bottom: 12px;
            break-inside: avoid;
            font-size: 14px;
            line-height: 1.4;
            padding-right: 8px;
            background: transparent; /* Allows watermark to be seen */
            position: relative;
        }
        
        .q-text { font-weight: 700; margin-bottom: 5px; display: block;}
        
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; 
            font-size: 13px; margin-left: 15px; row-gap: 4px;
        }
        
        .ans-row {
            text-align: left;
            font-size: 13px; font-weight: 700; margin-top: 6px; margin-left: 15px; 
        }
        
        .exp-box {
            font-size: 12px; color: #333 !important; margin-top: 4px;
            font-style: italic; margin-left: 15px;
            border-top: 0.5px dotted #ccc; padding-top: 2px;
        }

        /* FOOTER */
        .pdf-footer {
            position: absolute; bottom: 10mm; left: 0; width: 100%;
            text-align: center; 
            background: transparent;
            padding: 5px; font-size: 11px; font-weight: 600;
            border-top: 1px solid #000;
            z-index: 2;
        }

        /* Mobile Scaling */
        @media (max-width: 900px) {
            .container { flex-direction: column; margin-top: 90px; }
            .editor-section { width: 100%; }
            .preview-wrapper { width: 100%; padding: 10px; }
            .scale-box { transform: scale(0.42); transform-origin: top center; margin-bottom: -150%; }
        }
        @media (min-width: 901px) {
            .scale-box { transform: scale(0.85); transform-origin: top center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" alt="Logo" class="logo-img">
            Interactive Learning
        </div>
        <div class="hamburger">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="container">
        <div class="editor-section">
            <div class="section-title">PDF Content</div>
            
            <div id="topicSummary">Add items to start building your PDF.</div>

            <div class="input-group">
                <label>Main Heading</label>
                <input id="headTitle" class="form-control" value="স্থানীয় সরকার বিভাগ" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Sub Heading</label>
                <input id="subTitle" class="form-control" value="পদ: উপ সহকারী প্রকৌশলী" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Date & Info</label>
                <input id="examDate" class="form-control" value="তারিখ: ২৩ জানুয়ারি, ২০২৬" oninput="updatePDF()">
            </div>

            <div id="itemsList"></div>

            <div class="btn-group">
                <button class="btn-add" onclick="addHeader()">+ Subject</button>
                <button class="btn-add" onclick="addQuestion()">+ Question</button>
                <button class="btn-add btn-break" onclick="addPageBreak()">+ Page Break</button>
            </div>
            
            <button class="btn-download" onclick="downloadPDF()">Download PDF</button>
        </div>

        <div class="preview-wrapper">
            <div class="scale-box" id="pdfPreviewContainer">
                </div>
        </div>
    </div>

    <datalist id="subjectOptions">
        <option value="Bangla"><option value="English"><option value="General Knowledge">
        <option value="Mathematics"><option value="ICT"><option value="Physics">
    </datalist>

    <script>
        let items = [];

        function init() {
            renderInputs();
            updatePDF();
        }

        // --- DATA ---
        function addHeader() { items.push({ id: Date.now(), type: 'header', title: '' }); renderInputs(); updatePDF(); }
        function addQuestion() { items.push({ id: Date.now(), type: 'question', q: "", a: "", b: "", c: "", d: "", ans: "", exp: "" }); renderInputs(); updatePDF(); }
        function addPageBreak() { items.push({ id: Date.now(), type: 'break' }); renderInputs(); updatePDF(); }
        
        function removeItem(index) { items.splice(index, 1); renderInputs(); updatePDF(); }
        function moveItem(index, dir) {
            if (dir === 'up' && index > 0) [items[index], items[index-1]] = [items[index-1], items[index]];
            else if (dir === 'down' && index < items.length-1) [items[index], items[index+1]] = [items[index+1], items[index]];
            renderInputs(); updatePDF();
        }
        function updateData(id, field, val) {
            const item = items.find(x => x.id === id);
            if(item) { item[field] = val; updatePDF(); updateSummary(); }
        }

        function updateSummary() {
            const summaryBox = document.getElementById('topicSummary');
            let counts = {}, total = 0, currentHeader = 'General';
            items.forEach(item => {
                if(item.type === 'header') currentHeader = item.title || 'Untitled';
                else if(item.type === 'question') {
                    if(!counts[currentHeader]) counts[currentHeader] = 0;
                    counts[currentHeader]++; total++;
                }
            });
            if(total===0) return;
            let html = `<b>Total: ${total}</b> | `;
            for(let [k,v] of Object.entries(counts)) if(v>0) html += `${k}: ${v} &nbsp; `;
            summaryBox.innerHTML = html;
        }

        // --- EDITOR UI ---
        function renderInputs() {
            const list = document.getElementById('itemsList');
            list.innerHTML = '';
            let qCounter = 0;

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = item.type === 'header' ? 'header-card' : item.type === 'break' ? 'break-card' : 'question-card';
                
                let inner = `<div class="q-header">`;
                if(item.type === 'header') inner += `<span>SUBJECT</span>`;
                else if(item.type === 'break') inner += `<span>PAGE BREAK</span>`;
                else { qCounter++; inner += `<span>Q ${qCounter}</span>`; }
                
                inner += `<div class="control-icons">
                    <i class="fas fa-arrow-up control-icon" onclick="moveItem(${index}, 'up')"></i>
                    <i class="fas fa-arrow-down control-icon" onclick="moveItem(${index}, 'down')"></i>
                    <i class="fas fa-trash control-icon" onclick="removeItem(${index})"></i>
                </div></div>`;

                if(item.type === 'header') {
                    inner += `<input class="form-control" list="subjectOptions" placeholder="Subject Name" value="${item.title}" oninput="updateData(${item.id}, 'title', this.value)">`;
                } else if(item.type === 'question') {
                    inner += `
                        <input class="form-control" style="margin-bottom:10px;" placeholder="Question" value="${item.q}" oninput="updateData(${item.id}, 'q', this.value)">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                            <input class="form-control" placeholder="ক" value="${item.a}" oninput="updateData(${item.id}, 'a', this.value)">
                            <input class="form-control" placeholder="খ" value="${item.b}" oninput="updateData(${item.id}, 'b', this.value)">
                            <input class="form-control" placeholder="গ" value="${item.c}" oninput="updateData(${item.id}, 'c', this.value)">
                            <input class="form-control" placeholder="ঘ" value="${item.d}" oninput="updateData(${item.id}, 'd', this.value)">
                        </div>
                        <select class="form-control" style="margin-bottom:10px;" onchange="updateData(${item.id}, 'ans', this.value)">
                            <option value="">Correct Answer...</option>
                            <option value="ক" ${item.ans==='ক'?'selected':''}>ক</option>
                            <option value="খ" ${item.ans==='খ'?'selected':''}>খ</option>
                            <option value="গ" ${item.ans==='গ'?'selected':''}>গ</option>
                            <option value="ঘ" ${item.ans==='ঘ'?'selected':''}>ঘ</option>
                            <option value="ব্যাখ্যা দেখুন" ${item.ans==='ব্যাখ্যা দেখুন'?'selected':''}>ব্যাখ্যা দেখুন</option>
                        </select>
                        <textarea class="form-control" placeholder="Explanation" oninput="updateData(${item.id}, 'exp', this.value)">${item.exp}</textarea>
                    `;
                }
                div.innerHTML = inner;
                list.appendChild(div);
            });
        }

        // --- PDF GENERATION LOGIC ---
        function updatePDF() {
            const container = document.getElementById('pdfPreviewContainer');
            container.innerHTML = '';

            const headTitle = document.getElementById('headTitle').value;
            const subTitle = document.getElementById('subTitle').value;
            const examDate = document.getElementById('examDate').value;
            const banglaNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => n.toString().split('').map(x => banglaNums[x] || x).join('');

            // Helper to Create New Page
            function createNewPage(isFirst) {
                const page = document.createElement('div');
                page.className = 'pdf-page';
                
                // Add Vertical Line
                const vLine = document.createElement('div');
                vLine.className = 'vertical-line';
                page.appendChild(vLine);

                // Add Watermark
                const watermark = document.createElement('div');
                watermark.className = 'watermark-layer';
                watermark.innerText = 'Interactive Learning';
                page.appendChild(watermark);

                // Header (Only first page)
                if(isFirst) {
                    page.innerHTML += `
                        <div class="pdf-header">
                            <div class="brand-name-pdf">Interactive Learning</div>
                            <div class="pdf-main-title">${headTitle}</div>
                            <div class="pdf-sub-title">${subTitle}</div>
                            <div class="pdf-meta">${examDate}</div>
                        </div>`;
                } else {
                    // Spacer for subsequent pages so content doesn't hit top edge
                    const spacer = document.createElement('div');
                    spacer.style.height = '20px';
                    page.appendChild(spacer);
                }

                // Content Container (Columns)
                const contentArea = document.createElement('div');
                contentArea.className = 'pdf-content-area';
                page.appendChild(contentArea);

                // Footer
                page.innerHTML += `<div class="pdf-footer">Interactive Learning • BCS, Job & Admission Preparation</div>`;

                container.appendChild(page);
                return contentArea; // Return the content container, not the page
            }

            let currentContentArea = createNewPage(true);
            let qCount = 0;

            items.forEach((item) => {
                if (item.type === 'break') {
                    currentContentArea = createNewPage(false);
                    return;
                }

                const element = document.createElement('div');
                if (item.type === 'header') {
                    element.className = 'section-header-pdf';
                    element.innerText = item.title;
                } else {
                    qCount++;
                    element.className = 'mcq-item';
                    const expHTML = item.exp ? `<div class="exp-box"><b>ব্যাখ্যা:</b> ${item.exp}</div>` : '';
                    element.innerHTML = `
                        <span class="q-text">${toBn(qCount)}. ${item.q}</span>
                        <div class="options-grid">
                            <span>ক. ${item.a}</span><span>খ. ${item.b}</span>
                            <span>গ. ${item.c}</span><span>ঘ. ${item.d}</span>
                        </div>
                        <div class="ans-row">উত্তর: ${item.ans}</div>
                        ${expHTML}
                    `;
                }

                // Append to check height
                currentContentArea.appendChild(element);

                // Overflow Check: 
                // A4 Height ~ 1123px. Content Area Height fixed at ~870px (230mm).
                // Using scrollHeight > offsetHeight to detect overflow.
                if (currentContentArea.scrollHeight > currentContentArea.offsetHeight) {
                    currentContentArea.removeChild(element); // Undo add
                    currentContentArea = createNewPage(false); // Make new page
                    currentContentArea.appendChild(element); // Add to new page
                }
            });
        }

        function downloadPDF() {
            const element = document.getElementById('pdfPreviewContainer'); // Capture all pages
            const scaleBox = document.querySelector('.scale-box');
            
            const originalTransform = scaleBox.style.transform;
            const originalMargin = scaleBox.style.marginBottom;
            scaleBox.style.transform = 'none';
            scaleBox.style.margin = '0';

            // Select all pages
            const pages = document.querySelectorAll('.pdf-page');
            
            // Generate PDF options
            const opt = {
                margin:       0,
                filename:     'Question_Paper.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Loop through pages and add them to PDF
            // Note: simple .from(element) might merge them weirdly.
            // Best approach for multi-page div structure in html2pdf is simply passing the container
            // provided the pages align with A4 dimensions (which they do).
            
            html2pdf().set(opt).from(element).save().then(() => {
                scaleBox.style.transform = originalTransform;
                scaleBox.style.marginBottom = originalMargin;
            });
        }

        init();
    </script>
</body>
</html>
