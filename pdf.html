<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart PDF Question Maker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --primary: #6366f1;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-logo {
            display: flex; align-items: center;
            font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .logo-img { height: 30px; margin-right: 10px; border-radius: 50%; }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- LEFT: EDITOR --- */
        .editor-section {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            height: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 16px; font-weight: 700; color: #94a3b8; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        /* Page Count Badge */
        #pageCounter {
            background: rgba(99, 102, 241, 0.2); color: #a5b4fc;
            padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;
            margin-bottom: 15px; border: 1px solid rgba(99, 102, 241, 0.4);
            text-align: center;
        }

        /* NEW INPUT DESIGN (Modern Box) */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        
        .form-control {
            width: 100%; 
            background: #020617; 
            border: 1px solid #334155; 
            color: #f8fafc; padding: 12px; border-radius: 8px; font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 80px; }

        /* Cards */
        .card-base {
            background: #1e293b; padding: 15px; border-radius: 10px;
            margin-bottom: 15px; border: 1px solid #334155; position: relative;
        }
        .header-card { border-left: 4px solid var(--accent); background: linear-gradient(90deg, rgba(30,41,59,1) 0%, rgba(15,23,42,1) 100%); }
        .break-card { border: 1px dashed #ef4444; background: rgba(239, 68, 68, 0.05); color: #ef4444; text-align: center; font-weight: bold; }

        .q-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; margin-bottom: 10px; font-weight: 600; }
        
        .control-icons { display: flex; gap: 8px; }
        .control-icon { cursor: pointer; padding: 5px; border-radius: 4px; transition: 0.2s; background: rgba(255,255,255,0.05); }
        .control-icon:hover { background: rgba(255,255,255,0.1); color: white; }
        .fa-trash { color: #f87171; }

        /* Buttons */
        .btn-group { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-add {
            flex: 1; padding: 10px; border: 1px solid #475569; background: #1e293b;
            color: #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;
            transition: 0.2s; white-space: nowrap;
        }
        .btn-add:hover { background: #334155; border-color: #94a3b8; }
        .btn-break { color: #f87171; border-color: #7f1d1d; background: rgba(127, 29, 29, 0.2); }
        
        .btn-download {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: var(--primary); color: white;
            font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-download:hover { background: #4f46e5; }

        /* --- PREVIEW WRAPPER --- */
        .preview-wrapper {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #475569; 
            padding: 30px;
            border-radius: 16px;
            overflow: auto; 
            min-height: 600px;
            gap: 20px; /* Space between pages in preview */
        }

        .scale-box {
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        /* --- THE A4 PAGE (SMART PAGINATION) --- */
        .pdf-page {
            width: 210mm;
            height: 296mm; /* Fixed A4 Height */
            background: white;
            color: black !important;
            padding: 15mm;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px; /* Gap between pages in preview */
            
            /* Column Logic */
            column-count: 2;
            column-gap: 10mm;
            column-fill: auto; /* Ensures L->R flow on THIS page */
            
            /* Visuals */
            background-image: 
                /* Vertical Line */
                linear-gradient(to right, transparent 49.8%, #999 49.8%, #999 50.2%, transparent 50.2%),
                /* Watermark */
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><text x='50%' y='50%' font-size='40' fill='rgba(0,0,0,0.06)' font-weight='bold' font-family='Courier New' text-anchor='middle' dominant-baseline='middle' transform='rotate(-45, 200, 200)'>Interactive Learning</text></svg>");
            background-repeat: no-repeat, no-repeat;
            background-size: 100% 100%, 100% 100%;
            background-position: center, center;
            
            overflow: hidden; /* Hide overflow to detect breaks */
        }
        
        .pdf-page * { color: black !important; }

        /* Header (Only on Page 1) */
        .pdf-header {
            text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; 
            column-span: all; /* Spans across columns */
        }
        .brand-name-pdf {
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 5px; display: block; color: #333 !important;
        }
        .pdf-main-title {
            border: 2px solid #000; display: inline-block;
            padding: 5px 30px; font-size: 24px; font-weight: 800; margin-bottom: 8px;
        }
        .pdf-meta { font-size: 13px; font-weight: 500; display: flex; justify-content: center; gap: 20px; }

        /* Subject Header */
        .section-header-pdf {
            text-align: center; font-weight: 800; font-size: 16px;
            margin: 15px 0 10px 0;
            break-inside: avoid;
            background: white; /* Hides vertical line behind text */
            padding: 2px;
            border-bottom: 1px solid #333;
            display: block;
        }

        /* Question Item */
        .mcq-item {
            margin-bottom: 12px;
            break-inside: avoid;
            font-size: 14px;
            line-height: 1.4;
            padding-right: 8px;
            background: transparent;
            position: relative;
            /* White text shadow to separate text from vertical line if they overlap */
            text-shadow: 3px 0 0 #fff, -3px 0 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff; 
        }
        
        .q-text { font-weight: 700; margin-bottom: 4px; display: block;}
        
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; 
            font-size: 13px; margin-left: 15px; row-gap: 2px;
        }
        
        .ans-row {
            text-align: left; font-size: 12px; font-weight: 700; margin-top: 4px; margin-left: 15px; 
        }
        
        .exp-box {
            font-size: 12px; color: #333 !important; margin-top: 3px;
            font-style: italic; margin-left: 15px;
            border-top: 0.5px dotted #ccc; padding-top: 2px;
        }

        /* Footer */
        .pdf-footer {
            position: absolute; bottom: 10mm; left: 0; width: 100%;
            text-align: center; padding: 5px; font-size: 11px; font-weight: 600;
            border-top: 1px solid #000; background: white;
        }

        /* Mobile Scaling */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-section { width: 100%; }
            .preview-wrapper { width: 100%; padding: 10px; }
            .scale-box { transform: scale(0.42); transform-origin: top center; margin-bottom: -150%; }
        }
        @media (min-width: 901px) {
            .scale-box { transform: scale(0.85); transform-origin: top center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" alt="Logo" class="logo-img">
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">MCQ Card</a>
            <a href="notice.html">Notice Maker</a>
            <a href="pdf.html" style="color: var(--primary);">PDF Maker</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-section">
            <div class="section-title">PDF Content</div>
            
            <div id="pageCounter">Total Pages: 1</div>

            <div class="input-group">
                <label>Main Heading</label>
                <input id="headTitle" class="form-control" value="স্থানীয় সরকার বিভাগ" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Sub Heading</label>
                <input id="subTitle" class="form-control" value="পদ: উপ সহকারী প্রকৌশলী" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Date & Info</label>
                <input id="examDate" class="form-control" value="তারিখ: ২৩ জানুয়ারি, ২০২৬" oninput="updatePDF()">
            </div>

            <div id="itemsList"></div>

            <div class="btn-group">
                <button class="btn-add" onclick="addHeader()">+ Subject</button>
                <button class="btn-add" onclick="addQuestion()">+ Question</button>
                <button class="btn-add btn-break" onclick="addPageBreak()">+ Page Break</button>
            </div>
            
            <button class="btn-download" onclick="downloadPDF()">Download PDF</button>
        </div>

        <div class="preview-wrapper">
            <div class="scale-box" id="pdfPreviewContainer">
                </div>
        </div>
    </div>

    <datalist id="subjectOptions">
        <option value="Bangla"><option value="English"><option value="General Knowledge">
        <option value="Mathematics"><option value="ICT"><option value="Physics">
    </datalist>

    <script>
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
        }

        let items = [];

        function init() {
            renderInputs();
            updatePDF();
        }

        // --- DATA MANAGEMENT ---
        function addHeader() { items.push({ id: Date.now(), type: 'header', title: '' }); renderInputs(); updatePDF(); }
        function addQuestion() { items.push({ id: Date.now(), type: 'question', q: "", a: "", b: "", c: "", d: "", ans: "", exp: "" }); renderInputs(); updatePDF(); }
        function addPageBreak() { items.push({ id: Date.now(), type: 'break' }); renderInputs(); updatePDF(); }
        
        function removeItem(index) { items.splice(index, 1); renderInputs(); updatePDF(); }
        function moveItem(index, dir) {
            if (dir === 'up' && index > 0) [items[index], items[index-1]] = [items[index-1], items[index]];
            else if (dir === 'down' && index < items.length-1) [items[index], items[index+1]] = [items[index+1], items[index]];
            renderInputs(); updatePDF();
        }
        function updateData(id, field, val) {
            const item = items.find(x => x.id === id);
            if(item) { item[field] = val; updatePDF(); }
        }

        // --- EDITOR RENDERING ---
        function renderInputs() {
            const list = document.getElementById('itemsList');
            list.innerHTML = '';
            let qCounter = 0;

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = item.type === 'header' ? 'card-base header-card' : item.type === 'break' ? 'card-base break-card' : 'card-base question-card';
                
                let inner = `<div class="q-header">`;
                if(item.type === 'header') inner += `<span>SUBJECT</span>`;
                else if(item.type === 'break') inner += `<span>PAGE BREAK</span>`;
                else { qCounter++; inner += `<span>Q ${qCounter}</span>`; }
                
                inner += `<div class="control-icons">
                    <i class="fas fa-arrow-up control-icon" onclick="moveItem(${index}, 'up')"></i>
                    <i class="fas fa-arrow-down control-icon" onclick="moveItem(${index}, 'down')"></i>
                    <i class="fas fa-trash control-icon" onclick="removeItem(${index})"></i>
                </div></div>`;

                if(item.type === 'header') {
                    inner += `<input class="form-control" list="subjectOptions" placeholder="Subject Name (e.g. Bangla)" value="${item.title}" oninput="updateData(${item.id}, 'title', this.value)">`;
                } else if(item.type === 'question') {
                    inner += `
                        <input class="form-control" style="margin-bottom:10px;" placeholder="প্রশ্ন লিখুন..." value="${item.q}" oninput="updateData(${item.id}, 'q', this.value)">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                            <input class="form-control" placeholder="ক" value="${item.a}" oninput="updateData(${item.id}, 'a', this.value)">
                            <input class="form-control" placeholder="খ" value="${item.b}" oninput="updateData(${item.id}, 'b', this.value)">
                            <input class="form-control" placeholder="গ" value="${item.c}" oninput="updateData(${item.id}, 'c', this.value)">
                            <input class="form-control" placeholder="ঘ" value="${item.d}" oninput="updateData(${item.id}, 'd', this.value)">
                        </div>
                        <select class="form-control" style="margin-bottom:10px;" onchange="updateData(${item.id}, 'ans', this.value)">
                            <option value="">সঠিক উত্তর...</option>
                            <option value="ক" ${item.ans==='ক'?'selected':''}>ক</option>
                            <option value="খ" ${item.ans==='খ'?'selected':''}>খ</option>
                            <option value="গ" ${item.ans==='গ'?'selected':''}>গ</option>
                            <option value="ঘ" ${item.ans==='ঘ'?'selected':''}>ঘ</option>
                            <option value="ব্যাখ্যা দেখুন" ${item.ans==='ব্যাখ্যা দেখুন'?'selected':''}>ব্যাখ্যা দেখুন</option>
                        </select>
                        <textarea class="form-control" placeholder="ব্যাখ্যা (Optional)" oninput="updateData(${item.id}, 'exp', this.value)">${item.exp}</textarea>
                    `;
                }
                div.innerHTML = inner;
                list.appendChild(div);
            });
        }

        // --- SMART PDF RENDERING ENGINE ---
        function updatePDF() {
            const container = document.getElementById('pdfPreviewContainer');
            container.innerHTML = ''; // Clear previous pages

            const headTitle = document.getElementById('headTitle').value;
            const subTitle = document.getElementById('subTitle').value;
            const examDate = document.getElementById('examDate').value;
            
            const banglaNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => n.toString().split('').map(x => banglaNums[x] || x).join('');

            // Helper to create a new blank page
            function createPage(isFirst) {
                const page = document.createElement('div');
                page.className = 'pdf-page';
                
                // Header (Only on Page 1)
                if (isFirst) {
                    page.innerHTML = `
                        <div class="pdf-header">
                            <div class="brand-name-pdf">Interactive Learning</div>
                            <div class="pdf-main-title">${headTitle}</div>
                            <div class="pdf-sub-title">${subTitle}</div>
                            <div class="pdf-meta">${examDate}</div>
                        </div>
                    `;
                }
                
                // Footer
                page.innerHTML += `<div class="pdf-footer">Interactive Learning • BCS, Job & Admission Preparation</div>`;
                
                container.appendChild(page);
                return page;
            }

            // Start with Page 1
            let currentPage = createPage(true);
            let qCount = 0;

            items.forEach((item) => {
                // If user requests explicit break, make new page immediately
                if (item.type === 'break') {
                    currentPage = createPage(false);
                    return;
                }

                // Create the content element
                let element = document.createElement('div');
                
                if (item.type === 'header') {
                    element.className = 'section-header-pdf';
                    element.innerText = item.title;
                } else {
                    qCount++;
                    element.className = 'mcq-item';
                    const expHTML = item.exp ? `<div class="exp-box"><b>ব্যাখ্যা:</b> ${item.exp}</div>` : '';
                    element.innerHTML = `
                        <span class="q-text">${toBn(qCount)}. ${item.q}</span>
                        <div class="options-grid">
                            <span>ক. ${item.a}</span><span>খ. ${item.b}</span>
                            <span>গ. ${item.c}</span><span>ঘ. ${item.d}</span>
                        </div>
                        <div class="ans-row">উত্তর: ${item.ans}</div>
                        ${expHTML}
                    `;
                }

                // Append to current page to check height
                currentPage.appendChild(element);

                // Check for Overflow
                // We use scrollHeight vs clientHeight. 
                // clientHeight is fixed 296mm (~1120px). scrollHeight grows.
                // A small buffer (20px) is used for footer safety.
                if (currentPage.scrollHeight > currentPage.clientHeight + 5) {
                    // It overflowed! Remove it from this page.
                    currentPage.removeChild(element);
                    
                    // Create NEW PAGE
                    currentPage = createPage(false);
                    
                    // Add it to the new page
                    currentPage.appendChild(element);
                }
            });

            // Update page count badge
            document.getElementById('pageCounter').innerText = `Total Pages: ${container.children.length}`;
        }

        function downloadPDF() {
            // Temporary disable scaling for high-res capture
            const scaleBox = document.querySelector('.scale-box');
            const originalTransform = scaleBox.style.transform;
            scaleBox.style.transform = 'none';
            scaleBox.style.margin = '0';

            // Select all pages
            const pages = document.querySelectorAll('.pdf-page');
            
            // We'll generate one PDF from ALL pages. 
            // html2pdf can take an element containing multiple pages, but it might mess up breaks.
            // BEST PRACTICE: Capture the container, but ensure pages have specific break classes?
            // Actually, since we simulate pages visually with fixed height, html2pdf needs to know.
            
            const opt = {
                margin:       0, // We handle margins inside .pdf-page
                filename:     'Question_Paper.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Capture the whole container. 
            // Since our .pdf-page divs are exactly A4 size, jsPDF should (mostly) respect them.
            // BUT to be safe, we iterate or rely on good CSS.
            
            html2pdf().set(opt).from(scaleBox).save().then(() => {
                scaleBox.style.transform = originalTransform;
                scaleBox.style.marginBottom = '-150%';
            });
        }

        init();
    </script>
</body>
</html>
