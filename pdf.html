<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Learning | PDF Maker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- NAVBAR (TOGGLE FIXED) --- */
        header {
            width: 100%;
            background: linear-gradient(90deg, #1e1b4b, #312e81); /* Restored Gradient */
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 700; color: white;
        }
        
        .logo-icon { 
            width: 35px; height: 35px; background: var(--primary); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white;
        }

        .hamburger {
            cursor: pointer; width: 30px; height: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 2001; position: relative;
        }
        .hamburger span { 
            display: block; height: 3px; width: 100%; background: white; 
            border-radius: 2px; transition: 0.3s; 
        }
        
        /* Hamburger Animation */
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

        /* Mobile Menu */
        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 250px; height: 100vh;
            background: #1e1b4b; border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s ease-in-out; z-index: 1999;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a {
            color: #cbd5e1; text-decoration: none; padding: 15px 30px;
            font-size: 16px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }
        .mobile-menu a:hover { background: rgba(255,255,255,0.1); color: var(--primary); }

        /* --- CONTAINER --- */
        .container {
            margin-top: 90px;
            width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- LEFT: EDITOR --- */
        .editor-section {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            height: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 5px; }
        
        .form-control {
            width: 100%; background: var(--input-bg); border: 1px solid #334155; 
            color: #f1f5f9; padding: 12px; font-size: 14px; border-radius: 8px;
            transition: 0.3s;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 70px; }

        /* CARDS */
        .card-base {
            padding: 15px; border-radius: 10px; margin-bottom: 15px; position: relative;
        }
        .question-card { background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; }
        .header-card { background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(30, 41, 59, 0.6)); border: 1px solid var(--primary); }
        .break-card { border: 1px dashed #ef4444; background: rgba(239, 68, 68, 0.1); color: #ef4444; text-align: center; font-weight: bold; }

        .q-header { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 10px; font-weight: 600; }
        
        .control-icons i { cursor: pointer; padding: 5px; margin-left: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); }
        .fa-trash { color: #f87171; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-add {
            flex: 1; padding: 12px; border: 1px dashed var(--primary); background: rgba(99, 102, 241, 0.1);
            color: var(--primary); border-radius: 8px; cursor: pointer; font-weight: 600; min-width: 100px;
        }
        .btn-break { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        
        .btn-download {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #6366f1, #3b82f6); color: white;
            font-weight: 700; cursor: pointer; box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        /* --- PREVIEW --- */
        .preview-wrapper {
            flex: 1.5; display: flex; flex-direction: column; align-items: center;
            background: #334155; padding: 30px; border-radius: 16px;
            overflow: auto; min-height: 600px; gap: 20px;
        }

        .scale-box { transform-origin: top center; transition: transform 0.3s ease; }

        /* --- PDF PAGE (A4 Fixed) --- */
        .pdf-page {
            width: 210mm;
            height: 297mm; /* Fixed Height */
            background: white;
            color: black !important;
            padding: 15mm;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex; flex-direction: column;
            margin-bottom: 20px;
        }
        
        #pdfContent * { color: black !important; }

        /* Watermark */
        .watermark {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 40px; font-weight: 900;
            color: rgba(0,0,0,0.05); /* Light Opacity */
            white-space: nowrap; pointer-events: none; z-index: 0;
            font-family: 'Courier New', monospace;
        }

        /* Vertical Line */
        .v-line {
            position: absolute; left: 50%; 
            top: 55mm; /* Below Header */
            bottom: 15mm; /* Above Footer */
            width: 0.5px; background: #999; z-index: 1;
        }

        /* Header */
        .pdf-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 5px; flex-shrink: 0; z-index: 2; position: relative; }
        .brand-name { font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; color: #333 !important; }
        .main-title { border: 2px solid #000; display: inline-block; padding: 4px 25px; font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .sub-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .meta-info { font-size: 12px; margin-top: 4px; }

        /* Body (2 COLUMNS USING FLEX) */
        .pdf-body {
            flex-grow: 1;
            display: flex; 
            flex-direction: row;
            position: relative; z-index: 2;
            overflow: hidden;
            /* Height is handled by page size, but we restrict rendering height via JS */
        }

        .pdf-col {
            width: 50%;
            display: flex;
            flex-direction: column;
        }
        .col-left { padding-right: 5mm; }
        .col-right { padding-left: 5mm; }

        /* Items */
        .section-header {
            text-align: center; font-weight: 800; font-size: 16px;
            margin: 10px 0; border-bottom: 1px solid #333;
            background: white; padding: 2px;
            display: block; width: 100%;
        }

        .mcq-item {
            margin-bottom: 12px; 
            font-size: 13px; line-height: 1.4; padding-right: 5px;
            background: transparent; text-shadow: 3px 0 0 #fff, -3px 0 0 #fff; 
        }
        .q-text { font-weight: 700; display: block; margin-bottom: 3px; }
        .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
        .ans { font-weight: 700; margin-top: 3px; font-size: 12px; }
        .exp { font-size: 11px; font-style: italic; border-top: 1px dotted #ccc; margin-top: 2px; color: #333; }

        /* Footer */
        .pdf-footer {
            text-align: center; border-top: 1px solid #000;
            padding-top: 5px; font-size: 11px; font-weight: 600;
            flex-shrink: 0; z-index: 2; margin-top: auto;
        }

        /* Mobile Scaling */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-section { width: 100%; }
            .scale-box { transform: scale(0.42); transform-origin: top center; margin-bottom: -150%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <div class="logo-icon">IL</div>
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="#">Home</a>
        <a href="#">MCQ Maker</a>
        <a href="#">PDF Tool</a>
        <a href="#">Contact</a>
    </div>

    <div class="container">
        <div class="editor-section">
            <div class="section-title">PDF Details</div>
            
            <div class="input-group">
                <label>Main Title</label>
                <input id="headTitle" class="form-control" value="স্থানীয় সরকার বিভাগ" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Sub Title</label>
                <input id="subTitle" class="form-control" value="পদ: উপ সহকারী প্রকৌশলী" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Date</label>
                <input id="examDate" class="form-control" value="তারিখ: ২৩ জানুয়ারি, ২০২৬" oninput="updatePDF()">
            </div>

            <div id="itemsList"></div>

            <div class="btn-group">
                <button class="btn-add" onclick="addItem('header')">+ Subject</button>
                <button class="btn-add" onclick="addItem('question')">+ Question</button>
                <button class="btn-add btn-break" onclick="addItem('break')">+ Page Break</button>
            </div>
            
            <button class="btn-download" onclick="downloadPDF()">Download PDF</button>
        </div>

        <div class="preview-wrapper">
            <div class="scale-box" id="pdfPreviewContainer"></div>
        </div>
    </div>

    <datalist id="subjects"><option value="Bangla"><option value="English"><option value="General Knowledge"><option value="Math"><option value="ICT"></datalist>

    <script>
        let items = [];

        // Correct toggle logic
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const hamburger = document.querySelector('.hamburger');
            
            // Toggle active class
            if (menu.classList.contains('active')) {
                menu.classList.remove('active');
                hamburger.classList.remove('active');
            } else {
                menu.classList.add('active');
                hamburger.classList.add('active');
            }
        }

        // Close menu when clicking links
        document.querySelectorAll('.mobile-menu a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('mobileMenu').classList.remove('active');
                document.querySelector('.hamburger').classList.remove('active');
            });
        });

        function init() { addItem('question'); }

        function addItem(type) {
            const id = Date.now();
            if(type === 'header') items.push({ id, type, title: '' });
            else if(type === 'break') items.push({ id, type });
            else items.push({ id, type, q: '', a: '', b: '', c: '', d: '', ans: '', exp: '' });
            renderInputs(); updatePDF();
        }

        function removeItem(index) { items.splice(index, 1); renderInputs(); updatePDF(); }
        
        function moveItem(index, dir) {
            if(dir === 'up' && index > 0) [items[index], items[index-1]] = [items[index-1], items[index]];
            else if(dir === 'down' && index < items.length-1) [items[index], items[index+1]] = [items[index+1], items[index]];
            renderInputs(); updatePDF();
        }

        function updateData(id, field, val) {
            const item = items.find(x => x.id === id);
            if(item) { item[field] = val; updatePDF(); }
        }

        function renderInputs() {
            const list = document.getElementById('itemsList');
            list.innerHTML = '';
            let qNum = 0;

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `card-base ${item.type}-card`;
                
                let html = `<div class="q-header"><span>${item.type.toUpperCase()} ${item.type==='question'?++qNum:''}</span>
                    <div class="control-icons">
                        <i class="fas fa-arrow-up" onclick="moveItem(${index}, 'up')"></i>
                        <i class="fas fa-arrow-down" onclick="moveItem(${index}, 'down')"></i>
                        <i class="fas fa-trash" onclick="removeItem(${index})"></i>
                    </div></div>`;

                if(item.type === 'header') {
                    html += `<input class="form-control" list="subjects" placeholder="Subject" value="${item.title}" oninput="updateData(${item.id}, 'title', this.value)">`;
                } else if(item.type === 'question') {
                    html += `<input class="form-control" style="margin-bottom:5px" placeholder="Question" value="${item.q}" oninput="updateData(${item.id}, 'q', this.value)">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px">
                        <input class="form-control" placeholder="A" value="${item.a}" oninput="updateData(${item.id}, 'a', this.value)">
                        <input class="form-control" placeholder="B" value="${item.b}" oninput="updateData(${item.id}, 'b', this.value)">
                        <input class="form-control" placeholder="C" value="${item.c}" oninput="updateData(${item.id}, 'c', this.value)">
                        <input class="form-control" placeholder="D" value="${item.d}" oninput="updateData(${item.id}, 'd', this.value)">
                    </div>
                    <select class="form-control" style="margin-bottom:5px" onchange="updateData(${item.id}, 'ans', this.value)">
                        <option value="">Ans...</option>
                        <option value="ক" ${item.ans==='ক'?'selected':''}>ক</option>
                        <option value="খ" ${item.ans==='খ'?'selected':''}>খ</option>
                        <option value="গ" ${item.ans==='গ'?'selected':''}>গ</option>
                        <option value="ঘ" ${item.ans==='ঘ'?'selected':''}>ঘ</option>
                        <option value="ব্যাখ্যা দেখুন" ${item.ans==='ব্যাখ্যা দেখুন'?'selected':''}>ব্যাখ্যা দেখুন</option>
                    </select>
                    <textarea class="form-control" placeholder="Exp" oninput="updateData(${item.id}, 'exp', this.value)">${item.exp}</textarea>`;
                } else {
                    html += `<div style="text-align:center; color:#ef4444">--- PAGE BREAK ---</div>`;
                }
                div.innerHTML = html;
                list.appendChild(div);
            });
        }

        // --- EXPLICIT COLUMN PDF RENDERER (Guaranteed Flow) ---
        function updatePDF() {
            const container = document.getElementById('pdfPreviewContainer');
            container.innerHTML = '';

            const title = document.getElementById('headTitle').value;
            const sub = document.getElementById('subTitle').value;
            const date = document.getElementById('examDate').value;
            const bnNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => n.toString().split('').map(x => bnNums[x]||x).join('');

            // Page Creator
            function createPage(isFirst) {
                const page = document.createElement('div');
                page.className = 'pdf-page';
                
                page.innerHTML = `
                    <div class="watermark">Interactive Learning</div>
                    <div class="v-line"></div>
                    <div class="pdf-header">
                        <div class="brand-name">Interactive Learning</div>
                        <div class="main-title">${title}</div>
                        <div class="sub-title">${sub}</div>
                        <div class="meta-info">${date}</div>
                    </div>
                    <div class="pdf-body">
                        <div class="pdf-col col-left"></div>
                        <div class="pdf-col col-right"></div>
                    </div>
                    <div class="pdf-footer">Interactive Learning • BCS, Job & Admission Preparation</div>
                `;
                
                if(!isFirst) {
                    page.querySelector('.pdf-header').style.display = 'none';
                    page.querySelector('.v-line').style.top = '15mm';
                }

                container.appendChild(page);
                // Return access to columns
                const body = page.querySelector('.pdf-body');
                return {
                    left: page.querySelector('.col-left'),
                    right: page.querySelector('.col-right'),
                    page: page,
                    body: body
                };
            }

            let currentPage = createPage(true);
            let currentColumn = currentPage.left;
            let qNum = 0;

            // CONTENT FILLING LOGIC
            items.forEach(item => {
                if(item.type === 'break') {
                    currentPage = createPage(false);
                    currentColumn = currentPage.left;
                    return;
                }

                const el = document.createElement('div');
                if(item.type === 'header') {
                    el.className = 'section-header';
                    el.innerText = item.title;
                } else {
                    qNum++;
                    el.className = 'mcq-item';
                    const exp = item.exp ? `<div class="exp"><b>ব্যাখ্যা:</b> ${item.exp}</div>` : '';
                    el.innerHTML = `
                        <span class="q-text">${toBn(qNum)}. ${item.q}</span>
                        <div class="opts">
                            <span>ক. ${item.a}</span><span>খ. ${item.b}</span>
                            <span>গ. ${item.c}</span><span>ঘ. ${item.d}</span>
                        </div>
                        <div class="ans">উত্তর: ${item.ans}</div>
                        ${exp}
                    `;
                }

                // Add to current column
                currentColumn.appendChild(el);

                // Calculate limits (Approx height of content area)
                // First page has header, others don't.
                // 297mm height - margins. Safe height approx 950px - header.
                // We use offsetHeight of the column wrapper.
                // Safest way: Check against a pixel limit. 
                // A4 Height = ~1123px. 
                // Header ~150px. Footer ~50px. Padding ~60px.
                // First Page Limit ~850px. Others ~1000px.
                
                const isFirst = (container.children.length === 1);
                const limit = isFirst ? 750 : 950;

                if(currentColumn.offsetHeight > limit) {
                    // Overflow! Move to next spot
                    currentColumn.removeChild(el); // Take back

                    if(currentColumn === currentPage.left) {
                        currentColumn = currentPage.right; // Switch to Right
                        currentColumn.appendChild(el);
                        // Check right immediate overflow (big item)
                        if(currentColumn.offsetHeight > limit) {
                            currentColumn.removeChild(el);
                            currentPage = createPage(false);
                            currentColumn = currentPage.left;
                            currentColumn.appendChild(el);
                        }
                    } else {
                        // Right full -> New Page
                        currentPage = createPage(false);
                        currentColumn = currentPage.left;
                        currentColumn.appendChild(el);
                    }
                }
            });
        }

        function downloadPDF() {
            const element = document.getElementById('pdfPreviewContainer');
            const scaleBox = document.querySelector('.scale-box');
            
            const oldTransform = scaleBox.style.transform;
            const oldMargin = scaleBox.style.marginBottom;
            scaleBox.style.transform = 'none';
            scaleBox.style.margin = '0';

            const opt = {
                margin: 0,
                filename: `Question_${Math.floor(Math.random()*10000)}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                scaleBox.style.transform = oldTransform;
                scaleBox.style.marginBottom = oldMargin;
            });
        }

        init();
    </script>
</body>
</html>
