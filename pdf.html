<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Question Maker | Interactive Learning</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #8b5cf6;
            --accent: #fbbf24;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            display: flex; align-items: center;
            font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .logo-img { height: 30px; margin-right: 10px; border-radius: 50%; }

        .hamburger {
            cursor: pointer; z-index: 1100; width: 24px; height: 18px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hamburger span { display: block; height: 2px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 4px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -4px); }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: var(--bg-dark);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s; box-shadow: -5px 0 30px rgba(0,0,0,0.6);
            border-left: 1px solid var(--border-color);
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-color);
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- LEFT: EDITOR --- */
        .editor-section {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); padding: 25px; border-radius: 20px;
            border: 1px solid var(--border-color);
            height: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

        #topicSummary {
            background: rgba(139, 92, 246, 0.1);
            padding: 10px; border-radius: 8px;
            margin-bottom: 20px; font-size: 13px; color: #cbd5e1;
            border: 1px dashed var(--primary);
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control {
            width: 100%; 
            background: var(--input-bg); 
            border: none;
            border-bottom: 2px solid #334155; 
            color: #f1f5f9; padding: 12px 10px; font-size: 14px;
            transition: all 0.3s ease;
            border-radius: 4px 4px 0 0;
        }
        .form-control:focus {
            outline: none;
            background: #1e293b;
            border-bottom-color: var(--primary);
        }
        
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 80px; border: 1px solid #334155; border-radius: 8px; }

        .question-card {
            background: #1e293b; 
            padding: 20px; border-radius: 12px;
            margin-bottom: 20px; border: 1px solid #334155;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header-card {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 15px; border-radius: 8px;
            margin-bottom: 20px; border-left: 4px solid var(--accent);
            position: relative;
        }

        .break-card {
            background: rgba(239, 68, 68, 0.15);
            padding: 12px; border-radius: 8px;
            margin-bottom: 20px; border: 1px dashed #ef4444;
            color: #ef4444; font-weight: 700;
            text-align: center; display: flex; justify-content: space-between; align-items: center;
        }

        .q-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94a3b8; margin-bottom: 12px; font-weight: 700; }
        
        .control-icons { display: flex; gap: 8px; }
        .control-icon { 
            cursor: pointer; padding: 6px; border-radius: 4px; transition: 0.2s; 
            background: rgba(255,255,255,0.05);
        }
        .control-icon:hover { background: rgba(255,255,255,0.15); color: white; }
        .fa-trash { color: #f87171; }
        .fa-arrow-up, .fa-arrow-down { color: var(--primary); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-add {
            flex: 1; min-width: 120px; padding: 12px; border: 1px dashed var(--primary); background: rgba(139, 92, 246, 0.1);
            color: var(--primary); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: 0.3s;
        }
        .btn-add:hover { background: var(--primary); color: white; }
        
        .btn-break { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-break:hover { background: #ef4444; color: white; }

        .btn-download {
            width: 100%; padding: 16px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #6366f1, #3b82f6); color: white;
            font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s;
        }
        .btn-download:hover { transform: translateY(-2px); }

        /* --- PREVIEW --- */
        .preview-wrapper {
            flex: 1.5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #334155; 
            padding: 40px 20px;
            border-radius: 20px;
            overflow: auto; 
            min-height: 600px;
        }

        .scale-box {
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        /* --- A4 PAPER --- */
        #pdfContent {
            width: 210mm;
            min-height: 297mm; /* Ensure full page */
            background: white;
            color: black !important;
            padding: 12mm 15mm;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; 
            
            /* Watermark: Small & Centered - Fixed on Page */
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='800'><text x='50%' y='50%' font-size='40' fill='rgba(0,0,0,0.06)' font-weight='bold' font-family='Courier New, monospace' text-anchor='middle' dominant-baseline='middle' transform='rotate(-45, 250, 400)'>Interactive Learning</text></svg>");
            background-repeat: repeat-y;
            background-size: 100% 297mm; /* Ensure one watermark per A4 page height */
            background-position: center top;
        }
        
        #pdfContent * { color: black !important; }

        /* Header */
        .pdf-header {
            text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; 
            margin-top: 0;
        }
        .brand-name-pdf {
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 5px; display: block; color: #333 !important;
        }
        .pdf-main-title {
            background: transparent;
            border: 2px solid #000;
            color: #000 !important;
            display: inline-block;
            padding: 5px 30px; font-size: 24px; font-weight: 800; margin-bottom: 8px;
        }
        .pdf-sub-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .pdf-meta { font-size: 13px; font-weight: 500; display: flex; justify-content: center; gap: 20px; }

        /* Body & Vertical Line */
        .pdf-body {
            column-count: 2;
            column-gap: 10mm;
            text-align: left;
            display: block; 
            min-height: 100px;
            position: relative;
            /* Thin Vertical Line */
            background: linear-gradient(to right, transparent 49.8%, #000 49.8%, #000 50.2%, transparent 50.2%);
        }

        /* Subject Header */
        .section-header-pdf {
            column-span: all;
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 15px;
            margin-top: 20px;
            break-inside: avoid;
            background: white; 
            padding: 5px;
            display: block;
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        /* FORCE PAGE BREAK CLASS */
        .html2pdf__page-break {
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            /* This class is recognized by html2pdf to force a break */
        }

        /* Preview Only Break Line */
        .break-line-preview {
            column-span: all;
            border-top: 2px dashed #ef4444;
            color: #ef4444;
            text-align: center;
            margin: 20px 0;
            font-size: 10px;
            font-weight: bold;
            background: #fff;
            padding: 5px;
        }

        .mcq-item {
            margin-bottom: 15px;
            break-inside: avoid;
            page-break-inside: avoid;
            font-size: 14px;
            line-height: 1.4;
            padding-right: 8px;
            background: transparent; 
            position: relative;
            text-shadow: 2px 0 0 #fff, -2px 0 0 #fff; 
        }
        
        .q-text { font-weight: 700; margin-bottom: 5px; display: block;}
        
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; 
            font-size: 13px; margin-left: 15px; row-gap: 4px;
        }
        
        .ans-row {
            text-align: left;
            font-size: 13px; font-weight: 700; margin-top: 6px; margin-left: 15px; 
        }
        
        .exp-box {
            font-size: 12px; color: #333 !important; margin-top: 4px;
            font-style: italic; margin-left: 15px;
            border-top: 0.5px dotted #ccc; padding-top: 2px;
        }

        /* Footer */
        .pdf-footer {
            margin-top: 30px;
            width: 100%;
            text-align: center; 
            background: transparent;
            padding: 8px; font-size: 12px; font-weight: 600;
            border-top: 1px solid #000;
        }

        /* Mobile Scaling */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-section { width: 100%; }
            .preview-wrapper { width: 100%; padding: 10px; overflow: hidden; justify-content: center;}
            .scale-box { transform: scale(0.42); transform-origin: top center; margin-bottom: -150%; }
        }
        @media (min-width: 901px) {
            .scale-box { transform: scale(0.85); transform-origin: top center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" alt="Logo" class="logo-img">
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">MCQ Card</a>
            <a href="notice.html">Notice Maker</a>
            <a href="pdf.html" style="color: var(--primary);">PDF Maker</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-section">
            <div class="section-title">PDF Content</div>
            
            <div id="topicSummary">Add subjects and questions to start.</div>

            <div class="input-group">
                <label>Main Heading</label>
                <input id="headTitle" class="form-control" value="স্থানীয় সরকার বিভাগ" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Sub Heading</label>
                <input id="subTitle" class="form-control" value="পদ: উপ সহকারী প্রকৌশলী" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Date & Info</label>
                <input id="examDate" class="form-control" value="তারিখ: ২৩ জানুয়ারি, ২০২৬" oninput="updatePDF()">
            </div>

            <div id="itemsList"></div>

            <div class="btn-group">
                <button class="btn-add" onclick="addHeader()">+ Add Subject</button>
                <button class="btn-add" onclick="addQuestion()">+ Add Question</button>
                <button class="btn-add btn-break" onclick="addPageBreak()">+ Page Break</button>
            </div>
            
            <button class="btn-download" onclick="downloadPDF()">Download PDF</button>
        </div>

        <div class="preview-wrapper">
            <div class="scale-box">
                <div id="pdfContent">
                    <div class="pdf-header">
                        <div class="brand-name-pdf">Interactive Learning</div>
                        <div class="pdf-main-title" id="pTitle">স্থানীয় সরকার বিভাগ</div>
                        <div class="pdf-sub-title" id="pSub">পদ: উপ সহকারী প্রকৌশলী</div>
                        <div class="pdf-meta" id="pDate">তারিখ: ২৩ জানুয়ারি, ২০২৬</div>
                    </div>

                    <div class="pdf-body" id="pdfBody">
                        </div>

                    <div class="pdf-footer">
                        Interactive Learning • BCS, Job & Admission Preparation
                    </div>
                </div>
            </div>
        </div>
    </div>

    <datalist id="subjectOptions">
        <option value="Bangla">
        <option value="English">
        <option value="General Knowledge">
        <option value="Mathematics">
        <option value="ICT">
        <option value="Physics">
        <option value="Chemistry">
        <option value="Biology">
        <option value="Accounting">
        <option value="Management">
        <option value="Geography">
        <option value="International Affairs">
        <option value="Bangladesh Affairs">
        <option value="Mental Ability">
        <option value="Ethics & Governance">
    </datalist>

    <script>
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
        }

        let items = [];

        function init() {
            renderInputs();
            updatePDF();
        }

        function addHeader() {
            items.push({ id: Date.now(), type: 'header', title: '' });
            renderInputs();
            updatePDF();
        }

        function addQuestion() {
            items.push({ id: Date.now(), type: 'question', q: "", a: "", b: "", c: "", d: "", ans: "", exp: "" });
            renderInputs();
            updatePDF();
        }

        function addPageBreak() {
            items.push({ id: Date.now(), type: 'break' });
            renderInputs();
            updatePDF();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderInputs();
            updatePDF();
        }

        function moveItem(index, direction) {
            if (direction === 'up' && index > 0) {
                [items[index], items[index - 1]] = [items[index - 1], items[index]];
            } else if (direction === 'down' && index < items.length - 1) {
                [items[index], items[index + 1]] = [items[index + 1], items[index]];
            }
            renderInputs();
            updatePDF();
        }

        function updateData(id, field, val) {
            const item = items.find(x => x.id === id);
            if(item) {
                item[field] = val;
                updatePDF();
                if(item.type === 'header') updateSummary();
            }
        }

        function updateSummary() {
            const summaryBox = document.getElementById('topicSummary');
            let summaryHTML = '';
            let currentHeader = 'General';
            let counts = {};
            let total = 0;

            items.forEach(item => {
                if(item.type === 'header') {
                    currentHeader = item.title || 'Untitled';
                    if(!counts[currentHeader]) counts[currentHeader] = 0;
                } else if(item.type === 'question') {
                    if(!counts[currentHeader]) counts[currentHeader] = 0;
                    counts[currentHeader]++;
                    total++;
                }
            });

            if (total === 0) {
                summaryBox.innerHTML = 'Add items to start.';
                return;
            }

            summaryHTML = `<b>Total Questions: ${total}</b> <br> `;
            for (const [key, value] of Object.entries(counts)) {
                if(value > 0) summaryHTML += `<span style="color:#a78bfa; margin-right:10px;">${key}: ${value}</span>`;
            }
            summaryBox.innerHTML = summaryHTML;
        }

        function renderInputs() {
            const list = document.getElementById('itemsList');
            list.innerHTML = '';
            
            let qCounter = 0;

            items.forEach((item, index) => {
                const div = document.createElement('div');
                
                if (item.type === 'header') {
                    div.className = 'header-card';
                    div.innerHTML = `
                        <div class="q-header">
                            <span>SUBJECT SECTION</span>
                            <div class="control-icons">
                                <i class="fas fa-arrow-up control-icon" onclick="moveItem(${index}, 'up')"></i>
                                <i class="fas fa-arrow-down control-icon" onclick="moveItem(${index}, 'down')"></i>
                                <i class="fas fa-trash control-icon" onclick="removeItem(${index})"></i>
                            </div>
                        </div>
                        <input class="form-control" list="subjectOptions" placeholder="Subject Name (e.g. Bangla)" value="${item.title}" oninput="updateData(${item.id}, 'title', this.value)">
                    `;
                } else if (item.type === 'break') {
                    div.className = 'break-card';
                    div.innerHTML = `
                        <span>--- PAGE BREAK ---</span>
                        <div class="control-icons">
                            <i class="fas fa-arrow-up control-icon" style="color:#ef4444" onclick="moveItem(${index}, 'up')"></i>
                            <i class="fas fa-arrow-down control-icon" style="color:#ef4444" onclick="moveItem(${index}, 'down')"></i>
                            <i class="fas fa-trash control-icon" onclick="removeItem(${index})"></i>
                        </div>
                    `;
                } else {
                    qCounter++;
                    div.className = 'question-card';
                    div.innerHTML = `
                        <div class="q-header">
                            <span>Question ${qCounter}</span>
                            <div class="control-icons">
                                <i class="fas fa-arrow-up control-icon" onclick="moveItem(${index}, 'up')"></i>
                                <i class="fas fa-arrow-down control-icon" onclick="moveItem(${index}, 'down')"></i>
                                <i class="fas fa-trash control-icon" onclick="removeItem(${index})"></i>
                            </div>
                        </div>
                        <input class="form-control" style="margin-bottom:10px;" placeholder="প্রশ্ন লিখুন..." value="${item.q}" oninput="updateData(${item.id}, 'q', this.value)">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                            <input class="form-control" placeholder="ক" value="${item.a}" oninput="updateData(${item.id}, 'a', this.value)">
                            <input class="form-control" placeholder="খ" value="${item.b}" oninput="updateData(${item.id}, 'b', this.value)">
                            <input class="form-control" placeholder="গ" value="${item.c}" oninput="updateData(${item.id}, 'c', this.value)">
                            <input class="form-control" placeholder="ঘ" value="${item.d}" oninput="updateData(${item.id}, 'd', this.value)">
                        </div>
                        
                        <select class="form-control" style="margin-bottom:10px;" onchange="updateData(${item.id}, 'ans', this.value)">
                            <option value="">সঠিক উত্তর...</option>
                            <option value="ক" ${item.ans === 'ক' ? 'selected' : ''}>ক</option>
                            <option value="খ" ${item.ans === 'খ' ? 'selected' : ''}>খ</option>
                            <option value="গ" ${item.ans === 'গ' ? 'selected' : ''}>গ</option>
                            <option value="ঘ" ${item.ans === 'ঘ' ? 'selected' : ''}>ঘ</option>
                            <option value="ব্যাখ্যা দেখুন" ${item.ans === 'ব্যাখ্যা দেখুন' ? 'selected' : ''}>ব্যাখ্যা দেখুন</option>
                        </select>

                        <textarea class="form-control" placeholder="ব্যাখ্যা (Optional)" oninput="updateData(${item.id}, 'exp', this.value)">${item.exp}</textarea>
                    `;
                }
                list.appendChild(div);
            });
            updateSummary();
        }

        function updatePDF() {
            document.getElementById('pTitle').innerText = document.getElementById('headTitle').value;
            document.getElementById('pSub').innerText = document.getElementById('subTitle').value;
            document.getElementById('pDate').innerText = document.getElementById('examDate').value;

            const body = document.getElementById('pdfBody');
            body.innerHTML = '';

            const banglaNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => n.toString().split('').map(x => banglaNums[x] || x).join('');
            
            let qCount = 0;

            items.forEach((item) => {
                if (item.type === 'header') {
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'section-header-pdf';
                    headerDiv.innerText = item.title;
                    body.appendChild(headerDiv);
                } else if (item.type === 'break') {
                    // Preview Line
                    const previewLine = document.createElement('div');
                    previewLine.className = 'break-line-preview';
                    previewLine.innerText = '-- PDF WILL BREAK HERE --';
                    body.appendChild(previewLine);

                    // Actual PDF Break Element
                    const pdfBreak = document.createElement('div');
                    pdfBreak.className = 'html2pdf__page-break'; // Special Class
                    body.appendChild(pdfBreak);
                } else {
                    qCount++;
                    const div = document.createElement('div');
                    div.className = 'mcq-item';
                    const expHTML = item.exp ? `<div class="exp-box"><b>ব্যাখ্যা:</b> ${item.exp}</div>` : '';
                    
                    div.innerHTML = `
                        <span class="q-text">${toBn(qCount)}. ${item.q}</span>
                        <div class="options-grid">
                            <span>ক. ${item.a}</span><span>খ. ${item.b}</span>
                            <span>গ. ${item.c}</span><span>ঘ. ${item.d}</span>
                        </div>
                        <div class="ans-row">উত্তর: ${item.ans}</div>
                        ${expHTML}
                    `;
                    body.appendChild(div);
                }
            });
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const scaleBox = document.querySelector('.scale-box');
            
            // Hide preview lines
            document.querySelectorAll('.break-line-preview').forEach(el => el.style.display = 'none');

            // Save state
            const originalTransform = scaleBox.style.transform;
            const originalMargin = scaleBox.style.marginBottom;
            
            // Reset for capture
            scaleBox.style.transform = 'none';
            scaleBox.style.margin = '0';

            const opt = {
                // Adjust margins slightly to ensure first page top doesn't get cut
                margin:       [5, 10, 10, 10], 
                filename:     'Question_' + Math.floor(Math.random() * 10000) + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'] }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                // Restore
                scaleBox.style.transform = originalTransform;
                scaleBox.style.marginBottom = originalMargin;
                // Show preview lines
                document.querySelectorAll('.break-line-preview').forEach(el => el.style.display = 'block');
            });
        }

        init();
    </script>
</body>
</html>
