<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Question Maker | Interactive Learning</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #020617;
            --border-color: #334155;
            --primary: #6366f1; /* Indigo */
            --accent: #fbbf24;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Lexend', 'Anek Bangla', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            display: flex; align-items: center;
            font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .logo-img { height: 30px; margin-right: 10px; border-radius: 50%; }

        .hamburger {
            cursor: pointer; z-index: 1100; width: 24px; height: 18px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hamburger span { display: block; height: 2px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 4px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -4px); }

        .nav-menu {
            position: fixed; top: 0; right: -100%; height: 100vh; width: 260px;
            background: var(--bg-dark);
            display: flex; flex-direction: column; padding-top: 80px;
            transition: 0.4s; box-shadow: -5px 0 30px rgba(0,0,0,0.6);
            border-left: 1px solid var(--border-color);
        }
        .nav-menu.open { right: 0; }
        .nav-menu a {
            color: var(--text-main); text-decoration: none; padding: 15px 30px;
            font-weight: 500; border-bottom: 1px solid var(--border-color);
        }

        /* --- CONTAINER --- */
        .container {
            margin-top: 80px; width: 95%; max-width: 1400px;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: flex-start;
            gap: 30px; padding-bottom: 40px; flex: 1;
        }

        /* --- LEFT: EDITOR --- */
        .editor-section {
            flex: 1; min-width: 350px; max-width: 500px;
            background: var(--panel-bg); padding: 25px; border-radius: 16px;
            border: 1px solid var(--border-color);
            height: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 16px; font-weight: 700; color: #94a3b8; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* NEW INPUT DESIGN */
        .form-control {
            width: 100%; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color);
            color: #f1f5f9; padding: 14px; border-radius: 8px; font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background: #0f172a;
        }
        ::placeholder { color: #475569; }
        
        select.form-control { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 0.65em auto; }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .question-card {
            background: rgba(15, 23, 42, 0.5); 
            padding: 20px; border-radius: 12px;
            margin-bottom: 20px; border: 1px solid var(--border-color);
            position: relative;
        }
        .q-header { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 12px; font-weight: 600; }
        
        .btn-add {
            width: 100%; padding: 14px; border: 1px dashed #475569; background: transparent;
            color: #94a3b8; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-weight: 600;
            transition: 0.3s;
        }
        .btn-add:hover { border-color: var(--primary); color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        
        .btn-download {
            width: 100%; padding: 16px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #6366f1, #3b82f6); color: white;
            font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s;
        }
        .btn-download:hover { transform: translateY(-2px); }

        /* --- RIGHT: PREVIEW CONTAINER --- */
        .preview-wrapper {
            flex: 1.5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #334155; 
            padding: 40px 20px;
            border-radius: 20px;
            overflow: auto; 
            min-height: 600px;
        }

        .scale-box {
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        /* --- A4 PAPER DESIGN --- */
        #pdfContent {
            width: 210mm;
            min-height: 296mm;
            background: white;
            color: black !important;
            padding: 15mm;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; 
            
            /* Watermark */
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><text x='50%' y='50%' font-size='60' fill='rgba(0,0,0,0.06)' font-weight='bold' font-family='sans-serif' text-anchor='middle' dominant-baseline='middle' transform='rotate(-45, 250, 250)'>Interactive Learning</text></svg>");
            background-repeat: repeat;
            background-position: center;
        }
        
        #pdfContent * { color: black !important; }

        /* Header Design */
        .pdf-header {
            text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; 
            margin-top: 0;
        }
        .brand-name-pdf {
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 5px; display: block; color: #333 !important;
        }
        .pdf-main-title {
            background: transparent;
            border: 2px solid #000;
            color: #000 !important;
            display: inline-block;
            padding: 5px 30px; font-size: 24px; font-weight: 800; margin-bottom: 8px;
        }
        .pdf-sub-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .pdf-meta { font-size: 13px; font-weight: 500; display: flex; justify-content: center; gap: 20px; }

        /* 2-Column Layout with THIN LINE */
        .pdf-body {
            column-count: 2;
            column-gap: 10mm;
            /* Ultra Thin vertical line */
            column-rule: 0.5pt solid #bbb;
            text-align: left;
            display: block; 
            min-height: 200px;
        }

        .mcq-item {
            margin-bottom: 15px;
            break-inside: avoid;
            page-break-inside: avoid;
            font-size: 14px;
            line-height: 1.4;
            padding-right: 8px; /* Gap from the vertical line */
        }
        
        .q-text { font-weight: 700; margin-bottom: 5px; display: block;}
        
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; 
            font-size: 13px; margin-left: 15px; row-gap: 4px;
        }
        
        /* Answer Position: Left Side */
        .ans-row {
            text-align: left;
            font-size: 13px; 
            font-weight: 700; 
            margin-top: 6px;
            margin-left: 15px; 
        }
        
        .exp-box {
            font-size: 12px; color: #333 !important; margin-top: 4px;
            font-style: italic; margin-left: 15px;
            border-top: 0.5px dotted #ccc;
            padding-top: 2px;
        }

        /* Footer */
        .pdf-footer {
            margin-top: 30px;
            width: 100%;
            text-align: center; 
            background: transparent;
            padding: 8px; font-size: 12px; font-weight: 600;
            border-top: 1px solid #000;
        }

        /* Mobile Responsive Scaling */
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .editor-section { width: 100%; }
            .preview-wrapper { width: 100%; padding: 10px; overflow: hidden; justify-content: center;}
            
            .scale-box { 
                transform: scale(0.42); 
                transform-origin: top center; 
                margin-bottom: -150%; 
            }
        }
        
        @media (min-width: 901px) {
            .scale-box { transform: scale(0.85); transform-origin: top center; }
        }

    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="https://i.postimg.cc/jSTKgmrc/ib-logo.png" alt="Logo" class="logo-img">
            Interactive Learning
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">MCQ Card</a>
            <a href="notice.html">Notice Maker</a>
            <a href="pdf.html" style="color: var(--primary);">PDF Maker</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="container">
        <div class="editor-section">
            <div class="section-title">PDF Content</div>
            
            <div class="input-group">
                <label>Main Heading</label>
                <input id="headTitle" class="form-control" value="স্থানীয় সরকার বিভাগ" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Sub Heading</label>
                <input id="subTitle" class="form-control" value="পদ: উপ সহকারী প্রকৌশলী" oninput="updatePDF()">
            </div>
            <div class="input-group">
                <label>Date & Info</label>
                <input id="examDate" class="form-control" value="তারিখ: ২৩ জানুয়ারি, ২০২৬" oninput="updatePDF()">
            </div>

            <div id="questionsList"></div>

            <button class="btn-add" onclick="addQuestion()">+ Add New Question</button>
            <button class="btn-download" onclick="downloadPDF()">Download PDF</button>
        </div>

        <div class="preview-wrapper">
            <div class="scale-box">
                <div id="pdfContent">
                    <div class="pdf-header">
                        <div class="brand-name-pdf">Interactive Learning</div>
                        <div class="pdf-main-title" id="pTitle">স্থানীয় সরকার বিভাগ</div>
                        <div class="pdf-sub-title" id="pSub">পদ: উপ সহকারী প্রকৌশলী</div>
                        <div class="pdf-meta" id="pDate">তারিখ: ২৩ জানুয়ারি, ২০২৬</div>
                    </div>

                    <div class="pdf-body" id="pdfBody">
                        </div>

                    <div class="pdf-footer">
                        Interactive Learning • BCS, Job & Admission Preparation
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('open');
        }

        // Start with Empty Array
        let questions = [];

        function init() {
            renderInputs();
            updatePDF();
        }

        function addQuestion() {
            questions.push({ id: Date.now(), q: "", a: "", b: "", c: "", d: "", ans: "", exp: "" });
            renderInputs();
            updatePDF();
        }

        function removeQuestion(id) {
            questions = questions.filter(q => q.id !== id);
            renderInputs();
            updatePDF();
        }

        function updateData(id, field, val) {
            const q = questions.find(x => x.id === id);
            if(q) {
                q[field] = val;
                updatePDF();
            }
        }

        function renderInputs() {
            const list = document.getElementById('questionsList');
            list.innerHTML = '';
            questions.forEach((q, i) => {
                const item = document.createElement('div');
                item.className = 'question-card';
                item.innerHTML = `
                    <div class="q-header">
                        <span>Question ${i+1}</span>
                        <i class="fas fa-trash" onclick="removeQuestion(${q.id})" style="cursor:pointer; color:#ef4444;"></i>
                    </div>
                    <input class="form-control" style="margin-bottom:10px;" placeholder="প্রশ্ন লিখুন..." value="${q.q}" oninput="updateData(${q.id}, 'q', this.value)">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                        <input class="form-control" placeholder="ক" value="${q.a}" oninput="updateData(${q.id}, 'a', this.value)">
                        <input class="form-control" placeholder="খ" value="${q.b}" oninput="updateData(${q.id}, 'b', this.value)">
                        <input class="form-control" placeholder="গ" value="${q.c}" oninput="updateData(${q.id}, 'c', this.value)">
                        <input class="form-control" placeholder="ঘ" value="${q.d}" oninput="updateData(${q.id}, 'd', this.value)">
                    </div>
                    
                    <select class="form-control" style="margin-bottom:10px;" onchange="updateData(${q.id}, 'ans', this.value)">
                        <option value="">সঠিক উত্তর নির্বাচন করুন...</option>
                        <option value="ক" ${q.ans === 'ক' ? 'selected' : ''}>ক</option>
                        <option value="খ" ${q.ans === 'খ' ? 'selected' : ''}>খ</option>
                        <option value="গ" ${q.ans === 'গ' ? 'selected' : ''}>গ</option>
                        <option value="ঘ" ${q.ans === 'ঘ' ? 'selected' : ''}>ঘ</option>
                        <option value="ব্যাখ্যা দেখুন" ${q.ans === 'ব্যাখ্যা দেখুন' ? 'selected' : ''}>ব্যাখ্যা দেখুন</option>
                    </select>

                    <textarea class="form-control" placeholder="ব্যাখ্যা (Optional)" oninput="updateData(${q.id}, 'exp', this.value)">${q.exp}</textarea>
                `;
                list.appendChild(item);
            });
        }

        function updatePDF() {
            document.getElementById('pTitle').innerText = document.getElementById('headTitle').value;
            document.getElementById('pSub').innerText = document.getElementById('subTitle').value;
            document.getElementById('pDate').innerText = document.getElementById('examDate').value;

            const body = document.getElementById('pdfBody');
            body.innerHTML = '';

            const banglaNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => n.toString().split('').map(x => banglaNums[x] || x).join('');

            questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'mcq-item';
                const expHTML = q.exp ? `<div class="exp-box"><b>ব্যাখ্যা:</b> ${q.exp}</div>` : '';
                
                div.innerHTML = `
                    <span class="q-text">${toBn(i+1)}. ${q.q}</span>
                    <div class="options-grid">
                        <span>ক. ${q.a}</span><span>খ. ${q.b}</span>
                        <span>গ. ${q.c}</span><span>ঘ. ${q.d}</span>
                    </div>
                    <div class="ans-row">উত্তর: ${q.ans}</div>
                    ${expHTML}
                `;
                body.appendChild(div);
            });
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const scaleBox = document.querySelector('.scale-box');
            
            // Save state
            const originalTransform = scaleBox.style.transform;
            const originalMargin = scaleBox.style.marginBottom;
            
            // Reset for full quality capture
            scaleBox.style.transform = 'none';
            scaleBox.style.margin = '0';

            const opt = {
                margin:       [15, 10, 10, 10], 
                filename:     'Question_' + Math.floor(Math.random() * 10000) + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                // Restore mobile preview
                scaleBox.style.transform = originalTransform;
                scaleBox.style.marginBottom = originalMargin;
            });
        }

        init();
    </script>
</body>
</html>
